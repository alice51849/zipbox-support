y":"Soukromí","navTerms":"Podmínky","foot":"Zipbox běží celý ve vašem zařízení. Bez účtu, bez reklam, bez analytiky, nic se neodesílá.","updated":"Naposledy aktualizováno","secContact":"Kontakt","contact":"Napište nám v jakémkoli jazyce. Každou zprávu čte člověk.","contactHint":"Formát archivu, verze iOS a hláška, kterou jste viděli na obrazovce, hodně pomohou. Pevnou dobu odpovědi neslibujeme.","secTerms":"Podmínky užití","terms":["Zipbox se poskytuje tak, jak je, pro osobní i pracovní použití na vašich vlastních zařízeních Apple.","Rozbalování nic nestojí a neobsahuje reklamy. Zipbox Pro je nepovinný jednorázový nákup, který odemyká doplňkové nástroje uvedené v aplikaci.","Nákupy a vrácení peněz vyřizuje Apple podle podmínek App Store. Žádost o vrácení peněz míří na Apple, ne na nás.","Za soubory, které v Zipboxu otevíráte, vytváříte a sdílíte, odpovídáte vy, stejně jako za práva k nim. Nepoužívejte Zipbox pro materiál, ke kterému nemáte oprávnění.","Zipbox zpracovává soubory ve vašem zařízení. Dělejte si vlastní zálohy. Poškozený, přepsaný ani smazaný soubor neobnovíme a neneseme odpovědnost za ztrátu dat.","Tyto podmínky mohou být aktualizovány. Platí vždy verze zveřejněná na této stránce."],"pages":{"terms":{"title":"Podmínky užití Zipbox","meta":"Podmínky, které platí při používání Zipboxu, včetně nákupů, vrácení peněz a odpovědnosti.","badge":"Podmínky","h1":"Podmínky užití","lead":"Krátké a jasné podmínky pro používání Zipboxu na vašich vlastních zařízeních."}}},"da":{"langName":"Dansk","langLabel":"Sprog","navHome":"Forside","navSupport":"Support","navPrivacy":"Privatliv","navTerms":"Vilkår","foot":"Zipbox kører helt på din egen enhed. Ingen konto, ingen reklamer, ingen analyse, intet sendes af sted.","updated":"Senest opdateret","secContact":"Kontakt","contact":"Skriv til os på det sprog, du har lyst til. Hver besked bliver læst af et menneske.","contactHint":"Arkivets format, din iOS version og beskeden på skærmen hjælper meget. Vi lover ikke en fast svartid.","secTerms":"Brugsvilkår","terms":["Zipbox leveres, som det er, til privat og professionel brug på dine egne Apple enheder.","At pakke ud koster ingenting og indeholder ingen reklamer. Zipbox Pro er et valgfrit engangskøb, der låser de ekstra værktøjer op, som er nævnt i appen.","Køb og refusioner håndteres af Apple efter App Store vilkårene. Anmodning om refusion sker hos Apple og ikke hos os.","Du har selv ansvaret for de filer, du åbner, opretter og deler med Zipbox, og for at du har ret til at bruge dem. Brug ikke Zipbox til materiale, du ikke har rettigheder til.","Zipbox behandler filer på din enhed. Sørg selv for sikkerhedskopier. Vi kan ikke genskabe en fil, der er beskadiget, overskrevet eller slettet, og vi hæfter ikke for tab af data.","Disse vilkår kan blive opdateret. Den gældende version er altid den, der står på denne side."],"pages":{"terms":{"title":"Zipbox brugsvilkår","meta":"Vilkårene for at bruge Zipbox, herunder køb, refusion og dit eget ansvar.","badge":"Vilkår","h1":"Brugsvilkår","lead":"Korte, klare vilkår for at bruge Zipbox på dine egne enheder."}}},"nl-NL":{"langName":"Nederlands","langLabel":"Taal","navHome":"Start","navSupport":"Support","navPrivacy":"Privacy","navTerms":"Voorwaarden","foot":"Zipbox draait volledig op je eigen toestel. Geen account, geen reclame, geen analyse, niets wordt verstuurd.","updated":"Laatst bijgewerkt","secContact":"Contact","contact":"Schrijf ons in welke taal je wilt. Elk bericht wordt door een mens gelezen.","contactHint":"Het archieftype, je iOS versie en de melding op het scherm helpen enorm. We beloven geen vaste reactietijd.","secTerms":"Gebruiksvoorwaarden","terms":["Zipbox wordt geleverd zoals het is, voor persoonlijk en zakelijk gebruik op je eigen Apple toestellen.","Uitpakken kost niets en bevat geen reclame. Zipbox Pro is een optionele eenmalige aankoop die de extra gereedschappen uit de app ontgrendelt.","Aankopen en terugbetalingen lopen via Apple onder de voorwaarden van de App Store. Een ಾವತಿಯನ್ನು App Store ನಿಯಮಗಳ ಪ್ರಕಾರ Apple ನಿರ್ವಹಿಸುತ್ತದೆ. ಮರುಪಾವತಿ ಕೋರಿಕೆ Apple ಗೆ ಹೋಗುತ್ತದೆ, ನಮಗಲ್ಲ.","Zipbox ನಿಂದ ನೀವು ತೆರೆಯುವ, ರಚಿಸುವ ಮತ್ತು ಹಂಚಿಕೊಳ್ಳುವ ಫೈಲ್‌ಗಳಿಗೆ ಹಾಗೂ ಅವುಗಳನ್ನು ಬಳಸುವ ಹಕ್ಕಿಗೆ ನೀವೇ ಜವಾಬ್ದಾರರು. ಹಕ್ಕಿಲ್ಲದ ವಿಷಯಕ್ಕೆ Zipbox ಬಳಸಬೇಡಿ.","Zipbox ಫೈಲ್‌ಗಳನ್ನು ನಿಮ್ಮ ಸಾಧನದಲ್ಲೇ ಸಂಸ್ಕರಿಸುತ್ತದೆ. ನಿಮ್ಮ ಬ್ಯಾಕಪ್‌ಗಳನ್ನು ನೀವೇ ಇಟ್ಟುಕೊಳ್ಳಿ. ಹಾಳಾದ, ಮೇಲೆ ಬರೆದ ಅಥವಾ ಅಳಿಸಿದ ಫೈಲ್ ಅನ್ನು ನಾವು ಮರಳಿ ತರಲಾಗದು, ಮಾಹಿತಿ ನಷ್ಟಕ್ಕೆ ಜವಾಬ್ದಾರರಲ್ಲ.","ಈ ನಿಯಮಗಳು ನವೀಕರಣಗೊಳ್ಳಬಹುದು. ಜಾರಿಯಲ್ಲಿರುವುದು ಯಾವಾಗಲೂ ಈ ಪುಟದಲ್ಲಿ ಪ್ರಕಟಿಸಿದ ಆವೃತ್ತಿಯೇ."],"pages":{"terms":{"title":"Zipbox ಬಳಕೆಯ ನಿಯಮಗಳು","meta":"Zipbox ಬಳಕೆಗೆ ಅನ್ವಯಿಸುವ ನಿಯಮಗಳು, ಖರೀದಿ, ಮರುಪಾವತಿ ಮತ್ತು ನಿಮ್ಮ ಜವಾಬ್ದಾರಿ ಸೇರಿದಂತೆ.","badge":"ನಿಯಮಗಳು","h1":"ಬಳಕೆಯ ನಿಯಮಗಳು","lead":"ನಿಮ್ಮ ಸ್ವಂತ ಸಾಧನಗಳಲ್ಲಿ Zipbox ಬಳಸಲು ಸಂಕ್ಷಿಪ್ತ, ಸ್ಪಷ್ಟ ನಿಯಮಗಳು."}}},"ko":{"langName":"한국어","langLabel":"언어","navHome":"홈","navSupport":"지원","navPrivacy":"개인정보","navTerms":"이용약관","foot":"Zipbox은 전부 기기 안에서 동작합니다. 계정 없음, 광고 없음, 분석 없음, 업로드 없음.","updated":"최종 업데이트","secContact":"문의","contact":"어떤 언어로 쓰셔도 됩니다. 모든 메일은 사람이 직접 읽습니다.","contactHint":"압축파일 형식, iOS 버전, 화면에 나온 문구를 함께 알려주시면 큰 도움이 됩니다. 정해진 답변 시간을 약속드리지는 않습니다.","secTerms":"이용약관","terms":["Zipbox은 있는 그대로 제공되며, 본인의 Apple 기기에서 개인 용도와 업무 용도로 사용할 수 있습니다.","압축을 푸는 기능은 요금이 없고 광고도 없습니다. Zipbox Pro는 선택 사항인 한 번의 구입이며 앱에 안내된 추가 도구를 열어 줍니다.","구입과 환불은 App Store 약관에 따라 Apple이 처리합니다. 환불 요청은 저희가 아니라 Apple에 하셔야 합니다.","Zipbox으로 열고 만들고 공유하는 파일에 대한 책임은 사용자에게 있으며, 해당 내용을 사용할 권리가 있는지 확인해야 합니다. 권리가 없는 자료를 열거나 배포하는 데 쓰지 마세요.","Zipbox은 기기 안에서 파일을 처리합니다. 백업은 직접 보관하세요. 손상되거나 덮어써지거나 삭제된 파일은 복구해 드릴 수 없으며 데이터 손실에 대한 책임을 지지 않습니다.","이 약관은 갱신될 수 있습니다. 이 페이지에 게시된 판이 항상 유효한 판입니다."],"pages":{"terms":{"title":"Zipbox 이용약관","meta":"Zipbox을 사용할 때 적용되는 약관입니다. 구입, 환불, 사용자의 책임을 담고 있습니다.","badge":"이용약관","h1":"이용약관","lead":"본인의 기기에서 Zipbox을 쓸 때 적용되는 짧고 분명한 약관입니다."}}},"ms":{"langName":"Bahasa Melayu","langLabel":"Bahasa","navHome":"Laman utama","navSupport":"Sokongan","navPrivacy":"Privasi","navTerms":"Terma","foot":"Zipbox berjalan sepenuhnya pada peranti anda. Tiada akaun, tiada iklan, tiada analitik, tiada muat naik.","updated":"Kemas kini terakhir","secContact":"Hubungi kami","contact":"Tulis kepada kami dalam bahasa apa pun. Setiap mesej dibaca oleh manusia.","contactHint":"Menyatakan format arkib, versi iOS dan mesej yang anda lihat pada skrin banyak membantu. Kami tidak menjanjikan tempoh balasan yang tetap.","secTerms":"Terma penggunaan","terms":["Zipbox disediakan sebagaimana adanya, untuk kegunaan peribadi dan profesional pada peranti Apple anda sendiri.","Mengekstrak tidak dikenakan bayaran dan tiada iklan. Zipbox Pro ialah bayaran sekali sahaja yang bersifat pilihan dan membuka alat tambahan yang disenaraikan dalam aplikasi.","Pembelian dan bayaran balik dikendalikan oleh Apple di bawah terma App Store. Permintaan bayaran balik dihantar kepada Apple dan bukan kepada kami.","Anda bertanggungjawab ke atas fail yang anda buka, cipta dan kongsi dengan Zipbox, serta ke atas hak untuk menggunakannya. Jangan gunakan Zipbox untuk bahan yang anda tidak berhak menggunakannya.","Zipbox memproses fail pada peranti anda. Simpan salinan sandaran anda sendiri. Kami tidak dapat memulihkan fail yang rosak, ditulis ganti atau dipadam, dan kami tidak bertanggungjawab atas kehilangan data.","Terma ini boleh dikemas kini. Versi yang berkuat kuasa sentiasa yang diterbitkan di halaman ini."],"pages":{"terms":{"title":"Terma penggunaan Zipbox","meta":"Terma yang terpakai apabila anda menggunakan Zipbox, termasuk pembelian, bayaran balik dan tanggungjawab anda.","badge":"Terma","h1":"Terma penggunaan","lead":"Terma ringkas dan jelas untuk menggunakan Zipbox pada peranti anda sendiri."}}},"ml-IN":{"langName":"മലയാളം","langLabel":"ഭാഷ","navHome":"ഹോം","navSupport":"സഹായം","navPrivacy":"സ്വകാര്യത","navTerms":"നിബന്ധനകൾ","foot":"Zipbox പൂർണമായും നിങ്ങളുടെ ഉപകരണത്തിൽ പ്രവർത്തിക്കുന്നു. അക്കൗണ്ടില്ല, പരസ്യമില്ല, വിശകലനമില്ല, അപ്‌ലോഡില്ല.","updated":"അവസാനം പുതുക്കിയത്","secContact":"ബന്ധപ്പെടുക","contact":"ഏത് ഭാഷയിലും ഞങ്ങൾക്ക് എഴുതൂ. ഓരോ സന്ദേശവും ഒരാൾ വായിക്കുന്നു.","contactHint":"ആർക്കൈവിന്റെ ഫോർമാറ്റ്, iOS പതിപ്പ്, സ്ക്രീനിൽ കണ്ട സന്ദേശം എന്നിവ പറഞ്ഞാൽ വളരെ സഹായകമാണ്. മറുപടിക്ക് നിശ്ചിത സമയം ഞങ്ങൾ ഉറപ്പുനൽകുന്നില്ല.","secTerms":"ഉപയോഗ നിബന്ധനകൾ","terms":["Zipbox ഉള്ളതുപോലെ നൽകുന്നു, നിങ്ങളുടെ സ്വന്തം Apple ഉപകരണങ്ങളിൽ വ്യക്തിഗതവും തൊഴിൽപരവുമായ ഉപയോഗത്തിന്.","ഫയൽ എടുക്കാൻ ഫീസില്ല, പരസ്യവുമില്ല. Zipbox Pro ഐച്ഛികമായ, ഒറ്റത്തവണ വാങ്ങലാണ്, ആപ്പിൽ പറഞ്ഞിരിക്കുന്ന അധിക ഉപകരണങ്ങൾ ഇത് തുറക്കുന്നു.","വാങ്ങലും പണം തിരികെ നൽകലും App Store നിബന്ധനകൾ പ്രകാരം Apple കൈകാര്യം ചെയ്യുന്നു. പണം തിരികെ ചോദിക്കേണ്ടത് Apple നോടാണ്, ഞങ്ങളോടല്ല.","Zipbox ഉപയോഗിച്ച് നിങ്ങൾ തുറക്കുന്ന, ഉണ്ടാക്കുന്ന, പങ്കിടുന്ന ഫയലുകൾക്കും അവ ഉപയോഗിക്കാനുള്ള അവകാശത്തിനും നിങ്ങൾ തന്നെ ഉത്തരവാദി. അവകാശമില്ലാത്ത ഉള്ളടക്കത്തിന് Zipbox ഉപയോഗിക്കരുത്.","Zipbox ഫയലുകൾ നിങ്ങളുടെ ഉപകരണത്തിൽ തന്നെ കൈകാര്യം ചെയ്യുന്നു. സ്വന്തം ബാക്കപ്പുകൾ സൂക്ഷിക്കൂ. കേടായ, മേലെഴുതിയ അല്ലെങ്കിൽ മായ്ച്ച ഫയൽ ഞങ്ങൾക്ക് വീണ്ടെടുക്കാനാവില്ല, വിവരനഷ്ടത്തിന് ഉത്തരവാദികളുമല്ല.","ഈ നിബന്ധനകൾ പുതുക്കാം. പ്രാബല്യത്തിലുള്ളത് എപ്പോഴും ഈ പേജിൽ പ്രസിദ്ധീകരിച്ച പതിപ്പാണ്."],"pages":{"terms":{"title":"Zipbox ഉപയോഗ നിബന്ധനകൾ","meta":"Zipbox ഉപയോഗത്തിന് ബാധകമായ നിബന്ധനകൾ, വാങ്ങൽ, പണം തിരികെ നൽകൽ, നിങ്ങളുടെ ഉത്തരവാദിത്തം ഉൾപ്പെടെ.","badge":"നിബന്ധനകൾ","h1":"ഉപയോഗ നിബന്ധനകൾ","lead":"സ്വന്തം ഉപകരണങ്ങളിൽ Zipbox ഉപയോഗിക്കാൻ ചെറുതും വ്യക്തവുമായ നിബന്ധനകൾ."}}},"mr-IN":{"langName":"मराठी","langLabel":"भाषा","navHome":"मुख्यपृष्ठ","navSupport":"मदत","navPrivacy":"गोपनीयता","navTerms":"अटी","foot":"Zipbox पूर्णपणे तुमच्या उपकरणावर चालतो. खाते नाही, जाहिरात नाही, विश्लेषण नाही, अपलोड नाही.","updated":"शेवटचे अद्यतन","secContact":"संपर्क","contact":"आम्हाला कोणत्याही भाषेत लिहा. प्रत्येक संदेश माणूस वाचतो.","contactHint":"संग्रहाचे स्वरूप, iOS ची आवृत्ती आणि पडद्यावर दिसलेला संदेश सांगितल्यास खूप मदत होते. उत्तराची ठराविक वेळ आम्ही देत नाही.","secTerms":"वापराच्या अटी","terms":["Zipbox जसा आहे तसा दिला जातो, तुमच्या स्वतःच्या Apple उपकरणांवर वैयक्तिक आणि व्यावसायिक वापरासाठी.","फाइल काढण्यासाठी कोणतेही शुल्क ना t engångsköp som låser upp de extra verktyg som anges i appen.","Köp och återbetalningar hanteras av Apple enligt villkoren för App Store. Begäran om återbetalning görs till Apple, inte till oss.","Du ansvarar för de filer du öppnar, skapar och delar med Zipbox, och för att du har rätt att använda dem. Använd inte Zipbox för material du saknar rättigheter till.","Zipbox bearbetar filer i din enhet. Håll egna säkerhetskopior. Vi kan inte återskapa en fil som skadats, skrivits över eller raderats och ansvarar inte för dataförlust.","Dessa villkor kan uppdateras. Den gällande versionen är alltid den som publiceras på den här sidan."],"pages":{"terms":{"title":"Zipbox användarvillkor","meta":"Villkoren för att använda Zipbox, inklusive köp, återbetalningar och ditt eget ansvar.","badge":"Villkor","h1":"Användarvillkor","lead":"Korta, tydliga villkor för att använda Zipbox på dina egna enheter."}}},"ta-IN":{"langName":"தமிழ்","langLabel":"மொழி","navHome":"முகப்பு","navSupport":"உதவி","navPrivacy":"தனியுரிமை","navTerms":"விதிமுறைகள்","foot":"Zipbox முழுவதும் உங்கள் சாதனத்தில் இயங்குகிறது. கணக்கு இல்லை, விளம்பரம் இல்லை, பகுப்பாய்வு இல்லை, பதிவேற்றம் இல்லை.","updated":"கடைசியாக புதுப்பிக்கப்பட்டது","secContact":"தொடர்பு","contact":"எந்த மொழியிலும் எங்களுக்கு எழுதுங்கள். ஒவ்வொரு செய்தியையும் ஒரு மனிதர் படிக்கிறார்.","contactHint":"காப்பகத்தின் வடிவம், iOS பதிப்பு, திரையில் தெரிந்த செய்தி ஆகியவற்றைச் சொன்னால் பெரிதும் உதவும். பதிலுக்கு நிலையான கால அளவு உறுதி அளிக்கவில்லை.","secTerms":"பயன்பாட்டு விதிமுறைகள்","terms":["Zipbox உள்ளது உள்ளபடி வழங்கப்படுகிறது, உங்கள் சொந்த Apple சாதனங்களில் தனிப்பட்ட மற்றும் தொழில்முறைப் பயன்பாட்டுக்கு.","பிரித்தெடுத்தலுக்குக் கட்டணம் இல்லை, விளம்பரமும் இல்லை. Zipbox Pro என்பது விருப்பத் தேர்வாக ஒரே முறை வாங்குவது, செயலியில் பட்டியலிடப்பட்ட கூடுதல் கருவிகளைத் திறக்கிறது.","கொள்முதலும் பணத் திரும்பப்பெறுதலும் App Store விதிமுறைகளின்படி Apple கையாளுகிறது. பணம் திரும்பக் கோரிக்கை Apple இற்குச் செல்கிறது, எங்களுக்கு அல்ல.","Zipbox மூலம் நீங்கள் திறக்   var base=t.split("-")[0].toLowerCase();
  var map={en:"en-US",zh:"zh-Hans",pt:"pt-PT",fr:"fr-FR",es:"es-ES",de:"de-DE",nl:"nl-NL",ar:"ar-SA",
           sl:"sl-SI",bn:"bn-BD",gu:"gu-IN",kn:"kn-IN",ml:"ml-IN",mr:"mr-IN",or:"or-IN",pa:"pa-IN",
           ta:"ta-IN",te:"te-IN",ur:"ur-PK",nb:"no",nn:"no",he:"he",iw:"he",in:"id",ji:"he"};
  if(t.toLowerCase().indexOf("zh")===0)
   return /hant|tw|hk|mo/i.test(t)?"zh-Hant":"zh-Hans";
  if(t.toLowerCase().indexOf("pt")===0)return /br/i.test(t)?"pt-BR":"pt-PT";
  if(t.toLowerCase().indexOf("en")===0)
   return /gb|uk|ie/i.test(t)?"en-GB":/au|nz/i.test(t)?"en-AU":/ca/i.test(t)?"en-CA":"en-US";
  if(t.toLowerCase().indexOf("fr")===0)return /ca/i.test(t)?"fr-CA":"fr-FR";
  if(t.toLowerCase().indexOf("es")===0)return /mx|us|ar|cl|co|pe/i.test(t)?"es-MX":"es-ES";
  if(map[base]&&D[map[base]])return map[base];
  if(D[base])return base;
  return "en-US";
 }
 function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
 function pick(){
  var q=new URLSearchParams(location.search).get("lang");
  if(q)return resolve(q);
  try{var s=localStorage.getItem("zb-lang");if(s&&D[s])return s}catch(e){}
  var list=navigator.languages||[navigator.language||"en-US"];
  for(var i=0;i<list.length;i++){var r=resolve(list[i]);if(r)return r}
  return "en-US";
 }
 var sel=document.getElementById("lang");
 L.sort(function(a,b){return D[a].langName.localeCompare(D[b].langName)});
 L.forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=D[c].langName;sel.appendChild(o)});
 function render(code){
  var d=D[code],rtl=!!RTL[code];
  document.documentElement.lang=code;
  document.documentElement.dir=rtl?"rtl":"ltr";
  sel.value=code;
  document.getElementById("langLabel").textContent=d.langLabel;
  document.title=d.pages[PAGE].title;
  var m=document.querySelector('meta[name=description]');if(m)m.setAttribute("content",d.pages[PAGE].meta);
  var nav=document.getElementById("nav");nav.innerHTML="";
  [["index.html",d.navHome],["support.html",d.navSupport],["privacy.html",d.navPrivacy],["terms.html",d.navTerms]]
   .forEach(function(p){
    var a=document.createElement("a");a.href=p[0]+(code!=="en-US"?"?lang="+code:"");a.textContent=p[1];
    if(p[0].indexOf(PAGE)===0)a.setAttribute("aria-current","page");nav.appendChild(a)});
  document.getElementById("badge").textContent=d.pages[PAGE].badge;
  document.getElementById("h1").textContent=d.pages[PAGE].h1;
  document.getElementById("lead").textContent=d.pages[PAGE].lead;
  document.getElementById("body").innerHTML=BUILD[PAGE](d,code);
  document.getElementById("foot").innerHTML=esc(d.foot)+"<br>"+esc(d.updated)+" 2026-08-26 &middot; &copy; 2026 Zipbox";
  try{localStorage.setItem("zb-lang",code)}catch(e){}
 }
 function card(title,inner){return '<section class="card"><h2>'+esc(title)+'</h2>'+inner+'</section>'}
 function tiles(items){return '<div class="grid">'+items.map(function(t){
   var i=t.indexOf("|");return '<div class="tile"><b>'+esc(t.slice(0,i))+'</b>'+esc(t.slice(i+1))+'</div>'}).join("")+'</div>'}
 function list(items){return '<ul class="plain">'+items.map(function(t){return '<li>'+esc(t)+'</li>'}).join("")+'</ul>'}
 function paras(items){return items.map(function(t){return '<p>'+esc(t)+'</p>'}).join("")}
 function qa(items){return items.map(function(p){
   return '<div class="qa"><h3>'+esc(p[0])+'</h3><p>'+esc(p[1])+'</p></div>'}).join("")}
 function mail(d){return card(d.secContact,'<p>'+esc(d.contact)+'</p><p><a class="mail" href="mailto:hourstag.app@gmail.com">hourstag.app@gmail.com</a></p><p>'+esc(d.contactHint)+'</p>')}
 var BUILD={
  "index":function(d){return card(d.secFeatures,tiles(d.tiles))
    +card(d.secFormats,'<p>'+esc(d.formatsLead)+'</p>'+list(d.fea))
    +card(d.secPrivacy,paras(d.privacyShort)+'<p><a class="cta" href="privacy.html">'+esc(d.navPrivacy)+'</a></p>')
    +card(d.secPro,paras(d.proShort))
    +mail(d)},
  "support":function(d){return card(d.secStart,list(d.start))
    +card(d.secFaq,qa(d.faq))
    +card(d.secTrouble,qa(d.trouble))
    +mail(d)},
  "privacy":function(d){return card(d.secPrivacy,paras(d.priv))
    +card(d.secPrivacyPurchase,paras(d.privPurchase))
    +mail(d)},
  "terms":function(d){return card(d.secTerms,paras(d.terms))+mail(d)}
 };
 sel.addEventListener("change",function(){
  var c=sel.value,u=new URL(location.href);u.searchParams.set("lang",c);
  history.replaceState(null,"",u);render(c)});
 render(pick());
})();
</script>
