<script>window.ZB_I18N={"ar-SA":{"langName":"العربية","langLabel":"اللغة","navHome":"الرئيسية","navSupport":"الدعم","navPrivacy":"الخصوصية","navTerms":"الشروط","foot":"يعمل Zipbox بالكامل على جهازك. بلا حساب وبلا إعلانات وبلا تحليلات وبلا رفع للملفات.","updated":"آخر تحديث","secContact":"تواصل معنا","contact":"راسلنا بأي لغة تريدها. كل رسالة يقرأها إنسان.","contactHint":"ذكر صيغة الأرشيف وإصدار iOS ونص الرسالة التي ظهرت على الشاشة يساعدنا كثيرا. ولا نعد بمدة رد ثابتة.","secStart":"البداية","start":["افتح أرشيفا من تطبيق الملفات أو البريد أو تنزيل في سفاري أو أي قائمة مشاركة واختر Zipbox، أو افتح Zipbox أولا ثم انتقل إلى الملف.","المس الأرشيف لترى ما بداخله. لا يُستخرج شيء حتى تطلب ذلك.","عاين صورة أو فيديو أو ملف PDF أو نصا أو شيفرة لتتأكد أنه الملف المقصود.","استخرج كل شيء أو العناصر التي تحتاجها فقط، ثم اختر مكان الحفظ."],"secFaq":"أسئلة شائعة","faq":[["ما الصيغ التي يفتحها Zipbox؟","ZIP وRAR و7z وTAR وGZ وBZ2 وXZ وLZMA وISO وLZ4، بما في ذلك الأرشيفات المقسمة إلى أجزاء والمحمية بكلمة سر. فتحها لا يكلف شيئا ولا يعرض إعلانات."],["هل حقا لا توجد إعلانات؟","لا توجد أي إعلانات. لا يحتوي Zipbox على مكتبة إعلانات أصلا، فلا شريط ولا مقطع بملء الشاشة ولا عد تنازلي قبل فتح الملف."],["كيف أفتح أرشيفا موجودا في الملفات أو البريد أو سفاري؟","المس الأرشيف واختر Zipbox، أو استخدم قائمة المشاركة. ويمكنك أيضا فتح Zipbox أولا ثم الانتقال إلى الملف."],["هل يمكنني إخراج ملف واحد فقط؟","نعم. افتح الأرشيف وتصفح القائمة وتأكد من الملف في المعاينة ثم استخرج هذا العنصر وحده أو ما اخترته."],["ماذا يضيف Zipbox Pro؟","إنشاء ZIP و7z بتشفير AES-256 وتقسيم إلى أجزاء، والاستخراج والضغط الدفعي، والبحث في النص الكامل داخل الأرشيف، وأدوات الملفات المتقدمة، والتصدير واختصارات Siri. ويظل الاستخراج متاحا من دونه."],["كيف أستعيد الشراء على جهاز جديد؟","سجّل الدخول بحساب Apple نفسه، وافتح الإعدادات داخل Zipbox، ثم المس استعادة المشتريات."]],"secTrouble":"إذا تعثر شيء","trouble":[["الأرشيف لا يُفتح","تأكد أولا من اكتمال التنزيل. الملف الذي نُزّل جزئيا ناقص ولا يستطيع أي تطبيق قراءته. وفي الأرشيف المقسم ضع كل الأجزاء في المجلد نفسه وافتح الجزء الأول."],["يقول إن كلمة السر خاطئة","كلمات السر حساسة لحالة الأحرف، وبعض الأرشيفات أُنشئت بترميز حروف مختلف. اكتب كلمة السر يدويا بدل لصقها، وتأكد من عدم وجود مسافة في نهايتها."],["المساحة غير كافية","الأرشيف يشغل مساحة أكبر بعد فتحه. فرّغ مساحة أولا، أو استخرج العناصر التي تحتاجها فقط بدل الأرشيف كله."],["ملف بالداخل يبدو تالفا","يعرض Zipbox ما يحتويه الأرشيف فعلا. وإذا كان الملف تالفا قبل ضغطه فلن يصلحه الاستخراج. اطلب من المرسل نسخة جديدة."]],"pages":{"support":{"title":"دعم Zipbox","meta":"مساعدة حول Zipbox: فتح الأرشيفات وكلمات السر والأرشيفات المقسمة واستعادة الشراء والتواصل.","badge":"الدعم","h1":"مساعدة حول Zipbox","lead":"أكثر الأسئلة تكرارا، وما يمكن تجربته حين يستعصي أرشيف. وإن لم تجد سؤالك فراسلنا."}}},"bn-BD":{"langName":"বাংলা","langLabel":"ভাষা","navHome":"হোম","navSupport":"সহায়তা","navPrivacy":"গোপনীয়তা","navTerms":"শর্তাবলি","foot":"Zipbox পুরোপুরি আপনার ডিভাইসেই চলে। অ্যাকাউন্ট নেই, বিজ্ঞাপন নেই, বিশ্লেষণ নেই, আপলোড নেই।","updated":"সর্বশেষ হালনাগাদ","secContact":"যোগাযোগ","contact":"যেকোনো ভাষায় আমাদের লিখুন। প্রতিটি বার্তা একজন মানুষ পড়েন।","contactHint":"আর্কাইভের ফরম্যাট, iOS-এর সংস্করণ আর পর্দায় দেখা বার্তাটি জানালে অনেক সুবিধা হয়। উত্তরের নির্দিষ্ট সময় আমরা প্রতিশ্রুতি দিই না।","secStart":"শুরু করা","start":["ফাইলস, মেইল, সাফারির ডাউনলোড বা কোনো শেয়ার মেনু থেকে আর্কাইভ খুলে Zipbox বেছে নিন, বা আগে Zipbox খুলে ফাইলটি খুঁজে নিন।","ভেতরে দেখতে আর্কাইভে টোকা দিন। আপনি না বললে কিছুই বের করা হয় না।","এটাই কাঙ্ক্ষিত ফাইল কি না নিশ্চিত হতে ছবি, ভিডিও, PDF, লেখা বা কোড প্রিভিউ করুন।","সবকিছু বের করুন, বা কেবল দরকারি জিনিসগুলো, তারপর কোথায় রাখা হবে তা বেছে নিন।"],"secFaq":"সাধারণ প্রশ্ন","faq":[["Zipbox কোন কোন ফরম্যাট খোলে?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO ও LZ4, এর মধ্যে কয়েক ভাগে ভাগ করা এবং পাসওয়ার্ড দেওয়া আর্কাইভও আছে। এগুলো খুলতে কোনো খরচ নেই এবং কোনো বিজ্ঞাপনও আসে না।"],["সত্যিই কোনো বিজ্ঞাপন নেই?","একটিও নেই। Zipbox-এর ভেতরে কোনো বিজ্ঞাপন লাইব্রেরিই নেই, তাই ব্যানার নেই, পুরো পর্দার ভিডিও নেই, ফাইল খোলার আগে কাউন্টডাউনও নেই।"],["ফাইলস, মেইল বা সাফারিতে থাকা আর্কাইভ কীভাবে খুলব?","আর্কাইভে টোকা দিয়ে Zipbox বেছে নিন, বা শেয়ার মেনু ব্যবহার করুন। চাইলে আগে Zipbox খুলে ফাইলটি খুঁজেও নিতে পারেন।"],["কেবল একটি ফাইল বের করা যায়?","যায়। আর্কাইভ খুলুন, তালিকা দেখুন, প্রিভিউতে যাচাই করুন, তারপর কেবল সেই জিনিসটি বা আপনার বেছে নেওয়া জিনিসগুলো বের করুন।"],["Zipbox Pro-তে বাড়তি কী আছে?","AES-256 এনক্রিপশন ও ভাগে ভাগ করে ZIP ও 7z তৈরি, একসঙ্গে অনেক ফাইল বের করা ও সংকুচিত করা, আর্কাইভের ভেতরে পূর্ণ লেখা খোঁজা, উন্নত ফাইল সরঞ্জাম, রপ্তানি ও Siri শর্টকাট। এটি ছাড়াও ফাইল বের করা চলতেই থাকে।"],["নতুন ডিভাইসে কেনাকাটা কীভাবে ফেরাব?","একই Apple অ্যাকাউন্টে সাইন ইন করুন, Zipbox-এর সেটিংস খুলুন এবং কেনাকাটা ফিরিয়ে আনুন-এ টোকা দিন।"]],"secTrouble":"কিছু আটকে গেলে","trouble":[["আর্কাইভ খুলছে না","আগে দেখুন ডাউনলোড শেষ হয়েছিল কি না। অর্ধেক নামা ফাইল অসম্পূর্ণ থাকে, কোনো অ্যাপই সেটি পড়তে পারে না। কয়েক ভাগের আর্কাইভ হলে সব ভাগ একই ফোল্ডারে রেখে প্রথমটি খুলুন।"],["পাসওয়ার্ড ভুল বলছে","পাসওয়ার্ডে ছোট-বড় হাতের অক্ষরের পার্থক্য থাকে, আর কিছু আর্কাইভ অন্য ক্যারেক্টার এনকোডিংয়ে বানানো। পেস্ট না করে নিজে টাইপ করুন এবং শেষে বাড়তি ফাঁকা জায়গা আছে কি না দেখুন।"],["জায়গা যথেষ্ট নেই","আর্কাইভ খোলার পর নিজের চেয়ে বেশি জায়গা নেয়। আগে জায়গা খালি করুন, বা সবকিছুর বদলে কেবল দরকারি জিনিসগুলো বের করুন।"],["ভেতরের কোনো ফাইল নষ্ট দেখাচ্ছে","আর্কাইভে সত্যিই যা আছে Zipbox তাই দেখায়। সংকুচিত হওয়ার আগেই ফাইলটি নষ্ট থাকলে বের করে সেটি ঠিক করা যায় না। প্রেরকের কাছে নতুন কপি চান।"]],"pages":{"support":{"title":"Zipbox সহায়তা","meta":"Zipbox সহায়তা: আর্কাইভ খোলা, পাসওয়ার্ড, কয়েক ভাগের আর্কাইভ, কেনাকাটা ফেরানো ও যোগাযোগ।","badge":"সহায়তা","h1":"Zipbox সহায়তা","lead":"সবচেয়ে বেশি আসা প্রশ্ন, আর কোনো আর্কাইভ বেঁকে বসলে কী করবেন। আপনার প্রশ্ন না থাকলে আমাদের লিখুন।"}}},"ca":{"langName":"Català","langLabel":"Idioma","navHome":"Inici","navSupport":"Ajuda","navPrivacy":"Privadesa","navTerms":"Condicions","foot":"El Zipbox funciona del tot al teu dispositiu. Sense compte, sense anuncis, sense analítica i sense pujades.","updated":"Última actualització","secContact":"Contacte","contact":"Escriu-nos en l'idioma que vulguis. Cada missatge el llegeix una persona.","contactHint":"Dir-nos el format de l'arxiu, la versió d'iOS i el missatge que has vist a la pantalla ajuda molt. No prometem un termini fix de resposta.","secStart":"Per començar","start":["Obre un arxiu des de Fitxers, el Mail, una baixada del Safari o un menú de compartir i tria el Zipbox, o obre primer el Zipbox i cerca el fitxer.","Toca l'arxiu per mirar-hi dins. No s'extreu res fins que ho demanes.","Previsualitza una foto, un vídeo, un PDF, un text o codi per assegurar-te que és el que buscaves.","Extreu-ho tot, o només els elements que necessites, i tria on es desen."],"secFaq":"Preguntes freqüents","faq":[["Quins formats obre el Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO i LZ4, inclosos els arxius dividits en parts i els protegits amb contrasenya. Obrir-los no costa res i no mostra cap anunci."],["De debò que no hi ha anuncis?","Cap. El Zipbox no porta cap biblioteca de publicitat a dins, així que no hi ha franges, ni vídeos a pantalla completa, ni comptes enrere abans d'obrir un fitxer."],["Com obro un arxiu que és a Fitxers, al Mail o al Safari?","Toca l'arxiu i tria el Zipbox, o fes servir el menú de compartir. També pots obrir primer el Zipbox i navegar fins al fitxer."],["Puc treure només un fitxer?","Sí. Obre l'arxiu, recorre la llista, comprova el fitxer a la vista prèvia i extreu només aquell element o la teva selecció."],["Què hi afegeix el Zipbox Pro?","Crear ZIP i 7z amb xifratge AES-256 i volums dividits, extreure i comprimir per lots, cerca de text complet dins de l'arxiu, eines avançades de fitxers, exportacions i dreceres de Siri. Extreure continua disponible sense això."],["Com restauro la compra en un dispositiu nou?","Inicia la sessió amb el mateix compte d'Apple, obre els ajustos dins del Zipbox i toca Restaurar compres."]],"secTrouble":"Si alguna cosa falla","trouble":[["L'arxiu no s'obre","Comprova primer que la baixada s'ha acabat: un fitxer baixat a mitges és incomplet i cap aplicació no el pot llegir. Si està dividit en parts, posa totes les parts a la mateixa carpeta i obre la primera."],["Diu que la contrasenya és incorrecta","Les contrasenyes distingeixen majúscules i minúscules, i alguns arxius es van crear amb una codificació de caràcters diferent. Escriu-la a mà en comptes d'enganxar-la i mira que no hi hagi un espai al final."],["No hi ha prou espai","Un arxiu ocupa més un cop obert. Allibera espai abans, o extreu només els elements que necessites en lloc de tot."],["Un fitxer de dins sembla malmès","El Zipbox mostra el que l'arxiu conté realment. Si un fitxer ja estava malmès abans de comprimir-se, extreure'l no el repara. Demana una còpia nova a qui te l'ha enviat."]],"pages":{"support":{"title":"Ajuda del Zipbox","meta":"Ajuda amb el Zipbox: obrir arxius, contrasenyes, arxius dividits, restaurar la compra i contacte.","badge":"Ajuda","h1":"Ajuda amb el Zipbox","lead":"Les preguntes que ens arriben més sovint i què provar quan un arxiu no col·labora. Si la teva no hi és, escriu-nos."}}},"zh-Hans":{"langName":"简体中文","langLabel":"语言","navHome":"首页","navSupport":"支持","navPrivacy":"隐私","navTerms":"使用条款","foot":"Zipbox 完全在你的设备上运行。没有账号、没有广告、没有分析,也不上传。","updated":"最后更新","secContact":"联系我们","contact":"用任何语言写信给我们都可以,每一封都有真人阅读。","contactHint":"如果能附上压缩包格式、iOS 版本和屏幕上看到的提示,会很有帮助。我们不承诺固定的回复时间。","secStart":"开始使用","start":["在文件 App、邮件、Safari 下载或任意分享菜单里选择 Zipbox 打开压缩包,或者先打开 Zipbox 再浏览到文件。","点一下压缩包就能看到里面的内容,在你按下解压之前不会改动任何东西。","预览照片、视频、PDF、文本或代码,确认是你要的那一个。","整包解开,或只勾选需要的项目,再选择保存到哪里。"],"secFaq":"常见问题","faq":[["Zipbox 可以打开哪些格式?","ZIP、RAR、7z、TAR、GZ、BZ2、XZ、LZMA、ISO 和 LZ4,包括分卷压缩包与带密码的压缩包。打开这些格式全部不用付费,也不会出现广告。"],["真的完全没有广告吗?","完全没有。Zipbox 里根本没有放任何广告 SDK,所以不会有横幅、不会有全屏视频,打开文件前也没有倒计时。"],["文件在文件 App、邮件或 Safari 里怎么打开?","点一下压缩包选择 Zipbox,或者用分享菜单选 Zipbox。也可以先打开 Zipbox,再浏览到那个文件。"],["可以只取出其中一个文件吗?","可以。打开压缩包、浏览清单、先预览确认,然后只解压那一个项目或你勾选的几个项目。"],["Zipbox Pro 多了什么?","创建 ZIP 与 7z 压缩包(含 AES-256 加密与分卷输出)、批量解压与批量压缩、压缩包内全文搜索、进阶文件操作、导出与 Siri 快捷指令。没有购买也一样可以解压缩。"],["换新设备怎么恢复购买?","用同一个 Apple 账户登录,打开 Zipbox 的设置页面,点「恢复购买」。"]],"secTrouble":"遇到问题时","trouble":[["压缩包打不开","先确认下载真的完成了。只下载了一半的文件本身就是不完整的,任何应用都读不了。如果是分卷文件,请把每一个分卷放在同一个文件夹里,然后打开第一个。"],["一直提示密码错误","密码区分大小写,而且有些压缩包是用不同的字符编码创建的。请手动输入而不要粘贴,并检查结尾有没有多一个空格。"],["空间不够","压缩包解开之后会比原来大。请先清出一些空间,或者不要整包解开,只取出需要的项目。"],["里面的文件看起来坏了","Zipbox 只是如实呈现压缩包里的内容。如果文件在被压缩之前就已经损坏,解压缩没有办法修复它,请向发送者要一份新的。"]],"pages":{"support":{"title":"Zipbox 支持","meta":"Zipbox 使用说明:打开压缩包、密码、分卷文件、恢复购买与联系方式。","badge":"支持","h1":"Zipbox 使用说明","lead":"这里是大家最常问的问题,以及压缩包不对劲时可以先试什么。找不到答案就写信给我们。"}}},"zh-Hant":{"langName":"繁體中文","langLabel":"語言","navHome":"首頁","navSupport":"支援","navPrivacy":"隱私權","navTerms":"使用條款","foot":"Zipbox 全部在你的裝置上執行。沒有帳號、沒有廣告、沒有分析,也不上傳。","updated":"最後更新","secContact":"聯絡我們","contact":"用任何語言寫信給我們都可以,每一封都有真人閱讀。","contactHint":"如果能附上壓縮檔格式、iOS 版本和畫面上看到的訊息,會幫上很大的忙。我們不承諾固定的回覆時間。","secStart":"開始使用","start":["從檔案 App、郵件、Safari 下載或任何分享選單選擇 Zipbox 開啟壓縮檔,或先打開 Zipbox 再瀏覽到檔案。","點一下壓縮檔就能看見裡面的內容,在你按下解壓之前不會動到任何東西。","預覽照片、影片、PDF、文字或程式碼,確認是你要的那一個。","整包解開,或只勾選需要的項目,再選擇要存到哪裡。"],"secFaq":"常見問題","faq":[["Zipbox 可以打開哪些格式?","ZIP、RAR、7z、TAR、GZ、BZ2、XZ、LZMA、ISO 和 LZ4,包含分卷壓縮檔與有密碼的壓縮檔。打開這些格式全部不用付費,也不會出現廣告。"],["真的完全沒有廣告嗎?","完全沒有。Zipbox 裡面根本沒有放任何廣告 SDK,所以不會有橫幅、不會有全螢幕影片,開檔前也沒有倒數計時。"],["檔案在檔案 App、郵件或 Safari 裡要怎麼開?","點一下壓縮檔選擇 Zipbox,或用分享選單選 Zipbox。也可以先打開 Zipbox,再瀏覽到那個檔案。"],["可以只取出其中一個檔案嗎?","可以。打開壓縮檔、瀏覽清單、先預覽確認,然後只解壓那一個項目或你勾選的幾個項目。"],["Zipbox Pro 多了什麼?","建立 ZIP 與 7z 壓縮檔(含 AES-256 加密與分卷輸出)、批次解壓與批次壓縮、壓縮包內全文搜尋、進階檔案操作、匯出與 Siri 捷徑。沒有購買也一樣可以解壓縮。"],["換新手機要怎麼還原購買?","用同一個 Apple 帳號登入,打開 Zipbox 的設定頁面,點「還原購買」。"]],"secTrouble":"遇到問題時","trouble":[["壓縮檔打不開","先確認下載真的完成了。只下載到一半的檔案本身就是不完整的,任何 App 都讀不了。如果是分卷檔案,請把每一個分卷放在同一個資料夾,然後打開第一個。"],["一直說密碼錯誤","密碼有分大小寫,而且有些壓縮檔是用不同的文字編碼建立的。請手動輸入而不要用貼上的,並檢查結尾有沒有多一個空白。"],["空間不夠","壓縮檔解開之後會比原本大。請先清出一些空間,或者不要整包解開,只取出需要的項目。"],["裡面的檔案看起來壞掉了","Zipbox 只是如實呈現壓縮檔裡的內容。如果檔案在被壓縮之前就已經損毀,解壓縮沒有辦法修復它,請向寄件者要一份新的。"]],"pages":{"support":{"title":"Zipbox 支援","meta":"Zipbox 使用說明:開啟壓縮檔、密碼、分卷檔案、還原購買與聯絡方式。","badge":"支援","h1":"Zipbox 使用說明","lead":"這裡是大家最常問的問題,以及壓縮檔怪怪的時候可以先試什麼。找不到答案就寫信給我們。"}}},"hr":{"langName":"Hrvatski","langLabel":"Jezik","navHome":"Početna","navSupport":"Podrška","navPrivacy":"Privatnost","navTerms":"Uvjeti","foot":"Zipbox radi u cijelosti na tvom uređaju. Bez računa, bez reklama, bez analitike, bez slanja.","updated":"Posljednja izmjena","secContact":"Kontakt","contact":"Piši nam na bilo kojem jeziku. Svaku poruku pročita čovjek.","contactHint":"Format arhive, verzija iOS-a i poruka koju si vidio na zaslonu jako pomažu. Ne obećavamo fiksno vrijeme odgovora.","secStart":"Za početak","start":["Otvori arhivu iz Datoteka, Maila, preuzimanja u Safariju ili izbornika dijeljenja i odaberi Zipbox, ili prvo pokreni Zipbox pa pronađi datoteku.","Dodirni arhivu da pogledaš u nju. Ništa se ne raspakirava dok ne zatražiš.","Pregledaj fotografiju, videozapis, PDF, tekst ili kod da budeš siguran da je prava datoteka.","Raspakiraj sve ili samo stavke koje trebaš i odaberi gdje će se spremiti."],"secFaq":"Česta pitanja","faq":[["Koje formate Zipbox otvara?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO i LZ4, uključujući arhive podijeljene na dijelove i one zaštićene lozinkom. Otvaranje ne stoji ništa i ne prikazuje reklame."],["Zaista nema nikakvih reklama?","Nijedne. Zipbox uopće ne sadrži oglasnu biblioteku, pa nema banera, videa preko cijelog zaslona ni odbrojavanja prije otvaranja datoteke."],["Kako otvoriti arhivu koja je u Datotekama, Mailu ili Safariju?","Dodirni arhivu i odaberi Zipbox ili upotrijebi izbornik dijeljenja. Možeš i prvo otvoriti Zipbox pa doći do datoteke."],["Mogu li izvući samo jednu datoteku?","Možeš. Otvori arhivu, prođi popis, provjeri datoteku u pregledu i raspakiraj samo tu stavku ili svoj odabir."],["Što donosi Zipbox Pro?","Stvaranje ZIP i 7z sa šifriranjem AES-256 i podjelom na dijelove, skupno raspakiravanje i pakiranje, pretraživanje cijelog teksta unutar arhive, napredne alate za datoteke, izvoz i Siri prečace. Raspakiravanje radi i bez toga."],["Kako vratiti kupnju na novom uređaju?","Prijavi se s istim Apple računom, otvori postavke u Zipboxu i dodirni Vrati kupnje."]],"secTrouble":"Kad nešto zapne","trouble":[["Arhiva se ne otvara","Prvo provjeri je li preuzimanje dovršeno. Datoteka preuzeta do pola nepotpuna je i nijedna je aplikacija ne može pročitati. Kod arhive u dijelovima stavi sve dijelove u istu mapu i otvori prvi."],["Kaže da je lozinka pogrešna","Lozinke razlikuju velika i mala slova, a neke su arhive nastale u drugom kodiranju znakova. Upiši lozinku rukom umjesto da je zalijepiš i provjeri da na kraju nije ostao razmak."],["Nema dovoljno prostora","Arhiva zauzme više kad se otvori. Prvo oslobodi prostor ili raspakiraj samo stavke koje trebaš umjesto svega."],["Datoteka unutra izgleda oštećeno","Zipbox prikazuje ono što arhiva stvarno sadrži. Ako je datoteka bila oštećena još prije pakiranja, raspakiravanje to ne popravlja. Zatraži novu kopiju od pošiljatelja."]],"pages":{"support":{"title":"Zipbox podrška","meta":"Pomoć za Zipbox: otvaranje arhiva, lozinke, arhive u dijelovima, vraćanje kupnje i kontakt.","badge":"Podrška","h1":"Pomoć za Zipbox","lead":"Pitanja koja najčešće dobivamo i što isprobati kad arhiva ne surađuje. Ako tvojeg nema, javi nam se."}}},"cs":{"langName":"Čeština","langLabel":"Jazyk","navHome":"Úvod","navSupport":"Podpora","navPrivacy":"Soukromí","navTerms":"Podmínky","foot":"Zipbox běží celý ve vašem zařízení. Bez účtu, bez reklam, bez analytiky, nic se neodesílá.","updated":"Naposledy aktualizováno","secContact":"Kontakt","contact":"Napište nám v jakémkoli jazyce. Každou zprávu čte člověk.","contactHint":"Formát archivu, verze iOS a hláška, kterou jste viděli na obrazovce, hodně pomohou. Pevnou dobu odpovědi neslibujeme.","secStart":"Začínáme","start":["Otevřete archiv ze Souborů, Mailu, stažení v Safari nebo z nabídky sdílení a zvolte Zipbox, případně nejdřív spusťte Zipbox a soubor si najděte.","Klepnutím na archiv se do něj podíváte. Nic se nerozbalí, dokud o to nepožádáte.","Prohlédněte si fotku, video, PDF, text nebo kód, abyste měli jistotu, že jde o ten správný soubor.","Rozbalte všechno, nebo jen položky, které potřebujete, a vyberte, kam se uloží."],"secFaq":"Časté dotazy","faq":[["Jaké formáty Zipbox otevře?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO a LZ4, včetně archivů rozdělených na části a archivů chráněných heslem. Otevření nic nestojí a nezobrazí žádnou reklamu."],["Opravdu nejsou žádné reklamy?","Žádné. Zipbox v sobě nemá vůbec žádnou reklamní knihovnu, takže není banner, celoobrazovkové video ani odpočet před otevřením souboru."],["Jak otevřu archiv, který je v Souborech, Mailu nebo Safari?","Klepněte na archiv a zvolte Zipbox, nebo použijte nabídku sdílení. Můžete také nejdřív otevřít Zipbox a soubor najít v něm."],["Můžu vytáhnout jen jeden soubor?","Ano. Otevřete archiv, projděte seznam, zkontrolujte soubor v náhledu a pak rozbalte jen tuhle položku nebo svůj výběr."],["Co přidává Zipbox Pro?","Vytváření ZIP a 7z se šifrováním AES-256 a dělením na svazky, dávkové rozbalení i balení, fulltextové hledání uvnitř archivu, pokročilé nástroje pro soubory, export a zkratky Siri. Rozbalování funguje i bez toho."],["Jak obnovím nákup na novém zařízení?","Přihlaste se stejným účtem Apple, otevřete nastavení v Zipboxu a klepněte na Obnovit nákupy."]],"secTrouble":"Když něco zlobí","trouble":[["Archiv se neotevře","Nejdřív ověřte, že stahování doběhlo do konce. Soubor stažený z poloviny je neúplný a nepřečte ho žádná aplikace. U archivu v částech dejte všechny části do jedné složky a otevřete tu první."],["Heslo se nepřijímá","Na velikosti písmen v heslech záleží a část archivů vznikla v jiném kódování znaků. Napište heslo ručně místo vkládání a zkontrolujte, jestli na konci nezůstala mezera."],["Nedostatek místa","Archiv po rozbalení zabere víc než sám o sobě. Uvolněte nejdřív místo, nebo rozbalte jen položky, které potřebujete."],["Soubor uvnitř vypadá poškozeně","Zipbox ukazuje to, co archiv skutečně obsahuje. Pokud byl soubor poškozený už před zabalením, rozbalení to nespraví. Požádejte odesílatele o novou kopii."]],"pages":{"support":{"title":"Podpora Zipbox","meta":"Pomoc se Zipboxem: otevírání archivů, hesla, archivy v částech, obnovení nákupu a kontakt.","badge":"Podpora","h1":"Pomoc se Zipboxem","lead":"Nejčastější dotazy a co zkusit, když archiv nespolupracuje. Pokud tu ten váš není, napište nám."}}},"da":{"langName":"Dansk","langLabel":"Sprog","navHome":"Forside","navSupport":"Support","navPrivacy":"Privatliv","navTerms":"Vilkår","foot":"Zipbox kører helt på din egen enhed. Ingen konto, ingen reklamer, ingen analyse, intet sendes af sted.","updated":"Senest opdateret","secContact":"Kontakt","contact":"Skriv til os på det sprog, du har lyst til. Hver besked bliver læst af et menneske.","contactHint":"Arkivets format, din iOS version og beskeden på skærmen hjælper meget. Vi lover ikke en fast svartid.","secStart":"Kom godt i gang","start":["Åbn et arkiv fra Filer, Mail, en overførsel i Safari eller en delingsmenu og vælg Zipbox, eller åbn Zipbox først og find filen.","Tryk på arkivet for at kigge ind i det. Der pakkes intet ud, før du beder om det.","Se et foto, en video, en PDF, en tekst eller kode for at være sikker på, at det er den rigtige fil.","Pak det hele ud, eller kun de poster du skal bruge, og vælg hvor de gemmes."],"secFaq":"Ofte stillede spørgsmål","faq":[["Hvilke formater åbner Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO og LZ4, inklusive arkiver i flere dele og arkiver med adgangskode. Det koster ingenting at åbne dem, og der vises ingen reklamer."],["Er der virkelig ingen reklamer?","Ingen overhovedet. Zipbox indeholder slet ikke noget annoncebibliotek, så der er intet banner, ingen fuldskærmsvideo og ingen nedtælling, før en fil åbner."],["Hvordan åbner jeg et arkiv, der ligger i Filer, Mail eller Safari?","Tryk på arkivet og vælg Zipbox, eller brug delingsmenuen. Du kan også åbne Zipbox først og finde filen der."],["Kan jeg trække en enkelt fil ud?","Ja. Åbn arkivet, bladr gennem listen, se filen igennem og pak så kun den post eller dit udvalg ud."],["Hvad tilføjer Zipbox Pro?","Oprettelse af ZIP og 7z med AES-256 kryptering og opdelte enheder, udpakning og komprimering i samlet hug, fritekstsøgning inde i arkiver, avancerede filværktøjer, eksport og Siri genveje. Udpakning virker også uden."],["Hvordan gendanner jeg købet på en ny enhed?","Log ind med samme Apple konto, åbn indstillingerne i Zipbox og tryk på Gendan køb."]],"secTrouble":"Hvis noget driller","trouble":[["Arkivet vil ikke åbne","Tjek først, at overførslen blev færdig. En halvt hentet fil er ufuldstændig, og ingen app kan læse den. Ved arkiver i flere dele skal alle dele ligge i samme mappe, og du åbner den første."],["Adgangskoden bliver afvist","Adgangskoder skelner mellem store og små bogstaver, og nogle arkiver er lavet med en anden tegnkodning. Skriv koden i hånden i stedet for at indsætte den, og se efter et mellemrum til sidst."],["Der er ikke plads nok","Et arkiv fylder mere, når det åbnes. Frigør plads først, eller pak kun de poster ud, du har brug for."],["En fil indeni ser ødelagt ud","Zipbox viser det, arkivet faktisk indeholder. Var en fil allerede beskadiget, før den blev komprimeret, kan udpakning ikke reparere den. Bed afsenderen om en ny kopi."]],"pages":{"support":{"title":"Zipbox Support","meta":"Hjælp til Zipbox: åbne arkiver, adgangskoder, arkiver i flere dele, gendanne køb og kontakt.","badge":"Support","h1":"Hjælp til Zipbox","lead":"De spørgsmål vi oftest får, og hvad du kan prøve, når et arkiv driller. Er dit ikke med, så skriv til os."}}},"nl-NL":{"langName":"Nederlands","langLabel":"Taal","navHome":"Start","navSupport":"Support","navPrivacy":"Privacy","navTerms":"Voorwaarden","foot":"Zipbox draait volledig op je eigen toestel. Geen account, geen reclame, geen analyse, niets wordt verstuurd.","updated":"Laatst bijgewerkt","secContact":"Contact","contact":"Schrijf ons in welke taal je wilt. Elk bericht wordt door een mens gelezen.","contactHint":"Het archieftype, je iOS versie en de melding op het scherm helpen enorm. We beloven geen vaste reactietijd.","secStart":"Zo begin je","start":["Open een archief vanuit Bestanden, Mail, een download in Safari of een deelmenu en kies Zipbox, of open Zipbox eerst en zoek het bestand op.","Tik op het archief om erin te kijken. Er wordt niets uitgepakt tot je daarom vraagt.","Bekijk een foto, video, PDF, tekst of codebestand om zeker te weten dat het de juiste is.","Pak alles uit, of alleen de onderdelen die je nodig hebt, en kies waar ze terechtkomen."],"secFaq":"Veelgestelde vragen","faq":[["Welke formaten opent Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO en LZ4, inclusief archieven in meerdere delen en archieven met een wachtwoord. Openen kost niets en toont geen reclame."],["Is er echt geen reclame?","Geen enkele. In Zipbox zit helemaal geen advertentiebibliotheek, dus geen banner, geen schermvullende video en geen aftelklok voordat een bestand opengaat."],["Hoe open ik een archief in Bestanden, Mail of Safari?","Tik op het archief en kies Zipbox, of gebruik het deelmenu. Je kunt ook eerst Zipbox openen en naar het bestand bladeren."],["Kan ik er één bestand uithalen?","Ja. Open het archief, blader door de lijst, bekijk het bestand ter controle en pak dan alleen dat onderdeel of je selectie uit."],["Wat voegt Zipbox Pro toe?","ZIP en 7z maken met AES-256 versleuteling en gesplitste delen, uitpakken en inpakken in batch, volledig zoeken binnen archieven, uitgebreide bestandsgereedschappen, export en Siri opdrachten. Uitpakken werkt ook zonder."],["Hoe herstel ik een aankoop op een nieuw toestel?","Log in met dezelfde Apple account, open de instellingen in Zipbox en tik op Aankopen herstellen."]],"secTrouble":"Als er iets misgaat","trouble":[["Het archief gaat niet open","Controleer eerst of de download helemaal klaar was. Een half gedownload bestand is onvolledig en geen enkele app kan het lezen. Zet bij een archief in meerdere delen alle delen in dezelfde map en open het eerste deel."],["Het wachtwoord wordt niet geaccepteerd","Wachtwoorden zijn hoofdlettergevoelig, en sommige archieven zijn met een andere tekencodering gemaakt. Typ het wachtwoord met de hand in plaats van het te plakken en let op een spatie aan het eind."],["Te weinig ruimte","Een archief wordt groter zodra het opengaat. Maak eerst ruimte vrij, of pak alleen de onderdelen uit die je nodig hebt."],["Een bestand lijkt beschadigd","Zipbox laat zien wat er werkelijk in het archief staat. Was een bestand al kapot voordat het werd ingepakt, dan kan uitpakken dat niet herstellen. Vraag de afzender om een nieuwe kopie."]],"pages":{"support":{"title":"Zipbox Support","meta":"Hulp bij Zipbox: archieven openen, wachtwoorden, archieven in meerdere delen, aankopen herstellen en contact.","badge":"Support","h1":"Hulp bij Zipbox","lead":"De vragen die het vaakst binnenkomen, en wat je kunt proberen als een archief niet meewerkt. Staat die van jou er niet bij, mail ons."}}},"en-AU":{"langName":"English (Australia)","langLabel":"Language","navHome":"Home","navSupport":"Support","navPrivacy":"Privacy","navTerms":"Terms","foot":"Zipbox runs entirely on your device. No account, no adverts, no analytics, no uploads.","updated":"Last updated","secContact":"Contact","contact":"Write to us in any language. A real person reads every message.","contactHint":"Telling us the archive format, your iOS version and what you saw on screen helps a great deal. We do not promise a fixed response time.","secStart":"Getting started","start":["Open an archive from Files, Mail, a Safari download or any share sheet and choose Zipbox, or open Zipbox first and browse to the file.","Tap the archive to look inside it. Nothing is extracted until you ask for it.","Preview a photo, video, PDF, text or code file to be sure it is the one you want.","Extract everything, or select only the items you need, and choose where they are saved."],"secFaq":"Frequently asked questions","faq":[["Which formats can Zipbox open?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO and LZ4, including multi part sets and password protected archives. Opening any of them costs nothing and shows no adverts."],["Is there really no advertising?","None. Zipbox contains no advertising SDK at all, so there is no banner, no full screen video and no countdown before a file opens."],["How do I open an archive that is in Files, Mail or Safari?","Tap the archive and choose Zipbox, or use the share sheet and pick Zipbox. You can also open Zipbox first and browse to the file."],["Can I get one file out without extracting everything?","Yes. Open the archive, browse the list, preview the file to be sure, then extract just that item or a selection of items."],["What does Zipbox Pro add?","Creating ZIP and 7z archives with AES-256 encryption and split volumes, batch extract and compress, full text search inside archives, advanced file tools, exports and Siri Shortcuts. Extracting stays available without it."],["How do I restore a purchase on a new device?","Sign in with the same Apple Account, open Settings inside Zipbox and tap Restore Purchases."]],"secTrouble":"Troubleshooting","trouble":[["The archive will not open","Check that the download finished. A partly downloaded file is incomplete and no app can read it. For a multi part set, put every part in the same folder and open the first one."],["It says the password is wrong","Passwords are case sensitive, and some archives were written with a different character encoding. Type the password by hand rather than pasting it, and check for a trailing space."],["There is not enough space","An archive expands to more than its own size. Free up storage first, or extract only the items you need instead of the whole archive."],["A file inside looks damaged","Zipbox reports what the archive actually contains. If a file was already corrupted before it was compressed, extracting cannot repair it. Ask the sender for a fresh copy."]],"pages":{"support":{"title":"Zipbox Support","meta":"Help with Zipbox: opening archives, passwords, multi part sets, restoring a purchase and contacting us.","badge":"Support","h1":"Help with Zipbox","lead":"The questions people ask most, and what to try when an archive misbehaves. If your question is not here, write to us."}}},"en-CA":{"langName":"English (Canada)","langLabel":"Language","navHome":"Home","navSupport":"Support","navPrivacy":"Privacy","navTerms":"Terms","foot":"Zipbox runs entirely on your device. No account, no ads, no analytics, no uploads.","updated":"Last updated","secContact":"Contact","contact":"Write to us in any language. A real person reads every message.","contactHint":"Telling us the archive format, your iOS version and what you saw on screen helps a great deal. We do not promise a fixed response time.","secStart":"Getting started","start":["Open an archive from Files, Mail, a Safari download or any share sheet and choose Zipbox, or open Zipbox first and browse to the file.","Tap the archive to look inside it. Nothing is extracted until you ask for it.","Preview a photo, video, PDF, text or code file to be sure it is the one you want.","Extract everything, or select only the items you need, and choose where they are saved."],"secFaq":"Frequently asked questions","faq":[["Which formats can Zipbox open?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO and LZ4, including multi part sets and password protected archives. Opening any of them costs nothing and shows no advertising."],["Is there really no advertising?","None. Zipbox contains no advertising SDK at all, so there is no banner, no full screen video and no countdown before a file opens."],["How do I open an archive that is in Files, Mail or Safari?","Tap the archive and choose Zipbox, or use the share sheet and pick Zipbox. You can also open Zipbox first and browse to the file."],["Can I get on h copy."]],"pages":{"support":{"title":"Zipbox Support","meta":"Help with Zipbox: opening archives, passwords, multi part sets, restoring a purchase and contacting us.","badge":"Support","h1":"Help with Zipbox","lead":"The questions people ask most, and what to try when an archive misbehaves. If your question is not here, write to us."}}},"fi":{"langName":"Suomi","langLabel":"Kieli","navHome":"Etusivu","navSupport":"Tuki","navPrivacy":"Tietosuoja","navTerms":"Ehdot","foot":"Zipbox toimii kokonaan omassa laitteessasi. Ei tiliä, ei mainoksia, ei analytiikkaa, ei lähetyksiä.","updated":"Päivitetty viimeksi","secContact":"Yhteystiedot","contact":"Kirjoita meille millä kielellä haluat. Jokaisen viestin lukee ihminen.","contactHint":"Arkiston muoto, iOS versio ja näytöllä näkynyt viesti auttavat paljon. Emme lupaa kiinteää vastausaikaa.","secStart":"Näin pääset alkuun","start":["Avaa arkisto Tiedostoista, Mailista, Safarin latauksesta tai jakovalikosta ja valitse Zipbox, tai avaa ensin Zipbox ja etsi tiedosto.","Napauta arkistoa niin näet sisään. Mitään ei pureta ennen kuin pyydät.","Esikatsele kuva, video, PDF, teksti tai koodi varmistaaksesi että se on oikea tiedosto.","Pura kaikki tai vain tarvitsemasi kohteet, ja valitse mihin ne tallennetaan."],"secFaq":"Usein kysyttyä","faq":[["Mitä muotoja Zipbox avaa?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO ja LZ4, mukaan lukien useaan osaan jaetut ja salasanalla suojatut arkistot. Niiden avaaminen ei maksa mitään eikä näytä mainoksia."],["Eikö mainoksia todella ole?","Ei lainkaan. Zipboxissa ei ole minkäänlaista mainoskirjastoa, joten ei ole banneria, ei koko näytön videota eikä laskuria ennen tiedoston avautumista."],["Miten avaan arkiston joka on Tiedostoissa, Mailissa tai Safarissa?","Napauta arkistoa ja valitse Zipbox, tai käytä jakovalikkoa. Voit myös avata ensin Zipboxin ja etsiä tiedoston."],["Voinko poimia vain yhden tiedoston?","Voit. Avaa arkisto, selaa luetteloa, tarkista tiedosto esikatselussa ja pura sitten vain se kohde tai valintasi."],["Mitä Zipbox Pro tuo lisää?","ZIP ja 7z arkistojen luonnin AES-256 salauksella ja jaetuilla osilla, purkamisen ja pakkaamisen erissä, kokotekstihaun arkiston sisällä, edistyneet tiedostotyökalut, viennit ja Siri oikotiet. Purkaminen toimii ilmankin."],["Miten palautan oston uudessa laitteessa?","Kirjaudu samalle Apple tilille, avaa Zipboxin asetukset ja napauta Palauta ostokset."]],"secTrouble":"Jos jokin takkuaa","trouble":[["Arkisto ei aukea","Tarkista ensin että lataus meni loppuun. Puoliksi ladattu tiedosto on vajaa eikä mikään sovellus pysty lukemaan sitä. Useaan osaan jaetussa arkistossa laita kaikki osat samaan kansioon ja avaa ensimmäinen."],["Salasanaa ei hyväksytä","Salasanoissa on merkitystä isoilla ja pienillä kirjaimilla, ja osa arkistoista on tehty eri merkistökoodauksella. Kirjoita salasana käsin liittämisen sijaan ja tarkista ettei loppuun jäänyt välilyöntiä."],["Tila ei riitä","Arkisto vie enemmän tilaa purettuna. Vapauta ensin tilaa tai pura vain tarvitsemasi kohteet kaiken sijaan."],["Sisällä oleva tiedosto näyttää vioittuneelta","Zipbox näyttää sen mitä arkistossa todella on. Jos tiedosto oli rikki jo ennen pakkaamista, purkaminen ei korjaa sitä. Pyydä lähettäjältä uusi kopio."]],"pages":{"support":{"title":"Zipbox tuki","meta":"Apua Zipboxiin: arkistojen avaaminen, salasanat, jaetut arkistot, ostojen palautus ja yhteystiedot.","badge":"Tuki","h1":"Apua Zipboxiin","lead":"Useimmin kysytyt kysymykset ja mitä kokeilla kun arkisto ei suostu aukeamaan. Jos omasi puuttuu, kirjoita meille."}}},"fr-CA":{"langName":"Français (Canada)","langLabel":"Langue","navHome":"Accueil","navSupport":"Assistance","navPrivacy":"Confidentialité","navTerms":"Conditions","foot":"Zipbox fonctionne entièrement sur votre appareil. Sans compte, sans publicité, sans analyse, sans envoi.","updated":"Dernière mise à jour","secContact":"Nous écrire","contact":"Écrivez-nous dans la langue de votre choix. Une vraie personne lit chaque courriel.","contactHint":"Le format de l'archive, la version d'iOS et le message affiché à l'écran nous aident beaucoup. Nous ne promettons pas de délai de réponse fixe.","secStart":"Premiers pas","start":["Ouvrez une archive depuis Fichiers, Mail, un téléchargement Safari ou une feuille de partage et choisissez Zipbox, ou lancez Zipbox et allez chercher le fichier.","Touchez l'archive pour voir ce qu'elle contient. Rien n'est extrait tant que vous ne le demandez pas.","Prévisualisez une photo, une vidéo, un PDF, un texte ou du code pour vérifier que c'est le bon fichier.","Extrayez tout, ou seulement les éléments voulus, puis choisissez leur destination."],"secFaq":"Questions fréquentes","faq":[["Quels formats Zipbox ouvre-t-il ?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO et LZ4, y compris les archives en plusieurs parties et celles protégées par mot de passe. Les ouvrir ne coûte rien et n'affiche aucune publicité."],["Il n'y a vraiment aucune publicité ?","Aucune. Zipbox ne contient tout simplement aucune bibliothèque publicitaire : pas de bannière, pas de vidéo plein écran, pas de compte à rebours avant l'ouverture."],["Comment ouvrir une archive qui est dans Fichiers, Mail ou Safari ?","Touchez l'archive et choisissez Zipbox, ou passez par la feuille de partage. Vous pouvez aussi ouvrir Zipbox d'abord et naviguer jusqu'au fichier."],["Puis-je sortir un seul fichier ?","Oui. Ouvrez l'archive, parcourez la liste, vérifiez le fichier en aperçu, puis extrayez uniquement cet élément ou votre sélection."],["Qu'apporte Zipbox Pro ?","La création de ZIP et 7z avec chiffrement AES-256 et volumes séparés, l'extraction et la compression par lot, la recherche plein texte dans une archive, les outils de fichiers avancés, l'export et les raccourcis Siri. L'extraction reste disponible sans cela."],["Comment restaurer un achat sur un nouvel appareil ?","Connectez-vous avec le même compte Apple, ouvrez les réglages dans Zipbox et touchez Restaurer les achats."]],"secTrouble":"En cas de souci","trouble":[["L'archive ne s'ouvre pas","Vérifiez d'abord que le téléchargement est allé jusqu'au bout : un fichier à moitié téléchargé est incomplet et aucune application ne peut le lire. Pour une archive en plusieurs parties, mettez toutes les parties dans le même dossier et ouvrez la première."],["Le mot de passe est refusé","Les mots de passe distinguent les majuscules, et certaines archives ont été créées avec un autre encodage de caractères. Saisissez le mot de passe à la main plutôt que de le coller et vérifiez qu'il n'y a pas d'espace à la fin."],["Espace insuffisant","Une archive occupe plus de place une fois ouverte. Libérez de l'espace, ou extrayez seulement les éléments nécessaires au lieu de la totalité."],["Un fichier semble endommagé","Zipbox restitue ce que l'archive contient réellement. Si un fichier était déjà corrompu avant d'être compressé, l'extraction ne peut pas le réparer. Demandez une nouvelle copie à l'expéditeur."]],"pages":{"support":{"title":"Assistance Zipbox","meta":"Aide sur Zipbox : ouvrir des archives, mots de passe, archives en plusieurs parties, restaurer un achat et nous écrire par courriel.","badge":"Assistance","h1":"Aide sur Zipbox","lead":"Les questions qui reviennent le plus, et quoi essayer quand une archive fait des siennes. Si la vôtre n'y est pas, écrivez-nous."}}},"fr-FR":{"langName":"Français","langLabel":"Langue","navHome":"Accueil","navSupport":"Assistance","navPrivacy":"Confidentialité","navTerms":"Conditions","foot":"Zipbox fonctionne entièrement sur votre appareil. Sans compte, sans publicité, sans analyse, sans envoi.","updated":"Dernière mise à jour","secContact":"Nous écrire","contact":"Écrivez-nous dans la langue de votre choix. Une vraie personne lit chaque message.","contactHint":"Le format de l'archive, la version d'iOS et le message affiché à l'écran nous aident beaucoup. Nous ne promettons pas de délai de réponse fixe.","secStart":"Premiers pas","start":["Ouvrez une archive depuis Fichiers, Mail, un télécharg parties dans le même dossier et ouvrez la première."],["Le mot de passe est refusé","Les mots de passe distinguent les majuscules, et certaines archives ont été créées avec un autre encodage de caractères. Saisissez le mot de passe à la main plutôt que de le coller et vérifiez qu'il n'y a pas d'espace à la fin."],["Espace insuffisant","Une archive occupe plus de place une fois ouverte. Libérez de l'espace, ou extrayez seulement les éléments nécessaires au lieu de la totalité."],["Un fichier semble endommagé","Zipbox restitue ce que l'archive contient réellement. Si un fichier était déjà corrompu avant d'être compressé, l'extraction ne peut pas le réparer. Demandez une nouvelle copie à l'expéditeur."]],"pages":{"support":{"title":"Assistance Zipbox","meta":"Aide sur Zipbox : ouvrir des archives, mots de passe, archives en plusieurs parties, restaurer un achat et nous écrire.","badge":"Assistance","h1":"Aide sur Zipbox","lead":"Les questions qui reviennent le plus, et quoi essayer quand une archive fait des siennes. Si la vôtre n'y est pas, écrivez-nous."}}},"de-DE":{"langName":"Deutsch","langLabel":"Sprache","navHome":"Start","navSupport":"Hilfe","navPrivacy":"Datenschutz","navTerms":"Nutzungsbedingungen","foot":"Zipbox läuft vollständig auf Ihrem Gerät. Kein Konto, keine Werbung, keine Analyse, kein Upload.","updated":"Zuletzt aktualisiert","secContact":"Kontakt","contact":"Schreiben Sie uns in jeder Sprache. Jede Nachricht wird von einem Menschen gelesen.","contactHint":"Archivformat, iOS Version und die Meldung auf dem Bildschirm helfen sehr. Eine feste Antwortzeit sagen wir nicht zu.","secStart":"Erste Schritte","start":["Öffnen Sie ein Archiv aus Dateien, Mail, einem Safari Download oder einem Teilen Menü mit Zipbox, oder starten Sie Zipbox und suchen die Datei dort.","Tippen Sie das Archiv an, um hineinzusehen. Nichts wird entpackt, bevor Sie es verlangen.","Sehen Sie sich ein Foto, Video, PDF, eine Text oder Codedatei an, um sicher zu sein.","Entpacken Sie alles oder nur die gewünschten Einträge und wählen Sie den Zielordner."],"secFaq":"Häufige Fragen","faq":[["Welche Formate öffnet Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO und LZ4, auch mehrteilige Sätze und passwortgeschützte Archive. Das Öffnen kostet nichts und zeigt keine Werbung."],["Gibt es wirklich keine Werbung?","Keine. In Zipbox steckt überhaupt keine Werbebibliothek, also kein Banner, kein Vollbildvideo und kein Countdown vor dem Öffnen."],["Wie öffne ich ein Archiv aus Dateien, Mail oder Safari?","Tippen Sie das Archiv an und wählen Zipbox, oder nutzen Sie das Teilen Menü. Sie können auch zuerst Zipbox öffnen und zur Datei navigieren."],["Kann ich eine einzelne Datei herausholen?","Ja. Archiv öffnen, Liste durchsehen, Datei in der Vorschau prüfen und dann nur diesen Eintrag oder eine Auswahl entpacken."],["Was bringt Zipbox Pro?","Erstellen von ZIP und 7z mit AES-256 und geteilten Bänden, stapelweises Entpacken und Packen, Volltextsuche im Archiv, erweiterte Dateiwerkzeuge, Export und Kurzbefehle. Entpacken funktioniert auch ohne."],["Wie stelle ich den Kauf auf einem neuen Gerät wieder her?","Mit demselben Apple Account anmelden, in Zipbox die Einstellungen öffnen und Käufe wiederherstellen antippen."]],"secTrouble":"Wenn etwas klemmt","trouble":[["Das Archiv lässt sich nicht öffnen","Prüfen Sie zuerst, ob der Download vollständig war. Eine halb geladene Datei ist unvollständig und lässt sich von keiner App lesen. Legen Sie bei mehrteiligen Sätzen alle Teile in denselben Ordner und öffnen Sie den ersten."],["Das Passwort wird nicht akzeptiert","Passwörter unterscheiden Groß und Kleinschreibung, und manche Archive wurden mit einer anderen Zeichenkodierung erstellt. Tippen Sie das Passwort von Hand ein statt es einzufügen und achten Sie auf ein Leerzeichen am Ende."],["Nicht genug Speicherplatz","Ein Archiv wird beim Entpacken größer als es selbst ist. Geben Sie zuerst Speicher frei oder entpacken Sie nur die benötigten Einträge."],["Eine Datei im Archiv wirkt beschädigt","Zipbox gibt wieder, was im Archiv tatsächlich steht. War eine Datei schon vor dem Packen beschädigt, kann das Entpacken sie nicht reparieren. Bitten Sie den Absender um eine neue Kopie."]],"pages":{"support":{"title":"Zipbox Hilfe","meta":"Hilfe zu Zipbox: Archive öffnen, Passwörter, mehrteilige Sätze, Käufe wiederherstellen und Kontakt.","badge":"Hilfe","h1":"Hilfe zu Zipbox","lead":"Die häufigsten Fragen und was Sie versuchen können, wenn ein Archiv sich sperrt. Fehlt Ihre Frage, schreiben Sie uns."}}},"el":{"langName":"Ελληνικά","langLabel":"Γλώσσα","navHome":"Αρχική","navSupport":"Υποστήριξη","navPrivacy":"Απόρρητο","navTerms":"Όροι","foot":"Το Zipbox εκτελείται εξ ολοκλήρου στη συσκευή σου. Χωρίς λογαριασμό, χωρίς διαφημίσεις, χωρίς ανάλυση, χωρίς αποστολές.","updated":"Τελευταία ενημέρωση","secContact":"Επικοινωνία","contact":"Γράψε μας σε όποια γλώσσα θέλεις. Κάθε μήνυμα το διαβάζει άνθρωπος.","contactHint":"Η μορφή του αρχείου, η έκδοση iOS και το μήνυμα που είδες στην οθόνη βοηθούν πολύ. Δεν υποσχόμαστε σταθερό χρόνο απάντησης.","secStart":"Ξεκινώντας","start":["Άνοιξε ένα αρχείο από τα Αρχεία, το Mail, μια λήψη στο Safari ή ένα μενού κοινής χρήσης και διάλεξε Zipbox, ή άνοιξε πρώτα το Zipbox και βρες το αρχείο.","Πάτησε το αρχείο για να δεις μέσα του. Τίποτα δεν εξάγεται μέχρι να το ζητήσεις.","Δες σε προεπισκόπηση μια φωτογραφία, ένα βίντεο, ένα PDF, κείμενο ή κώδικα για να βεβαιωθείς ότι είναι το σωστό.","Εξήγαγε τα πάντα ή μόνο όσα χρειάζεσαι και διάλεξε πού θα αποθηκευτούν."],"secFaq":"Συχνές ερωτήσεις","faq":[["Ποιες μορφές ανοίγει το Zipbox;","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO και LZ4, μαζί με αρχεία χωρισμένα σε μέρη και αρχεία με κωδικό. Το άνοιγμα δεν κοστίζει τίποτα και δεν εμφανίζει διαφημίσεις."],["Πραγματικά δεν υπάρχουν διαφημίσεις;","Καμία. Το Zipbox δεν περιέχει καθόλου διαφημιστική βιβλιοθήκη, οπότε δεν υπάρχει μπάνερ, βίντεο πλήρους οθόνης ή αντίστροφη μέτρηση πριν ανοίξει ένα αρχείο."],["Πώς ανοίγω ένα αρχείο που βρίσκεται στα Αρχεία, στο Mail ή στο Safari;","Πάτησέ το και διάλεξε Zipbox, ή χρησιμοποίησε το μενού κοινής χρήσης. Μπορείς επίσης να ανοίξεις πρώτα το Zipbox και να βρεις το αρχείο."],["Μπορώ να βγάλω μόνο ένα αρχείο;","Ναι. Άνοιξέ το, περιήγησε τη λίστα, έλεγξέ το στην προεπισκόπηση και εξήγαγε μόνο αυτό ή την επιλογή σου."],["Τι προσθέτει το Zipbox Pro;","Δημιουργία ZIP και 7z με κρυπτογράφηση AES-256 και χωρισμό σε τόμους, μαζική εξαγωγή και συμπίεση, αναζήτηση πλήρους κειμένου μέσα στο αρχείο, προηγμένα εργαλεία αρχείων, εξαγωγές και συντομεύσεις Siri. Η εξαγωγή λειτουργεί και χωρίς αυτό."],["Πώς επαναφέρω την αγορά σε νέα συσκευή;","Συνδέσου με τον ίδιο λογαριασμό Apple, άνοιξε τις ρυθμίσεις μέσα στο Zipbox και πάτησε Επαναφορά αγορών."]],"secTrouble":"Αν κάτι κολλήσει","trouble":[["Το αρχείο δεν ανοίγει","Έλεγξε πρώτα ότι η λήψη ολοκληρώθηκε. Ένα μισοκατεβασμένο αρχείο είναι ελλιπές και καμία εφαρμογή δεν μπορεί να το διαβάσει. Σε αρχεία χωρισμένα σε μέρη, βάλε όλα τα μέρη στον ίδιο φάκελο και άνοιξε το πρώτο."],["Λέει ότι ο κωδικός είναι λάθος","Οι κωδικοί ξεχωρίζουν κεφαλαία και πεζά, ενώ κάποια αρχεία δημιουργήθηκαν με διαφορετική κωδικοποίηση χαρακτήρων. Γράψε τον κωδικό με το χέρι αντί να τον επικολλήσεις και δες μήπως έμεινε κενό στο τέλος."],["Δεν υπάρχει αρκετός χώρος","Ένα συμπιεσμένο αρχείο πιάνει περισσότερο χώρο όταν ανοίξει. Ελευθέρωσε χώρο πρώτα ή εξήγαγε μόνο όσα χρειάζεσαι αντί για όλα."],["Ένα αρχείο μέσα φαίνεται κατεστραμμένο","Το Zipbox δείχνει ό,τι πραγματικά περιέχεται. Αν ένα αρχείο ήταν ήδη χαλασμένο πριν συμπιεστεί, η εξαγωγή δεν το επιδιορθώνει. Ζήτησε νέο αντίγραφο από τον αποστολέα."]],"pages":{"support":{"title":"Υποστήριξη Zipbox","meta":"Βοήθεια για το Zipbox: άνοιγμα αρχείων, κωδικοί, αρχεία σε μέρη, επαναφορά αγοράς και επικοινωνία.","badge":"Υποστήριξη","h1":"Βοήθεια για το Zipbox","lead":"Οι ερωτήσεις που λαμβάνουμε πιο συχνά και τι να δοκιμάσεις όταν ένα αρχείο δυσκολεύει. Αν λείπει η δική σου, γράψε μας."}}},"gu-IN":{"langName":"ગુજરાતી","langLabel":"ભાષા","navHome":"મુખપૃષ્ઠ","navSupport":"સહાય","navPrivacy":"ગોપનીયતા","navTerms":"શરતો","foot":"Zipbox સંપૂર્ણપણે તમારા ઉપકરણ પર ચાલે છે. ખાતું નહીં, જાહેરાત નહીં, વિશ્લેષણ નહીં, અપલોડ નહીં.","updated":"છેલ્લે સુધારેલું","secContact":"સંપર્ક","contact":"અમને કોઈ પણ ભાષામાં લખો. દરેક સંદેશ એક માણસ વાંચે છે.","contactHint":"આર્કાઇવનું ફોર્મેટ, iOS ની આવૃત્તિ અને સ્ક્રીન પર દેખાયેલો સંદેશ જણાવવાથી ઘણી મદદ મળે છે. અમે જવાબનો કોઈ નિશ્ચિત સમય આપતા નથી.","secStart":"શરૂઆત","start":["ફાઇલ્સ, મેલ, Safari ના ડાઉનલોડ કે કોઈ શેર મેનૂમાંથી આર્કાઇવ ખોલો અને Zipbox પસંદ કરો, અથવા પહેલાં Zipbox ખોલીને ફાઇલ સુધી જાઓ.","અંદર જોવા માટે આર્કાઇવ પર ટૅપ કરો. તમે કહો નહીં ત્યાં સુધી કશું કઢાતું નથી.","આ જ ફાઇલ છે તેની ખાતરી કરવા ફોટો, વીડિયો, PDF, લખાણ કે કોડનું પૂર્વાવલોકન કરો.","બધું કાઢો, અથવા ફક્ત જરૂરી વસ્તુઓ, અને ક્યાં સાચવવી તે પસંદ કરો."],"secFaq":"વારંવાર પુછાતા પ્રશ્નો","faq":[["Zipbox કયા ફોર્મેટ ખોલે છે?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO અને LZ4, જેમાં અનેક ભાગવાળી અને પાસવર્ડથી સુરક્ષિત આર્કાઇવ પણ છે. તેમને ખોલવાનું કોઈ શુલ્ક નથી અને કોઈ જાહેરાત દેખાતી નથી."],["ખરેખર કોઈ જાહેરાત નથી?","એકેય નહીં. Zipbox માં જાહેરાતની કોઈ લાઇબ્રેરી જ નથી, એટલે ન બેનર છે, ન આખી સ્ક્રીનનો વીડિયો અને ન ફાઇલ ખૂલતાં પહેલાં ઊલટી ગણતરી."],["ફાઇલ્સ, મેલ કે Safari માં રહેલી આર્કાઇવ કેવી રીતે ખોલવી?","આર્કાઇવ પર ટૅપ કરીને Zipbox પસંદ કરો, અથવા શેર મેનૂ વાપરો. તમે પહેલાં Zipbox ખોલીને ફાઇલ સુધી પણ જઈ શકો છો."],["શું ફક્ત એક ફાઇલ કાઢી શકાય?","હા. આર્કાઇવ ખોલો, યાદી જુઓ, પૂર્વાવલોકનમાં ખાતરી કરો અને પછી ફક્ત એ જ વસ્તુ કે તમારી પસંદ કરેલી વસ્તુઓ કાઢો."],["Zipbox Pro માં વધારાનું શું છે?","AES-256 એન્ક્રિપ્શન અને ભાગમાં વહેંચીને ZIP અને 7z બનાવવું, એકસાથે અનેક ફાઇલો કાઢવી અને સંકોચવી, આર્કાઇવની અંદર આખું લખાણ શોધવું, અદ્યતન ફાઇલ સાધનો, નિકાસ અને Siri શોર્ટકટ. તેના વગર પણ ફાઇલ કાઢવાનું ચાલુ જ રહે છે."],["નવા ઉપકરણ પર ખરીદી કેવી રીતે પાછી લાવવી?","એ જ Apple ખાતાથી સાઇન ઇન કરો, Zipbox ની સેટિંગ ખોલો અને ખરીદી પુનઃસ્થાપિત કરો પર ટૅપ કરો."]],"secTrouble":"કંઈક અટકે ત્યારે","trouble":[["આર્કાઇવ ખૂલતી નથી","પહેલાં જુઓ કે ડાઉનલોડ પૂરું થયું હતું કે નહીં. અધૂરી ઊતરેલી ફાઇલ અધૂરી જ હોય છે અને તેને કોઈ એપ વાંચી શકતી નથી. અનેક ભાગવાળી આર્કાઇવ માટે બધા ભાગ એક જ ફોલ્ડરમાં રાખો અને પહેલો ભાગ ખોલો."],["પાસવર્ડ ખોટો બતાવે છે","પાસવર્ડમાં નાના અને મોટા અક્ષરનો ફેર હોય છે, અને કેટલીક આર્કાઇવ બીજી કેરેક્ટર એન્કોડિંગથી બની હોય છે. પેસ્ટ કરવાને બદલે જાતે ટાઇપ કરો અને છેડે ખાલી જગ્યા રહી નથી તે ચકાસો."],["જગ્યા પૂરતી નથી","આર્કાઇવ ખૂલ્યા પછી પોતાના કદ કરતાં વધારે જગ્યા લે છે. પહેલાં જગ્યા ખાલી કરો, અથવા બધું કાઢવાને બદલે ફક્ત જરૂરી વસ્તુઓ કાઢો."],["અંદરની કોઈ ફાઇલ બગડેલી લાગે છે","આર્કાઇવમાં ખરેખર જે છે તે જ Zipbox બતાવે છે. જો ફાઇલ સંકોચાયા પહેલાં જ બગડેલી હોય તો કાઢવાથી તે સુધરતી નથી. મોકલનાર પાસેથી નવી નકલ માગો."]],"pages":{"support":{"title":"Zipbox સહાય","meta":"Zipbox સહાય: આર્કાઇવ ખોલવી, પાસવર્ડ, ભાગવાળી આર્કાઇવ, ખરીદી પુનઃસ્થાપિત કરવી અને સંપર્ક.","badge":"સહાય","h1":"Zipbox સહાય","lead":"સૌથી વધુ પુછાતા પ્રશ્નો, અને કોઈ આર્કાઇવ ન ખૂલે ત્યારે શું અજમાવવું. તમારો પ્રશ્ન અહીં ન હોય તો અમને લખો."}}},"he":{"langName":"עברית","langLabel":"שפה","navHome":"בית","navSupport":"תמיכה","navPrivacy":"פרטיות","navTerms":"תנאים","foot":"Zipbox פועל כולו על המכשיר שלכם. בלי חשבון, בלי פרסומות, בלי אנליטיקה ובלי העלאות.","updated":"עודכן לאחרונה","secContact":"יצירת קשר","contact":"כתבו לנו בכל שפה. כל הודעה נקראת בידי אדם.","contactHint":"פורמט הארכיון, גרסת iOS וההודעה שראיתם על המסך עוזרים מאוד. איננו מבטיחים זמן תגובה קבוע.","secStart":"איך מתחילים","start":["פתחו ארכיון מהקבצים, מהדואר, מהורדה בספארי או מתפריט שיתוף ובחרו Zipbox, או פתחו קודם את Zipbox ונווטו לקובץ.","הקישו על הארכיון כדי להציץ פנימה. שום דבר לא מחולץ עד שתבקשו.","צפו בתמונה, בווידאו, בקובץ PDF, בטקסט או בקוד כדי לוודא שזה הקובץ הנכון.","חלצו הכול, או רק את הפריטים שצריך, ובחרו לאן הם נשמרים."],"secFaq":"שאלות נפוצות","faq":[["אילו פורמטים Zipbox פותח?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO וLZ4, כולל ארכיונים מפוצלים לחלקים וארכיונים מוגני סיסמה. פתיחתם לא עולה כלום ואינה מציגה פרסומות."],["באמת אין שום פרסומת?","אין. ב-Zipbox אין בכלל ספריית פרסום, ולכן אין באנר, אין סרטון במסך מלא ואין ספירה לאחור לפני שקובץ נפתח."],["איך פותחים ארכיון שנמצא בקבצים, בדואר או בספארי?","הקישו על הארכיון ובחרו Zipbox, או השתמשו בתפריט השיתוף. אפשר גם לפתוח קודם את Zipbox ולנווט לקובץ."],["אפשר להוציא קובץ אחד בלבד?","בהחלט. פתחו את הארכיון, עברו על הרשימה, בדקו בתצוגה המקדימה וחלצו רק את הפריט הזה או את הבחירה שלכם."],["מה Zipbox Pro מוסיף?","יצירת ZIP ו7z עם הצפנת AES-256 ופיצול לכרכים, חילוץ ודחיסה באצווה, חיפוש בטקסט המלא בתוך הארכיון, כלי קבצים מתקדמים, ייצוא וקיצורי Siri. החילוץ עובד גם בלי זה."],["איך משחזרים רכישה במכשיר חדש?","היכנסו עם אותו חשבון Apple, פתחו את ההגדרות בתוך Zipbox והקישו על שחזור רכישות."]],"secTrouble":"כשמשהו נתקע","trouble":[["הארכיון לא נפתח","בדקו קודם שההורדה הסתיימה. קובץ שהורד באמצע אינו שלם ואף אפליקציה לא תוכל לקרוא אותו. בארכיון מפוצל שימו את כל החלקים באותה תיקייה ופתחו את הראשון."],["כתוב שהסיסמה שגויה","בסיסמאות יש הבדל בין אותיות גדולות לקטנות, וחלק מהארכיונים נוצרו בקידוד תווים אחר. הקלידו את הסיסמה ידנית במקום להדביק ובדקו שלא נשאר רווח בסוף."],["אין מספיק מקום","ארכיון תופס יותר מקום אחרי שנפתח. פנו מקום קודם, או חלצו רק את הפריטים שצריך במקום את הכול."],["קובץ בפנים נראה פגום","Zipbox מציג את מה שהארכיון באמת מכיל. אם קובץ היה פגום עוד לפני הדחיסה, החילוץ לא יתקן אותו. בקשו מהשולח עותק חדש."]],"pages":{"support":{"title":"תמיכה ב-Zipbox","meta":"עזרה ב-Zipbox: פתיחת ארכיונים, סיסמאות, ארכיונים מפוצלים, שחזור רכישה ויצירת קשר.","badge":"תמיכה","h1":"עזרה ב-Zipbox","lead":"השאלות שחוזרות הכי הרבה, ומה כדאי לנסות כשארכיון מתעקש. אם שלכם לא כאן, כתבו לנו."}}},"hi":{"langName":"हिन्दी","langLabel":"भाषा","navHome":"मुखपृष्ठ","navSupport":"सहायता","navPrivacy":"गोपनीयता","navTerms":"शर्तें","foot":"Zipbox पूरी तरह आपके डिवाइस पर चलता है। कोई खाता नहीं, कोई विज्ञापन नहीं, कोई विश्लेषण नहीं, कोई अपलोड नहीं।","updated":"अंतिम अद्यतन","secContact":"संपर्क","contact":"हमें किसी भी भाषा में लिखिए। हर संदेश एक इंसान पढ़ता है।","contactHint":"संग्रह का फ़ॉर्मैट, iOS का संस्करण और स्क्रीन पर दिखा संदेश बताने से बहुत मदद मिलती है। हम जवाब का कोई निश्चित समय नहीं देते।","secStart":"शुरुआत कैसे करें","start":["फ़ाइल्स, मेल, Safari के डाउनलोड या किसी शेयर मेन्यू से संग्रह खोलिए और Zipbox चुनिए, या पहले Zipbox खोलकर फ़ाइल तक जाइए।","अंदर देखने के लिए संग्रह पर टैप कीजिए। जब तक आप न कहें, कुछ नहीं निकाला जाता।","यह पक्का करने के लिए कि यही फ़ाइल है, तस्वीर, वीडियो, PDF, टेक्स्ट या कोड का पूर्वावलोकन कीजिए।","सब कुछ निकालिए, या सिर्फ़ ज़रूरी चीज़ें, और तय कीजिए कि वे कहाँ सहेजी जाएँ।"],"secFaq":"अक्सर पूछे जाने वाले प्रश्न","faq":[["Zipbox कौन से फ़ॉर्मैट खोलता है?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO और LZ4, जिनमें कई हिस्सों वाली और पासवर्ड से सुरक्षित फ़ाइलें भी शामिल हैं। इन्हें खोलने का कोई शुल्क नहीं और कोई विज्ञापन नहीं दिखता।"],["क्या सचमुच कोई विज्ञापन नहीं है?","बिल्कुल नहीं। Zipbox में विज्ञापन की कोई लाइब्रेरी है ही नहीं, इसलिए न बैनर है, न पूरी स्क्रीन का वीडियो और न फ़ाइल खुलने से पहले उलटी गिनती।"],["फ़ाइल्स, मेल या Safari में मौजूद संग्रह कैसे खोलें?","संग्रह पर टैप करके Zipbox चुनिए, या शेयर मेन्यू का उपयोग कीजिए। आप पहले Zipbox खोलकर फ़ाइल तक भी जा सकते हैं।"],["क्या सिर्फ़ एक फ़ाइल निकाली जा सकती है?","हाँ। संग्रह खोलिए, सूची देखिए, पूर्वावलोकन में जाँचिए और सिर्फ़ वही वस्तु या अपनी चुनी हुई वस्तुएँ निकालिए।"],["Zipbox Pro में अतिरिक्त क्या है?","AES-256 एन्क्रिप्शन और हिस्सों में बाँटकर ZIP और 7z बनाना, एक साथ कई फ़ाइलें निकालना और संपीड़ित करना, संग्रह के अंदर पूरा टेक्स्ट खोजना, उन्नत फ़ाइल उपकरण, निर्यात और Siri शॉर्टकट। इसके बिना भी फ़ाइल निकालना चलता रहता है।"],["नए डिवाइस पर ख़रीद कैसे बहाल करें?","उसी Apple खाते से साइन इन कीजिए, Zipbox की सेटिंग खोलिए और ख़रीद बहाल करें पर टैप कीजिए।"]],"secTrouble":"अगर कुछ अटक जाए","trouble":[["संग्रह फ़ाइल नहीं खुल रही","पहले देखिए कि डाउनलोड पूरा हुआ था या नहीं। आधी डाउनलोड हुई फ़ाइल अधूरी होती है और उसे कोई ऐप नहीं पढ़ सकता। कई हिस्सों वाली फ़ाइल के लिए सभी हिस्से एक ही फ़ोल्डर में रखिए और पहला हिस्सा खोलिए।"],["पासवर्ड ग़लत बता रहा है","पासवर्ड में छोटे और बड़े अक्षर का फ़र्क़ होता है, और कुछ संग्रह दूसरी कैरेक्टर एन्कोडिंग से बने होते हैं। पेस्ट करने के बजाय ख़ुद टाइप कीजिए और देखिए कि आख़िर में कोई ख़ाली जगह तो नहीं रह गई।"],["जगह कम है","संग्रह खुलने के बाद अपने आकार से ज़्यादा जगह लेता है। पहले जगह ख़ाली कीजिए, या सब कुछ निकालने के बजाय सिर्फ़ ज़रूरी चीज़ें निकालिए।"],["अंदर की कोई फ़ाइल ख़राब लग रही है","Zipbox वही दिखाता है जो संग्रह में सचमुच है। अगर फ़ाइल संपीड़ित होने से पहले ही ख़राब थी तो निकालने से वह ठीक नहीं होगी। भेजने वाले से नई प्रति माँगिए।"]],"pages":{"support":{"title":"Zipbox सहायता","meta":"Zipbox की सहायता: संग्रह खोलना, पासवर्ड, कई हिस्सों वाली फ़ाइलें, ख़रीद बहाल करना और संपर्क।","badge":"सहायता","h1":"Zipbox की सहायता","lead":"सबसे ज़्यादा पूछे जाने वाले सवाल, और जब कोई संग्रह न खुले तो क्या आज़माएँ। आपका सवाल यहाँ न हो तो हमें लिखिए।"}}},"hu":{"langName":"Magyar","langLabel":"Nyelv","navHome":"Főoldal","navSupport":"Támogatás","navPrivacy":"Adatvédelem","navTerms":"Feltételek","foot":"A Zipbox teljes egészében a te készülékeden fut. Nincs fiók, nincs reklám, nincs elemzés, semmi nem megy sehova.","updated":"Utoljára frissítve","secContact":"Kapcsolat","contact":"Írj nekünk bármilyen nyelven. Minden üzenetet ember olvas el.","contactHint":"Az archívum formátuma, az iOS verziója és a képernyőn látott üzenet sokat segít. Fix válaszidőt nem ígérünk.","secStart":"Kezdő lépések","start":["Nyiss meg egy archívumot a Fájlokból, a Mailből, egy Safari letöltésből vagy egy megosztási menüből, és válaszd a Zipboxot, vagy indítsd el előbb a Zipboxot, és keresd meg a fájlt.","Koppints az archívumra, hogy belenézz. Semmi nem bomlik ki, amíg nem kéred.","Nézd meg előnézetben a fényképet, videót, PDF-et, szöveget vagy kódot, hogy biztosan a keresett fájl legyen.","Bontsd ki az egészet, vagy csak a szükséges elemeket, és válaszd ki, hova kerüljenek."],"secFaq":"Gyakori kérdések","faq":[["Milyen formátumokat nyit meg a Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO és LZ4, köztük a több részre bontott és a jelszóval védett archívumokat is. Bármelyik megnyitása ingyenes, és nem jelenik meg reklám."],["Tényleg nincs benne reklám?","Egy sem. A Zipboxban egyáltalán nincs hirdetési könyvtár, így nincs szalag, nincs teljes képernyős videó és nincs visszaszámlálás a fájl megnyitása előtt."],["Hogyan nyitok meg egy archívumot a Fájlokból, a Mailből vagy a Safariból?","Koppints az archívumra, és válaszd a Zipboxot, vagy használd a megosztási menüt. Elindíthatod előbb a Zipboxot is, és megkeresheted benne a fájlt."],["Kivehetek egyetlen fájlt?","Igen. Nyisd meg az archívumot, görgesd végig a listát, nézd meg előnézetben, majd csak azt az elemet vagy a kijelölésedet bontsd ki."],["Mit ad hozzá a Zipbox Pro?","ZIP és 7z készítése AES-256 titkosítással és kötetekre bontással, kötegelt kibontás és tömörítés, teljes szöveges keresés az archívumon belül, haladó fájlműveletek, exportálás és Siri parancsok. A kicsomagolás enélkül is működik."],["Hogyan állítom vissza a vásárlást új készüléken?","Jelentkezz be ugyanazzal az Apple fiókkal, nyisd meg a beállításokat a Zipboxban, és koppints a Vásárlások visszaállítása gombra."]],"secTrouble":"Ha valami akadozik","trouble":[["Nem nyílik meg az archívum","Először ellenőrizd, hogy a letöltés végigfutott-e. A félig letöltött fájl hiányos, és semmilyen alkalmazás nem tudja beolvasni. Több részre bontott archívumnál tedd az összes részt ugyanabba a mappába, és az elsőt nyisd meg."],["Azt írja, hibás a jelszó","A jelszavakban számít a kis- és nagybetű, és egyes archívumok más karakterkódolással készültek. Gépeld be kézzel beillesztés helyett, és nézd meg, nem maradt-e szóköz a végén."],["Nincs elég hely","Az archívum kibontva többet foglal, mint önmagában. Szabadíts fel helyet előbb, vagy csak a szükséges elemeket bontsd ki az egész helyett."],["Egy fájl belül sérültnek tűnik","A Zipbox azt mutatja, ami valóban az archívumban van. Ha egy fájl már a tömörítés előtt sérült volt, a kibontás nem javítja meg. Kérj új példányt a küldőtől."]],"pages":{"support":{"title":"Zipbox támogatás","meta":"Segítség a Zipboxhoz: archívumok megnyitása, jelszavak, több részre bontott archívumok, vásárlás visszaállítása és kapcsolat.","badge":"Támogatás","h1":"Segítség a Zipboxhoz","lead":"A leggyakoribb kérdések, és hogy mit érdemes kipróbálni, ha egy archívum makacskodik. Ha a tiéd nincs itt, írj nekünk."}}},"id":{"langName":"Bahasa Indonesia","langLabel":"Bahasa","navHome":"Beranda","navSupport":"Bantuan","navPrivacy":"Privasi","navTerms":"Ketentuan","foot":"Zipbox berjalan sepenuhnya di perangkatmu. Tanpa akun, tanpa iklan, tanpa analitik, tanpa unggahan.","updated":"Terakhir diperbarui","secContact":"Kontak","contact":"Tulis ke kami dalam bahasa apa pun. Setiap pesan dibaca orang sungguhan.","contactHint":"Menyebutkan format arsip, versi iOS, dan pesan yang muncul di layar sangat membantu. Kami tidak menjanjikan waktu balasan yang pasti.","secStart":"Cara memulai","start":["Buka arsip dari Berkas, Mail, unduhan Safari, atau menu berbagi lalu pilih Zipbox, atau buka Zipbox lebih dulu dan telusuri berkasnya.","Ketuk arsip untuk melihat isinya. Tidak ada yang diekstrak sampai kamu memintanya.","Pratinjau foto, video, PDF, teks, atau kode untuk memastikan itu berkas yang kamu cari.","Ekstrak semuanya, atau hanya butir yang kamu perlukan, lalu pilih tempat menyimpannya."],"secFaq":"Pertanyaan umum","faq":[["Format apa saja yang bisa dibuka Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO, dan LZ4, termasuk arsip terbagi beberapa bagian dan arsip berkata sandi. Membukanya tidak dipungut biaya dan tidak menampilkan iklan."],["Benar-benar tidak ada iklan?","Tidak ada sama sekali. Di dalam Zipbox tidak ada pustaka iklan apa pun, jadi tidak ada spanduk, video layar penuh, atau hitungan mundur sebelum berkas terbuka."],["Bagaimana membuka arsip yang ada di Berkas, Mail, atau Safari?","Ketuk arsipnya lalu pilih Zipbox, atau gunakan menu berbagi. Kamu juga bisa membuka Zipbox dulu lalu menelusuri berkasnya."],["Bisakah mengeluarkan satu berkas saja?","Bisa. Buka arsipnya, telusuri daftarnya, periksa lewat pratinjau, lalu ekstrak hanya butir itu atau pilihanmu."],["Apa yang ditambahkan Zipbox Pro?","Membuat ZIP dan 7z dengan enkripsi AES-256 dan pembagian volume, ekstrak dan kompres sekaligus banyak, pencarian teks penuh di dalam arsip, perkakas berkas tingkat lanjut, ekspor, dan Pintasan Siri. Mengekstrak tetap bisa tanpa itu."],["Bagaimana memulihkan pembelian di perangkat baru?","Masuk dengan akun Apple yang sama, buka pengaturan di dalam Zipbox, lalu ketuk Pulihkan Pembelian."]],"secTrouble":"Kalau ada yang macet","trouble":[["Arsip tidak mau terbuka","Pastikan dulu unduhannya selesai. Berkas yang terunduh separuh itu tidak lengkap dan tidak bisa dibaca aplikasi mana pun. Untuk arsip terbagi, letakkan semua bagian di folder yang sama lalu buka bagian pertama."],["Kata sandi ditolak","Kata sandi membedakan huruf besar dan kecil, dan sebagian arsip dibuat dengan pengodean karakter berbeda. Ketik manual alih-alih menempel, dan periksa apakah ada spasi di akhir."],["Ruang penyimpanan kurang","Arsip memakan tempat lebih besar setelah dibuka. Kosongkan ruang dulu, atau ekstrak hanya butir yang kamu perlukan alih-alih semuanya."],["Berkas di dalamnya tampak rusak","Zipbox menampilkan apa yang benar-benar ada di dalam arsip. Kalau berkas sudah rusak sebelum dikompres, mengekstrak tidak akan memperbaikinya. Minta salinan baru dari pengirim."]],"pages":{"support":{"title":"Bantuan Zipbox","meta":"Bantuan Zipbox: membuka arsip, kata sandi, arsip terbagi, memulihkan pembelian, dan kontak.","badge":"Bantuan","h1":"Bantuan Zipbox","lead":"Pertanyaan yang paling sering masuk dan apa yang bisa dicoba saat sebuah arsip membandel. Kalau punyamu belum ada, tulis ke kami."}}},"it":{"langName":"Italiano","langLabel":"Lingua","navHome":"Home","navSupport":"Assistenza","navPrivacy":"Privacy","navTerms":"Condizioni","foot":"Zipbox funziona interamente sul tuo dispositivo. Nessun account, nessuna pubblicità, nessuna analisi, nessun caricamento.","updated":"Ultimo aggiornamento","secContact":"Contatti","contact":"Scrivici nella lingua che preferisci. Ogni messaggio viene letto da una persona.","contactHint":"Indicare il formato dell'archivio, la versione di iOS e il messaggio visto sullo schermo aiuta molto. Non promettiamo tempi di risposta fissi.","secStart":"Come iniziare","start":["Apri un archivio da File, Mail, un download di Safari o un menu di condivisione e scegli Zipbox, oppure apri prima Zipbox e cerca il file.","Tocca l'archivio per guardarci dentro. Nulla viene estratto finché non lo chiedi.","Vedi in anteprima una foto, un video, un PDF, un testo o del codice per essere sicuro che sia il file giusto.","Estrai tutto, oppure solo le voci che ti servono, e scegli dove salvarle."],"secFaq":"Domande frequenti","faq":[["Quali formati apre Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO e LZ4, compresi gli archivi divisi in più parti e quelli protetti da password. Aprirli non costa nulla e non mostra pubblicità."],["Davvero non c'è pubblicità?","Nessuna. In Zipbox non è presente alcuna libreria pubblicitaria, quindi niente banner, niente video a schermo intero e nessun conto alla rovescia prima di aprire un file."],["Come apro un archivio che si trova in File, Mail o Safari?","Tocca l'archivio e scegli Zipbox, oppure usa il menu di condivisione. Puoi anche aprire prima Zipbox e cercare il file."],["Posso tirare fuori un solo file?","Sì. Apri l'archivio, scorri l'elenco, controlla il file in anteprima e poi estrai solo quella voce o la tua selezione."],["Cosa aggiunge Zipbox Pro?","Creazione di ZIP e 7z con crittografia AES-256 e volumi divisi, estrazione e compressione in blocco, ricerca a testo pieno dentro gli archivi, strumenti avanzati per i file, esportazioni e comandi rapidi. L'estrazione resta disponibile anche senza."],["Come ripristino l'acquisto su un dispositivo nuovo?","Accedi con lo stesso account Apple, apri le impostazioni dentro Zipbox e tocca Ripristina acquisti."]],"secTrouble":"Se qualcosa non va","trouble":[["L'archivio non si apre","Controlla prima che il download sia arrivato in fondo: un file scaricato a metà è incompleto e nessuna app riesce a leggerlo. Per un archivio in più parti, metti tutte le parti nella stessa cartella e apri la prima."],["Dice che la password è sbagliata","Le password distinguono maiuscole e minuscole, e alcuni archivi sono stati creati con una codifica dei caratteri diversa. Digita la password a mano invece di incollarla e controlla che non ci sia uno spazio finale."],["Spazio insufficiente","Un archivio, una volta aperto, occupa più del file stesso. Libera spazio prima, oppure estrai solo le voci che ti servono."],["Un file dentro sembra danneggiato","Zipbox mostra quello che l'archivio contiene davvero. Se un file era già rovinato prima di essere compresso, l'estrazione non può ripararlo. Chiedi al mittente una copia nuova."]],"pages":{"support":{"title":"Assistenza Zipbox","meta":"Aiuto su Zipbox: aprire archivi, password, archivi in più parti, ripristinare un acquisto e contatti.","badge":"Assistenza","h1":"Aiuto su Zipbox","lead":"Le domande più frequenti e cosa provare quando un archivio fa i capricci. Se la tua non c'è, scrivici."}}},"ja":{"langName":"日本語","langLabel":"言語","navHome":"ホーム","navSupport":"サポート","navPrivacy":"プライバシー","navTerms":"利用規約","foot":"Zipboxはすべて端末の中で動きます。アカウントなし、広告なし、解析なし、アップロードなし。","updated":"最終更新","secContact":"お問い合わせ","contact":"どの言語で書いていただいてもかまいません。すべてのメールに人が目を通しています。","contactHint":"書庫の形式、iOSのバージョン、画面に出た表示を添えていただけると助かります。返信の期限はお約束していません。","secStart":"使いはじめる","start":["ファイルApp、メール、Safariのダウンロード、共有シートから書庫を選んでZipboxで開くか、先にZipboxを開いてファイルをたどります。","書庫をタップすると中身が表示されます。展開を指示するまで何も取り出されません。","写真・動画・PDF・テキスト・ソースコードをプレビューして、目的のファイルかどうかを確かめます。","まとめて展開するか、必要な項目だけを選び、保存先を指定します。"],"secFaq":"よくある質問","faq":[["どの形式に対応していますか。","ZIP・RAR・7z・TAR・GZ・BZ2・XZ・LZMA・ISO・LZ4です。分割書庫やパスワード付きの書庫も含みます。どれを開くにも料金はかからず、広告も表示されません。"],["本当に広告は出ませんか。","出ません。Zipboxには広告SDKそのものが入っていないため、バナーも全画面動画も、開くまでのカウントダウンもありません。"],["ファイルApp・メール・Safariにある書庫はどう開きますか。","書庫をタップしてZipboxを選ぶか、共有シートからZipboxを選びます。先にZipboxを開いてファイルをたどることもできます。"],["1つのファイルだけ取り出せますか。","できます。書庫を開いて一覧をたどり、プレビューで確認してから、その項目だけ、または選んだ項目だけを展開します。"],["Zipbox Proで何が増えますか。","AES-256暗号化と分割出力に対応したZIP・7zの作成、まとめて展開と圧縮、書庫内の全文検索、詳細なファイル操作、書き出し、ショートカット連携です。購入しなくても展開はそのまま使えます。"],["機種変更したときの復元方法は。","同じApple アカウントでサインインし、Zipboxの設定画面で「購入を復元」をタップしてください。"]],"secTrouble":"うまくいかないとき","trouble":[["書庫が開きません","まずダウンロードが最後まで終わっているか確認してください。途中で止まったファイルはそれ自体が不完全で、どのアプリでも読めません。分割書庫の場合は、すべてのパートを同じフォルダに置いて最初のパートを開きます。"],["パスワードが違うと表示されます","パスワードは大文字と小文字を区別します。書庫によっては別の文字コードで作られていることもあります。貼り付けずに手で入力し、末尾に空白が入っていないか確認してください。"],["空き容量が足りません","書庫は展開すると元より大きくなります。空き容量を確保するか、すべてではなく必要な項目だけを取り出してください。"],["中のファイルが壊れています","Zipboxは書庫の中身をそのまま扱います。圧縮される前から壊れていたファイルは、展開しても直せません。送り主に新しいものを送ってもらってください。"]],"pages":{"support":{"title":"Zipbox サポート","meta":"Zipboxの使い方:書庫を開く、パスワード、分割書庫、購入の復元、お問い合わせ。","badge":"サポート","h1":"Zipboxの使い方","lead":"よくいただく質問と、書庫がうまく開かないときに試すことをまとめました。見つからなければご連絡ください。"}}},"kn-IN":{"langName":"ಕನ್ನಡ","langLabel":"ಭಾಷೆ","navHome":"ಮುಖಪುಟ","navSupport":"ಸಹಾಯ","navPrivacy":"ಗೌಪ್ಯತೆ","navTerms":"ನಿಯಮಗಳು","foot":"Zipbox ಸಂಪೂರ್ಣವಾಗಿ ನಿಮ್ಮ ಸಾಧನದಲ್ಲೇ ಚಲಿಸುತ್ತದೆ. ಖಾತೆ ಇಲ್ಲ, ಜಾಹೀರಾತು ಇಲ್ಲ, ವಿಶ್ಲೇಷಣೆ ಇಲ್ಲ, ಅಪ್‌ಲೋಡ್ ಇಲ್ಲ.","updated":"ಕೊನೆಯ ನವೀಕರಣ","secContact":"ಸಂಪರ್ಕ","contact":"ಯಾವುದೇ ಭಾಷೆಯಲ್ಲಿ ನಮಗೆ ಬರೆಯಿರಿ. ಪ್ರತಿ ಸಂದೇಶವನ್ನೂ ಒಬ್ಬ ವ್ಯಕ್ತಿ ಓದುತ್ತಾರೆ.","contactHint":"ಆರ್ಕೈವ್‌ನ ಸ್ವರೂಪ, iOS ಆವೃತ್ತಿ ಮತ್ತು ಪರದೆಯಲ್ಲಿ ಕಂಡ ಸಂದೇಶ ತಿಳಿಸಿದರೆ ತುಂಬಾ ಸಹಾಯವಾಗುತ್ತದೆ. ಉತ್ತರಕ್ಕೆ ನಿಗದಿತ ಸಮಯವನ್ನು ನಾವು ಭರವಸೆ ನೀಡುವುದಿಲ್ಲ.","secStart":"ಹೇಗೆ ಆರಂಭಿಸುವುದು","start":["ಫೈಲ್ಸ್, ಮೇಲ್, Safari ಡೌನ್‌ಲೋಡ್ ಅಥವಾ ಯಾವುದೇ ಹಂಚಿಕೆ ಮೆನುವಿನಿಂದ ಆರ್ಕೈವ್ ತೆರೆದು Zipbox ಆರಿಸಿ, ಅಥವಾ ಮೊದಲು Zipbox ತೆರೆದು ಫೈಲ್ ಹುಡುಕಿ.","ಒಳಗೆ ನೋಡಲು ಆರ್ಕೈವ್ ಮೇಲೆ ತಟ್ಟಿ. ನೀವು ಹೇಳುವವರೆಗೆ ಏನೂ ತೆಗೆಯುವುದಿಲ್ಲ.","ಇದೇ ಬೇಕಾದ ಫೈಲ್ ಎಂದು ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಲು ಚಿತ್ರ, ವೀಡಿಯೊ, PDF, ಪಠ್ಯ ಅಥವಾ ಕೋಡ್ ಮುನ್ನೋಟ ಪಡೆಯಿರಿ.","ಎಲ್ಲವನ್ನೂ ತೆಗೆಯಿರಿ, ಅಥವಾ ಬೇಕಾದವುಗಳನ್ನು ಮಾತ್ರ, ನಂತರ ಎಲ್ಲಿ ಉಳಿಸಬೇಕೆಂದು ಆರಿಸಿ."],"secFaq":"ಪದೇ ಪದೇ ಕೇಳುವ ಪ್ರಶ್ನೆಗಳು","faq":[["Zipbox ಯಾವ ಸ್ವರೂಪಗಳನ್ನು ತೆರೆಯುತ್ತದೆ?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO, LZ4, ಇದರಲ್ಲಿ ಹಲವು ಭಾಗಗಳ ಮತ್ತು ಪಾಸ್‌ವರ್ಡ್ ರಕ್ಷಿತ ಆರ್ಕೈವ್‌ಗಳೂ ಸೇರಿವೆ. ಇವನ್ನು ತೆರೆಯಲು ಯಾವುದೇ ಶುಲ್ಕವಿಲ್ಲ, ಜಾಹೀರಾತೂ ಕಾಣಿಸುವುದಿಲ್ಲ."],["ನಿಜಕ್ಕೂ ಜಾಹೀರಾತೇ ಇಲ್ಲವೇ?","ಒಂದೂ ಇಲ್ಲ. Zipbox ನಲ್ಲಿ ಜಾಹೀರಾತಿನ ಲೈಬ್ರರಿಯೇ ಇಲ್ಲ, ಆದ್ದರಿಂದ ಬ್ಯಾನರ್ ಇಲ್ಲ, ಪೂರ್ಣ ಪರದೆಯ ವೀಡಿಯೊ ಇಲ್ಲ, ಫೈಲ್ ತೆರೆಯುವ ಮೊದಲು ಎಣಿಕೆಯೂ ಇಲ್ಲ."],["ಫೈಲ್ಸ್, ಮೇಲ್ ಅಥವಾ Safari ನಲ್ಲಿರುವ ಆರ್ಕೈವ್ ಅನ್ನು ಹೇಗೆ ತೆರೆಯುವುದು?","ಆರ್ಕೈವ್ ಮೇಲೆ ತಟ್ಟಿ Zipbox ಆರಿಸಿ, ಅಥವಾ ಹಂಚಿಕೆ ಮೆನು ಬಳಸಿ. ಮೊದಲು Zipbox ತೆರೆದು ಫೈಲ್ ಹುಡುಕಲೂ ಬಹುದು."],["ಒಂದೇ ಫೈಲ್ ತೆಗೆಯಬಹುದೇ?","ಬಹುದು. ಆರ್ಕೈವ್ ತೆರೆದು, ಪಟ್ಟಿ ನೋಡಿ, ಮುನ್ನೋಟದಲ್ಲಿ ಖಚಿತಪಡಿಸಿಕೊಂಡು, ಆ ಒಂದನ್ನು ಅಥವಾ ನೀವು ಆರಿಸಿದವುಗಳನ್ನು ಮಾತ್ರ ತೆಗೆಯಿರಿ."],["Zipbox Pro ನಲ್ಲಿ ಹೆಚ್ಚುವರಿ ಏನಿದೆ?","AES-256 ಎನ್‌ಕ್ರಿಪ್ಶನ್ ಮತ್ತು ಭಾಗಗಳಾಗಿ ವಿಂಗಡಿಸಿ ZIP, 7z ರಚನೆ, ಒಟ್ಟಿಗೆ ಹಲವು ಫೈಲ್‌ಗಳನ್ನು ತೆಗೆಯುವುದು ಮತ್ತು ಸಂಕುಚಿಸುವುದು, ಆರ್ಕೈವ್ ಒಳಗಿನ ಪೂರ್ಣ ಪಠ್ಯ ಹುಡುಕಾಟ, ಸುಧಾರಿತ ಫೈಲ್ ಸಾಧನಗಳು, ರಫ್ತು ಮತ್ತು Siri ಶಾರ್ಟ್‌ಕಟ್‌ಗಳು. ಅದಿಲ್ಲದೆಯೂ ಫೈಲ್ ತೆಗೆಯುವುದು ಮುಂದುವರಿಯುತ್ತದೆ."],["ಹೊಸ ಸಾಧನದಲ್ಲಿ ಖರೀದಿಯನ್ನು ಹೇಗೆ ಮರುಸ್ಥಾಪಿಸುವುದು?","ಅದೇ Apple ಖಾತೆಯಿಂದ ಸೈನ್ ಇನ್ ಮಾಡಿ, Zipbox ಸೆಟ್ಟಿಂಗ್‌ಗಳನ್ನು ತೆರೆದು, ಖರೀದಿಗಳನ್ನು ಮರುಸ್ಥಾಪಿಸಿ ಎಂಬುದನ್ನು ತಟ್ಟಿ."]],"secTrouble":"ಏನಾದರೂ ಸಿಕ್ಕಿಕೊಂಡರೆ","trouble":[["ಆರ್ಕೈವ್ ತೆರೆಯುತ್ತಿಲ್ಲ","ಮೊದಲು ಡೌನ್‌ಲೋಡ್ ಪೂರ್ಣಗೊಂಡಿತೇ ನೋಡಿ. ಅರ್ಧದಲ್ಲಿ ನಿಂತ ಫೈಲ್ ಅಪೂರ್ಣ, ಅದನ್ನು ಯಾವ ಆ್ಯಪ್ ಕೂಡ ಓದಲಾಗದು. ಹಲವು ಭಾಗಗಳ ಆರ್ಕೈವ್ ಆದರೆ ಎಲ್ಲ ಭಾಗಗಳನ್ನು ಒಂದೇ ಫೋಲ್ಡರ್‌ನಲ್ಲಿ ಇಟ್ಟು ಮೊದಲನೆಯದನ್ನು ತೆರೆಯಿರಿ."],["ಪಾಸ್‌ವರ್ಡ್ ತಪ್ಪು ಎಂದು ತೋರಿಸುತ್ತದೆ","ಪಾಸ್‌ವರ್ಡ್‌ಗಳಲ್ಲಿ ಸಣ್ಣ ದೊಡ್ಡ ಅಕ್ಷರಗಳ ವ್ಯತ್ಯಾಸವಿದೆ, ಕೆಲವು ಆರ್ಕೈವ್‌ಗಳು ಬೇರೆ ಅಕ್ಷರ ಎನ್‌ಕೋಡಿಂಗ್‌ನಲ್ಲಿ ರಚಿತವಾಗಿವೆ. ಅಂಟಿಸುವ ಬದಲು ನೀವೇ ಟೈಪ್ ಮಾಡಿ, ಕೊನೆಯಲ್ಲಿ ಖಾಲಿ ಜಾಗ ಉಳಿದಿದೆಯೇ ನೋಡಿ."],["ಸ್ಥಳ ಸಾಕಾಗುತ್ತಿಲ್ಲ","ಆರ್ಕೈವ್ ತೆರೆದ ಮೇಲೆ ತನ್ನ ಗಾತ್ರಕ್ಕಿಂತ ಹೆಚ್ಚು ಜಾಗ ತೆಗೆದುಕೊಳ್ಳುತ್ತದೆ. ಮೊದಲು ಜಾಗ ಖಾಲಿ ಮಾಡಿ, ಅಥವಾ ಎಲ್ಲವನ್ನೂ ತೆಗೆಯದೆ ಬೇಕಾದವುಗಳನ್ನು ಮಾತ್ರ ತೆಗೆಯಿರಿ."],["ಒಳಗಿನ ಫೈಲ್ ಹಾಳಾದಂತೆ ಕಾಣುತ್ತದೆ","ಆರ್ಕೈವ್‌ನಲ್ಲಿ ನಿಜಕ್ಕೂ ಇರುವುದನ್ನೇ Zipbox ತೋರಿಸುತ್ತದೆ. ಸಂಕುಚಿಸುವ ಮೊದಲೇ ಫೈಲ್ ಹಾಳಾಗಿದ್ದರೆ ತೆಗೆಯುವುದರಿಂದ ಅದು ಸರಿಯಾಗುವುದಿಲ್ಲ. ಕಳುಹಿಸಿದವರಿಂದ ಹೊಸ ಪ್ರತಿ ಕೇಳಿ."]],"pages":{"support":{"title":"Zipbox ಸಹಾಯ","meta":"Zipbox ಸಹಾಯ: ಆರ್ಕೈವ್ ತೆರೆಯುವುದು, ಪಾಸ್‌ವರ್ಡ್, ಭಾಗಗಳ ಆರ್ಕೈವ್, ಖರೀದಿ ಮರುಸ್ಥಾಪನೆ ಮತ್ತು ಸಂಪರ್ಕ.","badge":"ಸಹಾಯ","h1":"Zipbox ಸಹಾಯ","lead":"ಹೆಚ್ಚು ಬರುವ ಪ್ರಶ್ನೆಗಳು, ಆರ್ಕೈವ್ ತೆರೆಯದಿದ್ದಾಗ ಏನು ಪ್ರಯತ್ನಿಸಬೇಕು. ನಿಮ್ಮ ಪ್ರಶ್ನೆ ಇಲ್ಲಿ ಇಲ್ಲದಿದ್ದರೆ ನಮಗೆ ಬರೆಯಿರಿ."}}},"ko":{"langName":"한국어","langLabel":"언어","navHome":"홈","navSupport":"지원","navPrivacy":"개인정보","navTerms":"이용약관","foot":"Zipbox은 전부 기기 안에서 동작합니다. 계정 없음, 광고 없음, 분석 없음, 업로드 없음.","updated":"최종 업데이트","secContact":"문의","contact":"어떤 언어로 쓰셔도 됩니다. 모든 메일은 사람이 직접 읽습니다.","contactHint":"압축파일 형식, iOS 버전, 화면에 나온 문구를 함께 알려주시면 큰 도움이 됩니다. 정해진 답변 시간을 약속드리지는 않습니다.","secStart":"시작하기","start":["파일 앱, 메일, 사파리 다운로드, 공유 시트에서 압축파일을 골라 Zipbox으로 열거나, Zipbox을 먼저 열고 파일을 찾아가세요.","압축파일을 누르면 안이 보입니다. 풀기를 누르기 전까지는 아무것도 꺼내지 않습니다.","사진, 동영상, PDF, 텍스트, 소스 코드를 미리 보고 찾던 파일이 맞는지 확인하세요.","전부 풀거나 필요한 항목만 골라서, 저장할 위치를 정하세요."],"secFaq":"자주 묻는 질문","faq":[["어떤 형식을 열 수 있나요?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO, LZ4이며 분할 압축파일과 비밀번호가 걸린 압축파일도 포함합니다. 무엇을 열든 요금이 붙지 않고 광고도 나오지 않습니다."],["정말 광고가 하나도 없나요?","없습니다. Zipbox에는 광고 SDK 자체가 들어 있지 않아서 배너도, 전면 동영상도, 파일이 열리기 전 카운트다운도 없습니다."],["파일 앱이나 메일, 사파리에 있는 압축파일은 어떻게 여나요?","압축파일을 누르고 Zipbox을 고르거나 공유 시트에서 Zipbox을 선택하세요. Zipbox을 먼저 열고 파일을 찾아가도 됩니다."],["전부 풀지 않고 하나만 꺼낼 수 있나요?","가능합니다. 압축파일을 열고 목록을 훑은 뒤 미리보기로 확인하고, 그 항목 하나 또는 고른 항목만 풀면 됩니다."],["Zipbox Pro에서는 무엇이 늘어나나요?","AES-256 암호화와 분할 저장을 지원하는 ZIP, 7z 만들기, 한 번에 풀기와 압축하기, 압축파일 안 전문 검색, 고급 파일 정리, 내보내기, 단축어입니다. 사지 않아도 압축 푸는 기능은 그대로 쓸 수 있습니다."],["기기를 바꾸면 구입은 어떻게 복원하나요?","같은 Apple 계정으로 로그인한 뒤 Zipbox 설정 화면에서 '구입 복원'을 누르세요."]],"secTrouble":"잘 안 될 때","trouble":[["압축파일이 열리지 않아요","먼저 다운로드가 끝났는지 확인하세요. 중간에 멈춘 파일은 그 자체가 불완전해서 어떤 앱으로도 읽을 수 없습니다. 분할 압축파일이라면 모든 조각을 같은 폴더에 두고 첫 번째 조각을 여세요."],["비밀번호가 틀렸다고 나와요","비밀번호는 대소문자를 구분하고, 어떤 압축파일은 다른 문자 인코딩으로 만들어졌을 수 있습니다. 붙여넣지 말고 직접 입력하고, 끝에 공백이 붙지 않았는지 확인하세요."],["공간이 부족해요","압축파일은 풀면 원래보다 커집니다. 저장 공간을 먼저 확보하거나, 전부 풀지 말고 필요한 항목만 꺼내세요."],["안에 있는 파일이 손상됐어요","Zipbox은 압축파일에 실제로 들어 있는 내용을 그대로 보여 줍니다. 압축되기 전에 이미 깨진 파일은 풀어도 복구되지 않습니다. 보낸 사람에게 새 파일을 요청하세요."]],"pages":{"support":{"title":"Zipbox 지원","meta":"Zipbox 사용법: 압축파일 열기, 비밀번호, 분할 압축파일, 구입 복원, 문의.","badge":"지원","h1":"Zipbox 사용법","lead":"가장 많이 묻는 질문과, 압축파일이 말을 안 들을 때 먼저 해 볼 것들을 모았습니다. 없으면 메일 주세요."}}},"ms":{"langName":"Bahasa Melayu","langLabel":"Bahasa","navHome":"Laman utama","navSupport":"Sokongan","navPrivacy":"Privasi","navTerms":"Terma","foot":"Zipbox berjalan sepenuhnya pada peranti anda. Tiada akaun, tiada iklan, tiada analitik, tiada muat naik.","updated":"Kemas kini terakhir","secContact":"Hubungi kami","contact":"Tulis kepada kami dalam bahasa apa pun. Setiap mesej dibaca oleh manusia.","contactHint":"Menyatakan format arkib, versi iOS dan mesej yang anda lihat pada skrin banyak membantu. Kami tidak menjanjikan tempoh balasan yang tetap.","secStart":"Cara bermula","start":["Buka arkib daripada Fail, Mel, muat turun Safari atau menu perkongsian dan pilih Zipbox, atau buka Zipbox dahulu dan cari failnya.","Ketik arkib untuk melihat isinya. Tiada apa diekstrak sehingga anda memintanya.","Pratonton foto, video, PDF, teks atau kod untuk memastikan itu fail yang betul.","Ekstrak semuanya, atau hanya item yang anda perlukan, dan pilih tempat ia disimpan."],"secFaq":"Soalan lazim","faq":[["Format apa yang Zipbox boleh buka?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO dan LZ4, termasuk arkib berpecah kepada beberapa bahagian dan arkib berkata laluan. Membukanya tidak dikenakan bayaran dan tidak memaparkan iklan."],["Betulkah tiada iklan langsung?","Betul, tiada langsung. Zipbox tidak mengandungi sebarang pustaka iklan, jadi tiada sepanduk, tiada video skrin penuh dan tiada kiraan detik sebelum fail dibuka."],["Bagaimana membuka arkib yang ada dalam Fail, Mel atau Safari?","Ketik arkib itu dan pilih Zipbox, atau gunakan menu perkongsian. Anda juga boleh membuka Zipbox dahulu dan cari failnya."],["Bolehkah saya keluarkan satu fail sahaja?","Boleh. Buka arkib, semak senarainya, sahkan melalui pratonton, kemudian ekstrak hanya item itu atau pilihan anda."],["Apa yang ditambah oleh Zipbox Pro?","Mencipta ZIP dan 7z dengan penyulitan AES-256 dan pembahagian volum, ekstrak dan mampat berkelompok, carian teks penuh di dalam arkib, alat fail lanjutan, eksport dan Pintasan Siri. Mengekstrak tetap boleh tanpa itu."],["Bagaimana memulihkan pembelian pada peranti baharu?","Log masuk dengan akaun Apple yang sama, buka tetapan di dalam Zipbox dan ketik Pulihkan Pembelian."]],"secTrouble":"Apabila ada masalah","trouble":[["Arkib tidak mahu dibuka","Semak dahulu sama ada muat turun selesai sepenuhnya. Fail yang dimuat turun separuh jalan adalah tidak lengkap dan tiada aplikasi boleh membacanya. Bagi arkib berpecah, letakkan semua bahagian dalam folder yang sama dan buka bahagian pertama."],["Kata laluan ditolak","Kata laluan membezakan huruf besar dan kecil, dan sesetengah arkib dicipta dengan pengekodan aksara berbeza. Taip sendiri dan bukan tampal, serta pastikan tiada ruang kosong di hujung."],["Ruang simpanan tidak cukup","Arkib memakan lebih banyak ruang selepas dibuka. Kosongkan ruang dahulu, atau ekstrak hanya item yang anda perlukan dan bukan semuanya."],["Fail di dalamnya kelihatan rosak","Zipbox memaparkan apa yang sebenarnya ada di dalam arkib. Jika sesuatu fail sudah rosak sebelum dimampatkan, mengekstrak tidak akan membaikinya. Minta salinan baharu daripada penghantar."]],"pages":{"support":{"title":"Sokongan Zipbox","meta":"Bantuan Zipbox: membuka arkib, kata laluan, arkib berpecah, memulihkan pembelian dan hubungi kami.","badge":"Sokongan","h1":"Bantuan Zipbox","lead":"Soalan yang paling kerap kami terima dan apa yang boleh dicuba apabila sesuatu arkib degil. Jika tiada di sini, tulis kepada kami."}}},"ml-IN":{"langName":"മലയാളം","langLabel":"ഭാഷ","navHome":"ഹോം","navSupport":"സഹായം","navPrivacy":"സ്വകാര്യത","navTerms":"നിബന്ധനകൾ","foot":"Zipbox പൂർണമായും നിങ്ങളുടെ ഉപകരണത്തിൽ പ്രവർത്തിക്കുന്നു. അക്കൗണ്ടില്ല, പരസ്യമില്ല, വിശകലനമില്ല, അപ്‌ലോഡില്ല.","updated":"അവസാനം പുതുക്കിയത്","secContact":"ബന്ധപ്പെടുക","contact":"ഏത് ഭാഷയിലും ഞങ്ങൾക്ക് എഴുതൂ. ഓരോ സന്ദേശവും ഒരാൾ വായിക്കുന്നു.","contactHint":"ആർക്കൈവിന്റെ ഫോർമാറ്റ്, iOS പതിപ്പ്, സ്ക്രീനിൽ കണ്ട സന്ദേശം എന്നിവ പറഞ്ഞാൽ വളരെ സഹായകമാണ്. മറുപടിക്ക് നിശ്ചിത സമയം ഞങ്ങൾ ഉറപ്പുനൽകുന്നില്ല.","secStart":"എങ്ങനെ തുടങ്ങാം","start":["ഫയൽസ്, മെയിൽ, Safari ഡൗൺലോഡ് അല്ലെങ്കിൽ ഏതെങ്കിലും പങ്കിടൽ മെനുവിൽ നിന്ന് ആർക്കൈവ് തുറന്ന് Zipbox തിരഞ്ഞെടുക്കൂ, അല്ലെങ്കിൽ ആദ്യം Zipbox തുറന്ന് ഫയലിലേക്ക് പോകൂ.","ഉള്ളിൽ നോക്കാൻ ആർക്കൈവിൽ ടാപ്പ് ചെയ്യൂ. നിങ്ങൾ ആവശ്യപ്പെടുന്നതുവരെ ഒന്നും എടുക്കില്ല.","ഇതുതന്നെയാണോ വേണ്ട ഫയൽ എന്ന് ഉറപ്പാക്കാൻ ചിത്രം, വീഡിയോ, PDF, വാചകം അല്ലെങ്കിൽ കോഡ് പ്രിവ്യൂ ചെയ്യൂ.","എല്ലാം എടുക്കൂ, അല്ലെങ്കിൽ വേണ്ടവ മാത്രം, പിന്നെ എവിടെ സൂക്ഷിക്കണമെന്ന് തിരഞ്ഞെടുക്കൂ."],"secFaq":"പതിവ് ചോദ്യങ്ങൾ","faq":[["Zipbox ഏതൊക്കെ ഫോർമാറ്റുകൾ തുറക്കും?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO, LZ4, ഇതിൽ പല ഭാഗങ്ങളായവയും പാസ്‌വേഡ് സംരക്ഷിതവയും ഉൾപ്പെടും. ഇവ തുറക്കാൻ ഒരു ഫീസുമില്ല, പരസ്യവും കാണില്ല."],["ശരിക്കും പരസ്യമേ ഇല്ലേ?","ഒന്നുമില്ല. Zipbox ൽ പരസ്യ ലൈബ്രറി തന്നെയില്ല, അതിനാൽ ബാനറില്ല, മുഴുവൻ സ്ക്രീൻ വീഡിയോയില്ല, ഫയൽ തുറക്കും മുൻപ് കാത്തിരിപ്പുമില്ല."],["ഫയൽസിലോ മെയിലിലോ Safari യിലോ ഉള്ള ആർക്കൈവ് എങ്ങനെ തുറക്കും?","ആർക്കൈവിൽ ടാപ്പ് ചെയ്ത് Zipbox തിരഞ്ഞെടുക്കൂ, അല്ലെങ്കിൽ പങ്കിടൽ മെനു ഉപയോഗിക്കൂ. ആദ്യം Zipbox തുറന്ന് ഫയലിലേക്കും പോകാം."],["ഒരൊറ്റ ഫയൽ മാത്രം എടുക്കാമോ?","ആകാം. ആർക്കൈവ് തുറന്ന്, പട്ടിക നോക്കി, പ്രിവ്യൂവിൽ ഉറപ്പാക്കി, ആ ഒന്നു മാത്രമോ നിങ്ങൾ തിരഞ്ഞെടുത്തവയോ എടുക്കൂ."],["Zipbox Pro യിൽ അധികമായി എന്തുണ്ട്?","AES-256 എൻക്രിപ്ഷനോടെയും ഭാഗങ്ങളായി വിഭജിച്ചും ZIP, 7z ഉണ്ടാക്കൽ, ഒരുമിച്ച് പല ഫയലുകൾ എടുക്കലും ചുരുക്കലും, ആർക്കൈവിനുള്ളിൽ പൂർണ വാചക തിരയൽ, വിപുലമായ ഫയൽ ഉപകരണങ്ങൾ, കയറ്റുമതി, Siri കുറുക്കുവഴികൾ. ഇതില്ലാതെയും ഫയൽ എടുക്കൽ തുടരും."],["പുതിയ ഉപകരണത്തിൽ വാങ്ങൽ എങ്ങനെ പുനഃസ്ഥാപിക്കും?","അതേ Apple അക്കൗണ്ടിൽ സൈൻ ഇൻ ചെയ്ത്, Zipbox ക്രമീകരണങ്ങൾ തുറന്ന്, വാങ്ങലുകൾ പുനഃസ്ഥാപിക്കുക എന്നതിൽ ടാപ്പ് ചെയ്യൂ."]],"secTrouble":"എന്തെങ്കിലും കുടുങ്ങിയാൽ","trouble":[["ആർക്കൈവ് തുറക്കുന്നില്ല","ആദ്യം ഡൗൺലോഡ് പൂർത്തിയായോ എന്നു നോക്കൂ. പാതിവഴിയിൽ നിന്ന ഫയൽ അപൂർണമാണ്, ഒരു ആപ്പിനും അതു വായിക്കാനാവില്ല. പല ഭാഗങ്ങളുള്ള ആർക്കൈവാണെങ്കിൽ എല്ലാ ഭാഗങ്ങളും ഒരേ ഫോൾഡറിൽ വച്ച് ആദ്യത്തേത് തുറക്കൂ."],["പാസ്‌വേഡ് തെറ്റെന്ന് കാണിക്കുന്നു","പാസ്‌വേഡിൽ ചെറിയ വലിയ അക്ഷര വ്യത്യാസമുണ്ട്, ചില ആർക്കൈവുകൾ വേറെ അക്ഷര എൻകോഡിംഗിലാണ് ഉണ്ടാക്കിയത്. ഒട്ടിക്കുന്നതിനു പകരം സ്വയം ടൈപ്പ് ചെയ്യൂ, അവസാനം സ്പേസ് ബാക്കിയുണ്ടോ എന്നു നോക്കൂ."],["ഇടം തികയുന്നില്ല","ആർക്കൈവ് തുറന്നാൽ അതിന്റെ വലുപ്പത്തേക്കാൾ കൂടുതൽ ഇടം എടുക്കും. ആദ്യം ഇടം ഒഴിവാക്കൂ, അല്ലെങ്കിൽ എല്ലാം എടുക്കാതെ വേണ്ടവ മാത്രം എടുക്കൂ."],["ഉള്ളിലെ ഫയൽ കേടായതായി തോന്നുന്നു","ആർക്കൈവിൽ ശരിക്കും ഉള്ളതു തന്നെയാണ് Zipbox കാണിക്കുന്നത്. ചുരുക്കുന്നതിനു മുൻപേ ഫയൽ കേടായിരുന്നെങ്കിൽ എടുക്കുന്നത് അതു ശരിയാക്കില്ല. അയച്ചയാളോട് പുതിയ പകർപ്പ് ചോദിക്കൂ."]],"pages":{"support":{"title":"Zipbox സഹായം","meta":"Zipbox സഹായം: ആർക്കൈവ് തുറക്കൽ, പാസ്‌വേഡുകൾ, ഭാഗങ്ങളുള്ള ആർക്കൈവുകൾ, വാങ്ങൽ പുനഃസ്ഥാപനം, ബന്ധപ്പെടൽ.","badge":"സഹായം","h1":"Zipbox സഹായം","lead":"ഏറ്റവും കൂടുതൽ വരുന്ന ചോദ്യങ്ങൾ, ആർക്കൈവ് തുറക്കാത്തപ്പോൾ എന്തു ചെയ്യാം. നിങ്ങളുടേത് ഇവിടെയില്ലെങ്കിൽ ഞങ്ങൾക്ക് എഴുതൂ."}}},"mr-IN":{"langName":"मराठी","langLabel":"भाषा","navHome":"मुख्यपृष्ठ","navSupport":"मदत","navPrivacy":"गोपनीयता","navTerms":"अटी","foot":"Zipbox पूर्णपणे तुमच्या उपकरणावर चालतो. खाते नाही, जाहिरात नाही, विश्लेषण नाही, अपलोड नाही.","updated":"शेवटचे अद्यतन","secContact":"संपर्क","contact":"आम्हाला कोणत्याही भाषेत लिहा. प्रत्येक संदेश माणूस वाचतो.","contactHint":"संग्रहाचे स्वरूप, iOS ची आवृत्ती आणि पडद्यावर दिसलेला संदेश सांगितल्यास खूप मदत होते. उत्तराची ठराविक वेळ आम्ही देत नाही.","secStart":"सुरुवात कशी करावी","start":["फाइल्स, मेल, Safari चे डाउनलोड किंवा कोणत्याही शेअर मेनूमधून संग्रह उघडा आणि Zipbox निवडा, किंवा आधी Zipbox उघडून फाइलपर्यंत जा.","आत पाहण्यासाठी संग्रहावर टॅप करा. तुम्ही सांगेपर्यंत काहीही काढले जात नाही.","हीच फाइल आहे याची खात्री करण्यासाठी फोटो, व्हिडिओ, PDF, मजकूर किंवा कोडचे पूर्वावलोकन करा.","सर्व काही काढा, किंवा फक्त गरजेच्या गोष्टी, आणि त्या कुठे जतन करायच्या ते निवडा.
