"],"secFaq":"नेहमीचे प्रश्न","faq":[["Zipbox कोणती स्वरूपे उघडतो?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO आणि LZ4, ज्यात अनेक भागांच्या आणि पासवर्डने सुरक्षित संग्रह फाइलीही येतात. त्या उघडण्यासाठी कोणतेही शुल्क नाही आणि कोणतीही जाहिरात दिसत नाही."],["खरोखर कोणतीही जाहिरात नाही का?","एकही नाही. Zipbox मध्ये जाहिरातीची लायब्ररीच नाही, त्यामुळे बॅनर नाही, पूर्ण पडद्याचा व्हिडिओ नाही आणि फाइल उघडण्याआधी उलटी गणतीही नाही."],["फाइल्स, मेल किंवा Safari मधील संग्रह कसा उघडायचा?","संग्रहावर टॅप करून Zipbox निवडा, किंवा शेअर मेनू वापरा. तुम्ही आधी Zipbox उघडून फाइलपर्यंतही जाऊ शकता."],["फक्त एकच फाइल काढता येते का?","हो. संग्रह उघडा, यादी पाहा, पूर्वावलोकनात खात्री करा आणि मग फक्त तीच गोष्ट किंवा तुम्ही निवडलेल्या गोष्टी काढा."],["Zipbox Pro मध्ये जास्तीचे काय आहे?","AES-256 एन्क्रिप्शन आणि भागांत विभागून ZIP व 7z तयार करणे, एकाच वेळी अनेक फाइली काढणे आणि संकुचित करणे, संग्रहाच्या आत संपूर्ण मजकूर शोधणे, प्रगत फाइल साधने, निर्यात आणि Siri शॉर्टकट. त्याशिवायही फाइल काढणे चालूच राहते."],["नव्या उपकरणावर खरेदी कशी परत मिळवायची?","त्याच Apple खात्याने साइन इन करा, Zipbox च्या सेटिंग उघडा आणि खरेदी पुनर्संचयित करा वर टॅप करा."]],"secTrouble":"काही अडले तर","trouble":[["संग्रह फाइल उघडत नाही","आधी डाउनलोड पूर्ण झाले होते का ते पाहा. अर्धवट उतरलेली फाइल अपूर्ण असते आणि तिला कोणतेही ॲप वाचू शकत नाही. अनेक भागांच्या संग्रहासाठी सर्व भाग एकाच फोल्डरमध्ये ठेवा आणि पहिला भाग उघडा."],["पासवर्ड चुकीचा दाखवतो","पासवर्डमध्ये लहान आणि मोठ्या अक्षरांचा फरक असतो, आणि काही संग्रह वेगळ्या कॅरेक्टर एन्कोडिंगने बनलेले असतात. पेस्ट करण्याऐवजी स्वतः टाइप करा आणि शेवटी मोकळी जागा राहिली नाही ना ते पाहा."],["जागा पुरेशी नाही","संग्रह उघडल्यावर स्वतःच्या आकारापेक्षा जास्त जागा घेतो. आधी जागा मोकळी करा, किंवा सर्व काही काढण्याऐवजी फक्त गरजेच्या गोष्टी काढा."],["आतील एखादी फाइल खराब दिसते","संग्रहात खरोखर जे आहे तेच Zipbox दाखवतो. फाइल संकुचित होण्याआधीच खराब असेल तर काढून ती दुरुस्त होत नाही. पाठवणाऱ्याकडून नवी प्रत मागा."]],"pages":{"support":{"title":"Zipbox मदत","meta":"Zipbox ची मदत: संग्रह उघडणे, पासवर्ड, अनेक भागांच्या फाइली, खरेदी पुनर्संचयित करणे आणि संपर्क.","badge":"मदत","h1":"Zipbox ची मदत","lead":"सर्वाधिक विचारले जाणारे प्रश्न, आणि एखादा संग्रह उघडत नसेल तेव्हा काय करून पाहावे. तुमचा प्रश्न इथे नसेल तर आम्हाला लिहा."}}},"no":{"langName":"Norsk","langLabel":"Språk","navHome":"Start","navSupport":"Støtte","navPrivacy":"Personvern","navTerms":"Vilkår","foot":"Zipbox kjører helt på din egen enhet. Ingen konto, ingen reklame, ingen analyse, ingenting sendes.","updated":"Sist oppdatert","secContact":"Kontakt","contact":"Skriv til oss på det språket du vil. Hver melding blir lest av et menneske.","contactHint":"Arkivformatet, iOS versjonen din og meldingen du så på skjermen hjelper mye. Vi lover ingen fast svartid.","secStart":"Kom i gang","start":["Åpne et arkiv fra Filer, Mail, en nedlasting i Safari eller en delingsmeny og velg Zipbox, eller åpne Zipbox først og finn filen.","Trykk på arkivet for å se inn i det. Ingenting pakkes ut før du ber om det.","Forhåndsvis et bilde, en video, en PDF, en tekst eller kode for å være sikker på at det er riktig fil.","Pakk ut alt, eller bare postene du trenger, og velg hvor de lagres."],"secFaq":"Vanlige spørsmål","faq":[["Hvilke formater åpner Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO og LZ4, inkludert arkiver i flere deler og arkiver med passord. Det koster ingenting å åpne dem, og det vises ingen reklame."],["Er det virkelig ingen reklame?","Ingen. Zipbox inneholder ikke noe annonsebibliotek i det hele tatt, så det er ingen banner, ingen fullskjermvideo og ingen nedtelling før en fil åpnes."],["Hvordan åpner jeg et arkiv som ligger i Filer, Mail eller Safari?","Trykk på arkivet og velg Zipbox, eller bruk delingsmenyen. Du kan også åpne Zipbox først og finne filen der."],["Kan jeg hente ut bare én fil?","Ja. Åpne arkivet, bla gjennom listen, se over filen og pakk deretter ut bare den posten eller utvalget ditt."],["Hva gir Zipbox Pro?","Å lage ZIP og 7z med AES-256 kryptering og delte volumer, utpakking og komprimering flere om gangen, fritekstsøk inne i arkiver, avanserte filverktøy, eksport og Siri snarveier. Utpakking virker også uten."],["Hvordan gjenoppretter jeg kjøpet på en ny enhet?","Logg på med samme Apple konto, åpne innstillingene i Zipbox og trykk Gjenopprett kjøp."]],"secTrouble":"Hvis noe henger seg opp","trouble":[["Arkivet vil ikke åpne","Sjekk først at nedlastingen ble ferdig. En halvveis nedlastet fil er ufullstendig, og ingen app kan lese den. For arkiver i flere deler legger du alle delene i samme mappe og åpner den første."],["Passordet blir avvist","Passord skiller mellom store og små bokstaver, og noen arkiver er laget med en annen tegnkoding. Skriv passordet for hånd i stedet for å lime det inn, og se etter mellomrom til slutt."],["Ikke nok plass","Et arkiv tar mer plass når det åpnes. Frigjør plass først, eller pakk ut bare postene du trenger i stedet for alt."],["En fil inni ser ødelagt ut","Zipbox viser det arkivet faktisk inneholder. Var en fil allerede ødelagt før den ble komprimert, kan ikke utpakking reparere den. Be avsenderen om en ny kopi."]],"pages":{"support":{"title":"Zipbox støtte","meta":"Hjelp med Zipbox: åpne arkiver, passord, arkiver i flere deler, gjenopprette kjøp og kontakt.","badge":"Støtte","h1":"Hjelp med Zipbox","lead":"Spørsmålene vi får oftest, og hva du kan prøve når et arkiv ikke vil samarbeide. Mangler ditt, skriv til oss."}}},"or-IN":{"langName":"ଓଡ଼ିଆ","langLabel":"ଭାଷା","navHome":"ମୁଖ୍ୟ ପୃଷ୍ଠା","navSupport":"ସହାୟତା","navPrivacy":"ଗୋପନୀୟତା","navTerms":"ସର୍ତ୍ତାବଳୀ","foot":"Zipbox ସମ୍ପୂର୍ଣ୍ଣ ଆପଣଙ୍କ ଡିଭାଇସରେ ଚାଲେ। ଖାତା ନାହିଁ, ବିଜ୍ଞାପନ ନାହିଁ, ବିଶ୍ଳେଷଣ ନାହିଁ, ଅପଲୋଡ ନାହିଁ।","updated":"ଶେଷ ଅଦ୍ୟତନ","secContact":"ଯୋଗାଯୋଗ","contact":"ଯେକୌଣସି ଭାଷାରେ ଆମକୁ ଲେଖନ୍ତୁ। ପ୍ରତ୍ୟେକ ସନ୍ଦେଶ ଜଣେ ମଣିଷ ପଢ଼ନ୍ତି।","contactHint":"ଆର୍କାଇଭର ଫର୍ମାଟ, iOS ସଂସ୍କରଣ ଏବଂ ପରଦାରେ ଦେଖାଯାଇଥିବା ସନ୍ଦେଶ କହିଲେ ବହୁତ ସାହାଯ୍ୟ ମିଳେ। ଉତ୍ତର ପାଇଁ ନିର୍ଦ୍ଦିଷ୍ଟ ସମୟ ଆମେ ପ୍ରତିଶ୍ରୁତି ଦେଉନାହୁଁ।","secStart":"କିପରି ଆରମ୍ଭ କରିବେ","start":["ଫାଇଲ୍ସ, ମେଲ, Safari ଡାଉନଲୋଡ କିମ୍ବା ଯେକୌଣସି ସେୟାର ମେନୁରୁ ଆର୍କାଇଭ ଖୋଲି Zipbox ବାଛନ୍ତୁ, କିମ୍ବା ପ୍ରଥମେ Zipbox ଖୋଲି ଫାଇଲ ଖୋଜନ୍ତୁ।","ଭିତରେ ଦେଖିବା ପାଇଁ ଆର୍କାଇଭରେ ଟ୍ୟାପ କରନ୍ତୁ। ଆପଣ ନକହିବା ପର୍ଯ୍ୟନ୍ତ କିଛି ବାହାର ହୁଏ ନାହିଁ।","ଏହା ହିଁ ଦରକାରୀ ଫାଇଲ କି ନା ନିଶ୍ଚିତ କରିବାକୁ ଛବି, ଭିଡିଓ, PDF, ପାଠ କିମ୍ବା କୋଡ ପ୍ରିଭ୍ୟୁ କରନ୍ତୁ।","ସବୁ ବାହାର କରନ୍ତୁ, କିମ୍ବା କେବଳ ଦରକାରୀ ଜିନିଷ, ଏବଂ କେଉଁଠି ସଞ୍ଚୟ ହେବ ତାହା ବାଛନ୍ତୁ।"],"secFaq":"ସାଧାରଣ ପ୍ରଶ୍ନ","faq":[["Zipbox କେଉଁ ଫର୍ମାଟ ଖୋଲେ?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO, LZ4, ଏଥିରେ ଅନେକ ଅଂଶର ଏବଂ ପାସୱାର୍ଡ ସୁରକ୍ଷିତ ଆର୍କାଇଭ ମଧ୍ୟ ଅଛି। ଏଗୁଡ଼ିକୁ ଖୋଲିବାରେ କୌଣସି ଖର୍ଚ୍ଚ ନାହିଁ ଏବଂ କୌଣସି ବିଜ୍ଞାପନ ଦେଖାଯାଏ ନାହିଁ।"],["ପ୍ରକୃତରେ କୌଣସି ବିଜ୍ଞାପନ ନାହିଁ କି?","ଗୋଟିଏ ବି ନାହିଁ। Zipbox ଭିତରେ ବିଜ୍ଞାପନର ଲାଇବ୍ରେରୀ ହିଁ ନାହିଁ, ତେଣୁ ବ୍ୟାନର ନାହିଁ, ପୂରା ପରଦାର ଭିଡିଓ ନାହିଁ ଏବଂ ଫାଇଲ ଖୋଲିବା ପୂର୍ବରୁ ଗଣନା ମଧ୍ୟ ନାହିଁ।"],["ଫାଇଲ୍ସ, ମେଲ କିମ୍ବା Safari ରେ ଥିବା ଆର୍କାଇଭ କିପରି ଖୋଲିବେ?","ଆର୍କାଇଭରେ ଟ୍ୟାପ କରି Zipbox ବାଛନ୍ତୁ, କିମ୍ବା ସେୟାର ମେନୁ ବ୍ୟବହାର କରନ୍ତୁ। ପ୍ରଥମେ Zipbox ଖୋଲି ଫାଇଲ ପର୍ଯ୍ୟନ୍ତ ମଧ୍ୟ ଯାଇପାରିବେ।"],["କେବଳ ଗୋଟିଏ ଫାଇଲ ବାହାର କରାଯାଇପାରିବ କି?","ହଁ। ଆର୍କାଇଭ ଖୋଲି, ତାଲିକା ଦେଖି, ପ୍ରିଭ୍ୟୁରେ ନିଶ୍ଚିତ କରି, କେବଳ ସେହି ଜିନିଷ କିମ୍ବା ଆପଣ ବଛା ଜିନିଷ ବାହାର କରନ୍ତୁ।"],["Zipbox Pro ରେ ଅତିରିକ୍ତ କଣ ଅଛି?","AES-256 ଏନକ୍ରିପସନ ସହ ଓ ଅଂଶରେ ବିଭକ୍ତ କରି ZIP, 7z ତିଆରି, ଏକାଥରେ ଅନେକ ଫାଇଲ ବାହାର କରିବା ଓ ସଙ୍କୋଚନ, ଆର୍କାଇଭ ଭିତରେ ପୂର୍ଣ୍ଣ ପାଠ ଖୋଜା, ଉନ୍ନତ ଫାଇଲ ଉପକରଣ, ରପ୍ତାନି ଏବଂ Siri ସର୍ଟକଟ। ଏହା ବିନା ମଧ୍ୟ ଫାଇଲ ବାହାର କରିବା ଚାଲିଥାଏ।"],["ନୂଆ ଡିଭାଇସରେ କିଣା କିପରି ପୁନଃସ୍ଥାପନ କରିବେ?","ସେହି Apple ଖାତାରେ ସାଇନ ଇନ କରି, Zipbox ସେଟିଂସ ଖୋଲି, କିଣା ପୁନଃସ୍ଥାପନରେ ଟ୍ୟାପ କରନ୍ତୁ।"]],"secTrouble":"କିଛି ଅଟକିଲେ","trouble":[["ଆର୍କାଇଭ ଖୋଲୁନାହିଁ","ପ୍ରଥମେ ଦେଖନ୍ତୁ ଡାଉନଲୋଡ ସମ୍ପୂର୍ଣ୍ଣ ହୋଇଥିଲା କି ନାହିଁ। ଅଧାରୁ ଅଟକିଥିବା ଫାଇଲ ଅସମ୍ପୂର୍ଣ୍ଣ ଏବଂ ତାହା କୌଣସି ଆପ ପଢ଼ିପାରିବ ନାହିଁ। ଅନେକ ଅଂଶର ଆର୍କାଇଭ ପାଇଁ ସବୁ ଅଂଶ ଏକା ଫୋଲ୍ଡରରେ ରଖି ପ୍ରଥମଟି ଖୋଲନ୍ତୁ।"],["ପାସୱାର୍ଡ ଭୁଲ ଦେଖାଉଛି","ପାସୱାର୍ଡରେ ଛୋଟ ବଡ଼ ଅକ୍ଷରର ପାର୍ଥକ୍ୟ ଥାଏ, ଏବଂ କିଛି ଆର୍କାଇଭ ଅନ୍ୟ ଅକ୍ଷର ଏନକୋଡିଂରେ ତିଆରି ହୋଇଥାଏ। ପେଷ୍ଟ କରିବା ବଦଳରେ ନିଜେ ଟାଇପ କରନ୍ତୁ ଏବଂ ଶେଷରେ ଖାଲି ଜାଗା ରହିଛି କି ନାହିଁ ଦେଖନ୍ତୁ।"],["ଯଥେଷ୍ଟ ଜାଗା ନାହିଁ","ଆର୍କାଇଭ ଖୋଲିବା ପରେ ନିଜ ଆକାରଠାରୁ ଅଧିକ ଜାଗା ନିଏ। ପ୍ରଥମେ ଜାଗା ଖାଲି କରନ୍ତୁ, କିମ୍ବା ସବୁ ବାହାର ନକରି କେବଳ ଦରକାରୀ ଜିନିଷ ବାହାର କରନ୍ତୁ।"],["ଭିତରର ଫାଇଲ ନଷ୍ଟ ଦେଖାଯାଉଛି","ଆର୍କାଇଭରେ ପ୍ରକୃତରେ ଯାହା ଅଛି Zipbox ତାହା ହିଁ ଦେଖାଏ। ସଙ୍କୋଚନ ପୂର୍ବରୁ ଫାଇଲ ନଷ୍ଟ ହୋଇଥିଲେ ବାହାର କରିବାରେ ତାହା ଠିକ ହୁଏ ନାହିଁ। ପଠାଇଥିବା ବ୍ୟକ୍ତିଙ୍କଠାରୁ ନୂଆ ନକଲ ମାଗନ୍ତୁ।"]],"pages":{"support":{"title":"Zipbox ସହାୟତା","meta":"Zipbox ସହାୟତା: ଆର୍କାଇଭ ଖୋଲିବା, ପାସୱାର୍ଡ, ଅଂଶର ଆର୍କାଇଭ, କିଣା ପୁନଃସ୍ଥାପନ ଏବଂ ଯୋଗାଯୋଗ।","badge":"ସହାୟତା","h1":"Zipbox ସହାୟତା","lead":"ସବୁଠାରୁ ଅଧିକ ଆସୁଥିବା ପ୍ରଶ୍ନ, ଏବଂ ଆର୍କାଇଭ ନଖୋଲିଲେ କଣ ଚେଷ୍ଟା କରିବେ। ଆପଣଙ୍କ ପ୍ରଶ୍ନ ଏଠାରେ ନଥିଲେ ଆମକୁ ଲେଖନ୍ତୁ।"}}},"pl":{"langName":"Polski","langLabel":"Język","navHome":"Start","navSupport":"Pomoc","navPrivacy":"Prywatność","navTerms":"Regulamin","foot":"Zipbox działa w całości na twoim urządzeniu. Bez konta, bez reklam, bez analityki, bez wysyłania czegokolwiek.","updated":"Ostatnia aktualizacja","secContact":"Kontakt","contact":"Napisz do nas w dowolnym języku. Każdą wiadomość czyta człowiek.","contactHint":"Format archiwum, wersja iOS i komunikat, który zobaczyłeś na ekranie, bardzo pomagają. Nie obiecujemy stałego czasu odpowiedzi.","secStart":"Pierwsze kroki","start":["Otwórz archiwum z Plików, Maila, pobrania w Safari albo menu udostępniania i wybierz Zipbox, albo najpierw uruchom Zipbox i odszukaj plik.","Stuknij archiwum, żeby do niego zajrzeć. Nic nie zostanie rozpakowane, dopóki o to nie poprosisz.","Obejrzyj zdjęcie, film, PDF, tekst albo kod, żeby mieć pewność, że to właściwy plik.","Rozpakuj wszystko albo tylko potrzebne pozycje i wybierz, gdzie mają trafić."],"secFaq":"Najczęstsze pytania","faq":[["Jakie formaty otwiera Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO i LZ4, w tym archiwa podzielone na części i zabezpieczone hasłem. Otwieranie ich nic nie kosztuje i nie pokazuje reklam."],["Naprawdę nie ma żadnych reklam?","Żadnych. Zipbox w ogóle nie zawiera biblioteki reklamowej, więc nie ma banera, filmu na pełnym ekranie ani odliczania przed otwarciem pliku."],["Jak otworzyć archiwum, które jest w Plikach, Mailu albo Safari?","Stuknij archiwum i wybierz Zipbox albo skorzystaj z menu udostępniania. Możesz też najpierw otworzyć Zipbox i odszukać plik."],["Czy mogę wyciągnąć tylko jeden plik?","Tak. Otwórz archiwum, przejrzyj listę, sprawdź plik w podglądzie i rozpakuj wyłącznie tę pozycję albo swój wybór."],["Co daje Zipbox Pro?","Tworzenie ZIP i 7z z szyfrowaniem AES-256 i podziałem na woluminy, rozpakowywanie i pakowanie wsadowe, wyszukiwanie pełnotekstowe wewnątrz archiwum, zaawansowane narzędzia plikowe, eksport i skróty Siri. Rozpakowywanie działa również bez tego."],["Jak przywrócić zakup na nowym urządzeniu?","Zaloguj się na to samo konto Apple, otwórz ustawienia w Zipbox i stuknij Przywróć zakupy."]],"secTrouble":"Gdy coś nie działa","trouble":[["Archiwum się nie otwiera","Najpierw sprawdź, czy pobieranie dobiegło końca. Plik pobrany do połowy jest niekompletny i żadna aplikacja go nie odczyta. Przy archiwum w częściach umieść wszystkie części w jednym folderze i otwórz pierwszą."],["Hasło jest odrzucane","W hasłach ma znaczenie wielkość liter, a część archiwów powstała w innym kodowaniu znaków. Wpisz hasło ręcznie zamiast je wklejać i sprawdź, czy na końcu nie ma spacji."],["Za mało miejsca","Archiwum po rozpakowaniu zajmuje więcej niż samo w sobie. Zwolnij najpierw miejsce albo rozpakuj tylko potrzebne pozycje zamiast całości."],["Plik w środku wygląda na uszkodzony","Zipbox pokazuje to, co archiwum faktycznie zawiera. Jeśli plik był uszkodzony jeszcze przed spakowaniem, rozpakowanie tego nie naprawi. Poproś nadawcę o nową kopię."]],"pages":{"support":{"title":"Pomoc Zipbox","meta":"Pomoc dotycząca Zipbox: otwieranie archiwów, hasła, archiwa w częściach, przywracanie zakupu i kontakt.","badge":"Pomoc","h1":"Pomoc dotycząca Zipbox","lead":"Pytania, które dostajemy najczęściej, i co sprawdzić, gdy archiwum nie współpracuje. Jeśli twojego tu nie ma, napisz."}}},"pt-BR":{"langName":"Português (Brasil)","langLabel":"Idioma","navHome":"Início","navSupport":"Suporte","navPrivacy":"Privacidade","navTerms":"Termos","foot":"O Zipbox roda inteiramente no seu aparelho. Sem conta, sem propaganda, sem análise e sem enviar nada.","updated":"Última atualização","secContact":"Contato","contact":"Escreva no idioma que preferir. Cada mensagem é lida por uma pessoa.","contactHint":"Contar o formato do compactado, a versão do iOS e a mensagem que apareceu na tela ajuda muito. Não prometemos um prazo fixo de resposta.","secStart":"Como começar","start":["Abra um compactado pelo Arquivos, pelo Mail, por um download do Safari ou por um menu de compartilhamento e escolha o Zipbox, ou abra o Zipbox primeiro e procure o arquivo.","Toque no compactado para olhar dentro. Nada é extraído até você pedir.","Visualize uma foto, um vídeo, um PDF, um texto ou código para ter certeza de que é o arquivo certo.","Extraia tudo, ou só os itens de que precisa, e escolha onde salvar."],"secFaq":"Perguntas frequentes","faq":[["Quais formatos o Zipbox abre?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO e LZ4, incluindo compactados divididos em partes e protegidos por senha. Abrir qualquer um deles não custa nada e não mostra propaganda."],["Não tem propaganda mesmo?","Nenhuma. O Zipbox não tem nenhuma biblioteca de anúncios dentro dele, então não há banner, nem vídeo em tela cheia, nem contagem antes de abrir um arquivo."],["Como abro um compactado que está no Arquivos, no Mail ou no Safari?","Toque no compactado e escolha o Zipbox, ou use o menu de compartilhamento. Você também pode abrir o Zipbox primeiro e navegar até o arquivo."],["Dá para tirar só um arquivo?","Dá. Abra o compactado, percorra a lista, confira na visualização e extraia só aquele item ou a sua seleção."],["O que o Zipbox Pro acrescenta?","Criar ZIP e 7z com criptografia AES-256 e volumes divididos, extrair e compactar em lote, busca de texto completo dentro do compactado, ferramentas avançadas de arquivos, exportações e atalhos da Siri. Extrair continua disponível sem isso."],["Como restauro a compra em um aparelho novo?","Entre com a mesma conta Apple, abra os ajustes dentro do Zipbox e toque em Restaurar compras."]],"secTrouble":"Se algo der errado","trouble":[["O compactado não abre","Confira primeiro se o download terminou: um arquivo baixado pela metade está incompleto e nenhum app consegue ler. Se estiver dividido em partes, coloque todas as partes na mesma pasta e abra a primeira."],["Diz que a senha está errada","Senhas diferenciam maiúsculas de minúsculas, e alguns compactados foram criados com outra codificação de caracteres. Digite a senha em vez de colar e veja se não sobrou um espaço no fim."],["Não tem espaço suficiente","Um compactado ocupa mais espaço depois de aberto. Libere espaço antes, ou extraia só os itens de que precisa em vez de tudo."],["Um arquivo de dentro parece corrompido","O Zipbox mostra o que o compactado realmente tem. Se um arquivo já estava corrompido antes de ser compactado, extrair não conserta. Peça uma cópia nova para quem enviou."]],"pages":{"support":{"title":"Suporte do Zipbox","meta":"Ajuda com o Zipbox: abrir compactados, senhas, arquivos divididos, restaurar a compra e contato.","badge":"Suporte","h1":"Ajuda com o Zipbox","lead":"As perguntas que mais chegam e o que tentar quando um compactado não colabora. Se a sua não estiver aqui, escreva para a gente."}}},"pt-PT":{"langName":"Português (Portugal)","langLabel":"Idioma","navHome":"Início","navSupport":"Apoio","navPrivacy":"Privacidade","navTerms":"Termos","foot":"O Zipbox funciona inteiramente no seu dispositivo. Sem conta, sem publicidade, sem análise e sem envios.","updated":"Última atualização","secContact":"Contacto","contact":"Escreva-nos no idioma que preferir. Cada mensagem é lida por uma pessoa.","contactHint":"Indicar o formato do arquivo, a versão do iOS e a mensagem que viu no ecrã ajuda bastante. Não prometemos um prazo fixo de resposta.","secStart":"Como começar","start":["Abra um arquivo a partir de Ficheiros, do Mail, de uma transferência do Safari ou de um menu de partilha e escolha o Zipbox, ou abra primeiro o Zipbox e procure o ficheiro.","Toque no arquivo para espreitar lá dentro. Nada é extraído até que o peça.","Pré-visualize uma fotografia, um vídeo, um PDF, texto ou código para confirmar que é o ficheiro certo.","Extraia tudo, ou apenas os itens de que precisa, e escolha onde ficam guardados."],"secFaq":"Perguntas frequentes","faq":[["Que formatos é que o Zipbox abre?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO e LZ4, incluindo arquivos divididos em partes e protegidos por palavra-passe. Abrir qualquer um não custa nada e não mostra publicidade."],["Não há mesmo publicidade nenhuma?","Nenhuma. O Zipbox não inclui qualquer biblioteca de publicidade, por isso não há faixas, nem vídeos em ecrã inteiro, nem contagens antes de um ficheiro abrir."],["Como abro um arquivo que está em Ficheiros, no Mail ou no Safari?","Toque no arquivo e escolha o Zipbox, ou use o menu de partilha. Também pode abrir primeiro o Zipbox e navegar até ao ficheiro."],["Posso retirar apenas um ficheiro?","Pode. Abra o arquivo, percorra a lista, confirme na pré-visualização e extraia apenas esse item ou a sua seleção."],["O que acrescenta o Zipbox Pro?","Criar ZIP e 7z com encriptação AES-256 e volumes divididos, extrair e comprimir em lote, pesquisa de texto integral dentro do arquivo, ferramentas avançadas de ficheiros, exportações e atalhos da Siri. Extrair continua disponível sem isso."],["Como restauro a compra num dispositivo novo?","Inicie sessão com a mesma conta Apple, abra as definições dentro do Zipbox e toque em Restaurar compras."]],"secTrouble":"Se algo correr mal","trouble":[["O arquivo não abre","Confirme primeiro que a transferência terminou: um ficheiro transferido a meio está incompleto e nenhuma aplicação o consegue ler. Se estiver dividido em partes, coloque todas as partes na mesma pasta e abra a primeira."],["Diz que a palavra-passe está errada","As palavras-passe distinguem maiúsculas de minúsculas e alguns arquivos foram criados com outra codificação de caracteres. Escreva-a à mão em vez de colar e confirme que não ficou um espaço no fim."],["Não há espaço suficiente","Um arquivo ocupa mais espaço depois de aberto. Liberte espaço primeiro, ou extraia apenas os itens de que precisa em vez de tudo."],["Um ficheiro lá dentro parece danificado","O Zipbox mostra o que o arquivo realmente contém. Se um ficheiro já estava danificado antes de ser comprimido, extrair não o repara. Peça uma cópia nova a quem o enviou."]],"pages":{"support":{"title":"Apoio do Zipbox","meta":"Ajuda com o Zipbox: abrir arquivos, palavras-passe, arquivos divididos, restaurar a compra e contacto.","badge":"Apoio","h1":"Ajuda com o Zipbox","lead":"As perguntas que mais nos chegam e o que tentar quando um arquivo não colabora. Se a sua não estiver aqui, escreva-nos."}}},"pa-IN":{"langName":"ਪੰਜਾਬੀ","langLabel":"ਭਾਸ਼ਾ","navHome":"ਮੁੱਖ ਪੰਨਾ","navSupport":"ਮਦਦ","navPrivacy":"ਨਿੱਜਤਾ","navTerms":"ਸ਼ਰਤਾਂ","foot":"Zipbox ਪੂਰੀ ਤਰ੍ਹਾਂ ਤੁਹਾਡੇ ਡਿਵਾਈਸ ਉੱਤੇ ਚੱਲਦਾ ਹੈ। ਖਾਤਾ ਨਹੀਂ, ਇਸ਼ਤਿਹਾਰ ਨਹੀਂ, ਵਿਸ਼ਲੇਸ਼ਣ ਨਹੀਂ, ਅਪਲੋਡ ਨਹੀਂ।","updated":"ਆਖਰੀ ਵਾਰ ਬਦਲਿਆ","secContact":"ਸੰਪਰਕ","contact":"ਸਾਨੂੰ ਕਿਸੇ ਵੀ ਭਾਸ਼ਾ ਵਿੱਚ ਲਿਖੋ। ਹਰ ਸੁਨੇਹਾ ਇੱਕ ਇਨਸਾਨ ਪੜ੍ਹਦਾ ਹੈ।","contactHint":"ਆਰਕਾਈਵ ਦਾ ਫਾਰਮੈਟ, iOS ਦਾ ਸੰਸਕਰਨ ਅਤੇ ਸਕਰੀਨ ਉੱਤੇ ਦਿੱਸਿਆ ਸੁਨੇਹਾ ਦੱਸਣ ਨਾਲ ਬਹੁਤ ਮਦਦ ਮਿਲਦੀ ਹੈ। ਅਸੀਂ ਜਵਾਬ ਦਾ ਕੋਈ ਪੱਕਾ ਸਮਾਂ ਨਹੀਂ ਦਿੰਦੇ।","secStart":"ਸ਼ੁਰੂਆਤ","start":["ਫਾਈਲਾਂ, ਮੇਲ, Safari ਦੀ ਡਾਊਨਲੋਡ ਜਾਂ ਕਿਸੇ ਸਾਂਝਾ ਮੀਨੂ ਤੋਂ ਆਰਕਾਈਵ ਖੋਲ੍ਹੋ ਅਤੇ Zipbox ਚੁਣੋ, ਜਾਂ ਪਹਿਲਾਂ Zipbox ਖੋਲ੍ਹ ਕੇ ਫਾਈਲ ਤੱਕ ਜਾਓ।","ਅੰਦਰ ਵੇਖਣ ਲਈ ਆਰਕਾਈਵ ਉੱਤੇ ਟੈਪ ਕਰੋ। ਜਦੋਂ ਤੱਕ ਤੁਸੀਂ ਨਾ ਕਹੋ, ਕੁਝ ਵੀ ਨਹੀਂ ਕੱਢਿਆ ਜਾਂਦਾ।","ਇਹੀ ਫਾਈਲ ਹੈ, ਇਹ ਪੱਕਾ ਕਰਨ ਲਈ ਤਸਵੀਰ, ਵੀਡੀਓ, PDF, ਲਿਖਤ ਜਾਂ ਕੋਡ ਦੀ ਝਲਕ ਲਵੋ।","ਸਭ ਕੁਝ ਕੱਢੋ, ਜਾਂ ਸਿਰਫ਼ ਲੋੜੀਂਦੀਆਂ ਚੀਜ਼ਾਂ, ਅਤੇ ਚੁਣੋ ਕਿ ਉਹ ਕਿੱਥੇ ਸੰਭਾਲੀਆਂ ਜਾਣ।"],"secFaq":"ਆਮ ਸਵਾਲ","faq":[["Zipbox ਕਿਹੜੇ ਫਾਰਮੈਟ ਖੋਲ੍ਹਦਾ ਹੈ?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO ਅਤੇ LZ4, ਜਿਨ੍ਹਾਂ ਵਿੱਚ ਕਈ ਹਿੱਸਿਆਂ ਵਾਲੀਆਂ ਅਤੇ ਪਾਸਵਰਡ ਨਾਲ ਸੁਰੱਖਿਅਤ ਆਰਕਾਈਵਾਂ ਵੀ ਹਨ। ਇਨ੍ਹਾਂ ਨੂੰ ਖੋਲ੍ਹਣ ਦਾ ਕੋਈ ਖਰਚ ਨਹੀਂ ਅਤੇ ਕੋਈ ਇਸ਼ਤਿਹਾਰ ਨਹੀਂ ਦਿੱਸਦਾ।"],["ਕੀ ਸੱਚਮੁੱਚ ਕੋਈ ਇਸ਼ਤਿਹਾਰ ਨਹੀਂ?","ਇੱਕ ਵੀ ਨਹੀਂ। Zipbox ਵਿੱਚ ਇਸ਼ਤਿਹਾਰ ਦੀ ਕੋਈ ਲਾਇਬ੍ਰੇਰੀ ਹੀ ਨਹੀਂ, ਇਸ ਲਈ ਨਾ ਬੈਨਰ ਹੈ, ਨਾ ਪੂਰੀ ਸਕਰੀਨ ਦੀ ਵੀਡੀਓ ਅਤੇ ਨਾ ਫਾਈਲ ਖੁੱਲ੍ਹਣ ਤੋਂ ਪਹਿਲਾਂ ਉਲਟੀ ਗਿਣਤੀ।"],["ਫਾਈਲਾਂ, ਮੇਲ ਜਾਂ Safari ਵਿਚਲੀ ਆਰਕਾਈਵ ਕਿਵੇਂ ਖੋਲ੍ਹੀਏ?","ਆਰਕਾਈਵ ਉੱਤੇ ਟੈਪ ਕਰ ਕੇ Zipbox ਚੁਣੋ, ਜਾਂ ਸਾਂਝਾ ਮੀਨੂ ਵਰਤੋ। ਤੁਸੀਂ ਪਹਿਲਾਂ Zipbox ਖੋਲ੍ਹ ਕੇ ਫਾਈਲ ਤੱਕ ਵੀ ਜਾ ਸਕਦੇ ਹੋ।"],["ਕੀ ਸਿਰਫ਼ ਇੱਕ ਫਾਈਲ ਕੱਢੀ ਜਾ ਸਕਦੀ ਹੈ?","ਹਾਂ। ਆਰਕਾਈਵ ਖੋਲ੍ਹੋ, ਸੂਚੀ ਵੇਖੋ, ਝਲਕ ਵਿੱਚ ਪਰਖੋ ਅਤੇ ਫਿਰ ਸਿਰਫ਼ ਉਹੀ ਚੀਜ਼ ਜਾਂ ਆਪਣੀਆਂ ਚੁਣੀਆਂ ਚੀਜ਼ਾਂ ਕੱਢੋ।"],["Zipbox Pro ਵਿੱਚ ਵਾਧੂ ਕੀ ਹੈ?","AES-256 ਏਨਕ੍ਰਿਪਸ਼ਨ ਅਤੇ ਹਿੱਸਿਆਂ ਵਿੱਚ ਵੰਡ ਕੇ ZIP ਤੇ 7z ਬਣਾਉਣਾ, ਇੱਕੋ ਵੇਲੇ ਕਈ ਫਾਈਲਾਂ ਕੱਢਣਾ ਤੇ ਸੰਕੁਚਿਤ ਕਰਨਾ, ਆਰਕਾਈਵ ਦੇ ਅੰਦਰ ਪੂਰਾ ਲਿਖਤ ਲੱਭਣਾ, ਉੱਨਤ ਫਾਈਲ ਸੰਦ, ਨਿਰਯਾਤ ਅਤੇ Siri ਸ਼ਾਰਟਕਟ। ਇਸ ਬਿਨਾਂ ਵੀ ਫਾਈਲ ਕੱਢਣਾ ਚੱਲਦਾ ਰਹਿੰਦਾ ਹੈ।"],["ਨਵੇਂ ਡਿਵਾਈਸ ਉੱਤੇ ਖਰੀਦ ਕਿਵੇਂ ਬਹਾਲ ਕਰੀਏ?","ਉਸੇ Apple ਖਾਤੇ ਨਾਲ ਸਾਈਨ ਇਨ ਕਰੋ, Zipbox ਦੀਆਂ ਸੈਟਿੰਗਾਂ ਖੋਲ੍ਹੋ ਅਤੇ ਖਰੀਦ ਬਹਾਲ ਕਰੋ ਉੱਤੇ ਟੈਪ ਕਰੋ।"]],"secTrouble":"ਜੇ ਕੁਝ ਅਟਕੇ","trouble":[["ਆਰਕਾਈਵ ਨਹੀਂ ਖੁੱਲ੍ਹ ਰਹੀ","ਪਹਿਲਾਂ ਵੇਖੋ ਕਿ ਡਾਊਨਲੋਡ ਪੂਰੀ ਹੋਈ ਸੀ ਜਾਂ ਨਹੀਂ। ਅੱਧੀ ਲੱਥੀ ਫਾਈਲ ਅਧੂਰੀ ਹੁੰਦੀ ਹੈ ਅਤੇ ਉਸ ਨੂੰ ਕੋਈ ਐਪ ਨਹੀਂ ਪੜ੍ਹ ਸਕਦੀ। ਕਈ ਹਿੱਸਿਆਂ ਵਾਲੀ ਆਰਕਾਈਵ ਲਈ ਸਾਰੇ ਹਿੱਸੇ ਇੱਕੋ ਫੋਲਡਰ ਵਿੱਚ ਰੱਖੋ ਅਤੇ ਪਹਿਲਾ ਖੋਲ੍ਹੋ।"],["ਪਾਸਵਰਡ ਗ਼ਲਤ ਦੱਸਦਾ ਹੈ","ਪਾਸਵਰਡ ਵਿੱਚ ਛੋਟੇ ਤੇ ਵੱਡੇ ਅੱਖਰ ਦਾ ਫ਼ਰਕ ਹੁੰਦਾ ਹੈ, ਅਤੇ ਕੁਝ ਆਰਕਾਈਵਾਂ ਵੱਖਰੀ ਕੈਰੇਕਟਰ ਏਨਕੋਡਿੰਗ ਨਾਲ ਬਣੀਆਂ ਹੁੰਦੀਆਂ ਹਨ। ਪੇਸਟ ਕਰਨ ਦੀ ਥਾਂ ਆਪ ਟਾਈਪ ਕਰੋ ਅਤੇ ਵੇਖੋ ਕਿ ਅੰਤ ਵਿੱਚ ਖਾਲੀ ਥਾਂ ਤਾਂ ਨਹੀਂ ਰਹਿ ਗਈ।"],["ਥਾਂ ਪੂਰੀ ਨਹੀਂ","ਆਰਕਾਈਵ ਖੁੱਲ੍ਹਣ ਤੋਂ ਬਾਅਦ ਆਪਣੇ ਆਕਾਰ ਤੋਂ ਵੱਧ ਥਾਂ ਲੈਂਦੀ ਹੈ। ਪਹਿਲਾਂ ਥਾਂ ਖਾਲੀ ਕਰੋ, ਜਾਂ ਸਭ ਕੁਝ ਕੱਢਣ ਦੀ ਥਾਂ ਸਿਰਫ਼ ਲੋੜੀਂਦੀਆਂ ਚੀਜ਼ਾਂ ਕੱਢੋ।"],["ਅੰਦਰਲੀ ਕੋਈ ਫਾਈਲ ਖਰਾਬ ਲੱਗਦੀ ਹੈ","ਆਰਕਾਈਵ ਵਿੱਚ ਜੋ ਸੱਚਮੁੱਚ ਹੈ, Zipbox ਉਹੀ ਵਿਖਾਉਂਦਾ ਹੈ। ਜੇ ਫਾਈਲ ਸੰਕੁਚਿਤ ਹੋਣ ਤੋਂ ਪਹਿਲਾਂ ਹੀ ਖਰਾਬ ਸੀ ਤਾਂ ਕੱਢਣ ਨਾਲ ਠੀਕ ਨਹੀਂ ਹੁੰਦੀ। ਭੇਜਣ ਵਾਲੇ ਤੋਂ ਨਵੀਂ ਨਕਲ ਮੰਗੋ।"]],"pages":{"support":{"title":"Zipbox ਮਦਦ","meta":"Zipbox ਦੀ ਮਦਦ: ਆਰਕਾਈਵ ਖੋਲ੍ਹਣਾ, ਪਾਸਵਰਡ, ਕਈ ਹਿੱਸਿਆਂ ਵਾਲੀਆਂ ਫਾਈਲਾਂ, ਖਰੀਦ ਬਹਾਲ ਕਰਨਾ ਅਤੇ ਸੰਪਰਕ।","badge":"ਮਦਦ","h1":"Zipbox ਦੀ ਮਦਦ","lead":"ਸਭ ਤੋਂ ਵੱਧ ਪੁੱਛੇ ਜਾਂਦੇ ਸਵਾਲ, ਅਤੇ ਜਦੋਂ ਕੋਈ ਆਰਕਾਈਵ ਨਾ ਖੁੱਲ੍ਹੇ ਤਾਂ ਕੀ ਕਰੀਏ। ਤੁਹਾਡਾ ਸਵਾਲ ਇੱਥੇ ਨਾ ਹੋਵੇ ਤਾਂ ਸਾਨੂੰ ਲਿਖੋ।"}}},"ro":{"langName":"Română","langLabel":"Limbă","navHome":"Acasă","navSupport":"Asistență","navPrivacy":"Confidențialitate","navTerms":"Termeni","foot":"Zipbox rulează în întregime pe dispozitivul tău. Fără cont, fără reclame, fără analiză, fără trimiteri.","updated":"Ultima actualizare","secContact":"Contact","contact":"Scrie-ne în orice limbă. Fiecare mesaj este citit de un om.","contactHint":"Formatul arhivei, versiunea de iOS și mesajul văzut pe ecran ajută foarte mult. Nu promitem un timp fix de răspuns.","secStart":"Primii pași","start":["Deschide o arhivă din Fișiere, Mail, o descărcare Safari sau un meniu de partajare și alege Zipbox, sau deschide întâi Zipbox și caută fișierul.","Atinge arhiva ca să te uiți în ea. Nimic nu se extrage până nu ceri tu.","Previzualizează o fotografie, un clip, un PDF, un text sau cod ca să fii sigur că este fișierul potrivit.","Extrage tot, sau doar elementele de care ai nevoie, și alege unde se salvează."],"secFaq":"Întrebări frecvente","faq":[["Ce formate deschide Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO și LZ4, inclusiv arhivele împărțite în părți și cele protejate cu parolă. Deschiderea lor nu costă nimic și nu afișează reclame."],["Chiar nu există reclame?","Niciuna. Zipbox nu conține deloc o bibliotecă de publicitate, așa că nu există banner, clip pe tot ecranul sau numărătoare inversă înainte de deschidere."],["Cum deschid o arhivă aflată în Fișiere, Mail sau Safari?","Atinge arhiva și alege Zipbox, sau folosește meniul de partajare. Poți deschide întâi Zipbox și naviga până la fișier."],["Pot scoate un singur fișier?","Da. Deschide arhiva, parcurge lista, verifică fișierul în previzualizare și extrage doar acel element sau selecția ta."],["Ce aduce în plus Zipbox Pro?","Crearea de ZIP și 7z cu criptare AES-256 și volume divizate, extragerea și comprimarea pe loturi, căutarea în tot textul din interiorul arhivei, instrumente avansate pentru fișiere, exporturi și scurtături Siri. Extragerea rămâne disponibilă și fără."],["Cum restaurez achiziția pe un dispozitiv nou?","Conectează-te cu același cont Apple, deschide setările din Zipbox și atinge Restaurează achizițiile."]],"secTrouble":"Când ceva nu merge","trouble":[["Arhiva nu se deschide","Verifică întâi dacă descărcarea s-a terminat. Un fișier descărcat pe jumătate este incomplet și nicio aplicație nu îl poate citi. La o arhivă în părți, pune toate părțile în același dosar și deschide-o pe prima."],["Spune că parola este greșită","Parolele țin cont de majuscule, iar unele arhive au fost create cu altă codificare de caractere. Scrie parola de mână în loc să o lipești și verifică dacă nu a rămas un spațiu la final."],["Nu este destul spațiu","O arhivă ocupă mai mult după ce este deschisă. Eliberează spațiu întâi, sau extrage doar elementele de care ai nevoie în loc de tot."],["Un fișier din interior pare deteriorat","Zipbox arată ce conține arhiva cu adevărat. Dacă un fișier era deja stricat înainte de comprimare, extragerea nu îl repară. Cere expeditorului o copie nouă."]],"pages":{"support":{"title":"Asistență Zipbox","meta":"Ajutor pentru Zipbox: deschiderea arhivelor, parole, arhive în părți, restaurarea achiziției și contact.","badge":"Asistență","h1":"Ajutor pentru Zipbox","lead":"Întrebările primite cel mai des și ce poți încerca atunci când o arhivă nu cooperează. Dacă a ta nu este aici, scrie-ne."}}},"ru":{"langName":"Русский","langLabel":"Язык","navHome":"Главная","navSupport":"Поддержка","navPrivacy":"Конфиденциальность","navTerms":"Условия","foot":"Zipbox работает целиком на вашем устройстве. Без аккаунта, без рекламы, без аналитики, без отправки данных.","updated":"Последнее обновление","secContact":"Связаться","contact":"Пишите нам на любом языке. Каждое письмо читает человек.","contactHint":"Формат архива, версия iOS и текст сообщения на экране очень помогают. Фиксированного срока ответа мы не обещаем.","secStart":"С чего начать","start":["Откройте архив из Файлов, Почты, загрузки в Safari или меню отправки и выберите Zipbox, либо сначала запустите Zipbox и найдите файл.","Нажмите на архив, чтобы посмотреть внутрь. Ничего не распакуется, пока вы этого не попросите.","Посмотрите фото, видео, PDF, текст или код, чтобы убедиться, что это нужный файл.","Распакуйте всё или только нужные элементы и выберите, куда их сохранить."],"secFaq":"Частые вопросы","faq":[["Какие форматы открывает Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO и LZ4, включая архивы из нескольких частей и архивы с паролем. Открытие ничего не стоит и не показывает рекламу."],["Рекламы правда совсем нет?","Совсем. В Zipbox вообще нет рекламной библиотеки, поэтому нет ни баннера, ни видео на весь экран, ни отсчёта перед открытием файла."],["Как открыть архив, который лежит в Файлах, Почте или Safari?","Нажмите на архив и выберите Zipbox или воспользуйтесь меню отправки. Можно и сначала открыть Zipbox, а потом найти файл."],["Можно достать только один файл?","Можно. Откройте архив, пролистайте список, проверьте файл в предпросмотре и распакуйте только его или выбранные элементы."],["Что даёт Zipbox Pro?","Создание ZIP и 7z с шифрованием AES-256 и разбиением на тома, пакетную распаковку и сжатие, полнотекстовый поиск внутри архива, расширенные операции с файлами, экспорт и команды Siri. Распаковка работает и без этого."],["Как восстановить покупку на новом устройстве?","Войдите с той же учётной записью Apple, откройте настройки в Zipbox и нажмите «Восстановить покупки»."]],"secTrouble":"Если что-то не так","trouble":[["Архив не открывается","Сначала проверьте, что загрузка завершилась. Файл, скачанный наполовину, неполный, и его не прочитает ни одно приложение. Если архив из нескольких частей, положите все части в одну папку и откройте первую."],["Пишет, что пароль неверный","В паролях важен регистр, а часть архивов создана в другой кодировке символов. Введите пароль вручную, а не вставляйте, и проверьте, не остался ли пробел в конце."],["Не хватает места","Архив после распаковки занимает больше, чем сам файл. Освободите место или извлеките только нужные элементы вместо всего архива."],["Файл внутри выглядит повреждённым","Zipbox показывает то, что в архиве есть на самом деле. Если файл был испорчен ещё до сжатия, распаковка это не исправит. Попросите отправителя прислать новую копию."]],"pages":{"support":{"title":"Поддержка Zipbox","meta":"Помощь по Zipbox: открытие архивов, пароли, архивы из частей, восстановление покупки и контакты.","badge":"Поддержка","h1":"Помощь по Zipbox","lead":"Самые частые вопросы и что попробовать, когда архив капризничает. Если вашего вопроса тут нет, напишите нам."}}},"sk":{"langName":"Slovenčina","langLabel":"Jazyk","navHome":"Úvod","navSupport":"Podpora","navPrivacy":"Súkromie","navTerms":"Podmienky","foot":"Zipbox beží celý vo vašom zariadení. Bez účtu, bez reklám, bez analytiky, nič sa neodosiela.","updated":"Naposledy aktualizované","secContact":"Kontakt","contact":"Napíšte nám v akomkoľvek jazyku. Každú správu číta človek.","contactHint":"Formát archívu, verzia iOS a hláška, ktorú ste videli na obrazovke, veľmi pomôžu. Pevný čas odpovede nesľubujeme.","secStart":"Začíname","start":["Otvorte archív zo Súborov, Mailu, stiahnutia v Safari alebo z ponuky zdieľania a zvoľte Zipbox, prípadne najprv spustite Zipbox a súbor si nájdite.","Ťuknutím na archív doň nazriete. Nič sa nerozbalí, kým o to nepožiadate.","Pozrite si fotku, video, PDF, text alebo kód, aby ste mali istotu, že ide o ten správny súbor.","Rozbaľte všetko alebo len položky, ktoré potrebujete, a vyberte, kam sa uložia."],"secFaq":"Časté otázky","faq":[["Aké formáty Zipbox otvorí?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO a LZ4, vrátane archívov rozdelených na časti a archívov chránených heslom. Otvorenie nič nestojí a nezobrazí žiadnu reklamu."],["Naozaj tam nie sú žiadne reklamy?","Žiadne. Zipbox v sebe nemá vôbec žiadnu reklamnú knižnicu, takže niet bannera, celoobrazovkového videa ani odpočtu pred otvorením súboru."],["Ako otvorím archív, ktorý je v Súboroch, Maile alebo Safari?","Ťuknite na archív a zvoľte Zipbox, alebo použite ponuku zdieľania. Môžete tiež najprv otvoriť Zipbox a súbor v ňom nájsť."],["Môžem vytiahnuť len jeden súbor?","Áno. Otvorte archív, prejdite zoznam, skontrolujte súbor v náhľade a potom rozbaľte len túto položku alebo svoj výber."],["Čo pridáva Zipbox Pro?","Vytváranie ZIP a 7z so šifrovaním AES-256 a delením na zväzky, dávkové rozbalenie aj balenie, fulltextové hľadanie vnútri archívu, pokročilé nástroje na súbory, export a skratky Siri. Rozbaľovanie funguje aj bez toho."],["Ako obnovím nákup na novom zariadení?","Prihláste sa rovnakým účtom Apple, otvorte nastavenia v Zipboxe a ťuknite na Obnoviť nákupy."]],"secTrouble":"Keď niečo nefunguje","trouble":[["Archív sa neotvorí","Najprv overte, či sťahovanie dobehlo do konca. Súbor stiahnutý spolovice je neúplný a neprečíta ho žiadna aplikácia. Pri archíve v častiach dajte všetky časti do jedného priečinka a otvorte prvú."],["Heslo sa neprijíma","Na veľkosti písmen v heslách záleží a časť archívov vznikla v inom kódovaní znakov. Napíšte heslo ručne namiesto vkladania a skontrolujte, či na konci nezostala medzera."],["Nedostatok miesta","Archív po rozbalení zaberie viac než sám o sebe. Uvoľnite najprv miesto alebo rozbaľte len položky, ktoré potrebujete."],["Súbor vnútri vyzerá poškodene","Zipbox ukazuje to, čo archív naozaj obsahuje. Ak bol súbor poškodený už pred zabalením, rozbalenie to nespraví. Požiadajte odosielateľa o novú kópiu."]],"pages":{"support":{"title":"Podpora Zipbox","meta":"Pomoc so Zipboxom: otváranie archívov, heslá, archívy v častiach, obnovenie nákupu a kontakt.","badge":"Podpora","h1":"Pomoc so Zipboxom","lead":"Najčastejšie otázky a čo skúsiť, keď archív nespolupracuje. Ak tú vašu tu nenájdete, napíšte nám."}}},"sl-SI":{"langName":"Slovenščina","langLabel":"Jezik","navHome":"Domov","navSupport":"Podpora","navPrivacy":"Zasebnost","navTerms":"Pogoji","foot":"Zipbox v celoti teče na tvoji napravi. Brez računa, brez oglasov, brez analitike, brez pošiljanja.","updated":"Zadnja posodobitev","secContact":"Stik","contact":"Piši nam v katerem koli jeziku. Vsako sporočilo prebere človek.","contactHint":"Oblika arhiva, različica iOS in sporočilo, ki si ga videl na zaslonu, zelo pomagajo. Fiksnega časa odgovora ne obljubljamo.","secStart":"Za začetek","start":["Odpri arhiv iz Datotek, Maila, prenosa v Safariju ali menija za deljenje in izberi Zipbox, ali pa najprej zaženi Zipbox in poišči datoteko.","Tapni arhiv, da pogledaš vanj. Nič se ne razširi, dokler tega ne zahtevaš.","Predoglej si fotografijo, videoposnetek, PDF, besedilo ali kodo, da si prepričan, da je prava datoteka.","Razširi vse ali samo elemente, ki jih potrebuješ, in izberi, kam se shranijo."],"secFaq":"Pogosta vprašanja","faq":[["Katere oblike Zipbox odpre?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO in LZ4, vključno z arhivi, razdeljenimi na dele, in arhivi z geslom. Odpiranje ne stane nič in ne prikaže oglasov."],["Res ni nobenih oglasov?","Nobenega. Zipbox sploh ne vsebuje oglasne knjižnice, zato ni pasice, videa čez ves zaslon ne odštevanja pred odprtjem datoteke."],["Kako odprem arhiv, ki je v Datotekah, Mailu ali Safariju?","Tapni arhiv in izberi Zipbox ali uporabi meni za deljenje. Lahko tudi najprej odpreš Zipbox in poiščeš datoteko."],["Ali lahko izvlečem samo eno datoteko?","Lahko. Odpri arhiv, preglej seznam, preveri datoteko v predogledu in razširi samo to postavko ali svoj izbor."],["Kaj prinese Zipbox Pro?","Ustvarjanje ZIP in 7z s šifriranjem AES-256 in razdelitvijo na dele, paketno razširjanje in stiskanje, iskanje po celotnem besedilu znotraj arhiva, napredna orodja za datoteke, izvoz in bližnjice Siri. Razširjanje deluje tudi brez tega."],["Kako obnovim nakup na novi napravi?","Prijavi se z istim računom Apple, odpri nastavitve v Zipboxu in tapni Obnovi nakupe."]],"secTrouble":"Ko kaj zatakne","trouble":[["Arhiv se ne odpre","Najprej preveri, ali je prenos stekel do konca. Datoteka, prenesena do polovice, je nepopolna in je nobena aplikacija ne more prebrati. Pri arhivu v delih daj vse dele v isto mapo in odpri prvega."],["Pravi, da je geslo napačno","Pri geslih so pomembne velike in male črke, nekateri arhivi pa so nastali v drugem kodiranju znakov. Geslo vpiši ročno namesto prilepi in preveri, ali na koncu ni ostal presledek."],["Ni dovolj prostora","Arhiv razširjen zasede več kot sam po sebi. Najprej sprosti prostor ali pa razširi samo elemente, ki jih potrebuješ."],["Datoteka v arhivu je videti poškodovana","Zipbox prikaže tisto, kar arhiv v resnici vsebuje. Če je bila datoteka poškodovana že pred stiskanjem, razširjanje tega ne popravi. Pošiljatelja prosi za novo kopijo."]],"pages":{"support":{"title":"Zipbox podpora","meta":"Pomoč za Zipbox: odpiranje arhivov, gesla, arhivi v delih, obnovitev nakupa in stik.","badge":"Podpora","h1":"Pomoč za Zipbox","lead":"Vprašanja, ki jih dobimo največkrat, in kaj poskusiti, ko arhiv ne sodeluje. Če tvojega ni tu, nam piši."}}},"es-MX":{"langName":"Español (Latinoamérica)","langLabel":"Idioma","navHome":"Inicio","navSupport":"Ayuda","navPrivacy":"Privacidad","navTerms":"Condiciones","foot":"Zipbox funciona por completo en tu dispositivo. Sin cuenta, sin anuncios, sin analítica y sin subir nada.","updated":"Última actualización","secContact":"Contacto","contact":"Escríbenos en el idioma que prefieras. Cada mensaje lo lee una persona.","contactHint":"Indicar el formato del comprimido, la versión de iOS y el mensaje que viste en pantalla ayuda mucho. No prometemos un plazo fijo de respuesta.","secStart":"Primeros pasos","start":["Abre un comprimido desde Archivos, Mail, una descarga de Safari o el menú de compartir y elige Zipbox, o abre antes Zipbox y busca el archivo.","Toca el comprimido para mirar dentro. No se extrae nada hasta que tú lo pides.","Previsualiza una foto, un vídeo, un PDF, un texto o código para asegurarte de que es el que buscabas.","Extrae todo, o solo los elementos que necesites, y elige dónde se guardan."],"secFaq":"Preguntas frecuentes","faq":[["¿Qué formatos abre Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO y LZ4, incluidos los comprimidos divididos en partes y los protegidos con contraseña. Abrirlos no cuesta nada y no muestra anuncios."],["¿De verdad no hay anuncios?","Ninguno. Zipbox no lleva dentro ninguna biblioteca de publicidad, así que no hay banners, ni vídeos a pantalla completa, ni cuentas atrás antes de abrir un archivo."],["¿Cómo abro un comprimido que está en Archivos, Mail o Safari?","Toca el comprimido y elige Zipbox, o usa el menú de compartir. También puedes abrir Zipbox primero y navegar hasta el archivo."],["¿Puedo sacar solo un archivo?","Sí. Abre el comprimido, recorre la lista, comprueba el archivo en la vista previa y extrae solo ese elemento o tu selección."],["¿Qué añade Zipbox Pro?","Crear ZIP y 7z con cifrado AES-256 y volúmenes divididos, extraer y comprimir por lotes, búsqueda de texto completo dentro del comprimido, herramientas avanzadas de archivos, exportaciones y atajos de Siri. Extraer sigue disponible sin ello."],["¿Cómo restauro la compra en un dispositivo nuevo?","Inicia sesión con la misma cuenta de Apple, abre los ajustes dentro de Zipbox y toca Restaurar compras."]],"secTrouble":"Si algo falla","trouble":[["El comprimido no se abre","Comprueba primero que la descarga terminó: un archivo descargado a medias está incompleto y ninguna aplicación puede leerlo. Si está dividido en partes, pon todas las partes en la misma carpeta y abre la primera."],["Dice que la contraseña es incorrecta","Las contraseñas distinguen mayúsculas y minúsculas, y algunos comprimidos se crearon con otra codificación de caracteres. Escríbela a mano en vez de pegarla y comprueba que no haya un espacio al final."],["No hay espacio suficiente","Un comprimido ocupa más al abrirse. Libera espacio antes, o extrae solo los elementos que necesitas en lugar de todo."],["Un archivo de dentro parece dañado","Zipbox muestra lo que el comprimido contiene realmente. Si un archivo ya estaba dañado antes de comprimirse, extraerlo no lo repara. Pide al remitente una copia nueva."]],"pages":{"support":{"title":"Ayuda de Zipbox","meta":"Ayuda con Zipbox: abrir comprimidos, contraseñas, archivos divididos, restaurar la compra y contacto.","badge":"Ayuda","h1":"Ayuda con Zipbox","lead":"Las preguntas que más nos llegan y qué probar cuando un comprimido se resiste. Si la tuya no está, escríbenos."}}},"es-ES":{"langName":"Español (España)","langLabel":"Idioma","navHome":"Inicio","navSupport":"Ayuda","navPrivacy":"Privacidad","navTerms":"Condiciones","foot":"Zipbox funciona por completo en tu dispositivo. Sin cuenta, sin anuncios, sin analítica y sin subir nada.","updated":"Última actualización","secContact":"Contacto","contact":"Escríbenos en el idioma que prefieras. Cada mensaje lo lee una persona.","contactHint":"Indicar el formato del comprimido, la versión de iOS y el mensaje que viste en pantalla ayuda mucho. No prometemos un plazo fijo de respuesta.","secStart":"Primeros pasos","start":["Abre un comprimido desde Archivos, Mail, una descarga de Safari o el menú de compartir y elige Zipbox, o abre antes Zipbox y busca el archivo.","Toca el comprimido para mirar dentro. No se extrae nada hasta que tú lo pides.","Previsualiza una foto, un vídeo, un PDF, un texto o código para asegurarte de que es el que buscabas.","Extrae todo, o solo los elementos que necesites, y elige dónde se guardan."],"secFaq":"Preguntas frecuentes","faq":[["¿Qué formatos abre Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO y LZ4, incluidos los comprimidos divididos en partes y los protegidos con contraseña. Abrirlos no cuesta nada y no muestra anuncios."],["¿De verdad no hay anuncios?","Ninguno. Zipbox no lleva dentro ninguna biblioteca de publicidad, así que no hay banners, ni vídeos a pantalla completa, ni cuentas atrás antes de abrir un archivo."],["¿Cómo abro un comprimido que está en Archivos, Mail o Safari?","Toca el comprimido y elige Zipbox, o usa el menú de compartir. También puedes abrir Zipbox primero y navegar hasta el archivo."],["¿Puedo sacar solo un archivo?","Sí. Abre el comprimido, recorre la lista, comprueba el archivo en la vista previa y extrae solo ese elemento o tu selección."],["¿Qué añade Zipbox Pro?","Crear ZIP y 7z con cifrado AES-256 y volúmenes divididos, extraer y comprimir por lotes, búsqueda de texto completo dentro del comprimido, herramientas avanzadas de archivos, exportaciones y atajos de Siri. Extraer sigue disponible sin ello."],["¿Cómo restauro la compra en un dispositivo nuevo?","Inicia sesión con la misma cuenta de Apple, abre los ajustes dentro de Zipbox y toca Restaurar compras."]],"secTrouble":"Si algo falla","trouble":[["El comprimido no se abre","Comprueba primero que la descarga terminó: un archivo descargado a medias está incompleto y ninguna aplicación puede leerlo. Si está dividido en partes, pon todas las partes en la misma carpeta y abre la primera."],["Dice que la contraseña es incorrecta","Las contraseñas distinguen mayúsculas y minúsculas, y algunos comprimidos se crearon con otra codificación de caracteres. Escríbela a mano en vez de pegarla y comprueba que no haya un espacio al final."],["No hay espacio suficiente","Un comprimido ocupa más al abrirse. Libera espacio antes, o extrae solo los elementos que necesitas en lugar de todo."],["Un archivo de dentro parece dañado","Zipbox muestra lo que el comprimido contiene realmente. Si un archivo ya estaba dañado antes de comprimirse, extraerlo no lo repara. Pide al remitente una copia nueva."]],"pages":{"support":{"title":"Ayuda de Zipbox","meta":"Ayuda con Zipbox: abrir comprimidos, contraseñas, archivos divididos, restaurar la compra y contacto.","badge":"Ayuda","h1":"Ayuda con Zipbox","lead":"Las preguntas que más nos llegan y qué probar cuando un comprimido se resiste. Si la tuya no está, escríbenos."}}},"sv":{"langName":"Svenska","langLabel":"Språk","navHome":"Start","navSupport":"Support","navPrivacy":"Integritet","navTerms":"Villkor","foot":"Zipbox körs helt i din enhet. Inget konto, ingen reklam, ingen analys, inget skickas iväg.","updated":"Senast uppdaterad","secContact":"Kontakt","contact":"Skriv till oss på vilket språk du vill. Varje meddelande läses av en människa.","contactHint":"Arkivets format, din iOS version och meddelandet du såg på skärmen hjälper mycket. Vi lovar ingen fast svarstid.","secStart":"Kom igång","start":["Öppna ett arkiv från Filer, Mail, en nedladdning i Safari eller en delningsmeny och välj Zipbox, eller öppna Zipbox först och leta upp filen.","Tryck på arkivet för att titta i det. Ingenting packas upp förrän du ber om det.","Förhandsgranska ett foto, en video, en PDF, en text eller kod för att vara säker.","Packa upp allt, eller bara de poster du behöver, och välj var de sparas."],"secFaq":"Vanliga frågor","faq":[["Vilka format öppnar Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO och LZ4, inklusive arkiv i flera delar och arkiv med lösenord. Att öppna dem kostar ingenting och visar ingen reklam."],["Finns det verkligen ingen reklam?","Ingen alls. Zipbox innehåller inget annonsbibliotek över huvud taget, så det finns ingen banner, ingen helskärmsvideo och ingen nedräkning innan en fil öppnas."],["Hur öppnar jag ett arkiv som ligger i Filer, Mail eller Safari?","Tryck på arkivet och välj Zipbox, eller använd delningsmenyn. Du kan också öppna Zipbox först och leta upp filen."],["Kan jag plocka ut en enda fil?","Ja. Öppna arkivet, bläddra i listan, kontrollera filen i förhandsgranskningen och packa sedan upp bara den posten eller ditt urval."],["Vad tillför Zipbox Pro?","Att skapa ZIP och 7z med AES-256 kryptering och delade volymer, satsvis uppackning och komprimering, fritextsökning inuti arkiv, avancerade filverktyg, export och Siri genvägar. Uppackning fungerar även utan."],["Hur återställer jag köpet på en ny enhet?","Logga in med samma Apple konto, öppna inställningarna i Zipbox och tryck på Återställ köp."]],"secTrouble":"Om något krånglar","trouble":[["Arkivet öppnas inte","Kontrollera först att nedladdningen blev klar. En halvt nedladdad fil är ofullständig och ingen app kan läsa den. För arkiv i flera delar, lägg alla delar i samma mapp och öppna den första."],["Lösenordet godtas inte","Lösenord skiljer på stora och små bokstäver, och vissa arkiv skapades med en annan teckenkodning. Skriv lösenordet för hand i stället för att klistra in det och kontrollera att det inte finns ett mellanslag sist."],["Inte tillräckligt med utrymme","Ett arkiv tar mer plats när det öppnas. Frigör utrymme först, eller packa upp bara de poster du behöver i stället för allt."],["En fil inuti verkar skadad","Zipbox visar det som arkivet faktiskt innehåller. Om en fil redan var trasig innan den komprimerades kan uppackning inte laga den. Be avsändaren om en ny kopia."]],"pages":{"support":{"title":"Zipbox Support","meta":"Hjälp med Zipbox: öppna arkiv, lösenord, arkiv i flera delar, återställa köp och kontakt.","badge":"Support","h1":"Hjälp med Zipbox","lead":"De vanligaste frågorna och vad du kan prova när ett arkiv krånglar. Saknas din fråga är du välkommen att skriva."}}},"ta-IN":{"langName":"தமிழ்","langLabel":"மொழி","navHome":"முகப்பு","navSupport":"உதவி","navPrivacy":"தனியுரிமை","navTerms":"விதிமுறைகள்","foot":"Zipbox முழுவதும் உங்கள் சாதனத்தில் இயங்குகிறது. கணக்கு இல்லை, விளம்பரம் இல்லை, பகுப்பாய்வு இல்லை, பதிவேற்றம் இல்லை.","updated":"கடைசியாக புதுப்பிக்கப்பட்டது","secContact":"தொடர்பு","contact":"எந்த மொழியிலும் எங்களுக்கு எழுதுங்கள். ஒவ்வொரு செய்தியையும் ஒரு மனிதர் படிக்கிறார்.","contactHint":"காப்பகத்தின் வடிவம், iOS பதிப்பு, திரையில் தெரிந்த செய்தி ஆகியவற்றைச் சொன்னால் பெரிதும் உதவும். பதிலுக்கு நிலையான கால அளவு உறுதி அளிக்கவில்லை.","secStart":"தொடங்குவது எப்படி","start":["கோப்புகள், அஞ்சல், Safari பதிவிறக்கம் அல்லது பகிர்வு பட்டியலிலிருந்து காப்பகத்தைத் திறந்து Zipbox ஐத் தேர்ந்தெடுங்கள், அல்லது முதலில் Zipbox ஐத் திறந்து கோப்பைத் தேடுங்கள்.","உள்ளே பார்க்க காப்பகத்தைத் தட்டுங்கள். நீங்கள் கேட்கும் வரை எதுவும் பிரிக்கப்படாது.","இதுதான் சரியான கோப்பா என உறுதி செய்ய படம், வீடியோ, PDF, உரை அல்லது நிரலை முன்னோட்டமிடுங்கள்.","அனைத்தையும் பிரித்தெடுங்கள், அல்லது தேவையானவற்றை மட்டும், பிறகு எங்கே சேமிக்க வேண்டும் எனத் தேர்ந்தெடுங்கள்."],"secFaq":"அடிக்கடி கேட்கப்படுவது","faq":[["Zipbox எந்த வடிவங்களைத் திறக்கும்?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO, LZ4, இதில் பல பகுதிகளாகப் பிரிந்தவையும் கடவுச்சொல் இட்டவையும் அடங்கும். இவற்றைத் திறக்க எந்தக் கட்டணமும் இல்லை, விளம்பரமும் தோன்றாது."],["உண்மையிலேயே விளம்பரம் இல்லையா?","ஒன்றும் இல்லை. Zipbox இல் விளம்பர நூலகமே இல்லை, எனவே பேனரும் இல்லை, முழுத்திரை வீடியோவும் இல்லை, கோப்பு திறப்பதற்கு முன் காத்திருப்பும் இல்லை."],["கோப்புகள், அஞ்சல் அல்லது Safari இல் உள்ள காப்பகத்தை எப்படித் திறப்பது?","காப்பகத்தைத் தட்டி Zipbox ஐத் தேர்ந்தெடுங்கள், அல்லது பகிர்வு பட்டியலைப் பயன்படுத்துங்கள். முதலில் Zipbox ஐத் திறந்து கோப்பைத் தேடவும் முடியும்."],["ஒரே ஒரு கோப்பை மட்டும் எடுக்க முடியுமா?","முடியும். காப்பகத்தைத் திறந்து, பட்டியலைப் பார்த்து, முன்னோட்டத்தில் உறுதி செய்து, அந்த ஒன்றை அல்லது நீங்கள் தேர்ந்தெடுத்தவற்றை மட்டும் பிரித்தெடுங்கள்."],["Zipbox Pro இல் கூடுதலாக என்ன?","AES-256 மறையாக்கத்துடனும் பகுதிகளாகப் பிரித்தும் ZIP, 7z உருவாக்குதல், பல கோப்புகளை ஒரே நேரத்தில் பிரித்தெடுத்தல், சுருக்குதல், காப்பகத்திற்குள் முழு உரைத் தேடல், மேம்பட்ட கோப்புக் கருவிகள், ஏற்றுமதி, Siri குறுக்குவழிகள். இது இல்லாமலும் பிரித்தெடுத்தல் தொடரும்."],["புதிய சாதனத்தில் கொள்முதலை எப்படி மீட்பது?","அதே Apple கணக்கில் உள்நுழைந்து, Zipbox அமைப்புகளைத் திறந்து, கொள்முதலை மீட்டமை என்பதைத் தட்டுங்கள்."]],"secTrouble":"ஏதேனும் சிக்கினால்","trouble":[["காப்பகம் திறக்கவில்லை","முதலில் பதிவிறக்கம் முழுமையாக முடிந்ததா எனப் பாருங்கள். பாதியில் நின்ற கோப்பு முழுமையற்றது, எந்தச் செயலியாலும் படிக்க முடியாது. பல பகுதிகள் இருந்தால் அனைத்தையும் ஒரே கோப்புறையில் வைத்து முதல் பகுதியைத் திறங்கள்."],["கடவுச்சொல் தவறு எனக் காட்டுகிறது","கடவுச்சொற்களில் பெரிய சிறிய எழுத்து வேறுபாடு உண்டு, சில காப்பகங்கள் வேறு எழுத்துக் குறியாக்கத்தில் உருவாக்கப்பட்டவை. ஒட்டுவதற்குப் பதிலாகத் தட்டச்சு செய்யுங்கள், இறுதியில் இடைவெளி இருக்கிறதா எனப் பாருங்கள்."],["இடம் போதவில்லை","காப்பகம் பிரித்த பிறகு தன் அளவைவிட அதிக இடம் எடுக்கும். முதலில் இடத்தைக் காலி செய்யுங்கள், அல்லது அனைத்தையும் பிரிக்காமல் தேவையானவற்றை மட்டும் எடுங்கள்."],["உள்ளே உள்ள கோப்பு சேதமடைந்ததாகத் தெரிகிறது","காப்பகத்தில் உண்மையில் உள்ளதையே Zipbox காட்டுகிறது. சுருக்கப்படுவதற்கு முன்பே கோப்பு சேதமடைந்திருந்தால் பிரித்தெடுப்பது அதைச் சரிசெய்யாது. அனுப்பியவரிடம் புதிய நகலைக் கேளுங்கள்."]],"pages":{"support":{"title":"Zipbox உதவி","meta":"Zipbox உதவி: காப்பகங்களைத் திறத்தல், கடவுச்சொற்கள், பல பகுதிக் காப்பகங்கள், கொள்முதல் மீட்பு, தொடர்பு.","badge":"உதவி","h1":"Zipbox உதவி","lead":"அடிக்கடி வரும் கேள்விகள், ஒரு காப்பகம் திறக்காதபோது என்ன செய்யலாம். உங்கள் கேள்வி இங்கு இல்லையெனில் எங்களுக்கு எழுதுங்கள்."}}},"te-IN":{"langName":"తెలుగు","langLabel":"భాష","navHome":"హోమ్","navSupport":"సహాయం","navPrivacy":"గోప్యత","navTerms":"నిబంధనలు","foot":"Zipbox పూర్తిగా మీ పరికరంలోనే నడుస్తుంది. ఖాతా లేదు, ప్రకటనలు లేవు, విశ్లేషణ లేదు, అప్‌లోడ్ లేదు.","updated":"చివరిసారి నవీకరించినది","secContact":"సంప్రదింపు","contact":"ఏ భాషలోనైనా మాకు రాయండి. ప్రతి సందేశాన్నీ ఒక మనిషి చదువుతారు.","contactHint":"ఆర్కైవ్ ఫార్మాట్, iOS వెర్షన్, తెరపై కనిపించిన సందేశం చెబితే చాలా ఉపయోగపడుతుంది. స్పందనకు నిర్ణీత సమయాన్ని మేము హామీ ఇవ్వము.","secStart":"ఎలా మొదలుపెట్టాలి","start":["ఫైల్స్, మెయిల్, Safari డౌన్‌లోడ్ లేదా ఏదైనా షేర్ మెనూ నుంచి ఆర్కైవ్ తెరిచి Zipbox ఎంచుకోండి, లేదా ముందు Zipbox తెరిచి ఫైల్ వద్దకు వెళ్లండి.","లోపల చూడటానికి ఆర్కైవ్‌ను నొక్కండి. మీరు అడిగే వరకు ఏదీ తీయబడదు.","ఇదే కావలసిన ఫైలా అని నిర్ధారించుకోవడానికి ఫొటో, వీడియో, PDF, పాఠ్యం లేదా కోడ్ ప్రివ్యూ చేయండి.","అన్నీ తీయండి, లేదా కావలసినవి మాత్రమే, ఆపై ఎక్కడ భద్రపరచాలో ఎంచుకోండి."],"secFaq":"తరచుగా అడిగే ప్రశ్నలు","faq":[["Zipbox ఏ ఫార్మాట్లను తెరుస్తుంది?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO, LZ4, వీటిలో అనేక భాగాల ఆర్కైవ్‌లు, పాస్‌వర్డ్ ఉన్నవీ ఉన్నాయి. వీటిని తెరవడానికి ఎలాంటి రుసుము లేదు, ప్రకటనా కనిపించదు."],["నిజంగా ప్రకటనలే లేవా?","ఒక్కటీ లేదు. Zipbox లో ప్రకటనల లైబ్రరీయే లేదు, కాబట్టి బ్యానర్ లేదు, పూర్తి తెర వీడియో లేదు, ఫైల్ తెరవకముందు కౌంట్‌డౌన్ కూడా లేదు."],["ఫైల్స్, మెయిల్ లేదా Safari లోని ఆర్కైవ్‌ను ఎలా తెరవాలి?","ఆర్కైవ్‌ను నొక్కి Zipbox ఎంచుకోండి, లేదా షేర్ మెనూ వాడండి. ముందు Zipbox తెరిచి ఫైల్ వద్దకు కూడా వెళ్లవచ్చు."],["ఒక్క ఫైల్ మాత్రమే తీయవచ్చా?","తీయవచ్చు. ఆర్కైవ్ తెరిచి, జాబితా చూసి, ప్రివ్యూలో నిర్ధారించుకుని, ఆ ఒక్కదాన్ని లేదా మీరు ఎంచుకున్నవాటిని మాత్రమే తీయండి."],["Zipbox Pro లో అదనంగా ఏమి ఉంటుంది?","AES-256 ఎన్‌క్రిప్షన్‌తో, భాగాలుగా విభజించి ZIP, 7z తయారీ, ఒకేసారి అనేక ఫైళ్లను తీయడం, కుదించడం, ఆర్కైవ్ లోపల పూర్తి పాఠ్య శోధన, అధునాతన ఫైల్ సాధనాలు, ఎగుమతి, Siri షార్ట్‌కట్‌లు. ఇది లేకున్నా ఫైల్ తీయడం కొనసాగుతుంది."],["కొత్త పరికరంలో కొనుగోలును ఎలా పునరుద్ధరించాలి?","అదే Apple ఖాతాతో సైన్ ఇన్ చేసి, Zipbox సెట్టింగ్‌లు తెరిచి, కొనుగోళ్లను పునరుద్ధరించండి అన్నదాన్ని నొక్కండి."]],"secTrouble":"ఏదైనా ఇబ్బంది వస్తే","trouble":[["ఆర్కైవ్ తెరుచుకోవడం లేదు","ముందుగా డౌన్‌లోడ్ పూర్తయిందా చూడండి. సగంలో ఆగిన ఫైల్ అసంపూర్ణం, దాన్ని ఏ యాప్ చదవలేదు. అనేక భాగాల ఆర్కైవ్ అయితే అన్ని భాగాలను ఒకే ఫోల్డర్‌లో ఉంచి మొదటిది తెరవండి."],["పాస్‌వర్డ్ తప్పు అని చూపుతోంది","పాస్‌వర్డ్‌లలో చిన్న పెద్ద అక్షరాల తేడా ఉంటుంది, కొన్ని ఆర్కైవ్‌లు వేరే అక్షర ఎన్‌కోడింగ్‌తో తయారైనవి. అతికించే బదులు మీరే టైప్ చేయండి, చివర ఖాళీ మిగిలిందేమో చూడండి."],["చోటు సరిపోవడం లేదు","ఆర్కైవ్ తెరిచాక దాని పరిమాణం కంటే ఎక్కువ చోటు తీసుకుంటుంది. ముందు చోటు ఖాళీ చేయండి, లేదా అన్నీ కాకుండా కావలసినవి మాత్రమే తీయండి."],["లోపలి ఫైల్ పాడైనట్టు కనిపిస్తోంది","ఆర్కైవ్‌లో నిజంగా ఉన్నదాన్నే Zipbox చూపుతుంది. కుదించకముందే ఫైల్ పాడైతే తీయడం దాన్ని బాగు చేయదు. పంపినవారి నుంచి కొత్త కాపీ అడగండి."]],"pages":{"support":{"title":"Zipbox సహాయం","meta":"Zipbox సహాయం: ఆర్కైవ్‌లు తెరవడం, పాస్‌వర్డ్‌లు, భాగాల ఆర్కైవ్‌లు, కొనుగోలు పునరుద్ధరణ, సంప్రదింపు.","badge":"సహాయం","h1":"Zipbox సహాయం","lead":"ఎక్కువగా వచ్చే ప్రశ్నలు, ఆర్కైవ్ తెరుచుకోనప్పుడు ఏమి ప్రయత్నించాలి. మీ ప్రశ్న ఇక్కడ లేకపోతే మాకు రాయండి."}}},"th":{"langName":"ไทย","langLabel":"ภาษา","navHome":"หน้าแรก","navSupport":"ความช่วยเหลือ","navPrivacy":"ความเป็นส่วนตัว","navTerms":"ข้อกำหนด","foot":"Zipbox ทำงานบนเครื่องของคุณทั้งหมด ไม่มีบัญชี ไม่มีโฆษณา ไม่มีการวิเคราะห์ ไม่มีการอัปโหลด","updated":"อัปเดตล่าสุด","secContact":"ติดต่อเรา","contact":"เขียนมาหาเราด้วยภาษาใดก็ได้ ทุกข้อความมีคนอ่านจริง","contactHint":"ถ้าบอกรูปแบบไฟล์ เวอร์ชัน iOS และข้อความที่เห็นบนหน้าจอมาด้วย จะช่วยได้มาก เราไม่รับปากเวลาตอบกลับที่แน่นอน","secStart":"เริ่มต้นใช้งาน","start":["เปิดไฟล์บีบอัดจากแอปไฟล์ อีเมล รายการดาวน์โหลดใน Safari หรือเมนูแชร์ แล้วเลือก Zipbox หรือจะเปิด Zipbox ก่อนแล้วค่อยหาไฟล์ก็ได้","แตะที่ไฟล์บีบอัดเพื่อดูข้างใน จะยังไม่มีการแตกไฟล์จนกว่าคุณจะสั่ง","พรีวิวรูปภาพ วิดีโอ PDF ข้อความ หรือโค้ด เพื่อให้แน่ใจว่าเป็นไฟล์ที่ต้องการ","แตกทั้งหมด หรือเลือกเฉพาะรายการที่ต้องการ แล้วเลือกที่จัดเก็บ"],"secFaq":"คำถามที่พบบ่อย","faq":[["Zipbox เปิดไฟล์รูปแบบใดได้บ้าง","ZIP RAR 7z TAR GZ BZ2 XZ LZMA ISO และ LZ4 รวมถึงไฟล์ที่แบ่งเป็นหลายส่วนและไฟล์ที่ตั้งรหัสผ่าน การเปิดทั้งหมดนี้ไม่มีค่าใช้จ่ายและไม่มีโฆษณา"],["ไม่มีโฆษณาจริงหรือ","ไม่มีจริง ๆ ใน Zipbox ไม่มีไลบรารีโฆษณาอยู่เลย จึงไม่มีแบนเนอร์ ไม่มีวิดีโอเต็มจอ และไม่มีการนับถอยหลังก่อนเปิดไฟล์"],["ไฟล์ที่อยู่ในแอปไฟล์ อีเมล หรือ Safari เปิดอย่างไร","แตะที่ไฟล์แล้วเลือก Zipbox หรือใช้เมนูแชร์ก็ได้ หรือจะเปิด Zipbox ก่อนแล้วไปหาไฟล์นั้นก็ได้เช่นกัน"],["ดึงออกมาแค่ไฟล์เดียวได้ไหม","ได้ เปิดไฟล์บีบอัด เลื่อนดูรายการ พรีวิวเพื่อยืนยัน แล้วแตกเฉพาะรายการนั้นหรือรายการที่เลือกไว้"],["Zipbox Pro เพิ่มอะไรบ้าง","การสร้าง ZIP และ 7z พร้อมการเข้ารหัส AES-256 และแบ่งเป็นหลายส่วน การแตกไฟล์และบีบอัดทีละหลายรายการ การค้นหาข้อความทั้งหมดภายในไฟล์บีบอัด เครื่องมือจัดการไฟล์ขั้นสูง การส่งออก และคำสั่งลัด Siri ส่วนการแตกไฟล์ใช้ได้อยู่แล้วโดยไม่ต้องซื้อ"],["เปลี่ยนเครื่องใหม่ กู้คืนการซื้ออย่างไร","ลงชื่อเข้าใช้ด้วยบัญชี Apple เดิม เปิดหน้าตั้งค่าใน Zipbox แล้วแตะกู้คืนการซื้อ"]],"secTrouble":"เมื่อมีอะไรติดขัด","trouble":[["ไฟล์บีบอัดเปิดไม่ได้","ตรวจสอบก่อนว่าดาวน์โหลดเสร็จสมบูรณ์ ไฟล์ที่โหลดค้างกลางทางจะไม่สมบูรณ์และไม่มีแอปใดอ่านได้ ถ้าเป็นไฟล์ที่แบ่งหลายส่วน ให้วางทุกส่วนไว้ในโฟลเดอร์เดียวกันแล้วเปิดส่วนแรก"],["ระบบแจ้งว่ารหัสผ่านไม่ถูกต้อง","รหัสผ่านแยกตัวพิมพ์ใหญ่เล็ก และไฟล์บางไฟล์ถูกสร้างด้วยการเข้ารหัสอักขระคนละแบบ ให้พิมพ์เองแทนการวาง และตรวจดูว่าไม่มีช่องว่างต่อท้าย"],["พื้นที่ไม่พอ","ไฟล์บีบอัดเมื่อแตกออกมาจะใช้พื้นที่มากกว่าตัวไฟล์เอง ให้เคลียร์พื้นที่ก่อน หรือแตกเฉพาะรายการที่ต้องการแทนที่จะแตกทั้งหมด"],["ไฟล์ข้างในดูเสียหาย","Zipbox แสดงสิ่งที่อยู่ในไฟล์บีบอัดตามจริง ถ้าไฟล์เสียหายมาตั้งแต่ก่อนถูกบีบอัด การแตกไฟล์ก็ซ่อมไม่ได้ ให้ขอไฟล์ใหม่จากผู้ส่ง"]],"pages":{"support":{"title":"ความช่วยเหลือ Zipbox","meta":"วิธีใช้ Zipbox: เปิดไฟล์บีบอัด รหัสผ่าน ไฟล์ที่แบ่งหลายส่วน การกู้คืนการซื้อ และการติดต่อ","badge":"ความช่วยเหลือ","h1":"วิธีใช้ Zipbox","lead":"คำถามที่พบบ่อยที่สุด และสิ่งที่ควรลองเมื่อไฟล์บีบอัดไม่ยอมทำงาน ถ้าไม่มีคำตอบที่ต้องการ เขียนมาหาเราได้"}}},"tr":{"langName":"Türkçe","langLabel":"Dil","navHome":"Ana sayfa","navSupport":"Destek","navPrivacy":"Gizlilik","navTerms":"Koşullar","foot":"Zipbox tümüyle kendi cihazında çalışır. Hesap yok, reklam yok, analiz yok, yükleme yok.","updated":"Son güncelleme","secContact":"İletişim","contact":"Bize istediğin dilde yaz. Her mesajı bir insan okuyor.","contactHint":"Arşiv biçimi, iOS sürümü ve ekranda gördüğün mesaj çok yardımcı olur. Sabit bir yanıt süresi vaat etmiyoruz.","secStart":"Başlarken","start":["Bir arşivi Dosyalar'dan, Mail'den, Safari indirmesinden veya paylaşım menüsünden aç ve Zipbox'ı seç, ya da önce Zipbox'ı açıp dosyaya git.","İçine bakmak için arşive dokun. Sen istemeden hiçbir şey çıkarılmaz.","Doğru dosya olduğundan emin olmak için bir fotoğrafı, videoyu, PDF'i, metni veya kodu önizle.","Tamamını, ya da yalnızca ihtiyacın olan öğeleri çıkar ve nereye kaydedileceğini seç."],"secFaq":"Sık sorulan sorular","faq":[["Zipbox hangi biçimleri açar?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO ve LZ4; parçalara bölünmüş ve şifreyle korunan arşivler dahil. Bunları açmak hiçbir ücret gerektirmez ve reklam göstermez."],["Gerçekten hiç reklam yok mu?","Hiç yok. Zipbox'ın içinde hiçbir reklam kitaplığı bulunmuyor; bu yüzden afiş, tam ekran video veya dosya açılmadan önce geri sayım yok."],["Dosyalar, Mail veya Safari'deki bir arşivi nasıl açarım?","Arşive dokun ve Zipbox'ı seç, ya da paylaşım menüsünü kullan. Önce Zipbox'ı açıp dosyaya da gidebilirsin."],["Tek bir dosyayı çıkarabilir miyim?","Evet. Arşivi aç, listeyi gez, dosyayı önizlemede doğrula ve yalnızca o öğeyi ya da seçimini çıkar."],["Zipbox Pro ne katıyor?","AES-256 şifreleme ve bölünmüş birimlerle ZIP ve 7z oluşturma, toplu açma ve sıkıştırma, arşiv içinde tam metin arama, gelişmiş dosya araçları, dışa aktarma ve Siri kısayolları. Çıkarma bunlar olmadan da çalışır."],["Yeni cihazda satın almayı nasıl geri yüklerim?","Aynı Apple hesabıyla giriş yap, Zipbox içindeki ayarları aç ve Satın Alımları Geri Yükle'ye dokun."]],"secTrouble":"Bir şey takılırsa","trouble":[["Arşiv açılmıyor","Önce indirmenin tamamlandığını doğrula. Yarım inen bir dosya eksiktir ve hiçbir uygulama onu okuyamaz. Parçalı arşivde bütün parçaları aynı klasöre koy ve ilkini aç."],["Şifre kabul edilmiyor","Şifrelerde büyük küçük harf ayrımı vardır ve bazı arşivler farklı karakter kodlamasıyla oluşturulmuştur. Yapıştırmak yerine elle yaz ve sonunda boşluk kalmadığını kontrol et."],["Yeterli alan yok","Bir arşiv açıldığında kendisinden daha fazla yer kaplar. Önce yer aç, ya da tamamı yerine yalnızca ihtiyacın olan öğeleri çıkar."],["İçindeki bir dosya bozuk görünüyor","Zipbox, arşivin gerçekte ne içerdiğini gösterir. Bir dosya sıkıştırılmadan önce zaten bozulmuşsa çıkarmak onu onarmaz. Gönderenden yeni bir kopya iste."]],"pages":{"support":{"title":"Zipbox Destek","meta":"Zipbox yardımı: arşiv açma, şifreler, parçalı arşivler, satın almayı geri yükleme ve iletişim.","badge":"Destek","h1":"Zipbox yardımı","lead":"En sık gelen sorular ve bir arşiv inat ettiğinde deneyebileceklerin. Seninki burada yoksa bize yaz."}}},"uk":{"langName":"Українська","langLabel":"Мова","navHome":"Головна","navSupport":"Підтримка","navPrivacy":"Конфіденційність","navTerms":"Умови","foot":"Zipbox працює повністю на вашому пристрої. Без облікового запису, без реклами, без аналітики, без надсилання даних.","updated":"Останнє оновлення","secContact":"Зв'язатися","contact":"Пишіть нам будь-якою мовою. Кожен лист читає людина.","contactHint":"Формат архіву, версія iOS і текст повідомлення на екрані дуже допомагають. Фіксованого терміну відповіді ми не обіцяємо.","secStart":"З чого почати","start":["Відкрийте архів із Файлів, Пошти, завантаження в Safari чи меню поширення й оберіть Zipbox, або спершу запустіть Zipbox і знайдіть файл.","Торкніться архіву, щоб подивитися всередину. Нічого не розпакується, доки ви цього не попросите.","Перегляньте фото, відео, PDF, текст або код, щоб переконатися, що це потрібний файл.","Розпакуйте все або лише потрібні елементи й оберіть, куди їх зберегти."],"secFaq":"Часті запитання","faq":[["Які формати відкриває Zipbox?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO і LZ4, разом з архівами з кількох частин та архівами з паролем. Відкриття нічого не коштує й не показує реклами."],["Реклами справді зовсім немає?","Зовсім. У Zipbox взагалі немає рекламної бібліотеки, тому немає ні банера, ні відео на весь екран, ні відліку перед відкриттям файлу."],["Як відкрити архів, що лежить у Файлах, Пошті чи Safari?","Торкніться архіву й оберіть Zipbox або скористайтеся меню поширення. Можна й спершу відкрити Zipbox, а потім знайти файл."],["Чи можна дістати лише один файл?","Можна. Відкрийте архів, перегляньте список, перевірте файл у попередньому перегляді й розпакуйте лише його або вибрані елементи."],["Що дає Zipbox Pro?","Створення ZIP і 7z із шифруванням AES-256 та поділом на томи, пакетне розпакування і стиснення, повнотекстовий пошук усередині архіву, розширені дії з файлами, експорт і команди Siri. Розпакування працює й без цього."],["Як відновити покупку на новому пристрої?","Увійдіть із тим самим обліковим записом Apple, відкрийте налаштування в Zipbox і натисніть «Відновити покупки»."]],"secTrouble":"Якщо щось не так","trouble":[["Архів не відкривається","Спершу перевірте, чи завантаження завершилося. Файл, скачаний наполовину, неповний, і його не прочитає жодна програма. Якщо архів із кількох частин, покладіть усі частини в одну папку й відкрийте першу."],["Пише, що пароль неправильний","У паролях важливий регістр, а частину архівів створено в іншому кодуванні символів. Введіть пароль вручну, а не вставляйте, і перевірте, чи не лишився пробіл у кінці."],["Бракує місця","Архів після розпакування займає більше, ніж сам файл. Звільніть місце або витягніть лише потрібні елементи замість усього архіву."],["Файл усередині виглядає пошкодженим","Zipbox показує те, що в архіві є насправді. Якщо файл був зіпсований ще до стиснення, розпакування цього не виправить. Попросіть відправника надіслати нову копію."]],"pages":{"support":{"title":"Підтримка Zipbox","meta":"Допомога щодо Zipbox: відкриття архівів, паролі, архіви з частин, відновлення покупки та контакти.","badge":"Підтримка","h1":"Допомога щодо Zipbox","lead":"Найчастіші запитання і що спробувати, коли архів вередує. Якщо вашого тут немає, напишіть нам."}}},"ur-PK":{"langName":"اردو","langLabel":"زبان","navHome":"صفحۂ اول","navSupport":"مدد","navPrivacy":"رازداری","navTerms":"شرائط","foot":"Zipbox مکمل طور پر آپ کے آلے پر چلتا ہے۔ کوئی اکاؤنٹ نہیں، کوئی اشتہار نہیں، کوئی تجزیہ نہیں، کوئی اپ لوڈ نہیں۔","updated":"آخری تازہ کاری","secContact":"رابطہ","contact":"ہمیں کسی بھی زبان میں لکھیں۔ ہر پیغام ایک انسان پڑھتا ہے۔","contactHint":"آرکائیو کا فارمیٹ، iOS کا ورژن اور اسکرین پر نظر آنے والا پیغام بتانا بہت مددگار ہوتا ہے۔ ہم جواب کے لیے کوئی مقررہ وقت نہیں دیتے۔","secStart":"شروعات","start":["فائلز، میل، سفاری کی ڈاؤن لوڈ یا کسی شیئر مینو سے آرکائیو کھولیں اور Zipbox منتخب کریں، یا پہلے Zipbox کھول کر فائل تک جائیں۔","اندر دیکھنے کے لیے آرکائیو پر ٹیپ کریں۔ جب تک آپ نہ کہیں، کچھ نہیں نکالا جاتا۔","یہ یقینی بنانے کے لیے کہ یہی مطلوبہ فائل ہے، تصویر، ویڈیو، PDF، متن یا کوڈ کا پیش منظر دیکھیں۔","سب کچھ نکالیں، یا صرف مطلوبہ اشیاء، اور محفوظ کرنے کی جگہ منتخب کریں۔"],"secFaq":"عام سوالات","faq":[["Zipbox کون سے فارمیٹ کھولتا ہے؟","ZIP، RAR، 7z، TAR، GZ، BZ2، XZ، LZMA، ISO اور LZ4، بشمول کئی حصوں میں بٹے اور پاس ورڈ سے محفوظ آرکائیو۔ انہیں کھولنے پر کوئی رقم نہیں لگتی اور کوئی اشتہار نہیں آتا۔"],["کیا واقعی کوئی اشتہار نہیں؟","بالکل نہیں۔ Zipbox میں اشتہار کی کوئی لائبریری ہے ہی نہیں، اس لیے نہ بینر ہے، نہ پوری اسکرین کی ویڈیو اور نہ فائل کھلنے سے پہلے الٹی گنتی۔"],["فائلز، میل یا سفاری میں موجود آرکائیو کیسے کھولیں؟","آرکائیو پر ٹیپ کر کے Zipbox منتخب کریں، یا شیئر مینو استعمال کریں۔ آپ پہلے Zipbox کھول کر بھی فائل تک جا سکتے ہیں۔"],["کیا صرف ایک فائل نکالی جا سکتی ہے؟","جی ہاں۔ آرکائیو کھولیں، فہرست دیکھیں، پیش منظر میں تصدیق کریں اور صرف وہی شے یا اپنی منتخب اشیاء نکالیں۔"],["Zipbox Pro میں کیا اضافی ملتا ہے؟","AES-256 خفیہ کاری اور حصوں میں تقسیم کے ساتھ ZIP اور 7z بنانا، بیک وقت کئی فائلیں نکالنا اور دبانا، آرکائیو کے اندر مکمل متن کی تلاش، فائل کے جدید اوزار، برآمد اور Siri شارٹ کٹ۔ فائل نکالنا اس کے بغیر بھی چلتا رہتا ہے۔"],["نئے آلے پر خریداری کیسے بحال کریں؟","اسی Apple اکاؤنٹ سے سائن اِن کریں، Zipbox کی ترتیبات کھولیں اور خریداری بحال کریں پر ٹیپ کریں۔"]],"secTrouble":"اگر کچھ اٹک جائے","trouble":[["آرکائیو نہیں کھل رہا","پہلے دیکھیں کہ ڈاؤن لوڈ مکمل ہوا تھا یا نہیں۔ آدھی ڈاؤن لوڈ ہوئی فائل نامکمل ہوتی ہے اور کوئی ایپ اسے نہیں پڑھ سکتی۔ کئی حصوں والے آرکائیو کے لیے تمام حصے ایک ہی فولڈر میں رکھیں اور پہلا حصہ کھولیں۔"],["پاس ورڈ غلط بتا رہا ہے","پاس ورڈ میں چھوٹے بڑے حروف کا فرق ہوتا ہے، اور کچھ آرکائیو مختلف کریکٹر انکوڈنگ سے بنے ہوتے ہیں۔ پیسٹ کرنے کے بجائے خود ٹائپ کریں اور دیکھیں کہ آخر میں خالی جگہ تو نہیں رہ گئی۔"],["جگہ کم ہے","آرکائیو کھلنے کے بعد اپنے حجم سے زیادہ جگہ لیتا ہے۔ پہلے جگہ خالی کریں، یا سب کچھ نکالنے کے بجائے صرف مطلوبہ اشیاء نکالیں۔"],["اندر کی کوئی فائل خراب لگ رہی ہے","Zipbox وہی دکھاتا ہے جو آرکائیو میں واقعی موجود ہے۔ اگر فائل دبائے جانے سے پہلے ہی خراب تھی تو نکالنے سے وہ ٹھیک نہیں ہوگی۔ بھیجنے والے سے نئی نقل مانگیں۔"]],"pages":{"support":{"title":"Zipbox مدد","meta":"Zipbox کی مدد: آرکائیو کھولنا، پاس ورڈ، کئی حصوں والے آرکائیو، خریداری کی بحالی اور رابطہ۔","badge":"مدد","h1":"Zipbox کی مدد","lead":"سب سے زیادہ پوچھے جانے والے سوالات، اور جب کوئی آرکائیو نہ کھلے تو کیا آزمائیں۔ اگر آپ کا سوال یہاں نہ ہو تو ہمیں لکھیں۔"}}},"vi":{"langName":"Tiếng Việt","langLabel":"Ngôn ngữ","navHome":"Trang chủ","navSupport":"Hỗ trợ","navPrivacy":"Quyền riêng tư","navTerms":"Điều khoản","foot":"Zipbox chạy hoàn toàn trên máy của bạn. Không tài khoản, không quảng cáo, không phân tích, không tải lên.","updated":"Cập nhật lần cuối","secContact":"Liên hệ","contact":"Hãy viết cho chúng tôi bằng bất kỳ ngôn ngữ nào. Mỗi tin nhắn đều có người thật đọc.","contactHint":"Cho biết định dạng tệp nén, phiên bản iOS và thông báo bạn thấy trên màn hình sẽ giúp ích rất nhiều. Chúng tôi không hứa thời gian phản hồi cố định.","secStart":"Bắt đầu","start":["Mở một tệp nén từ Tệp, Mail, mục tải xuống Safari hoặc trình đơn chia sẻ rồi chọn Zipbox, hoặc mở Zipbox trước rồi tìm đến tệp.","Chạm vào tệp nén để xem bên trong. Chưa có gì được giải nén cho tới khi bạn yêu cầu.","Xem thử ảnh, video, PDF, văn bản hoặc mã nguồn để chắc chắn đó là tệp bạn cần.","Giải nén toàn bộ, hoặc chỉ những mục cần thiết, rồi chọn nơi lưu."],"secFaq":"Câu hỏi thường gặp","faq":[["Zipbox mở được những định dạng nào?","ZIP, RAR, 7z, TAR, GZ, BZ2, XZ, LZMA, ISO và LZ4, bao gồm cả tệp nén chia nhiều phần và tệp nén đặt mật khẩu. Mở chúng không tốn phí và không hiện quảng cáo."],["Thật sự không có quảng cáo nào sao?","Đúng vậy. Zipbox không hề chứa thư viện quảng cáo nào, nên không có biểu ngữ, không video toàn màn hình và không đếm ngược trước khi tệp mở ra."],["Làm sao mở tệp nén đang nằm trong Tệp, Mail hoặc Safari?","Chạm vào tệp nén rồi chọn Zipbox, hoặc dùng trình đơn chia sẻ. Bạn cũng có thể mở Zipbox trước rồi tìm đến tệp."],["Có thể lấy ra đúng một tệp không?","Có. Mở tệp nén, lướt danh sách, xem thử để chắc chắn, rồi chỉ giải nén mục đó hoặc nhóm bạn chọn."],["Zipbox Pro thêm những gì?","Tạo ZIP và 7z với mã hóa AES-256 và chia nhiều phần, giải nén và nén hàng loạt, tìm toàn văn bên trong tệp nén, công cụ tệp nâng cao, xuất tệp và phím tắt Siri. Giải nén vẫn dùng được mà không cần mua."],["Khôi phục giao dịch mua trên máy mới thế nào?","Đăng nhập cùng một tài khoản Apple, mở phần cài đặt trong Zipbox rồi chạm Khôi phục giao dịch mua."]],"secTrouble":"Khi có trục trặc","trouble":[["Tệp nén không mở được","Trước tiên hãy kiểm tra xem việc tải xuống đã xong chưa. Tệp tải dở là tệp thiếu và không ứng dụng nào đọc được. Với tệp nén chia nhiều phần, hãy đặt tất cả các phần vào cùng một thư mục rồi mở phần đầu tiên."],["Báo sai mật khẩu","Mật khẩu phân biệt chữ hoa chữ thường, và một số tệp nén được tạo bằng bảng mã ký tự khác. Hãy gõ tay thay vì dán, và kiểm tra xem có dấu cách thừa ở cuối không."],["Không đủ dung lượng","Tệp nén khi mở ra sẽ chiếm nhiều hơn chính nó. Hãy dọn bớt dung lượng trước, hoặc chỉ giải nén những mục cần thay vì toàn bộ."],["Một tệp bên trong có vẻ bị hỏng","Zipbox hiển thị đúng những gì tệp nén thật sự chứa. Nếu tệp đã hỏng từ trước khi nén thì giải nén cũng không sửa được. Hãy xin người gửi bản mới."]],"pages":{"support":{"title":"Hỗ trợ Zipbox","meta":"Trợ giúp Zipbox: mở tệp nén, mật khẩu, tệp chia nhiều phần, khôi phục giao dịch mua và liên hệ.","badge":"Hỗ trợ","h1":"Trợ giúp Zipbox","lead":"Những câu hỏi hay gặp nhất và cách xử lý khi một tệp nén không chịu mở. Nếu chưa có câu trả lời, hãy viết cho chúng tôi."}}}};</script>
<script>
(function(){
 var D=window.ZB_I18N,L=Object.keys(D),PAGE=document.body.dataset.page;
 var RTL={"ar-SA":1,"he":1,"ur-PK":1};
 function resolve(t){
  if(!t)return"en-US";
  if(D[t])return t;
  var base=t.split("-")[0].toLowerCase();
  var map={en:"en-US",zh:"zh-Hans",pt:"pt-PT",fr:"fr-FR",es:"es-ES",de:"de-DE",nl:"nl-NL",ar:"ar-SA",
           sl:"sl-SI",bn:"bn-BD",gu:"gu-IN",kn:"kn-IN",ml:"ml-IN",mr:"mr-IN",or:"or-IN",pa:"pa-IN",
           ta:"ta-IN",te:"te-IN",ur:"ur-PK",nb:"no",nn:"no",he:"he",iw:"he",in:"id",ji:"he"};
  if(t.toLowerCase().indexOf("zh")===0)
   return /hant|tw|hk|mo/i.test(t)?"zh-Hant":"zh-Hans";
  if(t.toLowerCase().indexOf("pt")===0)return /br/i.test(t)?"pt-BR":"pt-PT";
  if(t.toLowerCase().indexOf("en")===0)
   return /gb|uk|ie/i.test(t)?"en-GB":/au|nz/i.test(t)?"en-AU":/ca/i.test(t)?"en-CA":"en-US";
  if(t.toLowerCase().indexOf("fr")===0)return /ca/i.test(t)?"fr-CA":"fr-FR";
  if(t.toLowerCase().indexOf("es")===0)return /mx|us|ar|cl|co|pe/i.test(t)?"es-MX":"es-ES";
  if(map[base]&&D[map[base]])return map[base];
  if(D[base])return base;
  return "en-US";
 }
 function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
 function pick(){
  var q=new URLSearchParams(location.search).get("lang");
  if(q)return resolve(q);
  try{var s=localStorage.getItem("zb-lang");if(s&&D[s])return s}catch(e){}
  var list=navigator.languages||[navigator.language||"en-US"];
  for(var i=0;i<list.length;i++){var r=resolve(list[i]);if(r)return r}
  return "en-US";
 }
 var sel=document.getElementById("lang");
 L.sort(function(a,b){return D[a].langName.localeCompare(D[b].langName)});
 L.forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=D[c].langName;sel.appendChild(o)});
 function render(code){
  var d=D[code],rtl=!!RTL[code];
  document.documentElement.lang=code;
  document.documentElement.dir=rtl?"rtl":"ltr";
  sel.value=code;
  document.getElementById("langLabel").textContent=d.langLabel;
  document.title=d.pages[PAGE].title;
  var m=document.querySelector('meta[name=description]');if(m)m.setAttribute("content",d.pages[PAGE].meta);
  var nav=document.getElementById("nav");nav.innerHTML="";
  [["index.html",d.navHome],["support.html",d.navSupport],["privacy.html",d.navPrivacy],["terms.html",d.navTerms]]
   .forEach(function(p){
    var a=document.createElement("a");a.href=p[0]+(code!=="en-US"?"?lang="+code:"");a.textContent=p[1];
    if(p[0].indexOf(PAGE)===0)a.setAttribute("aria-current","page");nav.appendChild(a)});
  document.getElementById("badge").textContent=d.pages[PAGE].badge;
  document.getElementById("h1").textContent=d.pages[PAGE].h1;
  document.getElementById("lead").textContent=d.pages[PAGE].lead;
  document.getElementById("body").innerHTML=BUILD[PAGE](d,code);
  document.getElementById("foot").innerHTML=esc(d.foot)+"<br>"+esc(d.updated)+" 2026-08-26 &middot; &copy; 2026 Zipbox";
  try{localStorage.setItem("zb-lang",code)}catch(e){}
 }
 function card(title,inner){return '<section class="card"><h2>'+esc(title)+'</h2>'+inner+'</section>'}
 function tiles(items){return '<div class="grid">'+items.map(function(t){
   var i=t.indexOf("|");return '<div class="tile"><b>'+esc(t.slice(0,i))+'</b>'+esc(t.slice(i+1))+'</div>'}).join("")+'</div>'}
 function list(items){return '<ul class="plain">'+items.map(function(t){return '<li>'+esc(t)+'</li>'}).join("")+'</ul>'}
 function paras(items){return items.map(function(t){return '<p>'+esc(t)+'</p>'}).join("")}
 function qa(items){return items.map(function(p){
   return '<div class="qa"><h3>'+esc(p[0])+'</h3><p>'+esc(p[1])+'</p></div>'}).join("")}
 function mail(d){return card(d.secContact,'<p>'+esc(d.contact)+'</p><p><a class="mail" href="mailto:hourstag.app@gmail.com">hourstag.app@gmail.com</a></p><p>'+esc(d.contactHint)+'</p>')}
 var BUILD={
  "index":function(d){return card(d.secFeatures,tiles(d.tiles))
    +card(d.secFormats,'<p>'+esc(d.formatsLead)+'</p>'+list(d.fea))
    +card(d.secPrivacy,paras(d.privacyShort)+'<p><a class="cta" href="privacy.html">'+esc(d.navPrivacy)+'</a></p>')
    +card(d.secPro,paras(d.proShort))
    +mail(d)},
  "support":function(d){return card(d.secStart,list(d.start))
    +card(d.secFaq,qa(d.faq))
    +card(d.secTrouble,qa(d.trouble))
    +mail(d)},
  "privacy":function(d){return card(d.secPrivacy,paras(d.priv))
    +card(d.secPrivacyPurchase,paras(d.privPurchase))
    +mail(d)},
  "terms":function(d){return card(d.secTerms,paras(d.terms))+mail(d)}
 };
 sel.addEventListener("change",function(){
  var c=sel.value,u=new URL(location.href);u.searchParams.set("lang",c);
  history.replaceState(null,"",u);render(c)});
 render(pick());
})();
</script>
</body>
</html>
