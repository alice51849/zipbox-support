تصال هناك يعود إلى خدمة النظام التي اخترتها، لا إلى Zipbox."],"pages":{"privacy":{"title":"سياسة خصوصية Zipbox","meta":"لا يجمع Zipbox بيانات شخصية ولا يرسل طلبات شبكة ولا يحتوي على إعلانات أو تحليلات.","badge":"الخصوصية","h1":"سياسة الخصوصية","lead":"لا يجمع Zipbox أي شيء. وهذا بالضبط ما يعنيه ذلك."}}},"bn-BD":{"langName":"বাংলা","langLabel":"ভাষা","navHome":"হোম","navSupport":"সহায়তা","navPrivacy":"গোপনীয়তা","navTerms":"শর্তাবলি","foot":"Zipbox পুরোপুরি আপনার ডিভাইসেই চলে। অ্যাকাউন্ট নেই, বিজ্ঞাপন নেই, বিশ্লেষণ নেই, আপলোড নেই।","updated":"সর্বশেষ হালনাগাদ","secContact":"যোগাযোগ","contact":"যেকোনো ভাষায় আমাদের লিখুন। প্রতিটি বার্তা একজন মানুষ পড়েন।","contactHint":"আর্কাইভের ফরম্যাট, iOS-এর সংস্করণ আর পর্দায় দেখা বার্তাটি জানালে অনেক সুবিধা হয়। উত্তরের নির্দিষ্ট সময় আমরা প্রতিশ্রুতি দিই না।","secPrivacy":"গোপনীয়তা","priv":["Zipbox কোনো ব্যক্তিগত তথ্য সংগ্রহ করে না। অ্যাকাউন্ট নেই, লগ ইন নেই, ব্যবহারকারীর কোনো প্রোফাইলও নেই।","Zipbox কোনো নেটওয়ার্ক অনুরোধ পাঠায় না। অ্যাপের নিজস্ব সার্ভার নেই, আর আপনার আর্কাইভ ও বের করা ফাইল কোথাও আপলোড হয় না।","Files provider এবং সহায়তা বা গোপনীয়তার পাতা Zipbox-এর বাইরে iOS খুলে দেয়। সেখানে নেটওয়ার্ক লাগলে সেটি আপনার বেছে নেওয়া সিস্টেম সেবার, Zipbox-এর নয়।","আমরা তৃতীয় পক্ষের বিজ্ঞাপন ব্যবহার করি না। Zipbox কোনো ধরনের বিজ্ঞাপন দেখায় না।","আমরা তৃতীয় পক্ষের বিশ্লেষণ, ট্র্যাকিং লাইব্রেরি বা ক্র্যাশ রিপোর্টিং সেবা ব্যবহার করি না, এবং Zipbox বিজ্ঞাপন শনাক্তকারী চায় না।","আপনি যেসব ফাইল খোলেন, বের করেন বা তৈরি করেন সেগুলো ডিভাইসেই থাকে, ফাইলস অ্যাপে বা Zipbox-এর নিজস্ব জায়গায়, যদি না আপনি অন্য কোথাও পাঠাতে বা শেয়ার করতে চান।","আর্কাইভ খুলতে বা এনক্রিপ্ট করতে লেখা পাসওয়ার্ড কেবল সেই কাজেই ব্যবহৃত হয়। কাজ চলাকালীন তা মেমোরিতে থাকে, কোনো লগে লেখা হয় না এবং কোথাও পাঠানো হয় না।","Zipbox ক্যামেরা, মাইক্রোফোন, পরিচিতি, অবস্থান বা স্বাস্থ্য তথ্য ব্যবহার করে না।","যেহেতু কিছুই আপনার ডিভাইস ছেড়ে যায় না, তাই আমাদের কাছে এমন কোনো ব্যক্তিগত তথ্য নেই যা আপনার হয়ে খুঁজব, পাঠিয়ে দেব বা মুছব। অ্যাপ মুছলে Zipbox-এর জায়গাও মুছে যায়।","এই নীতি বদলালে হালনাগাদ সংস্করণ নতুন তারিখসহ এই পাতাতেই প্রকাশ করা হবে।"],"secAppStore":"App Store","appStorePurchase":["Zipbox হলো App Store-এর পেইড অ্যাপ। একবার কিনলেই সব ফিচার থাকে; অ্যাপের ভেতরে আর কেনাকাটা, সাবস্ক্রিপশন বা বিজ্ঞাপন নেই। ১৩টি ফরম্যাট ফোনেই চলে।","কেনাকাটার পুরোটাই Apple, App Store-এর মাধ্যমে সামলায়। Zipbox আপনার পরিশোধের তথ্য কখনো দেখে না এবং এই লেনদেন থেকে কোনো ব্যক্তিগত তথ্য পায় না।","Files provider এবং সহায়তা বা গোপনীয়তার পাতা Zipbox-এর বাইরে iOS খুলে দেয়। সেখানে নেটওয়ার্ক লাগলে সেটি আপনার বেছে নেওয়া সিস্টেম সেবার, Zipbox-এর নয়।"],"pages":{"privacy":{"title":"Zipbox গোপনীয়তা নীতি","meta":"Zipbox ব্যক্তিগত তথ্য সংগ্রহ করে না, নেটওয়ার্ক অনুরোধ পাঠায় না এবং এতে বিজ্ঞাপন বা বিশ্লেষণ নেই।","badge":"গোপনীয়তা","h1":"গোপনীয়তা নীতি","lead":"Zipbox কিছুই সংগ্রহ করে না। এর ঠিক অর্থ কী, তা এখানে।"}}},"ca":{"langName":"Català","langLabel":"Idioma","navHome":"Inici","navSupport":"Ajuda","navPrivacy":"Privadesa","navTerms":"Condicions","foot":"El Zipbox funciona del tot al teu dispositiu. Sense compte, sense anuncis, sense analítica i sense pujades.","updated":"Última actualització","secContact":"Contacte","contact":"Escriu-nos en l'idioma que vulguis. Cada missatge el llegeix una persona.","contactHint":"Dir-nos el format de l'arxiu, la versió d'iOS i el missatge que has vist a la pantalla ajuda molt. No prometem un termini fix de resposta.","secPrivacy":"Privadesa","priv":["El Zipbox no recull dades personals. No hi ha compte, ni inici de sessió, ni perfil d'usuari.","El Zipbox no fa peticions de xarxa. L'aplicació no té servidor propi i els teus arxius i els fitxers extrets no es pugen enlloc.","Els proveïdors de Fitxers i les pàgines d’ajuda o privadesa s’obren amb iOS, fora del Zipbox. Qualsevol connexió correspon al servei del sistema triat, no al Zipbox.","No fem servir publicitat de tercers. El Zipbox no mostra publicitat de cap mena.","No fem servir analítica de tercers, biblioteques de seguiment ni serveis d'informes de fallada, i el Zipbox no demana l'identificador de publicitat.","Els fitxers que obres, extreus o crees es queden al dispositiu, a l'app Fitxers o a l'emmagatzematge propi del Zipbox, tret que decideixis exportar-los o compartir-los.","Una contrasenya escrita per obrir o xifrar un arxiu només serveix per a aquella operació. Es manté en memòria mentre dura la tasca i mai no es registra ni s'envia enlloc.","El Zipbox no fa servir la càmera, el micròfon, els contactes, la ubicació ni les dades de salut.","Com que res no surt del teu dispositiu, no tenim dades personals per consultar, exportar o esborrar per tu. Eliminar l'app elimina també l'emmagatzematge del Zipbox.","Si aquesta política canvia, la versió actualitzada es publicarà en aquesta pàgina amb una data nova."],"secAppStore":"App Store","appStorePurchase":["Zipbox és una app de pagament a l’App Store. Una compra inclou tot, sense compres integrades, subscripcions ni anuncis. Els 13 formats es processen al dispositiu.","La compra la gestiona del tot Apple a través de l'App Store. El Zipbox no veu mai les teves dades de pagament i no rep cap informació personal de la transacció.","Els proveïdors de Fitxers i les pàgines d’ajuda o privadesa s’obren amb iOS, fora del Zipbox. Qualsevol connexió correspon al servei del sistema triat, no al Zipbox."],"pages":{"privacy":{"title":"Política de privadesa del Zipbox","meta":"El Zipbox no recull dades personals, no fa peticions de xarxa i no conté publicitat ni analítica.","badge":"Privadesa","h1":"Política de privadesa","lead":"El Zipbox no recull res. Aquí tens exactament què vol dir això."}}},"zh-Hans":{"langName":"简体中文","langLabel":"语言","navHome":"首页","navSupport":"支持","navPrivacy":"隐私","navTerms":"使用条款","foot":"Zipbox 完全在你的设备上运行。没有账号、没有广告、没有分析，也不上传。","updated":"最后更新","secContact":"联系我们","contact":"用任何语言写信给我们都可以，每一封都有真人阅读。","contactHint":"如果能附上压缩包格式、iOS 版本和屏幕上看到的提示，会很有帮助。我们不承诺固定的回复时间。","secPrivacy":"隐私","priv":["Zipbox 不收集个人信息。没有账号、不用登录，也没有用户资料。","Zipbox 不发出任何网络请求。这个 App 没有自己的服务器，你的压缩包和解压出来的文件不会被上传到任何地方。","Files provider 与支持、隐私网页都由 iOS 在 Zipbox 外部打开；其中如有网络活动，来自你选择的系统服务，而不是 Zipbox。","我们不使用第三方广告。Zipbox 不显示任何形式的广告。","我们不使用第三方分析、跟踪 SDK 或崩溃上报服务，Zipbox 也不会索取广告标识符。","你打开、解压或创建的文件都留在你的设备上，存在文件 App 或 Zipbox 自己的存储空间里，除非你主动选择导出或分享。","你为了打开或加密压缩包而输入的密码，只用于那一次操作。它在处理期间保留在内存中，不会被写入日志，也不会被发送到任何地方。","Zipbox 不使用摄像头、麦克风、通讯录、定位或健康数据。","因为没有任何数据离开你的设备，我们这边没有可以替你查询、导出或删除的个人信息。删除 App 就会一并删除 Zipbox 在设备上的存储空间。","如果这份政策有变更，更新后的版本会连同新的日期发布在这个页面。"],"secAppStore":"App Store","appStorePurchase":["Zipbox 是 App Store 付费下载 App，一次购买就包含全部功能，没有 App 内购买、订阅或广告。13 种格式都在设备本地处理。","付款全程由 Apple 通过 App Store 处理。Zipbox 看不到你的付款信息，也不会从这笔交易中获得任何个人信息。","Files provider 与支持、隐私网页都由 iOS 在 Zipbox 外部打开；其中如有网络活动，来自你选择的系统服务，而不是 Zipbox。"],"pages":{"privacy":{"title":"Zipbox 隐私政策","meta":"Zipbox 不收集个人信息、不发出网络请求，也没有广告或分析 SDK。","badge":"隐私","h1":"隐私政策","lead":"Zipbox 什么都不收集。下面用最直白的方式说明这句话的意思。"}}},"zh-Hant":{"langName":"繁體中文","langLabel":"語言","navHome":"首頁","navSupport":"支援","navPrivacy":"隱私權","navTerms":"使用條款","foot":"Zipbox 全部在你的裝置上執行。沒有帳號、沒有廣告、沒有分析，也不上傳。","updated":"最後更新","secContact":"聯絡我們","contact":"用任何語言寫信給我們都可以，每一封都有真人閱讀。","contactHint":"如果能附上壓縮檔格式、iOS 版本和畫面上看到的訊息，會幫上很大的忙。我們不承諾固定的回覆時間。","secPrivacy":"隱私權","priv":["Zipbox 不蒐集個人資料。沒有帳號、不用登入，也沒有使用者檔案。","Zipbox 不發出任何網路請求。這個 App 沒有自己的伺服器，你的壓縮檔和解壓出來的檔案不會被上傳到任何地方。","Files provider 與支援、隱私權網頁都由 iOS 在 Zipbox 外部開啟；其中若有網路活動，來自你選擇的系統服務，而不是 Zipbox。","我們不使用第三方廣告。Zipbox 不顯示任何形式的廣告。","我們不使用第三方分析、追蹤 SDK 或當機回報服務，Zipbox 也不會索取廣告識別碼。","你打開、解壓或建立的檔案都留在你的裝置上，存在檔案 App 或 Zipbox 自己的儲存空間裡，除非你主動選擇匯出或分享。","你為了開啟或加密壓縮檔而輸入的密碼，只會用在那一次操作。它在處理期間保留在記憶體中，不會被寫進紀錄檔，也不會被送到任何地方。","Zipbox 不使用相機、麥克風、聯絡資訊、定位或健康資料。","因為沒有任何資料離開你的裝置，我們這邊沒有可以替你查詢、匯出或刪除的個人資料。移除 App 就會一併移除 Zipbox 在裝置上的儲存空間。","如果這份政策有所變更，更新後的版本會連同新的日期公布在這個頁面。"],"secAppStore":"App Store","appStorePurchase":["Zipbox 是 App Store 付費下載 App，一次購買就包含全部功能，沒有 App 內購買、訂閱或廣告。13 種格式全都在裝置本機處理。","付款全程由 Apple 透過 App Store 處理。Zipbox 看不到你的付款資訊，也不會從這筆交易取得任何個人資料。","Files provider 與支援、隱私權網頁都由 iOS 在 Zipbox 外部開啟；其中若有網路活動，來自你選擇的系統服務，而不是 Zipbox。"],"pages":{"privacy":{"title":"Zipbox 隱私權政策","meta":"Zipbox 不蒐集個人資料、不發出網路請求，也沒有廣告或分析 SDK。","badge":"隱私權","h1":"隱私權政策","lead":"Zipbox 什麼都不蒐集。以下用最直白的方式說明這句話的意思。"}}},"hr":{"langName":"Hrvatski","langLabel":"Jezik","navHome":"Početna","navSupport":"Podrška","navPrivacy":"Privatnost","navTerms":"Uvjeti","foot":"Zipbox radi u cijelosti na tvom uređaju. Bez računa, bez reklama, bez analitike, bez slanja.","updated":"Posljednja izmjena","secContact":"Kontakt","contact":"Piši nam na bilo kojem jeziku. Svaku poruku pročita čovjek.","contactHint":"Format arhive, verzija iOS-a i poruka koju si vidio na zaslonu jako pomažu. Ne obećavamo fiksno vrijeme odgovora.","secPrivacy":"Privatnost","priv":["Zipbox ne prikuplja osobne podatke. Nema računa, nema prijave i nema korisničkog profila.","Zipbox ne šalje mrežne zahtjeve. Aplikacija nema vlastiti poslužitelj, a tvoje arhive i raspakirane datoteke nikada se nikamo ne šalju.","Pružatelje u Datotekama te stranice podrške ili privatnosti iOS otvara izvan Zipboxa. Njihova mrežna aktivnost pripada odabranoj usluzi sustava, ne Zipboxu.","Ne koristimo oglase trećih strana. Zipbox ne prikazuje nikakve reklame.","Ne koristimo analitiku trećih strana, biblioteke za praćenje ni usluge prijave rušenja, a Zipbox ne traži oglasni identifikator.","Datoteke koje otvoriš, raspakiraš ili stvoriš ostaju na uređaju, u aplikaciji Datoteke ili u Zipboxovoj vlastitoj pohrani, osim ako ih odlučiš izvesti ili podijeliti.","Lozinka koju upišeš da otvoriš ili šifriraš arhivu koristi se samo za tu radnju. Ostaje u memoriji dok zadatak traje i nikada se ne zapisuje u dnevnik niti šalje dalje.","Zipbox ne koristi kameru, mikrofon, kontakte, lokaciju ni zdravstvene podatke.","Budući da ništa ne napušta tvoj uređaj, kod nas nema osobnih podataka koje bismo mogli pronaći, izvesti ili izbrisati umjesto tebe. Brisanjem aplikacije nestaje i Zipboxova pohrana.","Ako se ova pravila promijene, ažuriranu verziju objavit ćemo na ovoj stranici s novim datumom."],"secAppStore":"App Store","appStorePurchase":["Zipbox se plaća pri preuzimanju s App Storea. Sve su funkcije uključene, bez kupnji u aplikaciji, pretplata i oglasa. Svih 13 formata obrađuje se na uređaju.","Kupnju u cijelosti obavlja Apple putem App Storea. Zipbox nikada ne vidi tvoje podatke o plaćanju i iz transakcije ne dobiva nikakve osobne podatke.","Pružatelje u Datotekama te stranice podrške ili privatnosti iOS otvara izvan Zipboxa. Njihova mrežna aktivnost pripada odabranoj usluzi sustava, ne Zipboxu."],"pages":{"privacy":{"title":"Zipbox pravila privatnosti","meta":"Zipbox ne prikuplja osobne podatke, ne šalje mrežne zahtjeve i ne sadrži reklame ni analitiku.","badge":"Privatnost","h1":"Pravila privatnosti","lead":"Zipbox ne prikuplja ništa. Evo točno što to znači."}}},"cs":{"langName":"Čeština","langLabel":"Jazyk","navHome":"Úvod","navSupport":"Podpora","navPrivacy":"Soukromí","navTerms":"Podmínky","foot":"Zipbox běží celý ve vašem zařízení. Bez účtu, bez reklam, bez analytiky, nic se neodesílá.","updated":"Naposledy aktualizováno","secContact":"Kontakt","contact":"Napište nám v jakémkoli jazyce. Každou zprávu čte člověk.","contactHint":"Formát archivu, verze iOS a hláška, kterou jste viděli na obrazovce, hodně pomohou. Pevnou dobu odpovědi neslibujeme.","secPrivacy":"Soukromí","priv":["Zipbox nesbírá osobní údaje. Není tu účet, přihlášení ani uživatelský profil.","Zipbox nedělá síťové požadavky. Aplikace nemá vlastní server a vaše archivy ani rozbalené soubory se nikam neodesílají.","Poskytovatele v Souborech a stránky podpory či soukromí otevírá iOS mimo Zipbox. Případné připojení patří zvolené systémové službě, nikoli Zipboxu.","Nepoužíváme reklamu třetích stran. Zipbox nezobrazuje žádnou reklamu.","Nepoužíváme analytiku třetích stran, sledovací knihovny ani hlášení pádů a Zipbox si nevyžádá reklamní identifikátor.","Soubory, které otevřete, rozbalíte nebo vytvoříte, zůstávají v zařízení, v aplikaci Soubory nebo v úložišti samotného Zipboxu, pokud se je nerozhodnete exportovat či sdílet.","Heslo napsané pro otevření nebo zašifrování archivu slouží jen k této operaci. Zůstává v paměti po dobu úkolu a nikdy se nezapisuje do protokolu ani neodesílá.","Zipbox nepoužívá fotoaparát, mikrofon, kontakty, polohu ani zdravotní údaje.","Protože nic neopouští vaše zařízení, nemáme žádné osobní údaje, které bychom pro vás mohli dohledat, exportovat nebo smazat. Odstraněním aplikace zmizí i úložiště Zipboxu.","Pokud se tyto zásady změní, aktualizovanou verzi zveřejníme na této stránce s novým datem."],"secAppStore":"App Store","appStorePurchase":["Zipbox je placená aplikace z App Storu. Jedna koupě zahrnuje všechny funkce, bez nákupů v aplikaci, předplatného a reklam. Všech 13 formátů se zpracuje v zařízení.","Nákup zajišťuje celý Apple přes App Store. Zipbox nikdy nevidí vaše platební údaje a z transakce nedostává žádné osobní informace.","Poskytovatele v Souborech a stránky podpory či soukromí otevírá iOS mimo Zipbox. Případné připojení patří zvolené systémové službě, nikoli Zipboxu."],"pages":{"privacy":{"title":"Zásady ochrany soukromí Zipbox","meta":"Zipbox nesbírá osobní údaje, nedělá síťové požadavky a neobsahuje reklamy ani analytiku.","badge":"Soukromí","h1":"Zásady ochrany soukromí","lead":"Zipbox nesbírá nic. Tady je přesně, co to znamená."}}},"da":{"langName":"Dansk","langLabel":"Sprog","navHome":"Forside","navSupport":"Support","navPrivacy":"Privatliv","navTerms":"Vilkår","foot":"Zipbox kører helt på din egen enhed. Ingen konto, ingen reklamer, ingen analyse, intet sendes af sted.","updated":"Senest opdateret","secContact":"Kontakt","contact":"Skriv til os på det sprog, du har lyst til. Hver besked bliver læst af et menneske.","contactHint":"Arkivets format, din iOS version og beskeden på skærmen hjælper meget. Vi lover ikke en fast svartid.","secPrivacy":"Privatliv","priv":["Zipbox indsamler ikke personoplysninger. Der er ingen konto, intet login og ingen brugerprofil.","Zipbox foretager ingen netværkskald. Appen har ingen egen server, og dine arkiver og udpakkede filer bliver aldrig sendt nogen steder hen.","Udbydere i Arkiver samt support- og privatlivssider åbnes af iOS uden for Zipbox. Eventuel nettrafik tilhører den valgte systemtjeneste, ikke Zipbox.","Vi bruger ikke reklamer fra tredjepart. Zipbox viser ingen form for reklame.","Vi bruger ikke analyse fra tredjepart, sporingsbiblioteker eller nedbrudsrapportering, og Zipbox beder ikke om annonce id.","Filer, du åbner, pakker ud eller opretter, bliver på enheden, i appen Filer eller i Zipbox eget lager, medmindre du vælger at eksportere eller dele dem.","En adgangskode, du skriver for at åbne eller kryptere et arkiv, bruges kun til den handling. Den ligger i hukommelsen imens og bliver aldrig skrevet i en log eller sendt videre.","Zipbox bruger ikke kamera, mikrofon, kontakter, placering eller helbredsdata.","Da intet forlader din enhed, har vi ingen personoplysninger at slå op, eksportere eller slette for dig. Sletter du appen, forsvinder Zipbox lager også.","Ændres denne politik, offentliggøres den opdaterede version på denne side med en ny dato."],"secAppStore":"App Store","appStorePurchase":["Zipbox er en betalt app i App Store. Ét køb omfatter alle funktioner uden køb i appen, abonnementer eller reklamer. Alle 13 formater behandles på din enhed.","Købet håndteres udelukkende af Apple via App Store. Zipbox ser aldrig dine betalingsoplysninger og modtager ingen personoplysninger fra handlen.","Udbydere i Arkiver samt support- og privatlivssider åbnes af iOS uden for Zipbox. Eventuel nettrafik tilhører den valgte systemtjeneste, ikke Zipbox."],"pages":{"privacy":{"title":"Zipbox privatlivspolitik","meta":"Zipbox indsamler ingen personoplysninger, foretager ingen netværkskald og indeholder hverken reklamer eller analyse.","badge":"Privatliv","h1":"Privatlivspolitik","lead":"Zipbox indsamler ingenting. Her står præcis, hvad det betyder."}}},"nl-NL":{"langName":"Nederlands","langLabel":"Taal","navHome":"Start","navSupport":"Support","navPrivacy":"Privacy","navTerms":"Voorwaarden","foot":"Zipbox draait volledig op je eigen toestel. Geen account, geen reclame, geen analyse, niets wordt verstuurd.","updated":"Laatst bijgewerkt","secContact":"Contact","contact":"Schrijf ons in welke taal je wilt. Elk bericht wordt door een mens gelezen.","contactHint":"Het archieftype, je iOS versie en de melding op het scherm helpen enorm. We beloven geen vaste reactietijd.","secPrivacy":"Privacy","priv":["Zipbox verzamelt geen persoonsgegevens. Er is geen account, geen inloggen en geen profiel.","Zipbox doet geen netwerkverzoeken. De app heeft geen eigen server, en je archieven en uitgepakte bestanden worden nergens naartoe gestuurd.","Bestandsproviders en de support- of privacypagina openen via iOS buiten Zipbox. Eventueel netwerkverkeer komt van de gekozen systeemdienst, niet van Zipbox.","We gebruiken geen advertenties van derden. Zipbox toont geen enkele vorm van reclame.","We gebruiken geen analysediensten, trackingbibliotheken of crashrapportage van derden, en Zipbox vraagt de advertentie identificatie niet op.","Bestanden die je opent, uitpakt of maakt blijven op je toestel, in de app Bestanden of in de opslag van Zipbox zelf, tenzij je ze exporteert of deelt.","Een wachtwoord dat je invoert om een archief te openen of te versleutelen wordt alleen voor die handeling gebruikt. Het blijft tijdens de bewerking in het geheugen en wordt nooit gelogd of verstuurd.","Zipbox gebruikt geen camera, microfoon, contacten, locatie of gezondheidsgegevens.","Omdat er niets van je toestel af gaat, hebben wij ook geen persoonsgegevens die we voor je kunnen opzoeken, exporteren of verwijderen. De app verwijderen verwijdert ook de opslag van Zipbox.","Wijzigt dit beleid, dan publiceren we de nieuwe versie met een nieuwe datum op deze pagina."],"secAppStore":"App Store","appStorePurchase":["Zipbox is een betaalde app uit de App Store. Eén aankoop geeft alle functies, zonder in-app aankopen, abonnementen of reclame. 13 formaten worden lokaal verwerkt.","De aankoop verloopt volledig via Apple en de App Store. Zipbox ziet je betaalgegevens niet en ontvangt geen persoonsgegevens uit de transactie.","Bestandsproviders en de support- of privacypagina openen via iOS buiten Zipbox. Eventueel netwerkverkeer komt van de gekozen systeemdienst, niet van Zipbox."],"pages":{"privacy":{"title":"Privacybeleid van Zipbox","meta":"Zipbox verzamelt geen persoonsgegevens, doet geen netwerkverzoeken en bevat geen reclame of analysebibliotheken.","badge":"Privacy","h1":"Privacybeleid","lead":"Zipbox verzamelt niets. Hier staat precies wat dat betekent."}}},"en-AU":{"langName":"English (Australia)","langLabel":"Language","navHome":"Home","navSupport":"Support","navPrivacy":"Privacy","navTerms":"Terms","foot":"Zipbox runs entirely on your device. No account, no ads, no analytics, no uploads.","updated":"Last updated","secContact":"Contact","contact":"Write to us in any language. A real person reads every message.","contactHint":"Telling us the archive format, your iOS version and what you saw on screen helps a great deal. We do not promise a fixed response time.","secPrivacy":"Privacy","priv":["Zipbox does not collect personal data. There is no account, no sign in and no user profile.","Zipbox makes no network requests. The app has no server of its own, and your archives and extracted files are never uploaded anywhere.","Files providers and support or privacy pages open through iOS outside Zipbox. Any network activity there belongs to the system service you chose, not to Zipbox.","We do not use third party advertising. Zipbox shows no advertising of any kind.","We do not use third party analytics, tracking SDKs or crash reporting services, and Zipbox does not request the identifier for advertisers.","Files you open, extract or create stay on your device, in the Files app or in Zipbox's own storage, unless you choose to export or share them.","A password you type to open or to encrypt an archive is used for that operation only. It is held in memory for the task and is never written to a log or sent anywhere.","Zipbox does not use the camera, the microphone, contacts, location or health data.","Because nothing leaves your device, there is no personal data for us to look up, export or delete on your behalf. Removing the app removes Zipbox's own storage from your device.","If this policy changes, the updated version will be published on this page with a new date."],"secAppStore":"App Store","appStorePurchase":["Zipbox is a paid App Store download. One purchase includes every feature, with no in-app purchases, subscriptions or ads. All 13 formats are handled on your device.","The purchase is handled entirely by Apple through the App Store. Zipbox never sees your payment details and receives no personal information from the transaction.","Files providers and support or privacy pages open through iOS outside Zipbox. Any network activity there belongs to the system service you chose, not to Zipbox."],"pages":{"privacy":{"title":"Zipbox Privacy Policy","meta":"Zipbox collects no personal data, makes no network requests and contains no advertising or analytics SDKs.","badge":"Privacy","h1":"Privacy Policy","lead":"Zipbox collects nothing. Here is exactly what that means, in plain words."}}},"en-CA":{"langName":"English (Canada)","langLabel":"Language","navHome":"Home","navSupport":"Support","navPrivacy":"Privacy","navTerms":"Terms","foot":"Zipbox runs entirely on your device. No account, no ads, no analytics, no uploads.","updated":"Last updated","secContact":"Contact","contact":"Write to us in any language. A real person reads every message.","contactHint":"Telling us the archive format, your iOS version and what you saw on screen helps a great deal. We do not promise a fixed response time.","secPrivacy":"Privacy","priv":["Zipbox does not collect personal data. There is no account, no sign in and no user profile.","Zipbox makes no network requests. The app has no server  palvelinta, eikä arkistojasi tai purettuja tiedostoja lähetetä minnekään.","Tiedostot-apin palveluntarjoajat sekä tuki- ja tietosuojasivut avautuvat iOS:n kautta Zipboxin ulkopuolella. Mahdollinen verkkoliikenne kuuluu valitulle järjestelmäpalvelulle, ei Zipboxille.","Emme käytä kolmansien osapuolten mainontaa. Zipbox ei näytä minkäänlaisia mainoksia.","Emme käytä kolmansien osapuolten analytiikkaa, seurantakirjastoja tai kaatumisraportointia, eikä Zipbox pyydä mainostunnistetta.","Avaamasi, purkamasi tai luomasi tiedostot pysyvät laitteessa, Tiedostot sovelluksessa tai Zipboxin omassa tallennustilassa, ellet valitse niiden vientiä tai jakamista.","Arkiston avaamiseen tai salaamiseen kirjoittamaasi salasanaa käytetään vain siihen toimenpiteeseen. Se on muistissa työn ajan, eikä sitä kirjata lokiin tai lähetetä eteenpäin.","Zipbox ei käytä kameraa, mikrofonia, yhteystietoja, sijaintia tai terveystietoja.","Koska mikään ei poistu laitteestasi, meillä ei ole henkilötietoja joita hakea, viedä tai poistaa puolestasi. Sovelluksen poistaminen poistaa myös Zipboxin tallennustilan.","Jos tämä käytäntö muuttuu, päivitetty versio julkaistaan tällä sivulla uudella päivämäärällä."],"secAppStore":"App Store","appStorePurchase":["Zipbox on maksullinen App Store -appi. Yksi osto sisältää kaikki ominaisuudet: ei sovelluksen sisäisiä ostoja, tilauksia eikä mainoksia. 13 muotoa käsitellään laitteella.","Oston hoitaa kokonaan Apple App Storen kautta. Zipbox ei näe maksutietojasi eikä saa tapahtumasta henkilötietoja.","Tiedostot-apin palveluntarjoajat sekä tuki- ja tietosuojasivut avautuvat iOS:n kautta Zipboxin ulkopuolella. Mahdollinen verkkoliikenne kuuluu valitulle järjestelmäpalvelulle, ei Zipboxille."],"pages":{"privacy":{"title":"Zipboxin tietosuojakäytäntö","meta":"Zipbox ei kerää henkilötietoja, ei tee verkkopyyntöjä eikä sisällä mainoksia tai analytiikkaa.","badge":"Tietosuoja","h1":"Tietosuojakäytäntö","lead":"Zipbox ei kerää mitään. Tässä on tarkasti mitä se tarkoittaa."}}},"fr-CA":{"langName":"Français (Canada)","langLabel":"Langue","navHome":"Accueil","navSupport":"Assistance","navPrivacy":"Confidentialité","navTerms":"Conditions","foot":"Zipbox fonctionne entièrement sur votre appareil. Sans compte, sans publicité, sans analyse, sans envoi.","updated":"Dernière mise à jour","secContact":"Nous écrire","contact":"Écrivez-nous dans la langue de votre choix. Une vraie personne lit chaque courriel.","contactHint":"Le format de l'archive, la version d'iOS et le message affiché à l'écran nous aident beaucoup. Nous ne promettons pas de délai de réponse fixe.","secPrivacy":"Confidentialité","priv":["Zipbox ne collecte pas de données personnelles. Il n'y a ni compte, ni connexion, ni profil utilisateur.","Zipbox n'effectue aucune requête réseau. L'application n'a pas de serveur, et vos archives et fichiers extraits ne sont envoyés nulle part.","Les fournisseurs de Fichiers et les pages d’aide ou de confidentialité s’ouvrent par iOS, hors de Zipbox. Toute connexion vient du service système choisi, pas de Zipbox.","Nous n'utilisons pas de publicité tierce. Zipbox n'affiche aucune publicité, sous aucune forme.","Nous n'utilisons ni outil d'analyse tiers, ni bibliothèque de pistage, ni service de rapport de plantage, et Zipbox ne demande pas l'identifiant publicitaire.","Les fichiers que vous ouvrez, extrayez ou créez restent sur votre appareil, dans l'app Fichiers ou dans l'espace propre à Zipbox, sauf si vous choisissez de les exporter ou de les partager.","Un mot de passe saisi pour ouvrir ou chiffrer une archive ne sert qu'à cette opération. Il reste en mémoire le temps du traitement, n'est jamais écrit dans un journal ni envoyé ailleurs.","Zipbox n'utilise ni l'appareil photo, ni le micro, ni les contacts, ni la localisation, ni les données de santé.","Comme rien ne quitte votre appareil, nous n'avons aucune donnée personnelle à consulter, exporter ou supprimer pour vous. Supprimer l'app supprime aussi l'espace de stockage de Zipbox.","Si cette politique évolue, la version mise à jour sera publiée sur cette page avec une nouvelle date."],"secAppStore":"App Store","appStorePurchase":["Zipbox est une app payante de l’App Store. Un achat comprend tout, sans achats intégrés, abonnements ni pubs. Les 13 formats sont traités sur l’appareil.","L'achat est entièrement géré par Apple via l'App Store. Zipbox ne voit jamais vos informations de paiement et ne reçoit aucune donnée personnelle de la transaction.","Les fournisseurs de Fichiers et les pages d’aide ou de confidentialité s’ouvrent par iOS, hors de Zipbox. Toute connexion vient du service système choisi, pas de Zipbox."],"pages":{"privacy":{"title":"Politique de confidentialité de Zipbox","meta":"Zipbox ne collecte aucune donnée personnelle, n'effectue aucune requête réseau et ne contient ni publicité ni outil d'analyse.","badge":"Confidentialité","h1":"Politique de confidentialité","lead":"Zipbox ne collecte rien. Voici précisément ce que cela veut dire."}}},"fr-FR":{"langName":"Français","langLabel":"Langue","navHome":"Accueil","navSupport":"Assistance","navPrivacy":"Confidentialité","navTerms":"Conditions","foot":"Zipbox fonctionne entièrement sur votre appareil. Sans compte, sans publicité, sans analyse, sans envoi.","updated":"Dernière mise à jour","secContact":"Nous écrire","contact":"Écrivez-nous dans la langue de votre choix. Une vraie personne lit chaque message.","contactHint":"Le format de l'archive, la version d'iOS et le message affiché à l'écran nous aident beaucoup. Nous ne promettons pas de délai de réponse fixe.","secPrivacy":"Confidentialité","priv":["Zipbox ne collecte pas de données personnelles. Il n'y a ni compte, ni connexion, ni profil utilisateur.","Zipbox n'effectue aucune requête réseau. L'application n'a pas de serveur, et vos archives et fichiers extraits ne sont envoyés nulle part.","Les fournisseurs de Fichiers et les pages d’aide ou de confidentialité s’ouvrent via iOS, hors de Zipbox. Toute connexion vient du service sys gLabel":"Sprache","navHome":"Start","navSupport":"Hilfe","navPrivacy":"Datenschutz","navTerms":"Nutzungsbedingungen","foot":"Zipbox läuft vollständig auf Ihrem Gerät. Kein Konto, keine Werbung, keine Analyse, kein Upload.","updated":"Zuletzt aktualisiert","secContact":"Kontakt","contact":"Schreiben Sie uns in jeder Sprache. Jede Nachricht wird von einem Menschen gelesen.","contactHint":"Archivformat, iOS Version und die Meldung auf dem Bildschirm helfen sehr. Eine feste Antwortzeit sagen wir nicht zu.","secPrivacy":"Datenschutz","priv":["Zipbox erhebt keine personenbezogenen Daten. Es gibt kein Konto, keine Anmeldung und kein Profil.","Zipbox stellt keine Netzwerkanfragen. Die App hat keinen eigenen Server, und Ihre Archive und entpackten Dateien werden nirgendwohin hochgeladen.","Dateianbieter sowie Support- und Datenschutzseiten öffnet iOS außerhalb von Zipbox. Möglicher Netzwerkverkehr stammt vom gewählten Systemdienst, nicht von Zipbox.","Wir setzen keine Werbung von Dritten ein. Zipbox zeigt keinerlei Werbung.","Wir setzen keine Analysedienste, Tracking-Bibliotheken oder Absturzberichte von Dritten ein, und Zipbox fragt die Werbekennung nicht ab.","Dateien, die Sie öffnen, entpacken oder erstellen, bleiben auf dem Gerät, in der App Dateien oder im Speicher von Zipbox, solange Sie sie nicht selbst exportieren oder teilen.","Ein Passwort, das Sie zum Öffnen oder Verschlüsseln eingeben, wird nur für diesen Vorgang verwendet. Es bleibt währenddessen im Arbeitsspeicher und wird weder protokolliert noch versendet.","Zipbox verwendet weder Kamera noch Mikrofon, Kontakte, Standort oder Gesundheitsdaten.","Da nichts das Gerät verlässt, gibt es bei uns auch keine personenbezogenen Daten, die wir für Sie abrufen, exportieren oder löschen könnten. Mit der App verschwindet auch der Speicher von Zipbox.","Ändert sich diese Erklärung, veröffentlichen wir die neue Fassung mit neuem Datum auf dieser Seite."],"secAppStore":"App Store","appStorePurchase":["Zipbox ist eine kostenpflichtige App im App Store. Ein Kauf enthält alle Funktionen, ohne In-App-Käufe, Abos oder Werbung. 13 Formate werden auf dem Gerät verarbeitet.","Der Kauf läuft vollständig über Apple und den App Store. Zipbox sieht Ihre Zahlungsdaten nicht und erhält aus dem Vorgang keine personenbezogenen Daten.","Dateianbieter sowie Support- und Datenschutzseiten öffnet iOS außerhalb von Zipbox. Möglicher Netzwerkverkehr stammt vom gewählten Systemdienst, nicht von Zipbox."],"pages":{"privacy":{"title":"Zipbox Datenschutzerklärung","meta":"Zipbox erhebt keine personenbezogenen Daten, stellt keine Netzwerkanfragen und enthält weder Werbung noch Analysebibliotheken.","badge":"Datenschutz","h1":"Datenschutzerklärung","lead":"Zipbox erhebt nichts. Hier steht genau, was das bedeutet."}}},"el":{"langName":"Ελληνικά","langLabel":"Γλώσσα","navHome":"Αρχική","navSupport":"Υποστήριξη","navPrivacy":"Απόρρητο","navTerms":"Όροι","foot":"Το Zipbox εκτελείται εξ ολοκλήρου στη συσκευή σου. Χωρίς λογαριασμό, χωρίς διαφημίσεις, χωρίς ανάλυση, χωρίς αποστολές.","updated":"Τελευταία ενημέρωση","secContact":"Επικοινωνία","contact":"Γράψε μας σε όποια γλώσσα θέλεις. Κάθε μήνυμα το διαβάζει άνθρωπος.","contactHint":"Η μορφή του αρχείου, η έκδοση iOS και το μήνυμα που είδες στην οθόνη βοηθούν πολύ. Δεν υποσχόμαστε σταθερό χρόνο απάντησης.","secPrivacy":"Απόρρητο","priv":["Το Zipbox δεν συλλέγει προσωπικά δεδομένα. Δεν υπάρχει λογαριασμός, σύνδεση ή προφίλ χρήστη.","Το Zipbox δεν κάνει αιτήματα δικτύου. Η εφαρμογή δεν έχει δικό της διακομιστή και τα αρχεία σου δεν ανεβαίνουν ποτέ πουθενά.","Οι πάροχοι της εφαρμογής Αρχεία και οι σελίδες υποστήριξης ή απορρήτου ανοίγουν μέσω iOS έξω από το Zipbox. Τυχόν σύνδεση ανήκει στην υπηρεσία συστήματος, όχι στο Zipbox.","Δεν χρησιμοποιούμε διαφημίσεις τρίτων. Το Zipbox δεν εμφανίζει κανενός είδους διαφήμιση.","Δεν χρησιμοποιούμε αναλυτικά εργαλεία τρίτων, βιβλιοθήκες παρακολούθησης ή υπηρεσίες αναφοράς σφαλμάτων και το Zipbox δεν ζητά το αναγνωριστικό διαφημίσεων.","Τα αρχεία που ανοίγεις, εξάγεις ή δημιουργείς μένουν στη συσκευή, στην εφαρμογή Αρχεία ή στον δικό του χώρο του Zipbox, εκτός αν επιλέξεις να τα εξαγάγεις ή να τα μοιραστείς.","Ο κωδικός που πληκτρολογείς για να ανοίξεις ή να κρυπτογραφήσεις χρησιμοποιείται μόνο για εκείνη την ενέργεια. Παραμένει στη μνήμη όσο διαρκεί και δεν καταγράφεται ούτε αποστέλλεται.","Το Zipbox δεν χρησιμοποιεί κάμερα, μικρόφωνο, επαφές, τοποθεσία ή δεδομένα υγείας.","Επειδή τίποτα δεν φεύγει από τη συσκευή σου, δεν έχουμε προσωπικά δεδομένα να αναζητήσουμε, να εξαγάγουμε ή να διαγράψουμε για λογαριασμό σου. Η διαγραφή της εφαρμογής αφαιρεί και τον χώρο του Zipbox.","Αν αυτή η πολιτική αλλάξει, η ενημερωμένη έκδοση θα δημοσιευτεί σε αυτή τη σελίδα με νέα ημερομηνία."],"secAppStore":"App Store","appStorePurchase":["Το Zipbox είναι επί πληρωμή στο App Store. Μία αγορά δίνει τα πάντα, χωρίς αγορές εντός εφαρμογής, συνδρομές ή διαφημίσεις. Και οι 13 μορφές επεξεργάζονται στη συσκευή.","Η αγορά διεκπεραιώνεται εξ ολοκλήρου από την Apple μέσω του App Store. Το Zipbox δεν βλέπει ποτέ τα στοιχεία πληρωμής σου και δεν λαμβάνει προσωπικά στοιχεία από τη συναλλαγή.","Οι πάροχοι της εφαρμογής Αρχεία και οι σελίδες υποστήριξης ή απορρήτου ανοίγουν μέσω iOS έξω από το Zipbox. Τυχόν σύνδεση ανήκει στην υπηρεσία συστήματος, όχι στο Zipbox."],"pages":{"privacy":{"title":"Πολιτική απορρήτου Zipbox","meta":"Το Zipbox δεν συλλέγει προσωπικά δεδομένα, δεν κάνει αιτήματα δικτύου και δεν περιέχει διαφημίσεις ή ανάλυση.","badge":"Απόρρητο","h1":"Πολιτική απορρήτου","lead":"Το Zipbox δεν συλλέγει τίποτα. Εδώ είναι ακριβώς τι σημαίνει αυτό."}}},"gu-IN":{"langName":"ગુજરાતી","langLabel":"ભાષા","navHome":"મુખપૃષ્ઠ","navSupport":"સહાય","navPrivacy":"ગોપનીયતા","navTerms":"શરતો","foot":"Zipbox સંપૂર્ણપણે તમારા ઉપકરણ પર ચાલે છે. ખાતું નહીં, જાહેરાત નહીં, વિશ્લેષણ નહીં, અપલોડ નહીં.","updated":"છેલ્લે સુધારેલું","secContact":"સંપર્ક","contact":"અમને કોઈ પણ ભાષામાં લખો. દરેક સંદેશ એક માણસ વાંચે છે.","contactHint":"આર્કાઇવનું ફોર્મેટ, iOS ની આવૃત્તિ અને સ્ક્રીન પર દેખાયેલો સંદેશ જણાવવાથી ઘણી મદદ મળે છે. અમે જવાબનો કોઈ નિશ્ચિત સમય આપતા નથી.","secPrivacy":"ગોપનીયતા","priv":["Zipbox કોઈ અંગત માહિતી એકઠી કરતું નથી. ખાતું નથી, સાઇન ઇન નથી અને વપરાશકર્તાની કોઈ પ્રોફાઇલ પણ નથી.","Zipbox કોઈ નેટવર્ક વિનંતી મોકલતું નથી. એપનું પોતાનું કોઈ સર્વર નથી, અને તમારી આર્કાઇવ તથા કાઢેલી ફાઇલો ક્યાંય અપલોડ થતી નથી.","Files provider અને સપોર્ટ કે ગોપનીયતા પેજ iOS દ્વારા Zipboxની બહાર ખૂલે છે. ત્યાં નેટવર્ક વપરાય તો તે પસંદ કરેલી સિસ્ટમ સેવાનું છે, Zipboxનું નહીં.","અમે ત્રીજા પક્ષની જાહેરાત વાપરતા નથી. Zipbox કોઈ પણ પ્રકારની જાહેરાત બતાવતું નથી.","અમે ત્રીજા પક્ષનું વિશ્લેષણ, ટ્રેકિંગ લાઇબ્રેરી કે ક્રેશ રિપોર્ટિંગ સેવા વાપરતા નથી, અને Zipbox જાહેરાત ઓળખકર્તા માગતું નથી.","તમે જે ફાઇલો ખોલો, કાઢો કે બનાવો તે ઉપકરણ પર જ રહે છે, ફાઇલ્સ એપમાં કે Zipbox ની પોતાની જગ્યામાં, સિવાય કે તમે બીજે ક્યાંક મોકલવાનું કે શેર કરવાનું પસંદ કરો.","આર્કાઇવ ખોલવા કે એન્ક્રિપ્ટ કરવા લખેલો પાસવર્ડ ફક્ત એ જ કામ માટે વપરાય છે. કામ ચાલે ત્યાં સુધી તે મેમરીમાં રહે છે અને ક્યારેય કોઈ લોગમાં લખાતો નથી કે ક્યાંય મોકલાતો નથી.","Zipbox કેમેરા, માઇક્રોફોન, સંપર્કો, સ્થાન કે આરોગ્ય માહિતી વાપરતું નથી.","કશું તમારા ઉપકરણની બહાર જતું નથી, એટલે અમારી પાસે એવી કોઈ અંગત માહિતી નથી જે તમારા વતી શોધીએ, તમને મોકલીએ કે ભૂંસીએ. એપ કાઢી નાખવાથી Zipbox ની જગ્યા પણ નીકળી જાય છે.","આ નીતિ બદલાય તો સુધારેલી આવૃત્તિ નવી તારીખ સાથે આ જ પાના પર પ્રકાશિત થશે."],"secAppStore":"App Store","appStorePurchase":["Zipbox App Store પરની પેઇડ એપ છે. એક ખરીદીમાં બધાં ફીચર મળે છે; એપમાં બીજી ખરીદી, સબ્સ્ક્રિપ્શન કે જાહેરાત નથી. 13 ફોર્મેટ તમારા ઉપકરણ પર જ સંભાળાય છે.","ખરીદી સંપૂર્ણપણે Apple, App Store દ્વારા સંભાળે છે. Zipbox તમારી ચુકવણીની વિગતો ક્યારેય જોતું નથી અને આ વ્યવહારમાંથી કોઈ અંગત માહિતી મેળવતું નથી.","Files provider અને સપોર્ટ કે ગોપનીયતા પેજ iOS દ્વારા Zipboxની બહાર ખૂલે છે. ત્યાં નેટવર્ક વપરાય તો તે પસંદ કરેલી સિસ્ટમ સેવાનું છે, Zipboxનું નહીં."],"pages":{"privacy":{"title":"Zipbox ગોપનીયતા નીતિ","meta":"Zipbox અંગત માહિતી એકઠી કરતું નથી, નેટવર્ક વિનંતી  או הפרטיות נפתחים דרך iOS מחוץ ל-Zipbox. פעילות רשת שם שייכת לשירות המערכת שבחרת, לא ל-Zipbox."],"pages":{"privacy":{"title":"מדיניות הפרטיות של Zipbox","meta":"Zipbox לא אוסף מידע אישי, לא מבצע פניות לרשת ואין בו פרסומות או אנליטיקה.","badge":"פרטיות","h1":"מדיניות פרטיות","lead":"Zipbox לא אוסף כלום. הנה בדיוק מה שזה אומר."}}},"hi":{"langName":"हिन्दी","langLabel":"भाषा","navHome":"मुखपृष्ठ","navSupport":"सहायता","navPrivacy":"गोपनीयता","navTerms":"शर्तें","foot":"Zipbox पूरी तरह आपके डिवाइस पर चलता है। कोई खाता नहीं, कोई विज्ञापन नहीं, कोई विश्लेषण नहीं, कोई अपलोड नहीं।","updated":"अंतिम अद्यतन","secContact":"संपर्क","contact":"हमें किसी भी भाषा में लिखिए। हर संदेश एक इंसान पढ़ता है।","contactHint":"संग्रह का फ़ॉर्मैट, iOS का संस्करण और स्क्रीन पर दिखा संदेश बताने से बहुत मदद मिलती है। हम जवाब का कोई निश्चित समय नहीं देते।","secPrivacy":"गोपनीयता","priv":["Zipbox कोई निजी जानकारी इकट्ठा नहीं करता। न खाता है, न साइन इन और न कोई उपयोगकर्ता प्रोफ़ाइल।","Zipbox कोई नेटवर्क अनुरोध नहीं भेजता। ऐप का अपना कोई सर्वर नहीं है, और आपकी संग्रह तथा निकाली गई फ़ाइलें कहीं अपलोड नहीं होतीं।","Files provider और सहायता या गोपनीयता पेज iOS द्वारा Zipbox के बाहर खुलते हैं। वहाँ नेटवर्क का उपयोग चुनी हुई सिस्टम सेवा करती है, Zipbox नहीं।","हम किसी तीसरे पक्ष के विज्ञापन का उपयोग नहीं करते। Zipbox किसी भी तरह का विज्ञापन नहीं दिखाता।","हम किसी तीसरे पक्ष के विश्लेषण, ट्रैकिंग लाइब्रेरी या क्रैश रिपोर्टिंग सेवा का उपयोग नहीं करते, और Zipbox विज्ञापन पहचानकर्ता नहीं माँगता।","जो फ़ाइलें आप खोलते, निकालते या बनाते हैं वे डिवाइस पर ही रहती हैं, फ़ाइल्स ऐप में या Zipbox की अपनी जगह में, जब तक आप उन्हें कहीं और न भेजें या साझा न करें।","संग्रह खोलने या एन्क्रिप्ट करने के लिए टाइप किया गया पासवर्ड सिर्फ़ उसी काम के लिए इस्तेमाल होता है। वह काम के दौरान मेमोरी में रहता है और कभी किसी लॉग में नहीं लिखा जाता और न कहीं भेजा जाता है।","Zipbox कैमरा, माइक्रोफ़ोन, संपर्क, स्थान या स्वास्थ्य डेटा का उपयोग नहीं करता।","चूँकि कुछ भी आपके डिवाइस से बाहर नहीं जाता, हमारे पास ऐसी कोई निजी जानकारी नहीं जिसे हम आपके लिए खोजें, आपको भेजें या मिटाएँ। ऐप हटाने से Zipbox की जगह भी हट जाती है।","अगर यह नीति बदलेगी तो नया संस्करण नई तारीख़ के साथ इसी पृष्ठ पर प्रकाशित होगा।"],"secAppStore":"App Store","appStorePurchase":["Zipbox App Store का सशुल्क ऐप है। एक खरीद में सभी सुविधाएँ हैं; ऐप के अंदर खरीद, सब्सक्रिप्शन या विज्ञापन नहीं। 13 फ़ॉर्मैट डिवाइस पर ही प्रोसेस होते हैं।","ख़रीद पूरी तरह Apple, App Store के ज़रिए संभालता है। Zipbox आपकी भुगतान जानकारी कभी नहीं देखता और इस लेनदेन से कोई निजी जानकारी प्राप्त नहीं करता।","Files provider और सहायता या गोपनीयता पेज iOS द्वारा Zipbox के बाहर खुलते हैं। वहाँ नेटवर्क का उपयोग चुनी हुई सिस्टम सेवा करती है, Zipbox नहीं।"],"pages":{"privacy":{"title":"Zipbox गोपनीयता नीति","meta":"Zipbox निजी जानकारी इकट्ठा नहीं करता, नेटवर्क अनुरोध नहीं भेजता और इसमें विज्ञापन या विश्लेषण नहीं है।","badge":"गोपनीयता","h1":"गोपनीयता नीति","lead":"Zipbox कुछ भी इकट्ठा नहीं करता। इसका ठीक-ठीक मतलब यह है।"}}},"hu":{"langName":"Magyar","langLabel":"Nyelv","navHome":"Főoldal","navSupport":"Támogatás","navPrivacy":"Adatvédelem","navTerms":"Feltételek","foot":"A Zipbox teljes egészében a te készülékeden fut. Nincs fiók, nincs reklám, nincs elemzés, semmi nem megy sehova.","updated":"Utoljára frissítve","secContact":"Kapcsolat","contact":"Írj nekünk bármilyen nyelven. Minden üzenetet ember olvas el.","contactHint":"Az archívum formátuma, az iOS verziója és a képernyőn látott üzenet sokat segít. Fix válaszidőt nem ígérünk.","secPrivacy":"Adatvédelem","priv":["A Zipbox nem gyűjt személyes adatot. Nincs fiók, nincs bejelentkezés és nincs felhasználói profil.","A Zipbox nem küld hálózati kérést. Az alkalmazásnak nincs saját kiszolgálója, és az archívumaid, valamint a kibontott fájlok soha nem kerülnek fel sehova.","A Fájlok szolgáltatói, valamint a támogatási és adatvédelmi oldalak az iOS-en, a Zipboxon kívül nyílnak meg. Az ottani hálózatot a választott rendszerszolgáltatás használja, nem a Zipbox.","Nem használunk harmadik féltől származó hirdetést. A Zipbox semmilyen reklámot nem jelenít meg.","Nem használunk harmadik féltől származó elemzést, nyomkövető könyvtárat vagy összeomlás-jelentő szolgáltatást, és a Zipbox nem kéri le a hirdetési azonosítót.","A megnyitott, kibontott vagy létrehozott fájlok a készüléken maradnak, a Fájlok alkalmazásban vagy a Zipbox saját tárhelyén, hacsak nem exportálod vagy osztod meg őket.","Az archívum megnyitásához vagy titkosításához beírt jelszó csak arra a műveletre szolgál. A feladat idejére a memóriában marad, és soha nem kerül naplóba, sem máshova.","A Zipbox nem használ kamerát, mikrofont, névjegyeket, helyadatot vagy egészségügyi adatot.","Mivel semmi nem hagyja el a készüléket, nálunk nincs olyan személyes adat, amit kikereshetnénk, exportálhatnánk vagy törölhetnénk helyetted. Az alkalmazás törlésével a Zipbox tárhelye is eltűnik.","Ha ez a szabályzat változik, a frissített változatot új dátummal tesszük közzé ezen az oldalon."],"secAppStore":"App Store","appStorePurchase":["A Zipbox fizetős app az App Store-ban. Egy vásárlás minden funkciót ad, alkalmazáson belüli vásárlás, előfizetés és reklám nélkül. A Zipbox 13 formátumot kezel helyben.","A vásárlást teljes egészében az Apple kezeli az App Store-on keresztül. A Zipbox soha nem látja a fizetési adataidat, és a tranzakcióból semmilyen személyes adatot nem kap.","A Fájlok szolgáltatói, valamint a támogatási és adatvédelmi oldalak az iOS-en, a Zipboxon kívül nyílnak meg. Az ottani hálózatot a választott rendszerszolgáltatás használja, nem a Zipbox."],"pages":{"privacy":{"title":"Zipbox adatvédelmi szabályzat","meta":"A Zipbox nem gyűjt személyes adatot, nem küld hálózati kérést, és nincs benne reklám vagy elemzés.","badge":"Adatvédelem","h1":"Adatvédelmi szabályzat","lead":"A Zipbox semmit nem gyűjt. Itt pontosan az áll, hogy ez mit jelent."}}},"id":{"langName":"Bahasa Indonesia","langLabel":"Bahasa","navHome":"Beranda","navSupport":"Bantuan","navPrivacy":"Privasi","navTerms":"Ketentuan","foot":"Zipbox berjalan sepenuhnya di perangkatmu. Tanpa akun, tanpa iklan, tanpa analitik, tanpa unggahan.","updated":"Terakhir diperbarui","secContact":"Kontak","contact":"Tulis ke kami dalam bahasa apa pun. Setiap pesan dibaca orang sungguhan.","contactHint":"Menyebutkan format arsip, versi iOS, dan pesan yang muncul di layar sangat membantu. Kami tidak menjanjikan waktu balasan yang pasti.","secPrivacy":"Privasi","priv":["Zipbox tidak mengumpulkan data pribadi. Tidak ada akun, tidak ada proses masuk, dan tidak ada profil pengguna.","Zipbox tidak membuat permintaan jaringan. Aplikasi ini tidak punya server sendiri, dan arsip serta berkas hasil ekstrakmu tidak pernah diunggah ke mana pun.","Penyedia di File serta halaman dukungan atau privasi dibuka oleh iOS di luar Zipbox. Aktivitas jaringan di sana berasal dari layanan sistem pilihanmu, bukan Zipbox.","Kami tidak memakai iklan pihak ketiga. Zipbox tidak menampilkan iklan dalam bentuk apa pun.","Kami tidak memakai analitik pihak ketiga, pustaka pelacak, atau layanan laporan galat, dan Zipbox tidak meminta pengenal iklan.","Berkas yang kamu buka, ekstrak, atau buat tetap di perangkat, di aplikasi Berkas atau di penyimpanan Zipbox sendiri, kecuali kamu memilih mengekspor atau membagikannya.","Kata sandi yang kamu ketik untuk membuka atau mengenkripsi arsip hanya dipakai untuk operasi itu. Ia berada di memori selama proses dan tidak pernah ditulis ke log atau dikirim ke mana pun.","Zipbox tidak memakai kamera, mikrofon, kontak, lokasi, atau data kesehatan.","Karena tidak ada yang keluar dari perangkatmu, kami juga tidak punya data pribadi untuk dicari, diekspor, atau dihapus atas namamu. Menghapus aplikasi juga menghapus penyimpanan Zipbox.","Bila kebijakan ini berubah, versi terbarunya akan dimuat di halaman ini dengan tanggal baru."],"secAppStore":"App Store","appStorePurchase":["Zipbox adalah app berbayar di App Store. Sekali beli, semua fitur tersedia; tanpa pembelian dalam app, langganan, atau iklan. Semua 13 format diproses di perangkat.","Pembelian sepenuhnya ditangani Apple lewat App Store. Zipbox tidak pernah melihat data pembayaranmu dan tidak menerima informasi pribadi dari transaksi itu.","Penyedia di File serta halaman dukungan atau privasi dibuka oleh iOS di luar Zipbox. Aktivitas jaringan di sana berasal dari layanan sistem pilihanmu, bukan Zipbox."],"pages":{"privacy":{"title":"Kebijakan privasi Zipbox","meta":"Zipbox tidak mengumpulkan data pribadi, tidak membuat permintaan jaringan, dan tidak memuat iklan atau analitik.","badge":"Privasi","h1":"Kebijakan privasi","lead":"Zipbox tidak mengumpulkan apa pun. Berikut arti persisnya."}}},"it":{"langName":"Italiano","langLabel":"Lingua","navHome":"Home","navSupport":"Assistenza","navPrivacy":"Privacy","navTerms":"Condizioni","foot":"Zipbox funziona interamente sul tuo dispositivo. Nessun account, nessuna pubblicità, nessuna analisi, nessun caricamento.","updated":"Ultimo aggiornamento","secContact":"Contatti","contact":"Scrivici nella lingua che preferisci. Ogni messaggio viene letto da una persona.","contactHint":"Indicare il formato dell'archivio, la versione di iOS e il messaggio visto sullo schermo aiuta molto. Non promettiamo tempi di risposta fissi.","secPrivacy":"Privacy","priv":["Zipbox non raccoglie dati personali. Non c'è account, non c'è accesso e non c'è alcun profilo utente.","Zipbox non effettua richieste di rete. L'app non ha un proprio server e i tuoi archivi e i file estratti non vengono caricati da nessuna parte.","I provider di File e le pagine di supporto o privacy si aprono tramite iOS, fuori da Zipbox. L’eventuale rete appartiene al servizio di sistema scelto, non a Zipbox.","Non usiamo pubblicità di terze parti. Zipbox non mostra pubblicità di alcun tipo.","Non usiamo servizi di analisi, librerie di tracciamento o servizi di segnalazione dei crash di terze parti, e Zipbox non richiede l'identificatore pubblicitario.","I file che apri, estrai o crei restano sul dispositivo, nell'app File o nello spazio di Zipbox, a meno che tu non scelga di esportarli o condividerli.","Una password digitata per aprire o cifrare un archivio serve solo a quell'operazione. Resta in memoria per il tempo necessario e non viene mai scritta in un registro né inviata altrove.","Zipbox non usa fotocamera, microfono, contatti, posizione o dati sulla salute.","Poiché nulla esce dal dispositivo, non abbiamo dati personali da consultare, esportare o cancellare per te. Rimuovendo l'app si rimuove anche lo spazio di Zipbox.","Se questa informativa cambia, la versione aggiornata sarà pubblicata su questa pagina con una nuova data."],"secAppStore":"App Store","appStorePurchase":["Zipbox è un’app a pagamento su App Store. Un acquisto include tutto, senza acquisti in-app, abbonamenti o pubblicità. I 13 formati sono gestiti sul dispositivo.","L'acquisto è gestito interamente da Apple tramite l'App Store. Zipbox non vede i tuoi dati di pagamento e non riceve informazioni personali dalla transazione.","I provider di File e le pagine di supporto o privacy si aprono tramite iOS, fuori da Zipbox. L’eventuale rete appartiene al servizio di sistema scelto, non a Zipbox."],"pages":{"privacy":{"title":"Informativa sulla privacy di Zipbox","meta":"Zipbox non raccoglie dati personali, non fa richieste di rete e non contiene pubblicità né librerie di analisi.","badge":"Privacy","h1":"Informativa sulla privacy","lead":"Zipbox non raccoglie nulla. Qui c'è esattamente cosa significa."}}},"ja":{"langName":"日本語","langLabel":"言語","navHome":"ホーム","navSupport":"サポート","navPrivacy":"プライバシー","navTerms":"利用規約","foot":"Zipboxはすべて端末の中で動きます。アカウントなし、広告なし、解析なし、アップロードなし。","updated":"最終更新","secContact":"お問い合わせ","contact":"どの言語で書いていただいてもかまいません。すべてのメールに人が目を通しています。","contactHint":"圧縮ファイルの形式、iOSのバージョン、画面に出た表示を添えていただけると助かります。返信の期限はお約束していません。","secPrivacy":"プライバシー","priv":["Zipboxは個人情報を収集しません。アカウントもログインもユーザープロフィールもありません。","Zipboxは通信を行いません。独自のサーバーを持たず、圧縮ファイルや展開したファイルがどこかへ送られることはありません。","「ファイル」のプロバイダやサポート・プライバシーページは、iOSがZipboxの外で開きます。そこで通信が発生する場合は選択したシステムサービスによるもので、Zipboxによる通信ではありません。","第三者の広告は使用していません。Zipboxはいかなる広告も表示しません。","第三者の解析、追跡SDK、クラッシュレポートのサービスは使用しておらず、広告識別子の取得も行いません。","開いた、展開した、作成したファイルは、ご自身で書き出したり共有したりしないかぎり、ファイルAppまたはZipbox内の保存領域に残ります。","圧縮ファイルを開くときや暗号化するときに入力したパスワードは、その操作にのみ使用します。処理中はメモリ上に保持され、ログに書き出すことも、どこかへ送ることもありません。","Zipboxはカメラ、マイク、連絡先、位置情報、ヘルスケアのデータを使用しません。","データが端末の外に出ないため、当方で照会・書き出し・削除できる個人情報はありません。アプリを削除すると、Zipboxの保存領域も端末から取り除かれます。","この方針を変更した場合は、新しい日付とともにこのページで公開します。"],"secAppStore":"App Store","appStorePurchase":["ZipboxはApp Storeで購入する有料アプリです。1回の購入ですべての機能を利用でき、アプリ内課金・サブスクリプション・広告はありません。13形式を端末内だけで処理します。","支払いはすべてAppleがApp Storeを通じて処理します。Zipboxが支払い情報を見ることはなく、この取引から個人情報を受け取ることもありません。","「ファイル」のプロバイダやサポート・プライバシーページは、iOSがZipboxの外で開きます。そこで通信が発生する場合は選択したシステムサービスによるもので、Zipboxによる通信ではありません。"],"pages":{"privacy":{"title":"Zipbox プライバシーポリシー","meta":"Zipboxは個人情報を収集せず、通信も行わず、広告や解析SDKも含みません。","badge":"プライバシー","h1":"プライバシーポリシー","lead":"Zipboxは何も収集しません。それが具体的にどういう意味かをそのまま書きます。"}}},"kn-IN":{"langName":"ಕನ್ನಡ","langLabel":"ಭಾಷೆ","navHome":"ಮುಖಪುಟ","navSupport":"ಸಹಾಯ","navPrivacy":"ಗೌಪ್ಯತೆ","navTerms":"ನಿಯಮಗಳು","foot":"Zipbox ಸಂಪೂರ್ಣವಾಗಿ ನಿಮ್ಮ ಸಾಧನದಲ್ಲೇ ಚಲಿಸುತ್ತದೆ. ಖಾತೆ ಇಲ್ಲ, ಜಾಹೀರಾತು ಇಲ್ಲ, ವಿಶ್ಲೇಷಣೆ ಇಲ್ಲ, ಅಪ್‌ಲೋಡ್ ಇಲ್ಲ.","updated":"ಕೊನೆಯ ನವೀಕರಣ","secContact":"ಸಂಪರ್ಕ","contact":"ಯಾವುದೇ ಭಾಷೆಯಲ್ಲಿ ನಮಗೆ ಬರೆಯಿರಿ. ಪ್ರತಿ ಸಂದೇಶವನ್ನೂ ಒಬ್ಬ ವ್ಯಕ್ತಿ ಓದುತ್ತಾರೆ.","contactHint":"ಆರ್ಕೈವ್‌ನ ಸ್ವರೂಪ, iOS ಆವೃತ್ತಿ ಮತ್ತು ಪರದೆಯಲ್ಲಿ ಕಂಡ ಸಂದೇಶ ತಿಳಿಸಿದರೆ ತುಂಬಾ ಸಹಾಯವಾಗುತ್ತದೆ. ಉತ್ತರಕ್ಕೆ ನಿಗದಿತ ಸಮಯವನ್ನು ನಾವು ಭರವಸೆ ನೀಡುವುದಿಲ್ಲ.","secPrivacy":"ಗೌಪ್ಯತೆ","priv":["Zipbox ವೈಯಕ್ತಿಕ ಮಾಹಿತಿ ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ. ಖಾತೆ ಇಲ್ಲ, ಸೈನ್ ಇನ್ ಇಲ್ಲ, ಬಳಕೆದಾರ ಪ್ರೊಫೈಲೂ ಇಲ್ಲ.","Zipbox ಯಾವುದೇ ನೆಟ್‌ವರ್ಕ್ ವಿನಂತಿ ಕಳುಹಿಸುವುದಿಲ್ಲ. ಆ್ಯಪ್‌ಗೆ ಸ್ವಂತ ಸರ್ವರ್ ಇಲ್ಲ, ನಿಮ್ಮ ಆರ್ಕೈವ್‌ಗಳು ಮತ್ತು ತೆಗೆದ ಫೈಲ್‌ಗಳು ಎಲ್ಲಿಗೂ ಅಪ್‌ಲೋಡ್ ಆಗುವುದಿಲ್ಲ.","Files provider ಹಾಗೂ ಸಹಾಯ ಅಥವಾ ಗೌಪ್ಯತಾ ಪುಟಗಳನ್ನು iOS, Zipboxನ ಹೊರಗೆ ತೆರೆಯುತ್ತದೆ. ಅಲ್ಲಿ ನೆಟ್‌ವರ್ಕ್ ಬಳಕೆಯಾದರೆ ಅದು ನೀವು ಆರಿಸಿದ ಸಿಸ್ಟಂ ಸೇವೆಯದು, Zipboxನದಲ್ಲ.","ನಾವು ಮೂರನೇ ಪಕ್ಷದ ಜಾಹೀರಾತು ಬಳಸುವುದಿಲ್ಲ. Zipbox ಯಾವುದೇ ಬಗೆಯ ಜಾಹೀರಾತು ತೋರಿಸುವುದಿಲ್ಲ.","ನಾವು ಮೂರನೇ ಪಕ್ಷದ ವಿಶ್ಲೇಷಣೆ, ಟ್ರ್ಯಾಕಿಂಗ್ ಲೈಬ್ರರಿ ಅಥವಾ ಕ್ರ್ಯಾಶ್ ವರದಿ ಸೇವೆಗಳನ್ನು ಬಳಸುವುದಿಲ್ಲ, Zipbox ಜಾಹೀರಾತು ಗುರುತನ್ನೂ ಕೇಳುವುದಿಲ್ಲ.","ನೀವು ತೆರೆಯುವ, ತೆಗೆಯುವ ಅಥವಾ ರಚಿಸುವ ಫೈಲ್‌ಗಳು ಸಾಧನದಲ್ಲೇ ಉಳಿಯುತ್ತವೆ, ಫೈಲ್ಸ್ ಆ್ಯಪ್‌ನಲ್ಲಿ ಅಥವಾ Zipbox ನ ಸ್ವಂತ ಸ್ಥಳದಲ್ಲಿ, ನೀವು ಬೇರೆಡೆಗೆ ಕಳುಹಿಸಲು ಅಥವಾ ಹಂಚಿಕೊಳ್ಳಲು ಆರಿಸುವವರೆಗೆ.","ಆರ್ಕೈವ್ ತೆರೆಯಲು ಅಥವಾ ಎನ್‌ಕ್ರಿಪ್ಟ್ ಮಾಡಲು ನೀವು ಟೈಪ್ ಮಾಡುವ ಪಾಸ್‌ವರ್ಡ್ ಆ ಕೆಲಸಕ್ಕೆ ಮಾತ್ರ ಬಳಕೆಯಾಗುತ್ತದೆ. ಕೆಲಸ ನಡೆಯುವಷ್ಟು ಹೊತ್ತು ಅದು ಮೆಮೊರಿಯಲ್ಲಿ ಇರುತ್ತದೆ, ಯಾವ ಲಾಗ್‌ನಲ್ಲೂ ಬರೆಯಲ್ಪಡುವುದಿಲ್ಲ, ಎಲ್ಲಿಗೂ ಕಳುಹಿಸಲ್ಪಡುವುದಿಲ್ಲ.","Zipbox ಕ್ಯಾಮೆರಾ, ಮೈಕ್ರೊಫೋನ್, ಸಂಪರ್ಕಗಳು, ಸ್ಥಳ ಅಥವಾ ಆರೋಗ್ಯ ಮಾಹಿತಿಯನ್ನು ಬಳಸುವುದಿಲ್ಲ.","ಏನೂ ನಿಮ್ಮ ಸಾಧನವನ್ನು ಬಿಟ್ಟು ಹೋಗದ ಕಾರಣ, ನಿಮ್ಮ ಪರವಾಗಿ ಹುಡುಕಲು, ಕಳುಹಿಸಲು ಅಥವಾ ಅಳಿಸಲು ನಮ್ಮಲ್ಲಿ ವೈಯಕ್ತಿಕ ಮಾಹಿತಿಯೇ ಇಲ್ಲ. ಆ್ಯಪ್ ತೆಗೆದುಹಾಕಿದರೆ Zipbox ನ ಸ್ಥಳವೂ ಹೋಗುತ್ತದೆ.","ಈ ನೀತಿ ಬದಲಾದರೆ, ಪರಿಷ್ಕೃತ ಆವೃತ್ತಿಯನ್ನು ಹೊಸ ದಿನಾಂಕದೊಂದಿಗೆ ಇದೇ ಪುಟದಲ್ಲಿ ಪ್ರಕಟಿಸಲಾಗುತ್ತದೆ."],"secAppStore":"App Store","appStorePurchase":["Zipbox App Storeನ ಪೇಯ್ಡ್ ಆಪ್. ಒಮ್ಮೆ ಖರೀದಿಸಿದರೆ ಎಲ್ಲ ಸೌಲಭ್ಯಗಳೂ ಸಿಗುತ್ತವೆ; ಆಪ್ ಒಳಗೆ ಖರೀದಿ, ಸಬ್‌ಸ್ಕ್ರಿಪ್ಶನ್ ಅಥವಾ ಜಾಹೀರಾತು ಇಲ್ಲ. 13 ಸ್ವರೂಪಗಳನ್ನೂ ಸಾಧನದಲ್ಲೇ ನಿರ್ವಹಿಸುತ್ತದೆ.","ಖರೀದಿಯನ್ನು ಸಂಪೂರ್ಣವಾಗಿ Apple, App Store ಮೂಲಕ ನಿರ್ವಹಿಸುತ್ತದೆ. Zipbox ನಿಮ್ಮ ಪಾವತಿ ವಿವರಗಳನ್ನು ಎಂದಿಗೂ ನೋಡುವುದಿಲ್ಲ, ಈ ವಹಿವಾಟಿನಿಂದ ಯಾವುದೇ ವೈಯಕ್ತಿಕ ಮಾಹಿತಿಯನ್ನೂ ಪಡೆಯುವುದಿಲ್ಲ.","Files provider ಹಾಗೂ ಸಹಾಯ ಅಥವಾ ಗೌಪ್ಯತಾ ಪುಟಗಳನ್ನು iOS, Zipboxನ ಹೊರಗೆ ತೆರೆಯುತ್ತದೆ. ಅಲ್ಲಿ ನೆಟ್‌ವರ್ಕ್ ಬಳಕೆಯಾದರೆ ಅದು ನೀವು ಆರಿಸಿದ ಸಿಸ್ಟಂ ಸೇವೆಯದು, Zipboxನದಲ್ಲ."],"pages":{"privacy":{"title":"Zipbox ಗೌಪ್ಯತಾ ನೀತಿ","meta":"Zipbox ವೈಯಕ್ತಿಕ ಮಾಹಿತಿ ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ, ನೆಟ್‌ವರ್ಕ್ ವಿನಂತಿ ಕಳುಹಿಸುವುದಿಲ್ಲ, ಜಾಹೀರಾತು ಅಥವಾ ವಿಶ್ಲೇಷಣೆ ಇಲ್ಲ.","badge":"ಗೌಪ್ಯತೆ","h1":"ಗೌಪ್ಯತಾ ನೀತಿ","lead":"Zipbox ಏನನ್ನೂ ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ. ಅದರ ನಿಖರ ಅರ್ಥ ಇಲ್ಲಿದೆ."}}},"ko":{"langName":"한국어","langLabel":"언어","navHome":"홈","navSupport":"지원","navPrivacy":"개인정보","navTerms":"이용약관","foot":"Zipbox는 전부 기기 안에서 동작합니다. 계정 없음, 광고 없음, 분석 없음, 업로드 없음.","updated":"최종 업데이트","secContact":"문의","contact":"어떤 언어로 쓰셔도 됩니다. 모든 메일은 사람이 직접 읽습니다.","contactHint":"압축파일 형식, iOS 버전, 화면에 나온 문구를 함께 알려주시면 큰 도움이 됩니다. 정해진 답변 시간을 약속드리지는 않습니다.","secPrivacy":"개인정보","priv":["Zipbox는 개인정보를 수집하지 않습니다. 계정도, 로그인도, 사용자 프로필도 없습니다.","Zipbox는 네트워크 요청을 하지 않습니다. 자체 서버가 없으며, 압축파일과 풀어낸 파일이 어딘가로 올라가는 일도 없습니다.","파일 제공자와 지원·개인정보 보호 페이지는 iOS가 Zipbox 밖에서 엽니다. 그곳의 네트워크 활동은 사용자가 선택한 시스템 서비스의 것이며 Zipbox의 통신이 아닙니다.","제3자 광고를 사용하지 않습니다. Zipbox는 어떤 형태의 광고도 표시하지 않습니다.","제3자 분석, 추적 SDK, 크래시 리포트 서비스를 사용하지 않으며 광고 식별자도 요청하지 않습니다.","열거나 풀거나 만든 파일은 직접 내보내거나 공유하지 않는 한 파일 앱 또는 Zipbox 자체 저장 공간에 남습니다.","압축파일을 열거나 암호화할 때 입력한 비밀번호는 그 작업에만 쓰입니다. 처리하는 동안 메모리에만 있고 기록으로 남기거나 어딘가로 보내지 않습니다.","Zipbox는 카메라, 마이크, 연락처, 위치, 건강 데이터를 사용하지 않습니다.","기기 밖으로 나가는 데이터가 없기 때문에 저희가 대신 조회하거나 내보내거나 삭제할 개인정보도 없습니다. 앱을 삭제하면 Zipbox의 저장 공간도 함께 사라집니다.","이 방침이 바뀌면 새 날짜와 함께 이 페이지에 게시합니다."],"secAppStore":"App Store","appStorePurchase":["Zipbox는 App Store 유료 다운로드 앱입니다. 한 번 구매하면 모든 기능을 바로 쓸 수 있으며, 앱 내 구입·구독·광고가 없습니다. 13가지 형식은 기기 안에서만 처리됩니다.","결제는 Apple이 App Store를 통해 모두 처리합니다. Zipbox는 결제 정보를 볼 수 없고 이 거래에서 개인정보를 받지도 않습니다.","파일 제공자와 지원·개인정보 보호 페이지는 iOS가 Zipbox 밖에서 엽니다. 그곳의 네트워크 활동은 사용자가 선택한 시스템 서비스의 것이며 Zipbox의 통신이 아닙니다."],"pages":{"privacy":{"title":"Zipbox 개인정보 처리방침","meta":"Zipbox는 개인정보를 수집하지 않고 네트워크 요청도 하지 않으며 광고나 분석 SDK도 없습니다.","badge":"개인정보","h1":"개인정보 처리방침","lead":"Zipbox는 아무것도 수집하지 않습니다. 그 말이 정확히 무슨 뜻인지 그대로 적었습니다."}}},"ms":{"langName":"Bahasa Melayu","langLabel":"Bahasa","navHome":"Laman utama","navSupport":"Sokongan","navPrivacy":"Privasi","navTerms":"Terma","foot":"Zipbox berjalan sepenuhnya pada peranti anda. Tiada akaun, tiada iklan, tiada analitik, tiada muat naik.","updated":"Kemas kini terakhir","secContact":"Hubungi kami","contact":"Tulis kepada kami dalam bahasa apa pun. Setiap mesej dibaca oleh manusia.","contactHint":"Menyatakan format arkib, versi iOS dan mesej yang anda lihat pada skrin banyak membantu. Kami tidak menjanjikan tempoh balasan yang tetap.","secPrivacy":"Privasi","priv":["Zipbox tidak mengumpul data peribadi. Tiada akaun, tiada log masuk dan tiada profil pengguna.","Zipbox tidak membuat permintaan rangkaian. Aplikasi ini tiada pelayan sendiri, dan arkib serta fail yang anda ekstrak tidak pernah dimuat naik ke mana-mana.","Penyedia dalam Fail serta halaman sokongan atau privasi dibuka oleh iOS di luar Zipbox. Aktiviti rangkaian di situ datang daripada perkhidmatan sistem pilihan anda, bukan Zipbox.","Kami tidak menggunakan iklan pihak ketiga. Zipbox tidak memaparkan sebarang bentuk iklan.","Kami tidak menggunakan analitik pihak ketiga, pustaka penjejak atau perkhidmatan laporan ranap, dan Zipbox tidak meminta pengecam pengiklan.","Fail yang anda buka, ekstrak atau cipta kekal pada peranti, dalam aplikasi Fail atau dalam storan Zipbox sendiri, melainkan anda memilih untuk mengeksport atau berkongsinya.","Kata laluan yang anda taip untuk membuka atau menyulitkan arkib digunakan untuk operasi itu sahaja. Ia berada dalam memori sepanjang tugasan dan tidak pernah ditulis ke log atau dihantar ke mana-mana.","Zipbox tidak menggunakan kamera, mikrofon, kenalan, lokasi atau data kesihatan.","Kerana tiada apa yang meninggalkan peranti anda, kami juga tiada data peribadi untuk dicari, dieksport atau dipadam bagi pihak anda. Memadam aplikasi turut memadam storan Zipbox.","Jika dasar ini berubah, versi terkini akan diterbitkan di halaman ini dengan tarikh baharu."],"secAppStore":"App Store","appStorePurchase":["Zipbox ialah app berbayar di App Store. Satu pembelian merangkumi semua ciri, tanpa pembelian dalam app, langganan atau iklan. Kesemua 13 format diproses pada peranti.","Pembelian dikendalikan sepenuhnya oleh Apple melalui App Store. Zipbox tidak pernah melihat maklumat pembayaran anda dan tidak menerima maklumat peribadi daripada transaksi itu.","Penyedia dalam Fail serta halaman sokongan atau privasi dibuka oleh iOS di luar Zipbox. Aktiviti rangkaian di situ datang daripada perkhidmatan sistem pilihan anda, bukan Zipbox."],"pages":{"privacy":{"title":"Dasar privasi Zipbox","meta":"Zipbox tidak mengumpul data peribadi, tidak membuat permintaan rangkaian dan tiada iklan atau analitik.","badge":"Privasi","h1":"Dasar privasi","lead":"Zipbox tidak mengumpul apa-apa. Inilah maksud sebenarnya."}}},"ml-IN":{"langName":"മലയാളം","langLabel":"ഭാഷ","navHome":"ഹോം","navSupport":"സഹായം","navPrivacy":"സ്വകാര്യത","navTerms":"നിബന്ധനകൾ","foot":"Zipbox പൂർണമായും നിങ്ങളുടെ ഉപകരണത്തിൽ പ്രവർത്തിക്കുന്നു. അക്കൗണ്ടില്ല, പരസ്യമില്ല, വിശകലനമില്ല, അപ്‌ലോഡില്ല.","updated":"അവസാനം പുതുക്കിയത്","secContact":"ബന്ധപ്പെടുക","contact":"ഏത് ഭാഷയിലും ഞങ്ങൾക്ക് എഴുതൂ. ഓരോ സന്ദേശവും ഒരാൾ വായിക്കുന്നു.","contactHint":"ആർക്കൈവിന്റെ ഫോർമാറ്റ്, iOS പതിപ്പ്, സ്ക്രീനിൽ കണ്ട സന്ദേശം എന്നിവ പറഞ്ഞാൽ വളരെ സഹായകമാണ്. മറുപടിക്ക് നിശ്ചിത സമയം ഞങ്ങൾ ഉറപ്പുനൽകുന്നില്ല.","secPrivacy":"സ്വകാര്യത","priv":["Zipbox വ്യക്തിഗത വിവരങ്ങൾ ശേഖരിക്കുന്നില്ല. അക്കൗണ്ടില്ല, സൈൻ ഇന്നില്ല, ഉപയോക്തൃ പ്രൊഫൈലുമില്ല.","Zipbox ഒരു നെറ്റ്‌വർക്ക് അഭ്യർഥനയും അയക്കുന്നില്ല. ആപ്പിന് സ്വന്തം സെർവറില്ല, നിങ്ങളുടെ ആർക്കൈവുകളും എടുത്ത ഫയലുകളും എവിടേക്കും അപ്‌ലോഡ് ചെയ്യപ്പെടുന്നില്ല.","Files provider-കളും സഹായ അല്ലെങ്കിൽ സ്വകാര്യതാ പേജുകളും iOS, Zipbox-ന് പുറത്താണ് തുറക്കുന്നത്. അവിടെ നെറ്റ്‌വർക്ക് ഉപയോഗിച്ചാൽ അത് തിരഞ്ഞെടുത്ത സിസ്റ്റം സേവനത്തിന്റേതാണ്, Zipbox-ന്റേതല്ല.","ഞങ്ങൾ മൂന്നാം കക്ഷി പരസ്യം ഉപയോഗിക്കുന്നില്ല. Zipbox ഒരു തരത്തിലുള്ള പരസ്യവും കാണിക്കുന്നില്ല.","ഞങ്ങൾ മൂന്നാം കക്ഷി വിശകലനം, ട്രാക്കിംഗ് ലൈബ്രറികൾ, ക്രാഷ് റിപ്പോർട്ടിംഗ് സേവനങ്ങൾ എന്നിവ ഉപയോഗിക്കുന്നില്ല, Zipbox പരസ്യ ഐഡന്റിഫയറും ആവശ്യപ്പെടുന്നില്ല.","നിങ്ങൾ തുറക്കുന്ന, എടുക്കുന്ന അല്ലെങ്കിൽ ഉണ്ടാക്കുന്ന ഫയലുകൾ ഉപകരണത്തിൽ തന്നെ തുടരും, ഫയൽസ് ആപ്പിലോ Zipbox ന്റെ സ്വന്തം ഇടത്തിലോ, നിങ്ങൾ മറ്റെവിടേക്കെങ്കിലും അയക്കാനോ പങ്കിടാനോ തിരഞ്ഞെടുക്കുന്നതുവരെ.","ആർക്കൈവ് തുറക്കാനോ എൻക്രിപ്റ്റ് ചെയ്യാനോ നിങ്ങൾ ടൈപ്പ് ചെയ്യുന്ന പാസ്‌വേഡ് ആ പ്രവൃത്തിക്കു മാത്രമാണ് ഉപയോഗിക്കുന്നത്. ജോലി നടക്കുന്നത്ര നേരം അത് മെമ്മറിയിൽ ഇരിക്കും, ഒരു ലോഗിലും എഴുതപ്പെടില്ല, എവിടേക്കും അയക്കപ്പെടില്ല.","Zipbox ക്യാമറ, മൈക്രോഫോൺ, കോൺടാക്റ്റുകൾ, സ്ഥാനം അല്ലെങ്കിൽ ആരോഗ്യ വിവരങ്ങൾ ഉപയോഗിക്കുന്നില്ല.","ഒന്നും നിങ്ങളുടെ ഉപകരണത്തിൽ നിന്ന് പുറത്തുപോകാത്തതിനാൽ, നിങ്ങൾക്കുവേണ്ടി തിരയാനോ അയക്കാനോ മായ്ക്കാനോ ഞങ്ങളുടെ പക്കൽ വ്യക്തിഗത വിവരങ്ങളില്ല. ആപ്പ് നീക്കിയാൽ Zipbox ന്റെ ഇടവും പോകും.","ഈ നയം മാറിയാൽ, പുതുക്കിയ പതിപ്പ് പുതിയ തീയതിയോടെ ഈ പേജിൽ പ്രസിദ്ധീകരിക്കും."],"secAppStore":"App Store","appStorePurchase":["Zipbox App Store-ലെ പണമടച്ചുള്ള ആപ്പാണ്. ഒരിക്കൽ വാങ്ങിയാൽ എല്ലാ സൗകര്യവും ലഭിക്കും; ഇൻ-ആപ്പ് വാങ്ങലോ സബ്സ്ക്രിപ്ഷനോ പരസ്യമോ ഇല്ല. 13 ഫോർമാറ്റും ഉപകരണത്തിൽ തന്നെ.","വാങ്ങൽ പൂർണമായും Apple, App Store വഴിയാണ് കൈകാര്യം ചെയ്യുന്നത്. Zipbox നിങ്ങളുടെ പേയ്‌മെന്റ് വിവരങ്ങൾ ഒരിക്കലും കാണുന്നില്ല, ഈ ഇടപാടിൽ നിന്ന് വ്യക്തിഗത വിവരങ്ങളൊന്നും ലഭിക്കുന്നുമില്ല.","Files provider-കളും സഹായ അല്ലെങ്കിൽ സ്വകാര്യതാ പേജുകളും iOS, Zipbox-ന് പുറത്താണ് തുറക്കുന്നത്. അവിടെ നെറ്റ്‌വർക്ക് ഉപയോഗിച്ചാൽ അത് തിരഞ്ഞെടുത്ത സിസ്റ്റം സേവനത്തിന്റേതാണ്, Zipbox-ന്റേതല്ല."],"pages":{"privacy":{"title":"Zipbox സ്വകാര്യതാ നയം","meta":"Zipbox വ്യക്തിഗത വിവരങ്ങൾ ശേഖരിക്കുന്നില്ല, നെറ്റ്‌വർക്ക് അഭ്യർഥന അയക്കുന്നില്ല, പരസ്യമോ വിശകലനമോ ഇല്ല.","badge":"സ്വകാര്യത","h1":"സ്വകാര്യതാ നയം","lead":"Zipbox ഒന്നും ശേഖരിക്കുന്നില്ല. അതിന്റെ കൃത്യമായ അർഥം ഇതാണ്."}}},"mr-IN":{"langName":"मराठी","langLabel":"भाषा","navHome":"मुख्यपृष्ठ","navSupport":"मदत","navPrivacy":"गोपनीयता","navTerms":"अटी","foot":"Zipbox पूर्णपणे तुमच्या उपकरणावर चालतो. खाते नाही, जाहिरात नाही, विश्लेषण नाही, अपलोड नाही.","updated":"शेवटचे अद्यतन","secContact":"संपर्क","contact":"आम्हाला कोणत्याही भाषेत लिहा. प्रत्येक संदेश माणूस वाचतो.","contactHint":"संग्रहाचे स्वरूप, iOS ची आवृत्ती आणि पडद्यावर दिसलेला संदेश सांगितल्यास खूप मदत होते. उत्तराची ठराविक वेळ आम्ही देत नाही.","secPrivacy":"गोपनीयता","priv":["Zipbox कोणतीही वैयक्तिक माहिती गोळा करत नाही. खाते नाही, साइन इन नाही आणि वापरकर्त्याचे प्रोफाइलही नाही.","Zipbox कोणतीही नेटवर्क विनंती पाठवत नाही. ॲपचा स्वतःचा सर्व्हर नाही, आणि तुमच्या संग्रह व काढलेल्या फाइली कुठेही अपलोड होत नाहीत.","Files provider तसेच मदत किंवा गोपनीयता पाने iOS कडून Zipboxच्या बाहेर उघडली जातात. तिथले नेटवर्क काम निवडलेल्या सिस्टम सेवेचे असते, Zipboxचे नाही.","आम्ही तिसऱ्या पक्षाच्या जाहिराती वापरत नाही. Zipbox कोणत्याही प्रकारची जाहिरात दाखवत नाही.","आम्ही तिसऱ्या
