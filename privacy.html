ੀਆਂ ਫਾਈਲਾਂ ਕਿਤੇ ਅਪਲੋਡ ਨਹੀਂ ਹੁੰਦੀਆਂ।","Files provider ਅਤੇ ਸਹਾਇਤਾ ਜਾਂ ਪਰਦੇਦਾਰੀ ਪੰਨੇ iOS ਵੱਲੋਂ Zipbox ਤੋਂ ਬਾਹਰ ਖੁੱਲ੍ਹਦੇ ਹਨ। ਉੱਥੇ ਨੈੱਟਵਰਕ ਵਰਤਿਆ ਜਾਵੇ ਤਾਂ ਉਹ ਚੁਣੀ ਸਿਸਟਮ ਸੇਵਾ ਦਾ ਹੈ, Zipbox ਦਾ ਨਹੀਂ।","ਅਸੀਂ ਤੀਜੀ ਧਿਰ ਦੇ ਇਸ਼ਤਿਹਾਰ ਨਹੀਂ ਵਰਤਦੇ। Zipbox ਕਿਸੇ ਵੀ ਤਰ੍ਹਾਂ ਦਾ ਇਸ਼ਤਿਹਾਰ ਨਹੀਂ ਵਿਖਾਉਂਦਾ।","ਅਸੀਂ ਤੀਜੀ ਧਿਰ ਦਾ ਵਿਸ਼ਲੇਸ਼ਣ, ਟਰੈਕਿੰਗ ਲਾਇਬ੍ਰੇਰੀ ਜਾਂ ਕਰੈਸ਼ ਰਿਪੋਰਟਿੰਗ ਸੇਵਾ ਨਹੀਂ ਵਰਤਦੇ, ਅਤੇ Zipbox ਇਸ਼ਤਿਹਾਰ ਪਛਾਣਕਰਤਾ ਨਹੀਂ ਮੰਗਦਾ।","ਜੋ ਫਾਈਲਾਂ ਤੁਸੀਂ ਖੋਲ੍ਹਦੇ, ਕੱਢਦੇ ਜਾਂ ਬਣਾਉਂਦੇ ਹੋ ਉਹ ਡਿਵਾਈਸ ਉੱਤੇ ਹੀ ਰਹਿੰਦੀਆਂ ਹਨ, ਫਾਈਲਾਂ ਐਪ ਵਿੱਚ ਜਾਂ Zipbox ਦੀ ਆਪਣੀ ਥਾਂ ਵਿੱਚ, ਜਦੋਂ ਤੱਕ ਤੁਸੀਂ ਕਿਤੇ ਹੋਰ ਨਾ ਭੇਜੋ ਜਾਂ ਸਾਂਝਾ ਨਾ ਕਰੋ।","ਆਰਕਾਈਵ ਖੋਲ੍ਹਣ ਜਾਂ ਏਨਕ੍ਰਿਪਟ ਕਰਨ ਲਈ ਲਿਖਿਆ ਪਾਸਵਰਡ ਸਿਰਫ਼ ਉਸੇ ਕੰਮ ਲਈ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ। ਕੰਮ ਦੌਰਾਨ ਉਹ ਯਾਦਦਾਸ਼ਤ ਵਿੱਚ ਰਹਿੰਦਾ ਹੈ ਅਤੇ ਕਦੇ ਕਿਸੇ ਲੌਗ ਵਿੱਚ ਨਹੀਂ ਲਿਖਿਆ ਜਾਂਦਾ ਜਾਂ ਕਿਤੇ ਭੇਜਿਆ ਨਹੀਂ ਜਾਂਦਾ।","Zipbox ਕੈਮਰਾ, ਮਾਈਕਰੋਫ਼ੋਨ, ਸੰਪਰਕ, ਟਿਕਾਣਾ ਜਾਂ ਸਿਹਤ ਡਾਟਾ ਨਹੀਂ ਵਰਤਦਾ।","ਕਿਉਂਕਿ ਕੁਝ ਵੀ ਤੁਹਾਡੇ ਡਿਵਾਈਸ ਤੋਂ ਬਾਹਰ ਨਹੀਂ ਜਾਂਦਾ, ਸਾਡੇ ਕੋਲ ਅਜਿਹੀ ਕੋਈ ਨਿੱਜੀ ਜਾਣਕਾਰੀ ਨਹੀਂ ਜੋ ਅਸੀਂ ਤੁਹਾਡੇ ਲਈ ਲੱਭੀਏ, ਤੁਹਾਨੂੰ ਭੇਜੀਏ ਜਾਂ ਮਿਟਾਈਏ। ਐਪ ਹਟਾਉਣ ਨਾਲ Zipbox ਦੀ ਥਾਂ ਵੀ ਹਟ ਜਾਂਦੀ ਹੈ।","ਜੇ ਇਹ ਨੀਤੀ ਬਦਲੀ ਤਾਂ ਸੋਧੀ ਆਵ੍ਰਿਤੀ ਨਵੀਂ ਤਾਰੀਖ਼ ਨਾਲ ਇਸੇ ਪੰਨੇ ਉੱਤੇ ਛਾਪੀ ਜਾਵੇਗੀ।"],"secAppStore":"App Store","appStorePurchase":["Zipbox App Store ਉੱਤੇ ਪੇਡ ਐਪ ਹੈ। ਇੱਕ ਵਾਰ ਖਰੀਦਣ ਨਾਲ ਸਾਰੇ ਫੀਚਰ ਮਿਲਦੇ ਹਨ; ਐਪ ਅੰਦਰ ਹੋਰ ਖਰੀਦ, ਸਬਸਕ੍ਰਿਪਸ਼ਨ ਜਾਂ ਇਸ਼ਤਿਹਾਰ ਨਹੀਂ। 13 ਫਾਰਮੈਟ ਡਿਵਾਈਸ ਉੱਤੇ ਹੀ ਚੱਲਦੇ ਹਨ।","ਖਰੀਦ ਪੂਰੀ ਤਰ੍ਹਾਂ Apple, App Store ਰਾਹੀਂ ਸੰਭਾਲਦਾ ਹੈ। Zipbox ਤੁਹਾਡੀ ਭੁਗਤਾਨ ਜਾਣਕਾਰੀ ਕਦੇ ਨਹੀਂ ਵੇਖਦਾ ਅਤੇ ਇਸ ਲੈਣ-ਦੇਣ ਤੋਂ ਕੋਈ ਨਿੱਜੀ ਜਾਣਕਾਰੀ ਨਹੀਂ ਲੈਂਦਾ।","Files provider ਅਤੇ ਸਹਾਇਤਾ ਜਾਂ ਪਰਦੇਦਾਰੀ ਪੰਨੇ iOS ਵੱਲੋਂ Zipbox ਤੋਂ ਬਾਹਰ ਖੁੱਲ੍ਹਦੇ ਹਨ। ਉੱਥੇ ਨੈੱਟਵਰਕ ਵਰਤਿਆ ਜਾਵੇ ਤਾਂ ਉਹ ਚੁਣੀ ਸਿਸਟਮ ਸੇਵਾ ਦਾ ਹੈ, Zipbox ਦਾ ਨਹੀਂ।"],"pages":{"privacy":{"title":"Zipbox ਨਿੱਜਤਾ ਨੀਤੀ","meta":"Zipbox ਨਿੱਜੀ ਜਾਣਕਾਰੀ ਇਕੱਠੀ ਨਹੀਂ ਕਰਦਾ, ਨੈੱਟਵਰਕ ਬੇਨਤੀ ਨਹੀਂ ਭੇਜਦਾ ਅਤੇ ਇਸ ਵਿੱਚ ਇਸ਼ਤਿਹਾਰ ਜਾਂ ਵਿਸ਼ਲੇਸ਼ਣ ਨਹੀਂ।","badge":"ਨਿੱਜਤਾ","h1":"ਨਿੱਜਤਾ ਨੀਤੀ","lead":"Zipbox ਕੁਝ ਵੀ ਇਕੱਠਾ ਨਹੀਂ ਕਰਦਾ। ਇਸ ਦਾ ਪੂਰਾ ਮਤਲਬ ਇਹ ਹੈ।"}}},"ro":{"langName":"Română","langLabel":"Limbă","navHome":"Acasă","navSupport":"Asistență","navPrivacy":"Confidențialitate","navTerms":"Termeni","foot":"Zipbox rulează în întregime pe dispozitivul tău. Fără cont, fără reclame, fără analiză, fără trimiteri.","updated":"Ultima actualizare","secContact":"Contact","contact":"Scrie-ne în orice limbă. Fiecare mesaj este citit de un om.","contactHint":"Formatul arhivei, versiunea de iOS și mesajul văzut pe ecran ajută foarte mult. Nu promitem un timp fix de răspuns.","secPrivacy":"Confidențialitate","priv":["Zipbox nu colectează date personale. Nu există cont, autentificare sau profil de utilizator.","Zipbox nu face cereri de rețea. Aplicația nu are server propriu, iar arhivele și fișierele extrase nu sunt trimise nicăieri.","Furnizorii din Fișiere și paginile de asistență sau confidențialitate sunt deschise de iOS în afara Zipbox. Orice conexiune aparține serviciului de sistem ales, nu Zipbox.","Nu folosim publicitate de la terți. Zipbox nu afișează niciun fel de reclamă.","Nu folosim analiză de la terți, biblioteci de urmărire sau servicii de raportare a erorilor, iar Zipbox nu solicită identificatorul de publicitate.","Fișierele pe care le deschizi, extragi sau creezi rămân pe dispozitiv, în aplicația Fișiere sau în spațiul propriu al Zipbox, dacă nu alegi să le exporți sau să le partajezi.","O parolă scrisă pentru a deschide sau a cripta o arhivă servește doar acelei operațiuni. Rămâne în memorie pe durata sarcinii și nu este niciodată scrisă într-un jurnal sau trimisă altundeva.","Zipbox nu folosește camera, microfonul, contactele, locația sau datele de sănătate.","Pentru că nimic nu părăsește dispozitivul tău, nu avem date personale pe care să le căutăm, exportăm sau ștergem pentru tine. Ștergerea aplicației elimină și spațiul de stocare al Zipbox.","Dacă această politică se schimbă, versiunea actualizată va fi publicată pe această pagină cu o dată nouă."],"secAppStore":"App Store","appStorePurchase":["Zipbox este o aplicație cu plată din App Store. O cumpărare include totul, fără achiziții în aplicație, abonamente ori reclame. Cele 13 formate sunt procesate local.","Achiziția este gestionată în întregime de Apple prin App Store. Zipbox nu vede niciodată datele tale de plată și nu primește informații personale din tranzacție.","Furnizorii din Fișiere și paginile de asistență sau confidențialitate sunt deschise de iOS în afara Zipbox. Orice conexiune aparține serviciului de sistem ales, nu Zipbox."],"pages":{"privacy":{"title":"Politica de confidențialitate Zipbox","meta":"Zipbox nu colectează date personale, nu face cereri de rețea și nu conține reclame sau analiză.","badge":"Confidențialitate","h1":"Politica de confidențialitate","lead":"Zipbox nu colectează nimic. Iată exact ce înseamnă asta."}}},"ru":{"langName":"Русский","langLabel":"Язык","navHome":"Главная","navSupport":"Поддержка","navPrivacy":"Конфиденциальность","navTerms":"Условия","foot":"Zipbox работает целиком на вашем устройстве. Без аккаунта, без рекламы, без аналитики, без отправки данных.","updated":"Последнее обновление","secContact":"Связаться","contact":"Пишите нам на любом языке. Каждое письмо читает человек.","contactHint":"Формат архива, версия iOS и текст сообщения на экране очень помогают. Фиксированного срока ответа мы не обещаем.","secPrivacy":"Конфиденциальность","priv":["Zipbox не собирает персональные данные. Нет ни аккаунта, ни входа, ни профиля пользователя.","Zipbox не делает сетевых запросов. У приложения нет собственного сервера, а ваши архивы и распакованные файлы никуда не отправляются.","Провайдеры приложения «Файлы» и страницы поддержки или конфиденциальности iOS открывает вне Zipbox. Возможная сеть относится к выбранной системной службе, а не к Zipbox.","Мы не используем стороннюю рекламу. Zipbox не показывает рекламу ни в каком виде.","Мы не используем стороннюю аналитику, библиотеки отслеживания и службы отчётов о сбоях, и Zipbox не запрашивает рекламный идентификатор.","Файлы, которые вы открываете, распаковываете или создаёте, остаются на устройстве, в приложении Файлы или в собственном хранилище Zipbox, пока вы сами не экспортируете или не отправите их.","Пароль, введённый для открытия или шифрования архива, используется только для этой операции. Он хранится в памяти на время задачи и никогда не записывается в журнал и не отправляется.","Zipbox не использует камеру, микрофон, контакты, геопозицию и данные о здоровье.","Поскольку с устройства ничего не уходит, у нас нет персональных данных, которые можно было бы найти, выгрузить или удалить по вашему запросу. Удаление приложения удаляет и хранилище Zipbox.","Если политика изменится, обновлённая версия будет опубликована на этой странице с новой датой."],"secAppStore":"App Store","appStorePurchase":["Zipbox: платное приложение из App Store. Одна покупка включает все функции: без встроенных покупок, подписок и рекламы. Все 13 форматов обрабатываются на устройстве.","Покупку полностью проводит Apple через App Store. Zipbox не видит ваши платёжные данные и не получает персональной информации из этой операции.","Провайдеры приложения «Файлы» и страницы поддержки или конфиденциальности iOS открывает вне Zipbox. Возможная сеть относится к выбранной системной службе, а не к Zipbox."],"pages":{"privacy":{"title":"Политика конфиденциальности Zipbox","meta":"Zipbox не собирает персональные данные, не делает сетевых запросов и не содержит рекламы и аналитики.","badge":"Конфиденциальность","h1":"Политика конфиденциальности","lead":"Zipbox не собирает ничего. Ниже точно указано, что это значит."}}},"sk":{"langName":"Slovenčina","langLabel":"Jazyk","navHome":"Úvod","navSupport":"Podpora","navPrivacy":"Súkromie","navTerms":"Podmienky","foot":"Zipbox beží celý vo vašom zariadení. Bez účtu, bez reklám, bez analytiky, nič sa neodosiela.","updated":"Naposledy aktualizované","secContact":"Kontakt","contact":"Napíšte nám v akomkoľvek jazyku. Každú správu číta človek.","contactHint":"Formát archívu, verzia iOS a hláška, ktorú ste videli na obrazovke, veľmi pomôžu. Pevný čas odpovede nesľubujeme.","secPrivacy":"Súkromie","priv":["Zipbox nezbiera osobné údaje. Nie je tu účet, prihlásenie ani používateľský profil.","Zipbox nerobí sieťové požiadavky. Aplikácia nemá vlastný server a vaše archívy ani rozbalené súbory sa nikam neodosielajú.","Poskytovateľov v Súboroch a stránky podpory či súkromia otvára iOS mimo Zipboxu. Prípadné pripojenie patrí zvolenej systémovej službe, nie Zipboxu.","Nepoužívame reklamu tretích strán. Zipbox nezobrazuje žiadnu reklamu.","Nepoužívame analytiku tretích strán, sledovacie knižnice ani hlásenie pádov a Zipbox si nevyžiada reklamný identifikátor.","Súbory, ktoré otvoríte, rozbalíte alebo vytvoríte, zostávajú v zariadení, v aplikácii Súbory alebo v úložisku samotného Zipboxu, pokiaľ sa ich nerozhodnete exportovať či zdieľať.","Heslo napísané na otvorenie alebo zašifrovanie archívu slúži len na túto operáciu. Zostáva v pamäti počas úlohy a nikdy sa nezapisuje do protokolu ani neodosiela.","Zipbox nepoužíva fotoaparát, mikrofón, kontakty, polohu ani zdravotné údaje.","Keďže nič neopúšťa vaše zariadenie, nemáme žiadne osobné údaje, ktoré by sme pre vás mohli dohľadať, exportovať alebo vymazať. Odstránením aplikácie zmizne aj úložisko Zipboxu.","Ak sa tieto zásady zmenia, aktualizovanú verziu zverejníme na tejto stránke s novým dátumom."],"secAppStore":"App Store","appStorePurchase":["Zipbox je platená aplikácia z App Storu. Jedna kúpa zahŕňa všetky funkcie, bez nákupov v aplikácii, predplatného a reklám. Všetkých 13 formátov sa spracuje v zariadení.","Nákup zabezpečuje celý Apple cez App Store. Zipbox nikdy nevidí vaše platobné údaje a z transakcie nedostáva žiadne osobné informácie.","Poskytovateľov v Súboroch a stránky podpory či súkromia otvára iOS mimo Zipboxu. Prípadné pripojenie patrí zvolenej systémovej službe, nie Zipboxu."],"pages":{"privacy":{"title":"Zásady ochrany súkromia Zipbox","meta":"Zipbox nezbiera osobné údaje, nerobí sieťové požiadavky a neobsahuje reklamy ani analytiku.","badge":"Súkromie","h1":"Zásady ochrany súkromia","lead":"Zipbox nezbiera nič. Tu je presne, čo to znamená."}}},"sl-SI":{"langName":"Slovenščina","langLabel":"Jezik","navHome":"Domov","navSupport":"Podpora","navPrivacy":"Zasebnost","navTerms":"Pogoji","foot":"Zipbox v celoti teče na tvoji napravi. Brez računa, brez oglasov, brez analitike, brez pošiljanja.","updated":"Zadnja posodobitev","secContact":"Stik","contact":"Piši nam v katerem koli jeziku. Vsako sporočilo prebere človek.","contactHint":"Oblika arhiva, različica iOS in sporočilo, ki si ga videl na zaslonu, zelo pomagajo. Fiksnega časa odgovora ne obljubljamo.","secPrivacy":"Zasebnost","priv":["Zipbox ne zbira osebnih podatkov. Ni računa, ni prijave in ni uporabniškega profila.","Zipbox ne pošilja omrežnih zahtev. Aplikacija nima svojega strežnika, tvoji arhivi in razpakirane datoteke pa nikoli ne gredo nikamor.","Ponudnike v aplikaciji Datoteke ter strani za podporo ali zasebnost odpre iOS zunaj Zipboxa. Morebitna povezava pripada izbrani sistemski storitvi, ne Zipboxu.","Ne uporabljamo oglasov tretjih oseb. Zipbox ne prikazuje nikakršnih oglasov.","Ne uporabljamo analitike tretjih oseb, sledilnih knjižnic ali storitev poročanja o sesutjih, Zipbox pa ne zahteva oglasnega identifikatorja.","Datoteke, ki jih odpreš, razpakiraš ali ustvariš, ostanejo na napravi, v aplikaciji Datoteke ali v Zipboxovi lastni shrambi, razen če jih izvoziš ali deliš.","Geslo, ki ga vpišeš za odpiranje ali šifriranje arhiva, se uporabi samo za to opravilo. Med opravilom ostane v pomnilniku in se nikoli ne zapiše v dnevnik ali pošlje drugam.","Zipbox ne uporablja kamere, mikrofona, stikov, lokacije ali zdravstvenih podatkov.","Ker nič ne zapusti tvoje naprave, pri nas ni osebnih podatkov, ki bi jih lahko poiskali, izvozili ali izbrisali namesto tebe. Z odstranitvijo aplikacije izgine tudi Zipboxova shramba.","Če se ta pravila spremenijo, bo posodobljena različica objavljena na tej strani z novim datumom."],"secAppStore":"App Store","appStorePurchase":["Zipbox je plačljiva aplikacija iz trgovine App Store. En nakup da vse funkcije, brez nakupov v aplikaciji, naročnin in oglasov. Zipbox vseh 13 formatov obdela lokalno.","Nakup v celoti izvede Apple prek trgovine App Store. Zipbox nikoli ne vidi tvojih plačilnih podatkov in iz transakcije ne prejme nobenih osebnih podatkov.","Ponudnike v aplikaciji Datoteke ter strani za podporo ali zasebnost odpre iOS zunaj Zipboxa. Morebitna povezava pripada izbrani sistemski storitvi, ne Zipboxu."],"pages":{"privacy":{"title":"Zipbox pravilnik o zasebnosti","meta":"Zipbox ne zbira osebnih podatkov, ne pošilja omrežnih zahtev in ne vsebuje oglasov ali analitike.","badge":"Zasebnost","h1":"Pravilnik o zasebnosti","lead":"Zipbox ne zbira ničesar. Tu je natančno, kaj to pomeni."}}},"es-MX":{"langName":"Español (Latinoamérica)","langLabel":"Idioma","navHome":"Inicio","navSupport":"Ayuda","navPrivacy":"Privacidad","navTerms":"Condiciones","foot":"Zipbox funciona por completo en tu dispositivo. Sin cuenta, sin anuncios, sin analítica y sin subir nada.","updated":"Última actualización","secContact":"Contacto","contact":"Escríbenos en el idioma que prefieras. Cada mensaje lo lee una persona.","contactHint":"Indicar el formato del comprimido, la versión de iOS y el mensaje que viste en pantalla ayuda mucho. No prometemos un plazo fijo de respuesta.","secPrivacy":"Privacidad","priv":["Zipbox no recopila datos personales. No hay cuenta, ni inicio de sesión, ni perfil de usuario.","Zipbox no hace peticiones de red. La aplicación no tiene servidor propio y tus comprimidos y archivos extraídos no se suben a ningún sitio.","Los proveedores de Archivos y las páginas de soporte o privacidad se abren con iOS fuera de Zipbox. Cualquier conexión pertenece al servicio del sistema elegido, no a Zipbox.","No usamos publicidad de terceros. Zipbox no muestra publicidad de ningún tipo.","No usamos analítica de terceros, bibliotecas de seguimiento ni servicios de informes de fallos, y Zipbox no solicita el identificador de publicidad.","Los archivos que abres, extraes o creas se quedan en el dispositivo, en la app Archivos o en el almacenamiento propio de Zipbox, salvo que decidas exportarlos o compartirlos.","Una contraseña escrita para abrir o cifrar un comprimido se usa solo en esa operación. Permanece en memoria mientras dura la tarea y nunca se registra ni se envía a ningún sitio.","Zipbox no usa la cámara, el micrófono, los contactos, la ubicación ni los datos de salud.","Como nada sale de tu dispositivo, no tenemos datos personales que podamos consultar, exportar o borrar por ti. Al eliminar la app se elimina también el almacenamiento de Zipbox.","Si esta política cambia, la versión actualizada se publicará en esta página con una fecha nueva."],"secAppStore":"App Store","appStorePurchase":["Zipbox es una app de pago en App Store. Una compra incluye todo, sin compras dentro de la app, suscripciones ni anuncios. Los 13 formatos se procesan en tu celular.","La compra la gestiona por completo Apple a través del App Store. Zipbox nunca ve tus datos de pago y no recibe ninguna información personal de la transacción.","Los proveedores de Archivos y las páginas de soporte o privacidad se abren con iOS fuera de Zipbox. Cualquier conexión pertenece al servicio del sistema elegido, no a Zipbox."],"pages":{"privacy":{"title":"Política de privacidad de Zipbox","meta":"Zipbox no recopila datos personales, no hace peticiones de red y no contiene anuncios ni analítica.","badge":"Privacidad","h1":"Política de privacidad","lead":"Zipbox no recopila nada. Aquí está exactamente lo que eso significa."}}},"es-ES":{"langName":"Español (España)","langLabel":"Idioma","navHome":"Inicio","navSupport":"Ayuda","navPrivacy":"Privacidad","navTerms":"Condiciones","foot":"Zipbox funciona por completo en tu dispositivo. Sin cuenta, sin anuncios, sin analítica y sin subir nada.","updated":"Última actualización","secContact":"Contacto","contact":"Escríbenos en el idioma que prefieras. Cada mensaje lo lee una persona.","contactHint":"Indicar el formato del comprimido, la versión de iOS y el mensaje que viste en pantalla ayuda mucho. No prometemos un plazo fijo de respuesta.","secPrivacy":"Privacidad","priv":["Zipbox no recopila datos personales. No hay cuenta, ni inicio de sesión, ni perfil de usuario.","Zipbox no hace peticiones de red. La aplicación no tiene servidor propio y tus comprimidos y archivos extraídos no se suben a ningún sitio.","Los proveedores de Archivos y las páginas de soporte o privacidad se abren mediante iOS fuera de Zipbox. Cualquier conexión pertenece al servicio del sistema elegido, no a Zipbox.","No usamos publicidad de terceros. Zipbox no muestra publicidad de ningún tipo.","No usamos analítica de terceros, bibliotecas de seguimiento ni servicios de informes de fallos, y Zipbox no solicita el identificador de publicidad.","Los archivos que abres, extraes o creas se quedan en el dispositivo, en la app Archivos o en el almacenamiento propio de Zipbox, salvo que decidas exportarlos o compartirlos.","Una contraseña escrita para abrir o cifrar un comprimido se usa solo en esa operación. Permanece en memoria mientras dura la tarea y nunca se registra ni se envía a ningún sitio.","Zipbox no usa la cámara, el micrófono, los contactos, la ubicación ni los datos de salud.","Como nada sale de tu dispositivo, no tenemos datos personales que podamos consultar, exportar o borrar por ti. Al eliminar la app se elimina también el almacenamiento de Zipbox.","Si esta política cambia, la versión actualizada se publicará en esta página con una fecha nueva."],"secAppStore":"App Store","appStorePurchase":["Zipbox es una app de pago en App Store. Una compra incluye todo, sin compras dentro de la app, suscripciones ni anuncios. Los 13 formatos se procesan en el móvil.","La compra la gestiona por completo Apple a través del App Store. Zipbox nunca ve tus datos de pago y no recibe ninguna información personal de la transacción.","Los proveedores de Archivos y las páginas de soporte o privacidad se abren mediante iOS fuera de Zipbox. Cualquier conexión pertenece al servicio del sistema elegido, no a Zipbox."],"pages":{"privacy":{"title":"Política de privacidad de Zipbox","meta":"Zipbox no recopila datos personales, no hace peticiones de red y no contiene anuncios ni analítica.","badge":"Privacidad","h1":"Política de privacidad","lead":"Zipbox no recopila nada. Aquí está exactamente lo que eso significa."}}},"sv":{"langName":"Svenska","langLabel":"Språk","navHome":"Start","navSupport":"Support","navPrivacy":"Integritet","navTerms":"Villkor","foot":"Zipbox körs helt i din enhet. Inget konto, ingen reklam, ingen analys, inget skickas iväg.","updated":"Senast uppdaterad","secContact":"Kontakt","contact":"Skriv till oss på vilket språk du vill. Varje meddelande läses av en människa.","contactHint":"Arkivets format, din iOS version och meddelandet du såg på skärmen hjälper mycket. Vi lovar ingen fast svarstid.","secPrivacy":"Integritet","priv":["Zipbox samlar inte in personuppgifter. Det finns inget konto, ingen inloggning och ingen användarprofil.","Zipbox gör inga nätverksanrop. Appen har ingen egen server, och dina arkiv och uppackade filer skickas aldrig någonstans.","Leverantörer i Filer och support- eller integritetssidor öppnas av iOS utanför Zipbox. Eventuell nätverkstrafik tillhör den valda systemtjänsten, inte Zipbox.","Vi använder ingen reklam från tredje part. Zipbox visar ingen reklam alls.","Vi använder ingen analys från tredje part, inga spårningsbibliotek och inga kraschrapporteringstjänster, och Zipbox begär inte annonsidentifieraren.","Filer du öppnar, packar upp eller skapar stannar i enheten, i appen Filer eller i Zipbox eget utrymme, om du inte väljer att exportera eller dela dem.","Ett lösenord du skriver för att öppna eller kryptera ett arkiv används bara för den åtgärden. Det ligger i minnet under arbetet och skrivs aldrig till en logg eller skickas vidare.","Zipbox använder inte kamera, mikrofon, kontakter, plats eller hälsodata.","Eftersom ingenting lämnar din enhet finns det inga personuppgifter hos oss att slå upp, exportera eller radera åt dig. Tar du bort appen försvinner även Zipbox utrymme.","Om denna policy ändras publiceras den uppdaterade versionen på den här sidan med ett nytt datum."],"secAppStore":"App Store","appStorePurchase":["Zipbox är en betalapp i App Store. Ett köp ger alla funktioner, utan köp i appen, abonnemang eller reklam. Alla 13 format behandlas på enheten.","Köpet hanteras helt av Apple via App Store. Zipbox ser aldrig dina betaluppgifter och får inga personuppgifter från transaktionen.","Leverantörer i Filer och support- eller integritetssidor öppnas av iOS utanför Zipbox. Eventuell nätverkstrafik tillhör den valda systemtjänsten, inte Zipbox."],"pages":{"privacy":{"title":"Zipbox integritetspolicy","meta":"Zipbox samlar inte in personuppgifter, gör inga nätverksanrop och innehåller varken reklam eller analysbibliotek.","badge":"Integritet","h1":"Integritetspolicy","lead":"Zipbox samlar inte in något. Här står exakt vad det betyder."}}},"ta-IN":{"langName":"தமிழ்","langLabel":"மொழி","navHome":"முகப்பு","navSupport":"உதவி","navPrivacy":"தனியுரிமை","navTerms":"விதிமுறைகள்","foot":"Zipbox முழுவதும் உங்கள் சாதனத்தில் இயங்குகிறது. கணக்கு இல்லை, விளம்பரம் இல்லை, பகுப்பாய்வு இல்லை, பதிவேற்றம் இல்லை.","updated":"கடைசியாக புதுப்பிக்கப்பட்டது","secContact":"தொடர்பு","contact":"எந்த மொழியிலும் எங்களுக்கு எழுதுங்கள். ஒவ்வொரு செய்தியையும் ஒரு மனிதர் படிக்கிறார்.","contactHint":"காப்பகத்தின் வடிவம், iOS பதிப்பு, திரையில் தெரிந்த செய்தி ஆகியவற்றைச் சொன்னால் பெரிதும் உதவும். பதிலுக்கு நிலையான கால அளவு உறுதி அளிக்கவில்லை.","secPrivacy":"தனியுரிமை","priv":["Zipbox தனிப்பட்ட தரவைச் சேகரிப்பதில்லை. கணக்கு இல்லை, உள்நுழைவு இல்லை, பயனர் சுயவிவரமும் இல்லை.","Zipbox எந்த நெட்வொர்க் கோரிக்கையையும் அனுப்புவதில்லை. செயலிக்குச் சொந்த சேவையகம் இல்லை, உங்கள் காப்பகங்களும் பிரித்தெடுத்த கோப்புகளும் எங்கும் பதிவேற்றப்படுவதில்லை.","Files provider-களையும் உதவி அல்லது தனியுரிமைப் பக்கங்களையும் iOS, Zipbox-க்கு வெளியே திறக்கும். அங்கு இணையம் பயன்படுத்தப்பட்டால் அது தேர்ந்தெடுத்த system service-இன் செயல்; Zipbox-இன் செயல் அல்ல.","மூன்றாம் தரப்பு விளம்பரங்களைப் பயன்படுத்துவதில்லை. Zipbox எந்த வகை விளம்பரத்தையும் காட்டுவதில்லை.","மூன்றாம் தரப்பு பகுப்பாய்வு, கண்காணிப்பு நூலகங்கள், செயலிழப்பு அறிக்கை சேவைகள் எதையும் பயன்படுத்துவதில்லை, Zipbox விளம்பர அடையாளங்காட்டியையும் கோருவதில்லை.","நீங்கள் திறக்கும், பிரித்தெடுக்கும், உருவாக்கும் கோப்புகள் சாதனத்திலேயே இருக்கும், கோப்புகள் செயலியில் அல்லது Zipbox இன் சொந்த இடத்தில், நீங்களே வேறு இடத்திற்கு அனுப்பவோ பகிரவோ தேர்ந்தெடுக்கும் வரை.","காப்பகத்தைத் திறக்கவோ மறையாக்கவோ நீங்கள் தட்டச்சு செய்யும் கடவுச்சொல் அந்தச் செயலுக்கு மட்டுமே பயன்படும். பணி நடக்கும் வரை நினைவகத்தில் இருக்கும், எந்தப் பதிவேட்டிலும் எழுதப்படுவதில்லை, எங்கும் அனுப்பப்படுவதும் இல்லை.","Zipbox கேமரா, ஒலிவாங்கி, தொடர்புகள், இருப்பிடம், உடல்நல தரவு எதையும் பயன்படுத்துவதில்லை.","எதுவும் உங்கள் சாதனத்தை விட்டு வெளியேறாததால், உங்களுக்காகத் தேட, அனுப்ப அல்லது நீக்க எங்களிடம் தனிப்பட்ட தரவே இல்லை. செயலியை நீக்கினால் Zipbox இன் சேமிப்பிடமும் நீங்கும்.","இக்கொள்கை மாறினால், புதிய தேதியுடன் திருத்தப்பட்ட பதிப்பு இதே பக்கத்தில் வெளியிடப்படும்."],"secAppStore":"App Store","appStorePurchase":["Zipbox App Store-இல் கட்டண app. ஒரே வாங்குதலில் எல்லா அம்சங்களும் கிடைக்கும்; in-app வாங்குதல், சந்தா, விளம்பரம் இல்லை. 13 வடிவங்களும் சாதனத்திலேயே செயலாக்கப்படும்.","கொள்முதலை முழுவதுமாக Apple, App Store வழியாகக் கையாளுகிறது. Zipbox உங்கள் கட்டணத் தகவலைப் பார்ப்பதே இல்லை, இந்தப் பரிவர்த்தனையிலிருந்து தனிப்பட்ட தகவல் எதையும் பெறுவதும் இல்லை.","Files provider-களையும் உதவி அல்லது தனியுரிமைப் பக்கங்களையும் iOS, Zipbox-க்கு வெளியே திறக்கும். அங்கு இணையம் பயன்படுத்தப்பட்டால் அது தேர்ந்தெடுத்த system service-இன் செயல்; Zipbox-இன் செயல் அல்ல."],"pages":{"privacy":{"title":"Zipbox தனியுரிமைக் கொள்கை","meta":"Zipbox தனிப்பட்ட தரவைச் சேகரிப்பதில்லை, நெட்வொர்க் கோரிக்கை அனுப்புவதில்லை, விளம்பரமோ பகுப்பாய்வோ இல்லை.","badge":"தனியுரிமை","h1":"தனியுரிமைக் கொள்கை","lead":"Zipbox எதையும் சேகரிப்பதில்லை. அதன் சரியான பொருள் இதோ."}}},"te-IN":{"langName":"తెలుగు","langLabel":"భాష","navHome":"హోమ్","navSupport":"సహాయం","navPrivacy":"గోప్యత","navTerms":"నిబంధనలు","foot":"Zipbox పూర్తిగా మీ పరికరంలోనే నడుస్తుంది. ఖాతా లేదు, ప్రకటనలు లేవు, విశ్లేషణ లేదు, అప్‌లోడ్ లేదు.","updated":"చివరిసారి నవీకరించినది","secContact":"సంప్రదింపు","contact":"ఏ భాషలోనైనా మాకు రాయండి. ప్రతి సందేశాన్నీ ఒక మనిషి చదువుతారు.","contactHint":"ఆర్కైవ్ ఫార్మాట్, iOS వెర్షన్, తెరపై కనిపించిన సందేశం చెబితే చాలా ఉపయోగపడుతుంది. స్పందనకు నిర్ణీత సమయాన్ని మేము హామీ ఇవ్వము.","secPrivacy":"గోప్యత","priv":["Zipbox వ్యక్తిగత సమాచారాన్ని సేకరించదు. ఖాతా లేదు, సైన్ ఇన్ లేదు, వినియోగదారు ప్రొఫైల్ కూడా లేదు.","Zipbox ఏ నెట్‌వర్క్ అభ్యర్థనా పంపదు. యాప్‌కు సొంత సర్వర్ లేదు, మీ ఆర్కైవ్‌లు, తీసిన ఫైళ్లు ఎక్కడికీ అప్‌లోడ్ కావు.","Files providerలు, సహాయం లేదా గోప్యత పేజీలను iOS, Zipbox బయట తెరుస్తుంది. అక్కడ నెట్‌వర్క్ వాడితే అది మీరు ఎంచుకున్న సిస్టమ్ సేవది; Zipboxది కాదు.","మేము మూడో పక్షం ప్రకటనలను వాడము. Zipbox ఎలాంటి ప్రకటననూ చూపదు.","మేము మూడో పక్షం విశ్లేషణ, ట్రాకింగ్ లైబ్రరీలు లేదా క్రాష్ నివేదన సేవలను వాడము, Zipbox ప్రకటన గుర్తింపును అడగదు.","మీరు తెరిచే, తీసే లేదా తయారు చేసే ఫైళ్లు పరికరంలోనే ఉంటాయి, ఫైల్స్ యాప్‌లో లేదా Zipbox సొంత నిల్వలో, మీరు వేరే చోటికి పంపాలని లేదా పంచుకోవాలని ఎంచుకోనంత వరకు.","ఆర్కైవ్ తెరవడానికి లేదా ఎన్‌క్రిప్ట్ చేయడానికి మీరు టైప్ చేసే పాస్‌వర్డ్ ఆ పనికి మాత్రమే వాడతారు. పని జరిగినంతసేపు అది మెమరీలో ఉంటుంది, ఏ లాగ్‌లోనూ రాయబడదు, ఎక్కడికీ పంపబడదు.","Zipbox కెమెరా, మైక్రోఫోన్, పరిచయాలు, స్థానం లేదా ఆరోగ్య సమాచారాన్ని వాడదు.","ఏదీ మీ పరికరం దాటి బయటకు వెళ్లదు కాబట్టి, మీ తరఫున వెతకడానికి, పంపడానికి లేదా తొలగించడానికి మా వద్ద వ్యక్తిగత సమాచారమే లేదు. యాప్ తీసేస్తే Zipbox నిల్వ కూడా పోతుంది.","ఈ విధానం మారితే, సవరించిన సంస్కరణ కొత్త తేదీతో ఇదే పేజీలో ప్రచురిస్తాము."],"secAppStore":"App Store","appStorePurchase":["Zipbox App Storeలో చెల్లింపు app. ఒక్క కొనుగోలుతో అన్ని ఫీచర్లు లభిస్తాయి; appలో మరో కొనుగోలు, సబ్‌స్క్రిప్షన్ లేదా ప్రకటనలు లేవు. 13 ఫార్మాట్లు పరికరంలోనే పనిచేస్తాయి.","కొనుగోలును పూర్తిగా Apple, App Store ద్వారా నిర్వహిస్తుంది. Zipbox మీ చెల్లింపు వివరాలను ఎప్పుడూ చూడదు, ఈ లావాదేవీ నుంచి ఎలాంటి వ్యక్తిగత సమాచారమూ పొందదు.","Files providerలు, సహాయం లేదా గోప్యత పేజీలను iOS, Zipbox బయట తెరుస్తుంది. అక్కడ నెట్‌వర్క్ వాడితే అది మీరు ఎంచుకున్న సిస్టమ్ సేవది; Zipboxది కాదు."],"pages":{"privacy":{"title":"Zipbox గోప్యతా విధానం","meta":"Zipbox వ్యక్తిగత సమాచారాన్ని సేకరించదు, నెట్‌వర్క్ అభ్యర్థనలు పంపదు, ప్రకటనలు లేదా విశ్లేషణ లేవు.","badge":"గోప్యత","h1":"గోప్యతా విధానం","lead":"Zipbox ఏదీ సేకరించదు. దాని ఖచ్చితమైన అర్థం ఇదే."}}},"th":{"langName":"ไทย","langLabel":"ภาษา","navHome":"หน้าแรก","navSupport":"ความช่วยเหลือ","navPrivacy":"ความเป็นส่วนตัว","navTerms":"ข้อกำหนด","foot":"Zipbox ทำงานบนเครื่องของคุณทั้งหมด ไม่มีบัญชี ไม่มีโฆษณา ไม่มีการวิเคราะห์ ไม่มีการอัปโหลด","updated":"อัปเดตล่าสุด","secContact":"ติดต่อเรา","contact":"เขียนมาหาเราด้วยภาษาใดก็ได้ ทุกข้อความมีคนอ่านจริง","contactHint":"ถ้าบอกรูปแบบไฟล์ เวอร์ชัน iOS และข้อความที่เห็นบนหน้าจอมาด้วย จะช่วยได้มาก เราไม่รับปากเวลาตอบกลับที่แน่นอน","secPrivacy":"ความเป็นส่วนตัว","priv":["Zipbox ไม่เก็บข้อมูลส่วนบุคคล ไม่มีบัญชี ไม่ต้องลงชื่อเข้าใช้ และไม่มีโปรไฟล์ผู้ใช้","Zipbox ไม่ส่งคำขอผ่านเครือข่าย แอปไม่มีเซิร์ฟเวอร์ของตัวเอง และไฟล์บีบอัดกับไฟล์ที่แตกออกมาจะไม่ถูกอัปโหลดไปที่ใด","ผู้ให้บริการในแอปไฟล์และหน้าช่วยเหลือหรือความเป็นส่วนตัวเปิดผ่าน iOS ภายนอก Zipbox หากมีการใช้เครือข่าย จะเป็นของบริการระบบที่คุณเลือก ไม่ใช่ Zipbox","เราไม่ใช้โฆษณาจากบุคคลที่สาม Zipbox ไม่แสดงโฆษณาในรูปแบบใดทั้งสิ้น","เราไม่ใช้บริการวิเคราะห์ ไลบรารีติดตาม หรือบริการรายงานข้อขัดข้องจากบุคคลที่สาม และ Zipbox ไม่ร้องขอตัวระบุสำหรับโฆษณา","ไฟล์ที่คุณเปิด แตก หรือสร้างขึ้น จะอยู่บนเครื่องของคุณ ในแอปไฟล์หรือในพื้นที่จัดเก็บของ Zipbox เอง เว้นแต่คุณจะเลือกส่งออกหรือแชร์","รหัสผ่านที่คุณพิมพ์เพื่อเปิดหรือเข้ารหัสไฟล์บีบอัดจะใช้เฉพาะการทำงานครั้งนั้น อยู่ในหน่วยความจำระหว่างทำงานเท่านั้น ไม่ถูกบันทึกลงล็อกและไม่ถูกส่งไปที่ใด","Zipbox ไม่ใช้กล้อง ไมโครโฟน รายชื่อผู้ติดต่อ ตำแหน่งที่ตั้ง หรือข้อมูลสุขภาพ","เพราะไม่มีอะไรออกจากเครื่องของคุณ เราจึงไม่มีข้อมูลส่วนบุคคลให้ค้นหา ส่งออก หรือลบแทนคุณ การลบแอปจะลบพื้นที่จัดเก็บของ Zipbox ออกจากเครื่องด้วย","หากนโยบายนี้เปลี่ยนแปลง เราจะเผยแพร่ฉบับปรับปรุงพร้อมวันที่ใหม่บนหน้านี้"],"secAppStore":"App Store","appStorePurchase":["Zipbox เป็นแอปแบบชำระเงินบน App Store ซื้อครั้งเดียวได้ทุกฟีเจอร์ ไม่มีการซื้อในแอป การสมัครสมาชิก หรือโฆษณา รองรับ 13 รูปแบบและประมวลผลบนเครื่องเท่านั้น","การชำระเงินดำเนินการโดย Apple ผ่าน App Store ทั้งหมด Zipbox ไม่เห็นข้อมูลการชำระเงินของคุณ และไม่ได้รับข้อมูลส่วนบุคคลใดจากธุรกรรมนี้","ผู้ให้บริการในแอปไฟล์และหน้าช่วยเหลือหรือความเป็นส่วนตัวเปิดผ่าน iOS ภายนอก Zipbox หากมีการใช้เครือข่าย จะเป็นของบริการระบบที่คุณเลือก ไม่ใช่ Zipbox"],"pages":{"privacy":{"title":"นโยบายความเป็นส่วนตัวของ Zipbox","meta":"Zipbox ไม่เก็บข้อมูลส่วนบุคคล ไม่ส่งคำขอผ่านเครือข่าย และไม่มีโฆษณาหรือการวิเคราะห์","badge":"ความเป็นส่วนตัว","h1":"นโยบายความเป็นส่วนตัว","lead":"Zipbox ไม่เก็บอะไรเลย ด้านล่างคือความหมายที่แท้จริงของประโยคนี้"}}},"tr":{"langName":"Türkçe","langLabel":"Dil","navHome":"Ana sayfa","navSupport":"Destek","navPrivacy":"Gizlilik","navTerms":"Koşullar","foot":"Zipbox tümüyle kendi cihazında çalışır. Hesap yok, reklam yok, analiz yok, yükleme yok.","updated":"Son güncelleme","secContact":"İletişim","contact":"Bize istediğin dilde yaz. Her mesajı bir insan okuyor.","contactHint":"Arşiv biçimi, iOS sürümü ve ekranda gördüğün mesaj çok yardımcı olur. Sabit bir yanıt süresi vaat etmiyoruz.","secPrivacy":"Gizlilik","priv":["Zipbox kişisel veri toplamaz. Hesap, giriş ve kullanıcı profili yoktur.","Zipbox ağ isteği göndermez. Uygulamanın kendi sunucusu yoktur; arşivlerin ve çıkardığın dosyalar hiçbir yere yüklenmez.","Dosyalar sağlayıcıları ile destek veya gizlilik sayfalarını iOS, Zipbox dışında açar. Buradaki ağ etkinliği seçtiğiniz sistem hizmetine aittir, Zipbox'a değil.","Üçüncü taraf reklam kullanmıyoruz. Zipbox hiçbir türde reklam göstermez.","Üçüncü taraf analiz, izleme kitaplığı veya çökme raporlama hizmeti kullanmıyoruz ve Zipbox reklam tanımlayıcısını istemez.","Açtığın, çıkardığın veya oluşturduğun dosyalar, dışa aktarmayı ya da paylaşmayı seçmediğin sürece cihazında, Dosyalar uygulamasında veya Zipbox'ın kendi deposunda kalır.","Bir arşivi açmak veya şifrelemek için yazdığın parola yalnızca o işlem için kullanılır. İşlem boyunca bellekte tutulur, hiçbir günlüğe yazılmaz ve hiçbir yere gönderilmez.","Zipbox kamerayı, mikrofonu, kişileri, konumu veya sağlık verilerini kullanmaz.","Cihazından hiçbir şey çıkmadığı için bizde senin adına arayacağımız, dışa aktaracağımız veya sileceğimiz kişisel veri de yoktur. Uygulamayı silmek Zipbox'ın deposunu da kaldırır.","Bu politika değişirse güncel sürüm yeni bir tarihle bu sayfada yayımlanır."],"secAppStore":"App Store","appStorePurchase":["Zipbox, App Store'da ücretli bir uygulamadır. Tek satın alımla tüm özellikler gelir; uygulama içi satın alma, abonelik veya reklam yoktur. 13 biçim cihazda işlenir.","Satın alma işlemini tümüyle Apple, App Store üzerinden yürütür. Zipbox ödeme bilgilerini görmez ve bu işlemden kişisel bilgi almaz.","Dosyalar sağlayıcıları ile destek veya gizlilik sayfalarını iOS, Zipbox dışında açar. Buradaki ağ etkinliği seçtiğiniz sistem hizmetine aittir, Zipbox'a değil."],"pages":{"privacy":{"title":"Zipbox Gizlilik Politikası","meta":"Zipbox kişisel veri toplamaz, ağ isteği göndermez ve reklam ya da analiz kitaplığı içermez.","badge":"Gizlilik","h1":"Gizlilik Politikası","lead":"Zipbox hiçbir şey toplamaz. Bunun tam olarak ne anlama geldiği burada."}}},"uk":{"langName":"Українська","langLabel":"Мова","navHome":"Головна","navSupport":"Підтримка","navPrivacy":"Конфіденційність","navTerms":"Умови","foot":"Zipbox працює повністю на вашому пристрої. Без облікового запису, без реклами, без аналітики, без надсилання даних.","updated":"Останнє оновлення","secContact":"Зв'язатися","contact":"Пишіть нам будь-якою мовою. Кожен лист читає людина.","contactHint":"Формат архіву, версія iOS і текст повідомлення на екрані дуже допомагають. Фіксованого терміну відповіді ми не обіцяємо.","secPrivacy":"Конфіденційність","priv":["Zipbox не збирає персональних даних. Немає ні облікового запису, ні входу, ні профілю користувача.","Zipbox не робить мережевих запитів. Програма не має власного сервера, а ваші архіви та розпаковані файли нікуди не надсилаються.","Провайдери програми «Файли» та сторінки підтримки чи конфіденційності iOS відкриває поза Zipbox. Можлива мережа належить вибраній системній службі, а не Zipbox.","Ми не використовуємо сторонньої реклами. Zipbox не показує реклами в жодному вигляді.","Ми не використовуємо сторонньої аналітики, бібліотек відстеження й служб звітів про збої, і Zipbox не запитує рекламний ідентифікатор.","Файли, які ви відкриваєте, розпаковуєте або створюєте, лишаються на пристрої, у програмі Файли чи у власному сховищі Zipbox, доки ви самі не експортуєте чи не поширите їх.","Пароль, введений для відкриття або шифрування архіву, використовується лише для цієї дії. Він зберігається в пам'яті на час завдання і ніколи не записується в журнал і не надсилається.","Zipbox не використовує камеру, мікрофон, контакти, геопозицію та дані про здоров'я.","Оскільки з пристрою нічого не виходить, у нас немає персональних даних, які можна було б знайти, вивантажити чи видалити на ваш запит. Видалення програми видаляє і сховище Zipbox.","Якщо ця політика зміниться, оновлену версію буде опубліковано на цій сторінці з новою датою."],"secAppStore":"App Store","appStorePurchase":["Zipbox: платна програма з App Store. Одна покупка включає всі функції: без вбудованих покупок, підписок і реклами. Усі 13 форматів обробляються на пристрої.","Покупку повністю проводить Apple через App Store. Zipbox не бачить ваших платіжних даних і не отримує персональної інформації з цієї операції.","Провайдери програми «Файли» та сторінки підтримки чи конфіденційності iOS відкриває поза Zipbox. Можлива мережа належить вибраній системній службі, а не Zipbox."],"pages":{"privacy":{"title":"Політика конфіденційності Zipbox","meta":"Zipbox не збирає персональних даних, не робить мережевих запитів і не містить реклами та аналітики.","badge":"Конфіденційність","h1":"Політика конфіденційності","lead":"Zipbox не збирає нічого. Нижче точно вказано, що це означає."}}},"ur-PK":{"langName":"اردو","langLabel":"زبان","navHome":"صفحۂ اول","navSupport":"مدد","navPrivacy":"رازداری","navTerms":"شرائط","foot":"Zipbox مکمل طور پر آپ کے آلے پر چلتا ہے۔ کوئی اکاؤنٹ نہیں، کوئی اشتہار نہیں، کوئی تجزیہ نہیں، کوئی اپ لوڈ نہیں۔","updated":"آخری تازہ کاری","secContact":"رابطہ","contact":"ہمیں کسی بھی زبان میں لکھیں۔ ہر پیغام ایک انسان پڑھتا ہے۔","contactHint":"آرکائیو کا فارمیٹ، iOS کا ورژن اور اسکرین پر نظر آنے والا پیغام بتانا بہت مددگار ہوتا ہے۔ ہم جواب کے لیے کوئی مقررہ وقت نہیں دیتے۔","secPrivacy":"رازداری","priv":["Zipbox ذاتی معلومات جمع نہیں کرتا۔ نہ کوئی اکاؤنٹ ہے، نہ لاگ اِن اور نہ صارف کا کوئی پروفائل۔","Zipbox کوئی نیٹ ورک درخواست نہیں بھیجتا۔ ایپ کا اپنا کوئی سرور نہیں، اور آپ کے آرکائیو اور نکالی گئی فائلیں کہیں اپ لوڈ نہیں ہوتیں۔","فائلز کے فراہم کنندگان اور معاونت یا رازداری کے صفحات iOS، Zipbox سے باہر کھولتا ہے۔ وہاں نیٹ ورک استعمال ہو تو وہ منتخب نظامی خدمت کا ہے، Zipbox کا نہیں۔","ہم کسی تیسرے فریق کے اشتہارات استعمال نہیں کرتے۔ Zipbox کسی بھی قسم کا اشتہار نہیں دکھاتا۔","ہم کسی تیسرے فریق کے تجزیاتی اوزار، ٹریکنگ لائبریریاں یا کریش رپورٹنگ کی خدمات استعمال نہیں کرتے، اور Zipbox اشتہاری شناخت کنندہ نہیں مانگتا۔","جو فائلیں آپ کھولتے، نکالتے یا بناتے ہیں وہ آلے پر ہی رہتی ہیں، فائلز ایپ میں یا Zipbox کی اپنی جگہ میں، جب تک آپ انہیں کہیں اور بھیجنے یا شیئر کرنے کا انتخاب نہ کریں۔","آرکائیو کھولنے یا خفیہ کرنے کے لیے لکھا گیا پاس ورڈ صرف اسی کام کے لیے استعمال ہوتا ہے۔ وہ کام کے دوران میموری میں رہتا ہے اور کبھی کسی لاگ میں نہیں لکھا جاتا اور نہ کہیں بھیجا جاتا ہے۔","Zipbox کیمرہ، مائیکروفون، رابطے، مقام یا صحت کا ڈیٹا استعمال نہیں کرتا۔","چونکہ کچھ بھی آپ کے آلے سے باہر نہیں جاتا، اس لیے ہمارے پاس ایسی کوئی ذاتی معلومات نہیں جو ہم آپ کے لیے تلاش کریں، آپ کو بھیجیں یا حذف کریں۔ ایپ ہٹانے سے Zipbox کی جگہ بھی ہٹ جاتی ہے۔","اگر یہ پالیسی بدلی تو نظرثانی شدہ نسخہ نئی تاریخ کے ساتھ اسی صفحے پر شائع کیا جائے گا۔"],"secAppStore":"App Store","appStorePurchase":["Zipbox، App Store کی بامعاوضہ ایپ ہے۔ ایک خریداری میں تمام خصوصیات شامل ہیں؛ ایپ کے اندر مزید خریداری، سبسکرپشن یا اشتہار نہیں۔ تمام 13 فارمیٹ آلے پر ہی پروسیس ہوتے ہیں۔","خریداری مکمل طور پر Apple ایپ اسٹور کے ذریعے کرتا ہے۔ Zipbox آپ کی ادائیگی کی تفصیلات کبھی نہیں دیکھتا اور اس لین دین سے کوئی ذاتی معلومات وصول نہیں کرتا۔","فائلز کے فراہم کنندگان اور معاونت یا رازداری کے صفحات iOS، Zipbox سے باہر کھولتا ہے۔ وہاں نیٹ ورک استعمال ہو تو وہ منتخب نظامی خدمت کا ہے، Zipbox کا نہیں۔"],"pages":{"privacy":{"title":"Zipbox رازداری کی پالیسی","meta":"Zipbox ذاتی معلومات جمع نہیں کرتا، نیٹ ورک درخواست نہیں بھیجتا اور اس میں اشتہار یا تجزیہ شامل نہیں۔","badge":"رازداری","h1":"رازداری کی پالیسی","lead":"Zipbox کچھ بھی جمع نہیں کرتا۔ اس کا بالکل ٹھیک مطلب یہ ہے۔"}}},"vi":{"langName":"Tiếng Việt","langLabel":"Ngôn ngữ","navHome":"Trang chủ","navSupport":"Hỗ trợ","navPrivacy":"Quyền riêng tư","navTerms":"Điều khoản","foot":"Zipbox chạy hoàn toàn trên máy của bạn. Không tài khoản, không quảng cáo, không phân tích, không tải lên.","updated":"Cập nhật lần cuối","secContact":"Liên hệ","contact":"Hãy viết cho chúng tôi bằng bất kỳ ngôn ngữ nào. Mỗi tin nhắn đều có người thật đọc.","contactHint":"Cho biết định dạng tệp nén, phiên bản iOS và thông báo bạn thấy trên màn hình sẽ giúp ích rất nhiều. Chúng tôi không hứa thời gian phản hồi cố định.","secPrivacy":"Quyền riêng tư","priv":["Zipbox không thu thập dữ liệu cá nhân. Không có tài khoản, không đăng nhập và không có hồ sơ người dùng.","Zipbox không gửi yêu cầu mạng. Ứng dụng không có máy chủ riêng, và tệp nén cùng các tệp giải nén của bạn không bao giờ được tải lên đâu cả.","Nhà cung cấp trong Tệp và trang hỗ trợ hoặc quyền riêng tư được iOS mở bên ngoài Zipbox. Mọi kết nối ở đó thuộc dịch vụ hệ thống bạn chọn, không phải Zipbox.","Chúng tôi không dùng quảng cáo của bên thứ ba. Zipbox không hiển thị quảng cáo dưới bất kỳ hình thức nào.","Chúng tôi không dùng dịch vụ phân tích, thư viện theo dõi hay dịch vụ báo lỗi của bên thứ ba, và Zipbox không yêu cầu mã định danh quảng cáo.","Các tệp bạn mở, giải nén hoặc tạo ra vẫn nằm trên máy, trong ứng dụng Tệp hoặc trong bộ nhớ riêng của Zipbox, trừ khi bạn chọn xuất ra hoặc chia sẻ.","Mật khẩu bạn nhập để mở hoặc mã hóa một tệp nén chỉ dùng cho thao tác đó. Nó nằm trong bộ nhớ trong lúc xử lý, không được ghi vào nhật ký và không được gửi đi đâu.","Zipbox không dùng camera, micrô, danh bạ, vị trí hay dữ liệu sức khỏe.","Vì không có gì rời khỏi máy bạn, chúng tôi cũng không có dữ liệu cá nhân nào để tra cứu, xuất ra hay xóa giúp bạn. Gỡ ứng dụng sẽ xóa luôn bộ nhớ của Zipbox.","Nếu chính sách này thay đổi, bản cập nhật sẽ được đăng trên trang này kèm ngày mới."],"secAppStore":"App Store","appStorePurchase":["Zipbox là app trả phí trên App Store. Mua một lần có đủ mọi tính năng; không mua trong app, không thuê bao, không quảng cáo. Cả 13 định dạng đều được xử lý trên thiết bị.","Toàn bộ giao dịch do Apple xử lý qua App Store. Zipbox không bao giờ thấy thông tin thanh toán của bạn và không nhận thông tin cá nhân nào từ giao dịch.","Nhà cung cấp trong Tệp và trang hỗ trợ hoặc quyền riêng tư được iOS mở bên ngoài Zipbox. Mọi kết nối ở đó thuộc dịch vụ hệ thống bạn chọn, không phải Zipbox."],"pages":{"privacy":{"title":"Chính sách quyền riêng tư của Zipbox","meta":"Zipbox không thu thập dữ liệu cá nhân, không gửi yêu cầu mạng và không chứa quảng cáo hay phân tích.","badge":"Quyền riêng tư","h1":"Chính sách quyền riêng tư","lead":"Zipbox không thu thập gì cả. Đây là ý nghĩa chính xác của câu đó."}}}};</script>
<script>
(function(){
 var D=window.ZB_I18N,L=Object.keys(D),PAGE=document.body.dataset.page;
 var RTL={"ar-SA":1,"he":1,"ur-PK":1};
 function resolve(t){
  if(!t)return"en-US";
  if(D[t])return t;
  var base=t.split("-")[0].toLowerCase();
  var map={en:"en-US",zh:"zh-Hans",pt:"pt-PT",fr:"fr-FR",es:"es-ES",de:"de-DE",nl:"nl-NL",ar:"ar-SA",
           sl:"sl-SI",bn:"bn-BD",gu:"gu-IN",kn:"kn-IN",ml:"ml-IN",mr:"mr-IN",or:"or-IN",pa:"pa-IN",
           ta:"ta-IN",te:"te-IN",ur:"ur-PK",nb:"no",nn:"no",he:"he",iw:"he",in:"id",ji:"he"};
  if(t.toLowerCase().indexOf("zh")===0)
   return /hant|tw|hk|mo/i.test(t)?"zh-Hant":"zh-Hans";
  if(t.toLowerCase().indexOf("pt")===0)return /br/i.test(t)?"pt-BR":"pt-PT";
  if(t.toLowerCase().indexOf("en")===0)
   return /gb|uk|ie/i.test(t)?"en-GB":/au|nz/i.test(t)?"en-AU":/ca/i.test(t)?"en-CA":"en-US";
  if(t.toLowerCase().indexOf("fr")===0)return /ca/i.test(t)?"fr-CA":"fr-FR";
  if(t.toLowerCase().indexOf("es")===0)return /mx|us|ar|cl|co|pe/i.test(t)?"es-MX":"es-ES";
  if(map[base]&&D[map[base]])return map[base];
  if(D[base])return base;
  return "en-US";
 }
 function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
 function pick(){
  var q=new URLSearchParams(location.search).get("lang");
  if(q)return resolve(q);
  try{var s=localStorage.getItem("zb-lang");if(s&&D[s])return s}catch(e){}
  var list=navigator.languages||[navigator.language||"en-US"];
  for(var i=0;i<list.length;i++){var r=resolve(list[i]);if(r)return r}
  return "en-US";
 }
 var sel=document.getElementById("lang");
 L.sort(function(a,b){return D[a].langName.localeCompare(D[b].langName)});
 L.forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=D[c].langName;sel.appendChild(o)});
 function render(code){
  var d=D[code],rtl=!!RTL[code];
  document.documentElement.lang=code;
  document.documentElement.dir=rtl?"rtl":"ltr";
  sel.value=code;
  document.getElementById("langLabel").textContent=d.langLabel;
  document.title=d.pages[PAGE].title;
  var m=document.querySelector('meta[name=description]');if(m)m.setAttribute("content",d.pages[PAGE].meta);
  var nav=document.getElementById("nav");nav.innerHTML="";
  [["index.html",d.navHome],["support.html",d.navSupport],["privacy.html",d.navPrivacy],["terms.html",d.navTerms]]
   .forEach(function(p){
    var a=document.createElement("a");a.href=p[0]+(code!=="en-US"?"?lang="+code:"");a.textContent=p[1];
    if(p[0].indexOf(PAGE)===0)a.setAttribute("aria-current","page");nav.appendChild(a)});
  document.getElementById("badge").textContent=d.pages[PAGE].badge;
  document.getElementById("h1").textContent=d.pages[PAGE].h1;
  document.getElementById("lead").textContent=d.pages[PAGE].lead;
  document.getElementById("body").innerHTML=BUILD[PAGE](d,code);
  document.getElementById("foot").innerHTML=esc(d.foot)+"<br>"+esc(d.updated)+" 2026-08-28 &middot; &copy; 2026 Zipbox";
  try{localStorage.setItem("zb-lang",code)}catch(e){}
 }
 function card(title,inner){return '<section class="card"><h2>'+esc(title)+'</h2>'+inner+'</section>'}
 function tiles(items){return '<div class="grid">'+items.map(function(t){
   var i=t.indexOf("|");return '<div class="tile"><b>'+esc(t.slice(0,i))+'</b>'+esc(t.slice(i+1))+'</div>'}).join("")+'</div>'}
 function list(items){return '<ul class="plain">'+items.map(function(t){return '<li>'+esc(t)+'</li>'}).join("")+'</ul>'}
 function paras(items){return items.map(function(t){return '<p>'+esc(t)+'</p>'}).join("")}
 function qa(items){return items.map(function(p){
   return '<div class="qa"><h3>'+esc(p[0])+'</h3><p>'+esc(p[1])+'</p></div>'}).join("")}
 function mail(d){return card(d.secContact,'<p>'+esc(d.contact)+'</p><p><a class="mail" href="mailto:hourstag.app@gmail.com">hourstag.app@gmail.com</a></p><p>'+esc(d.contactHint)+'</p>')}
 var BUILD={
  "index":function(d){return card(d.secFeatures,tiles(d.tiles))
    +card(d.secFormats,'<p>'+esc(d.formatsLead)+'</p>'+list(d.fea))
    +card(d.secPrivacy,paras(d.privacyShort)+'<p><a class="cta" href="privacy.html">'+esc(d.navPrivacy)+'</a></p>')
  +card(d.secIncluded,paras(d.includedShort))
    +mail(d)},
  "support":function(d){return card(d.secStart,list(d.start))
    +card(d.secFaq,qa(d.faq))
    +card(d.secTrouble,qa(d.trouble))
    +mail(d)},
  "privacy":function(d){return card(d.secPrivacy,paras(d.priv))
    +card(d.secAppStore,paras(d.appStorePurchase))
    +mail(d)},
  "terms":function(d){return card(d.secTerms,paras(d.terms))+mail(d)}
 };
 sel.addEventListener("change",function(){
  var c=sel.value,u=new URL(location.href);u.searchParams.set("lang",c);
  history.replaceState(null,"",u);render(c)});
 render(pick());
})();
</script>
